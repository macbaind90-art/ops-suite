function attendancePatternFindings(opts={}){const dates=getPatternDates(),s=attendance.settings||{},items=[];for(const e of activeAttendanceEmployees()){const resetDates=acknowledgedDisciplineDateSet(e.id);const disc=[],week={},month={},dow={};for(const d of dates){if(resetDates.has(d))continue;const c=getCode(e.id,d);if(!DISCIPLINE_CODES.has(c))continue;const dt=parseISO(d),wk=weekKey(dt),mo=d.slice(0,7),day=DAYS[dt.getDay()];const item={date:d,code:c};disc.push(item);if(c==='T'){(week[wk]=week[wk]||[]).push(item);(month[mo]=month[mo]||[]).push(item);(dow[day]=dow[day]||[]).push(item)}}const add=(type,sev,sort,msg,periodKey,arr)=>{const key=patternKey(e.id,type,periodKey);items.push({emp:e,type,sev,sort,msg,periodKey,dates:arr,key,acknowledged:false,action:null})};if(disc.length>=(s.rollingThreshold||6))add('90-Day Discipline','critical',0,`${disc.length} open T/U/UE occurrence(s) in the rolling 90-day window`,`rolling-${dates[0]}-${dates[dates.length-1]}`,disc);else if(disc.length>=4)add('90-Day Discipline','high',1,`${disc.length} open T/U/UE occurrence(s) in the rolling 90-day window`,`rolling-${dates[0]}-${dates[dates.length-1]}`,disc);for(const [k,v] of Object.entries(week))if(v.length>=(s.weekThreshold||3))add('Weekly Tardy Pattern','high',2,`${v.length} open tardy occurrence(s) in week of ${k}`,k,v);for(const [k,v] of Object.entries(month))if(v.length>=(s.monthThreshold||5))add('Monthly Tardy Pattern','high',3,`${v.length} open tardy occurrence(s) in ${k}`,k,v);for(const [k,v] of Object.entries(dow))if(v.length>=(s.patternThreshold||3))add('Day-of-Week Pattern','medium',4,`${v.length} open tardy occurrence(s) on ${k}s`,k,v);}return items.sort((a,b)=>a.sort-b.sort||a.emp.name.localeCompare(b.emp.name)||a.type.localeCompare(b.type))}

function openAttendanceRemoveModal(){if(!canRemoveAttendanceEmployee()){toast('Attendance employee removal is Admin-only');return;}
  const emps=activeAttendanceEmployees().slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  if(!emps.length){toast('No active Attendance employees found.');return;}

}
async function confirmAttendanceRemove(){if(!canRemoveAttendanceEmployee()){toast('Attendance employee removal is Admin-only');return;}
  const id=val('attendanceRemoveEmp');
  const emp=(attendance.employees||[]).find(e=>String(e.id)===String(id));
  if(!emp){toast('Attendance employee not found.');return;}
  const note=val('attendanceRemoveNote')||'Manual Attendance removal backup control.';
  if(!confirm('Remove '+(emp.name||'this employee')+' from active Attendance?\n\nHistory will be preserved.'))return;
  try{await SuiteBridge.send('suite:createBackup',attendance,{module:'attendance'});}catch(err){console.warn('Pre-removal attendance backup failed',err)}
  emp.active=false;
  emp.archived=true;
  emp.status='Archived';
  emp.archivedAt=emp.archivedAt||new Date().toISOString();
  emp.removedFromAttendanceAt=new Date().toISOString();
  emp.removedFromAttendanceBy=currentUserName()||env.user||'';
  emp.removedFromAttendanceNote=note;
  attendance.audit=Array.isArray(attendance.audit)?attendance.audit:[];
  attendance.audit.unshift({at:new Date().toISOString(),user:currentUserName()||env.user||'',machine:env.machine||'',action:'Attendance employee removed',detail:(emp.name||id)+' hidden from active Attendance. History preserved. Note: '+note});
  const ok=await saveAttendanceNow('attendance-manual-remove');
  if(ok){closeModal();selectedEntryEmpId='';selectedGridEmpId='';selectedPatternEmpId='';safeRenderPages();toast((emp.name||'Employee')+' removed from active Attendance. History preserved.');}
}


function patternPersonGroups(){
  const open=attendancePatternFindings({includeAcknowledged:false}).filter(x=>entryShift==='All'||x.emp.shift===entryShift);
  const map={};
  for(const p of open){
    const id=String(p.emp.id);
    if(!map[id])map[id]={emp:p.emp,patterns:[],stats:attendancePeriodStats(p.emp)};
    map[id].patterns.push(p);
  }
  return Object.values(map).sort((a,b)=>{
    const ac=a.patterns.some(p=>p.sev==='critical')?0:1,bc=b.patterns.some(p=>p.sev==='critical')?0:1;
    return ac-bc||a.emp.name.localeCompare(b.emp.name);
  });
}

function patternCategoryRows(stats,codes,patterns){
  const pdates=new Set();
  for(const p of patterns){(p.dates||[]).forEach(it=>{if(it&&it.date)pdates.add(it.date)})}
  return codes.map(c=>{
    const dates=codeDateList(stats,c).filter(d=>codes.includes(c));
    const issueDates=dates.filter(d=>pdates.has(d));
    const cls=DISCIPLINE_CODES.has(c)&&issueDates.length?'threshold-number':'';
    return `<details class="bucket att-review-code"><summary><span class="badge ${esc(c)}">${esc(c)}</span><span><strong>${esc(codeLabel(c))}</strong><br><small>Week ${codeCount(stats,'week',c)} · Month ${codeCount(stats,'month',c)} · 90-Day ${codeCount(stats,'rolling',c)}</small></span><span class="chip ${cls? 'critical':''}">${issueDates.length||dates.length} date(s)</span></summary><div class="bucket-body">${dates.length?dates.map(d=>`<span class="chip ${pdates.has(d)?'critical':''}">${fmt(d)}</span>`).join(' '):'<span class="muted">No dates in selected 90-day window.</span>'}</div></details>`;
  }).join('');
}
function patternTileCategory(label,codes,stats,cls=''){
  const hits=codes.filter(c=>codeCount(stats,'rolling',c)>0);
  if(!hits.length)return '';
  return `<div class="pattern-tile-cat ${esc(cls)}"><div class="pattern-tile-cat-title">${esc(label)}</div><div class="pattern-tile-codes">${hits.map(c=>`<span class="chip ${cls==='critical'?'critical':''}"><span class="badge ${esc(c)}">${esc(c)}</span> ${codeCount(stats,'rolling',c)}</span>`).join('')}</div></div>`;
}

function computeFlags(){const dates=getDates(),flags=[],s=attendance.settings;for(const e of activeAttendanceEmployees()){let issues=[],counts={week:{},month:{},dow:{}},disc=[],occ=[];for(const d of dates){const c=getCode(e.id,d);if(!DISCIPLINE_CODES.has(c))continue;const dt=parseISO(d),wk=weekKey(dt),mo=d.slice(0,7),dow=DAYS[dt.getDay()];const item={date:d,code:c};if(c==='U')issues.push({type:'Unexcused',sev:'critical',periodKey:d,msg:`Unexcused absence on ${fmt(d)}`,issueDates:[item]});if(c==='UE')issues.push({type:'Unauthorized Early',sev:'high',periodKey:d,msg:`Unauthorized early departure on ${fmt(d)}`,issueDates:[item]});if(c==='CO')issues.push({type:'Call-Out',sev:'medium',periodKey:d,msg:`Call-out on ${fmt(d)}`,issueDates:[item]});if(c==='NCNS')issues.push({type:'No Call No Show',sev:'critical',periodKey:d,msg:`No call no show on ${fmt(d)}`,issueDates:[item]});disc.push(item);occ.push(item);if(c==='T'){counts.week[wk]=counts.week[wk]||[];counts.week[wk].push(item);counts.month[mo]=counts.month[mo]||[];counts.month[mo].push(item);counts.dow[dow]=counts.dow[dow]||[];counts.dow[dow].push(item)}}if(disc.length>=s.rollingThreshold)issues.push({type:'90-Day',sev:'critical',periodKey:`rolling-${dates[dates.length-1]}-${dates[0]}`,msg:`${disc.length} discipline occurrence(s) in 90 days`,issueDates:disc});for(const [k,it] of Object.entries(counts.week))if(it.length>=s.weekThreshold)issues.push({type:'Weekly',sev:'high',periodKey:k,msg:`${it.length} tardy occurrence(s) in week of ${k}`,issueDates:it});for(const [k,it] of Object.entries(counts.month))if(it.length>=s.monthThreshold)issues.push({type:'Monthly',sev:'high',periodKey:k,msg:`${it.length} tardy occurrence(s) in ${k}`,issueDates:it});for(const [k,it] of Object.entries(counts.dow))if(it.length>=s.patternThreshold)issues.push({type:'Pattern',sev:'medium',periodKey:k,msg:`${it.length} tardy occurrence(s) on ${k}s`,issueDates:it});if(occ.length>=6)issues.push({type:'Occurrences',sev:'critical',periodKey:`occ-${dates[dates.length-1]}-${dates[0]}`,msg:`${occ.length} discipline occurrence(s) in 90 days`,issueDates:occ});else if(occ.length>=4)issues.push({type:'Occurrences',sev:'high',periodKey:`occ-${dates[dates.length-1]}-${dates[0]}`,msg:`${occ.length} discipline occurrence(s) in 90 days`,issueDates:occ});for(const iss of issues){const k=flagKey(e.id,iss.type,iss.periodKey),a=attendance.flagActions[k];flags.push({...iss,emp:e,key:k,addressed:!!a,action:a||null})}}return flags}
function attendancePeriodStats(emp){
  const dates=getDates();
  const todayIso=new Date().toISOString().slice(0,10);
  const weekStart=weekKey(new Date());
  const monthKey=todayIso.slice(0,7);
  const buckets={week:{},month:{},rolling:{},dates:{},entries:[]};
  for(const d of dates){
    const c=getCode(emp.id,d);
    if(!c)continue;
    const entry={date:d,code:c,label:codeLabel(c)};
    buckets.entries.push(entry);
    buckets.dates[c]=buckets.dates[c]||[];
    buckets.dates[c].push(d);
    if(d>=weekStart)buckets.week[c]=(buckets.week[c]||0)+1;
    if(d.slice(0,7)===monthKey)buckets.month[c]=(buckets.month[c]||0)+1;
    buckets.rolling[c]=(buckets.rolling[c]||0)+1;
  }
  return buckets;
}
function codeCount(stats,period,code){return Number((stats[period]||{})[code]||0)}

function codeCountExceeded(stats,period,code){
  const n=codeCount(stats,period,code);
  if(!n)return false;
  const s=attendance.settings||{};
  if(code==='U'||code==='UE')return n>0;
  if(code==='T'){
    if(period==='week')return n>=(s.weekThreshold||3);
    if(period==='month')return n>=(s.monthThreshold||5);
    if(period==='rolling')return n>=(s.rollingThreshold||6);
  }
  return false;
}

function normalizeTasks(){
  tasks=tasks&&typeof tasks==='object'?tasks:{tasks:[],audit:[],nextId:1};
  tasks.tasks=Array.isArray(tasks.tasks)?tasks.tasks:[];
  tasks.audit=Array.isArray(tasks.audit)?tasks.audit:[];
  tasks.nextId=Number(tasks.nextId||0)||((tasks.tasks.reduce((m,t)=>Math.max(m,Number(t.id)||0),0))+1);
  for(const t of tasks.tasks){
    t.id=t.id||tasks.nextId++;
    t.project=t.project||'';
    if(['Active','Planning','Finalizing','Follow-up'].includes(String(t.status||'')))t.status='In Progress';
    if(['On Hold','Tabled'].includes(String(t.status||'')))t.status='Waiting';
    if(String(t.status||'')==='Complete')t.status='Completed';
    t.status=t.status||'Not Started';
    if(String(t.priority||'')==='Medium')t.priority='Normal';
    t.priority=t.priority||'Normal';
    t.category=t.category||'General';
    t.owner=t.owner||t.assignedTo||'David';
    t.assignedTo=t.assignedTo||t.owner||'David';
    t.update=t.update||'';
    t.lastUpdate=t.lastUpdate||t.update||'';
    t.nextAction=t.nextAction||'';
    t.blockedBy=t.blockedBy||'';
    t.dueDate=t.dueDate||'';
    t.followUpDate=t.followUpDate||'';
    t.recurring=t.recurring||'None';
    t.createdAt=t.createdAt||new Date().toISOString();
    t.updatedAt=t.updatedAt||new Date().toISOString();
  }
}

function renderTasks(){const m=taskMetrics();const list=filteredTasks();const statuses=['Not Started','In Progress','Waiting','Blocked','Completed','Archived'];const cats=uniqueTaskValues('category');return `<div class="page-head"><div><div class="page-title">Task Tracker</div><div class="page-sub">Weekly project command board · ${tasks.lastSaved?'Last saved '+new Date(tasks.lastSaved).toLocaleString():'Using packaged starter tasks'}</div></div><div class="top-actions"><button class="primary" onclick="openTaskModal()">+ Add Task</button><button onclick="openWeeklyTaskEmail()">Open Current Draft</button><button class="gold" onclick="generateWeeklyUpdate()">Generate Fresh Draft</button><button onclick="copyWeeklyTaskText()">Copy Draft Text</button><button onclick="exportTasksCSV()">Export CSV</button><button onclick="createTaskBackup()">Backup Now</button><button onclick="document.getElementById('tasksImportFile').click()">Import JSON</button><button onclick="reloadPackagedTasksData()">Use Packaged Tasks</button><input id="tasksImportFile" type="file" accept=".json,application/json" class="hidden" onchange="importTasksJSON(this)"></div></div><div class="task-summary-row"><div class="kpi task-kpi-primary"><div class="num">${m.total}</div><div class="lbl">Open Tasks</div></div><div class="kpi"><div class="num">${m.inProgress}</div><div class="lbl">In Progress</div></div><div class="kpi"><div class="num schedule-risk">${m.overdue}</div><div class="lbl">Overdue</div></div><div class="kpi"><div class="num">${m.dueSoon}</div><div class="lbl">Due This Week</div></div><div class="kpi"><div class="num schedule-risk">${m.blocked}</div><div class="lbl">Blocked</div></div><div class="kpi"><div class="num">${m.high}</div><div class="lbl">High/Critical</div></div></div><div class="card"><div class="task-card-title"><div class="card-title">Task Controls</div><div class="mini-note">Open Current Draft keeps the existing email draft behavior. Generate Fresh Draft builds the upgraded weekly update from task status, due dates, blockers, and next actions.</div></div><div class="task-toolbar"><div><label>Search</label><input value="${esc(taskSearch)}" placeholder="Search project, update, blocker, next action..." oninput="taskSearch=this.value;safeRenderPages()"></div><div><label>Status</label><select onchange="taskStatusFilter=this.value;safeRenderPages()"><option value="all">Open Statuses</option>${statuses.map(x=>`<option ${taskStatusFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div><label>Priority</label><select onchange="taskPriorityFilter=this.value;safeRenderPages()"><option value="all">All Priorities</option>${['Critical','High','Normal','Low'].map(x=>`<option ${taskPriorityFilter===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Category</label><select onchange="taskCategoryFilter=this.value;safeRenderPages()"><option value="all">All Categories</option>${cats.map(x=>`<option ${taskCategoryFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div></div><div class="table-wrap"><table class="wide-table"><thead><tr><th>Project</th><th>Status</th><th>Priority</th><th>Category</th><th>Assigned To</th><th>Due</th><th>Follow-up</th><th>Blocked By</th><th>Next Action</th><th>Last Update</th><th>Actions</th></tr></thead><tbody>${list.map(t=>`<tr><td class="td-name">${esc(t.project)}</td><td>${taskBadge(t.status)}</td><td class="${taskPriorityClass(t.priority)}">${esc(t.priority)}</td><td>${esc(t.category||'')}</td><td>${esc(t.assignedTo||t.owner||'')}</td><td>${esc(taskDateShort(t.dueDate))}</td><td>${esc(taskDateShort(t.followUpDate))}</td><td>${esc(t.blockedBy||'')}</td><td class="task-update">${esc(t.nextAction||'')}</td><td class="task-update">${esc(t.lastUpdate||t.update||'')}</td><td><div class="task-actions"><button class="sm" onclick="openTaskModal(${Number(t.id)})">Edit</button>${String(t.status||'')==='Archived'?'<button class="sm" onclick="reopenTask('+Number(t.id)+')">Reopen</button>':'<button class="sm" onclick="markTaskComplete('+Number(t.id)+')">Done</button>'}<button class="sm danger" onclick="removeTask(${Number(t.id)})">Remove</button></div></td></tr>`).join('')||'<tr><td colspan="11" class="empty">No tasks match current filters.</td></tr>'}</tbody></table></div>`}
function openTaskModal(id){taskEditId=id||null;const t=id?(tasks.tasks||[]).find(x=>Number(x.id)===Number(id)):{project:'',status:'Not Started',priority:'Normal',category:'General',owner:'David',assignedTo:'David',dueDate:'',followUpDate:'',recurring:'None',blockedBy:'',nextAction:'',lastUpdate:'',update:''};if(!t){toast('Task not found');return;}showModal(`<div class="modal-head"><div class="modal-title">${id?'Edit Task':'Add Task'}</div><button onclick="closeModal()">Close</button></div><div class="form-grid"><div class="form-group full"><label>Project / Task</label><input id="taskProject" value="${esc(t.project)}"></div><div class="form-group"><label>Status</label><select id="taskStatus">${['Not Started','In Progress','Waiting','Blocked','Completed','Archived'].map(x=>`<option ${t.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label>Priority</label><select id="taskPriority">${['Critical','High','Normal','Low'].map(x=>`<option ${t.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label>Category</label><input id="taskCategory" value="${esc(t.category||'General')}"></div><div class="form-group"><label>Assigned To</label><input id="taskAssigned" value="${esc(t.assignedTo||t.owner||'David')}"></div><div class="form-group"><label>Due Date</label><input type="date" id="taskDue" value="${esc(t.dueDate||'')}"></div><div class="form-group"><label>Follow-up Date</label><input type="date" id="taskFollow" value="${esc(t.followUpDate||'')}"></div><div class="form-group"><label>Recurring</label><select id="taskRecurring">${['None','Daily','Weekly','Monthly','Quarterly','Annual','Custom'].map(x=>`<option ${String(t.recurring||'None')===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group full"><label>Blocked By</label><input id="taskBlockedBy" value="${esc(t.blockedBy||'')}" placeholder="Vendor, approval, quote, decision, access, etc."></div><div class="form-group full"><label>Last Update</label><textarea id="taskLastUpdate" rows="4">${esc(t.lastUpdate||t.update||'')}</textarea></div><div class="form-group full"><label>Next Action</label><textarea id="taskNextAction" rows="3">${esc(t.nextAction||'')}</textarea></div></div><div class="form-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveTaskFromModal()">Save Task</button></div>`) }
function saveTaskFromModal(){const data={project:document.getElementById('taskProject').value.trim(),status:document.getElementById('taskStatus').value,priority:document.getElementById('taskPriority').value,category:document.getElementById('taskCategory').value.trim()||'General',assignedTo:document.getElementById('taskAssigned').value.trim()||'David',owner:document.getElementById('taskAssigned').value.trim()||'David',dueDate:document.getElementById('taskDue').value,followUpDate:document.getElementById('taskFollow').value,recurring:document.getElementById('taskRecurring').value,blockedBy:document.getElementById('taskBlockedBy').value.trim(),lastUpdate:document.getElementById('taskLastUpdate').value.trim(),update:document.getElementById('taskLastUpdate').value.trim(),nextAction:document.getElementById('taskNextAction').value.trim()};if(!data.project){toast('Task needs a project name');return;}if(taskEditId){let t=tasks.tasks.find(x=>Number(x.id)===Number(taskEditId));Object.assign(t,data,{updatedAt:new Date().toISOString()});if(data.status==='Completed')t.completedAt=new Date().toISOString();taskAudit(data.status==='Archived'?'Archived task':'Updated task',data.project)}else{data.id=tasks.nextId++;data.createdAt=new Date().toISOString();data.updatedAt=new Date().toISOString();if(data.status==='Completed')data.completedAt=data.updatedAt;tasks.tasks.push(data);taskAudit('Added task',data.project)}saveTasksNow('task-modal').then(ok=>{if(ok){closeModal();safeRenderPages();toast(data.status==='Archived'?'Task archived':'Task saved')}});}
function markTaskComplete(id){let t=tasks.tasks.find(x=>Number(x.id)===Number(id));if(!t)return;t.status='Completed';t.completedAt=new Date().toISOString();t.updatedAt=t.completedAt;taskAudit('Marked task completed',t.project);saveTasks();safeRenderPages();toast('Task marked completed')}
function reopenTask(id){let t=tasks.tasks.find(x=>Number(x.id)===Number(id));if(!t)return;t.status='In Progress';t.updatedAt=new Date().toISOString();delete t.completedAt;taskAudit('Reopened task',t.project);saveTasks();safeRenderPages();toast('Task reopened')}
function removeTask(id){let t=tasks.tasks.find(x=>Number(x.id)===Number(id));if(!t)return;let reason=prompt('Archive/remove reason for: '+t.project,'No longer needed');if(reason===null)return;t.status='Archived';t.archivedAt=new Date().toISOString();t.updatedAt=t.archivedAt;t.archiveReason=reason;taskAudit('Archived task',t.project+' · '+reason);saveTasks();safeRenderPages();toast('Task archived')}
async function createTaskBackup(){try{await SuiteBridge.send('suite:createBackup',tasks,{module:'tasks'});toast('Task backup created')}catch(e){toast('Task backup failed: '+e.message)}}
async function reloadPackagedTasksData(){if(!confirm('Replace current task tracker with the packaged starter task list? A backup will be created first.'))return;try{const res=await SuiteBridge.send('suite:resetModuleFromSeed',{}, {module:'tasks'});tasks=JSON.parse(res.data||'{}');normalizeTasks();toast('Packaged task tracker loaded');safeRenderPages();}catch(e){toast('Task seed restore failed: '+e.message)}}
async function importTasksJSON(input){const file=input&&input.files&&input.files[0];if(!file)return;try{const text=await file.text();const data=JSON.parse(text);if(!Array.isArray(data.tasks))throw new Error('File does not look like a PWADC task tracker JSON export.');tasks=data;normalizeTasks();taskAudit('Imported task JSON',file.name);saveTasks('import');safeRenderPages();toast('Task JSON imported')}catch(e){toast('Task import failed: '+e.message)}}
function exportTasksCSV(){let rows=[['Project','Status','Priority','Category','Assigned To','Due Date','Follow-up Date','Recurring','Blocked By','Last Update','Next Action','Updated At','Completed At','Archived At'],...(tasks.tasks||[]).map(t=>[t.project,t.status,t.priority,t.category,t.assignedTo||t.owner,t.dueDate,t.followUpDate,t.recurring,t.blockedBy,t.lastUpdate||t.update,t.nextAction,t.updatedAt,t.completedAt||'',t.archivedAt||''])];downloadCSV('PWADC_Tasks_'+new Date().toISOString().slice(0,10)+'.csv',rows)}
function taskBucketLists(){const open=(tasks.tasks||[]).filter(isTaskOpen);return{completed:(tasks.tasks||[]).filter(t=>t.status==='Completed'&&String(t.completedAt||t.updatedAt||'').slice(0,10)>=taskPlusDaysIso(-7)),inProgress:open.filter(t=>t.status==='In Progress'),waiting:open.filter(t=>t.status==='Waiting'),blocked:open.filter(t=>t.status==='Blocked'),needsDecision:open.filter(t=>/decision|approval|approve|direction|need/i.test(`${t.blockedBy||''} ${t.nextAction||''} ${t.lastUpdate||t.update||''}`)),upcoming:open.filter(t=>isTaskDueSoon(t)||t.followUpDate&&t.followUpDate<=taskPlusDaysIso(7))}}
function taskLine(t){let parts=[t.project];if(t.lastUpdate||t.update)parts.push(t.lastUpdate||t.update);if(t.nextAction)parts.push('Next: '+t.nextAction);if(t.blockedBy)parts.push('Blocked by: '+t.blockedBy);let meta=taskUpcomingText(t);if(meta)parts.push(meta);return parts.join(' - ')}
function weeklyTaskText(){const today=new Date().toLocaleDateString();const b=taskBucketLists();const sections=[['Completed This Week',b.completed],['In Progress',b.inProgress],['Waiting / Blocked',[...b.waiting,...b.blocked]],['Needs Decision',b.needsDecision],['Upcoming Next Week',b.upcoming]];let lines=['Security Projects Weekly Update - '+today,''];for(const [title,list] of sections){lines.push(title);if(!list.length)lines.push(' - None');else for(const t of list)lines.push(' - '+taskLine(t));lines.push('');}return lines.join('\n').trim()}
function weeklyTaskHtml(){const today=new Date().toLocaleDateString();const b=taskBucketLists();const sections=[['Completed This Week',b.completed],['In Progress',b.inProgress],['Waiting / Blocked',[...b.waiting,...b.blocked]],['Needs Decision',b.needsDecision],['Upcoming Next Week',b.upcoming]];return `<!doctype html><html><head><meta charset="utf-8"><title>PWADC Security Weekly Project Update</title><style>body{font-family:Segoe UI,Arial,sans-serif;margin:28px;color:#1d2430}h1{color:#8f1c21;margin-bottom:4px}.sub{color:#667085;margin-bottom:22px}h2{border-bottom:1px solid #d0d5dd;padding-bottom:4px;margin-top:18px}.item{border-left:4px solid #C0272D;background:#f5f6f8;margin:10px 0;padding:10px 14px;border-radius:6px}.project{font-weight:800;color:#1e2330}.meta{font-size:12px;color:#667085;margin:2px 0 8px}.empty{color:#667085;font-style:italic}button{padding:8px 14px;margin-bottom:18px}@media print{button{display:none}body{margin:.35in}}</style></head><body><button onclick="window.print()">Print</button><h1>PWADC Security Weekly Project Update</h1><div class="sub">Generated ${esc(today)}</div>${sections.map(([title,list])=>`<h2>${esc(title)}</h2>${list.length?list.map(t=>`<div class="item"><div class="project">${esc(t.project)}</div><div class="meta">${esc(t.status)} · ${esc(t.priority)} Priority · ${esc(t.category||'General')} · ${esc(t.assignedTo||t.owner||'')}</div><div>${esc(t.lastUpdate||t.update||'No current update entered.')}</div>${t.nextAction?`<div><strong>Next:</strong> ${esc(t.nextAction)}</div>`:''}${t.blockedBy?`<div><strong>Blocked by:</strong> ${esc(t.blockedBy)}</div>`:''}${taskUpcomingText(t)?`<div class="meta">${esc(taskUpcomingText(t))}</div>`:''}</div>`).join(''):'<div class="empty">None</div>'}`).join('')}</body></html>`}
function taskEmailBody(){return weeklyTaskText()+"\n\nRespectfully,\nDavid"}
function openWeeklyTaskEmail(){const subject='PWADC Security Weekly Project Update - '+new Date().toLocaleDateString();const body=taskEmailBody();const mailto='mailto:jfaure@pwadc.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);const a=document.createElement('a');a.href=mailto;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{try{a.remove()}catch(e){}},1000);toast('Opening email draft to jfaure@pwadc.com')}
async function generateWeeklyUpdate(){const html=weeklyTaskHtml();const txt=weeklyTaskText();const date=new Date().toISOString().slice(0,10);try{await SuiteBridge.send('suite:writeExport',html,{module:'tasks',fileName:'PWADC_Weekly_Project_Update_'+date+'.html'});await SuiteBridge.send('suite:writeExport',txt,{module:'tasks',fileName:'PWADC_Weekly_Project_Update_'+date+'.txt'});toast('Weekly update exported and email draft opening');}catch(e){toast('Weekly export failed: '+e.message)}openWeeklyTaskEmail();showModal(`<div class="modal-title">Weekly Manager Update</div><div class="notice">The existing email draft behavior is preserved. HTML and plain text copies were exported to the Task Tracker export folder.</div><div class="weekly-preview">${esc(txt)}</div><div class="form-actions"><button onclick="closeModal()">Close</button><button onclick="openWeeklyTaskEmail()">Open Current Draft Again</button><button onclick="copyWeeklyTaskText()">Copy Text</button><button class="primary" onclick="printWeeklyTaskUpdate()">Print Draft</button></div>`)}
function copyWeeklyTaskText(){const txt=weeklyTaskText();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('Weekly draft copied')).catch(()=>showWeeklyTextModal(txt));}else showWeeklyTextModal(txt)}
function showWeeklyTextModal(txt){showModal(`<div class="modal-title">Weekly Draft Text</div><textarea rows="16" style="width:100%">${esc(txt)}</textarea><div class="form-actions"><button onclick="closeModal()">Close</button><button class="primary" onclick="printWeeklyTaskUpdate()">Print Draft</button></div>`)}
function printWeeklyTaskUpdate(){let w=window.open('','_blank');if(!w){toast('Popup blocked. Allow popups to preview weekly update.');return;}w.document.write(weeklyTaskHtml());w.document.close();}

function dayCheckboxesForCoverage(r,i){const selected=new Set(coverageDayArray(r));return DAYS.map(d=>`<label style="display:inline-flex;gap:3px;align-items:center;margin-right:5px;font-size:11px"><input id="cov_day_${i}_${d}" type="checkbox" ${selected.has(d)?'checked':''}>${d}</label>`).join('')+`<div class="toolbar" style="margin-top:4px"><button type="button" class="sm" onclick="setCoverageDays(${i},'weekdays')">Weekdays</button><button type="button" class="sm" onclick="setCoverageDays(${i},'weekends')">Weekends</button><button type="button" class="sm" onclick="setCoverageDays(${i},'all')">All</button></div>`}
function setCoverageDays(i,mode){const map={weekdays:['Mon','Tue','Wed','Thu','Fri'],weekends:['Sun','Sat'],all:[...DAYS]};DAYS.forEach(d=>{const el=document.getElementById('cov_day_'+i+'_'+d);if(el)el.checked=(map[mode]||[]).includes(d);});}
function renderCoverageRows(){return coverageRequirements().map((r,i)=>`<tr><td><input id="cov_area_${i}" value="${esc(r.area)}"></td><td><input id="cov_section_${i}" value="${esc(r.section)}"></td><td><input id="cov_post_${i}" value="${esc(r.post||'')}" placeholder="Optional"></td><td style="min-width:260px">${dayCheckboxesForCoverage(r,i)}</td><td><input id="cov_hc_${i}" type="number" min="0" step="1" value="${r.requiredHeadcount}"></td><td><input id="cov_hours_${i}" type="number" min="0" step="0.5" value="${r.hoursPerPost}"></td><td><input id="cov_notes_${i}" value="${esc(r.notes||'')}"></td><td><button class="danger sm" onclick="removeCoverageRow(${i})">Remove</button></td></tr>`).join('')}
function collectCoverageFromSettings(){return coverageRequirements().map((r,i)=>normalizeCoverageRequirement({id:r.id||('cov'+i),area:document.getElementById('cov_area_'+i)?.value||r.area,section:document.getElementById('cov_section_'+i)?.value||r.section,post:document.getElementById('cov_post_'+i)?.value||r.post,days:DAYS.filter(d=>document.getElementById('cov_day_'+i+'_'+d)?.checked),requiredHeadcount:document.getElementById('cov_hc_'+i)?.value||r.requiredHeadcount,hoursPerPost:document.getElementById('cov_hours_'+i)?.value||r.hoursPerPost,notes:document.getElementById('cov_notes_'+i)?.value||r.notes},i))}
function addCoverageRow(){settings.coverageRequirements=collectCoverageFromSettingsSafe();settings.coverageRequirements.push(normalizeCoverageRequirement({id:'cov'+Date.now(),area:'New Area',section:'New Area',post:'',days:['Mon','Tue','Wed','Thu','Fri'],requiredHeadcount:1,hoursPerPost:8,notes:''},settings.coverageRequirements.length));renderSettings()}
function removeCoverageRow(i){settings.coverageRequirements=collectCoverageFromSettingsSafe();settings.coverageRequirements.splice(i,1);renderSettings()}
function resetCoverageDefaults(){if(!confirm('Restore default schedule-based coverage requirements? Unsaved coverage edits will be replaced.'))return;settings.coverageRequirements=DEFAULT_COVERAGE_REQUIREMENTS.map((x,i)=>normalizeCoverageRequirement(x,i));renderSettings()}
function renderUserRows(){return (settings.users||[]).map((u,i)=>`<tr><td><input id="u_name_${i}" value="${esc(u.username||'')}"></td><td><input id="u_disp_${i}" value="${esc(u.displayName||'')}"></td><td><select id="u_role_${i}">${['Admin','Supervisor','Lead','Viewer'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></td><td><input id="u_pin_${i}" value="${esc(u.pin||'')}" maxlength="8"></td><td><select id="u_active_${i}"><option value="true" ${u.active!==false?'selected':''}>Yes</option><option value="false" ${u.active===false?'selected':''}>No</option></select></td><td><button class="danger sm" onclick="removeUserRow(${i})">Remove</button></td></tr>`).join('')}
function collectUsersFromSettings(){return (settings.users||[]).map((u,i)=>normalizeUser({id:u.id||('user'+Date.now()+i),username:document.getElementById('u_name_'+i)?.value||u.username,displayName:document.getElementById('u_disp_'+i)?.value||u.displayName,role:document.getElementById('u_role_'+i)?.value||u.role,pin:document.getElementById('u_pin_'+i)?.value||u.pin,active:(document.getElementById('u_active_'+i)?.value||'true')==='true'},i))}
function addUserRow(){settings.users=collectUsersFromSettingsSafe();settings.users.push(normalizeUser({id:'user'+Date.now(),username:'NewUser',displayName:'New User',role:'Viewer',pin:'1234',active:true},settings.users.length));renderSettings()}
function removeUserRow(i){settings.users=collectUsersFromSettingsSafe();if((settings.users||[]).filter(u=>u.role==='Admin'&&u.active!==false).length<=1 && settings.users[i]?.role==='Admin'){toast('At least one active Admin is required');return;}settings.users.splice(i,1);renderSettings()}
function collectUsersFromSettingsSafe(){try{return collectUsersFromSettings()}catch(_){return settings.users||[]}}
function collectCoverageFromSettingsSafe(){try{return collectCoverageFromSettings()}catch(_){return coverageRequirements()}}
function validateSettingsInput(next){
  const errors=[];
  if(!next.users.some(u=>u.role==='Admin'&&u.active!==false))errors.push('At least one active Admin is required.');
  next.users.forEach((u,i)=>{if(!String(u.username||'').trim())errors.push('User row '+(i+1)+' needs a username.');if(!String(u.pin||'').trim())errors.push('User '+(u.username||i+1)+' needs a PIN.');});
  [['FT Pig loaded rate',next.ftLoadedRate],['PT Pig loaded rate',next.ptLoadedRate],['TempToHire loaded rate',next.tempLoadedRate]].forEach(([name,val])=>{if(!Number.isFinite(Number(val))||Number(val)<0||Number(val)>1)errors.push(name+' must be between 0% and 100%.');});
  if(!Number.isFinite(Number(next.monthlyMultiplier))||Number(next.monthlyMultiplier)<=0)errors.push('Monthly multiplier must be greater than 0.');
  if(!Number.isFinite(Number(next.annualMultiplier))||Number(next.annualMultiplier)<=0)errors.push('Annual multiplier must be greater than 0.');
  if(!Number.isFinite(Number(next.fteBaselineHours))||Number(next.fteBaselineHours)<=0)errors.push('FTE baseline hours must be greater than 0.');
  next.coverageRequirements.forEach((r,i)=>{if(!String(r.area||'').trim())errors.push('Coverage row '+(i+1)+' needs an area.');if(Number(r.requiredHeadcount)<0)errors.push('Coverage row '+(i+1)+' headcount cannot be negative.');if(Number(r.hoursPerPost)<0)errors.push('Coverage row '+(i+1)+' hours/post cannot be negative.');if(!coverageDayArray(r).length)errors.push('Coverage row '+(i+1)+' needs at least one day selected.');});
  return errors;
}
async function saveSettings(){
  const users=collectUsersFromSettings();
  const coverageRequirements=collectCoverageFromSettings();
  const next={...settings,theme:document.getElementById('setTheme')?.value||settings.theme,defaultModule:document.getElementById('setDefault')?.value||settings.defaultModule,pin:document.getElementById('setPin')?.value||'1234',dataRoot:document.getElementById('setRoot')?.value||settings.dataRoot,backupRetentionDays:Number(document.getElementById('setRetention')?.value||180),ftLoadedRate:Number(document.getElementById('setFtLoaded')?.value||33)/100,ptLoadedRate:Number(document.getElementById('setPtLoaded')?.value||27)/100,tempLoadedRate:Number(document.getElementById('setTempLoaded')?.value||35)/100,monthlyMultiplier:Number(document.getElementById('setMonthlyMultiplier')?.value||4.333),annualMultiplier:Number(document.getElementById('setAnnualMultiplier')?.value||52),fteBaselineHours:Number(document.getElementById('setFteBaseline')?.value||40),coverageRequirements,users};
  const errors=validateSettingsInput(next);
  if(errors.length){const box=document.getElementById('healthBox');if(box)box.innerHTML=`<div class="card settings-validation"><div class="card-title">Settings Validation</div>${errors.map(e=>`<div class="health-row"><span>${esc(e)}</span><span class="bad">FIX</span></div>`).join('')}</div>`;toast('Settings need '+errors.length+' fix(es)');return;}
  settings=next;
  applyTheme();renderShell();
  try{await SuiteBridge.send('suite:saveSettings',settings);toast('Settings saved');safeRenderPages({preserveScroll:true});}catch(e){toast('Settings failed: '+e.message)}
}
async function backupEverything(){
  const stamp=new Date().toLocaleString();
  const results=[];
  try{await SuiteBridge.send('suite:createBackup',attendance,{module:'attendance'});results.push({name:'Attendance',ok:true});}catch(e){results.push({name:'Attendance',ok:false,error:e.message});}
  try{await SuiteBridge.send('suite:createBackup',roster,{module:'roster'});results.push({name:'Roster',ok:true});}catch(e){results.push({name:'Roster',ok:false,error:e.message});}
  try{await SuiteBridge.send('suite:createBackup',tasks,{module:'tasks'});results.push({name:'Task Tracker',ok:true});}catch(e){results.push({name:'Task Tracker',ok:false,error:e.message});}
  try{await SuiteBridge.send('suite:createBackup',settings,{module:'suite-settings'});results.push({name:'Suite Settings',ok:true});}catch(e){results.push({name:'Suite Settings',ok:false,error:e.message});}
  try{await SuiteBridge.send('suite:backupPrograms');results.push({name:'Standalone Programs',ok:true});}catch(e){results.push({name:'Standalone Programs',ok:false,error:e.message});}
  const okCount=results.filter(r=>r.ok).length;
  const box=document.getElementById('healthBox');
  if(box)box.innerHTML=`<div class="card"><div class="card-title">Backup Everything</div><div style="color:var(--muted);font-size:12px;margin-bottom:8px">Run ${esc(stamp)}</div>${results.map(r=>`<div class="health-row"><span>${esc(r.name)}</span><span class="${r.ok?'ok':'bad'}">${r.ok?'BACKED UP':esc(r.error||'FAILED')}</span></div>`).join('')}</div>`;
  toast(okCount===results.length?'Everything backed up':'Backup completed with '+(results.length-okCount)+' issue(s)');
}
async function runHealthCheck(){try{let r=await SuiteBridge.send('suite:healthCheck');document.getElementById('healthBox').innerHTML=`<div class="card"><div class="card-title">Health Check</div><div style="color:var(--muted);font-size:12px;margin-bottom:8px">${esc(r.dataRoot)}</div>${r.checks.map(c=>`<div class="health-row"><span>${esc(c.name)}</span><span class="${c.ok?'ok':'bad'}">${c.ok?'OK':esc(c.error)}</span></div>`).join('')}</div>`}catch(e){toast('Health check failed')}}


function applyViewportSizing(){
  const root=document.documentElement;
  const w=window.innerWidth||document.documentElement.clientWidth||1400;
  const h=window.innerHeight||document.documentElement.clientHeight||900;
  let view='standard';
  if(w<1280 || h<760) view='compact';
  else if(w>=2200) view='wide';
  root.setAttribute('data-view',view);
  root.style.setProperty('--vh',(h*0.01)+'px');
}
let viewportResizeTimer=null;
window.addEventListener('resize',()=>{clearTimeout(viewportResizeTimer);viewportResizeTimer=setTimeout(()=>{applyViewportSizing();try{safeRenderPages();}catch(_){ }},120);});
window.addEventListener('orientationchange',()=>setTimeout(applyViewportSizing,150));
applyViewportSizing();

init();
</script>
