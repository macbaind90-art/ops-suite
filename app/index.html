}

}

const SuiteBridge={seq:0,pending:{},send(type,payload={},extra={}){return new Promise((resolve,reject)=>{const id='r'+(++this.seq);this.pending[id]={resolve,reject};if(window.chrome&&window.chrome.webview){window.chrome.webview.postMessage({id,type,payload,...extra});}else{setTimeout(()=>resolve(mockResponse(type,payload,extra)),150);}})},receive(res){const p=this.pending[res.id];if(!p)return;delete this.pending[res.id];res.ok?p.resolve(res.payload):p.reject(new Error((res.payload&&res.payload.error)||'Bridge error'));}};window.SuiteBridge=SuiteBridge;
async function mockResponse(type,payload,extra){if(type==='suite:getSettings')return{settings:{...DEFAULT_SETTINGS},environment:{user:'Preview',machine:'Browser',version:'3.0.16'}};if(type==='suite:loadModuleData'&&extra.module==='attendance'){let r=await fetch('seed/attendance-data.json');return{module:'attendance',data:await r.text()}};if(type==='suite:loadModuleData'&&extra.module==='roster'){let r=await fetch('seed/roster-data.json');return{module:'roster',data:await r.text()}};if(type==='suite:loadModuleData'&&extra.module==='tasks'){let r=await fetch('seed/tasks-data.json');return{module:'tasks',data:await r.text()}};if(type==='suite:healthCheck')return{dataRoot:settings.dataRoot,checks:[{name:'Preview mode',ok:true,error:''},{name:'Desktop bridge unavailable in browser',ok:false,error:'Run EXE for real checks'}]};if(type==='suite:openPath')return{ok:true};if(type==='suite:refreshPrograms')return{ok:true};if(type==='suite:backupPrograms')return{ok:true,path:'Preview'};if(type==='suite:listBackups')return{module:(extra&&extra.module)||'attendance',backups:[]};if(type==='suite:restoreBackup')return{module:(extra&&extra.module)||'attendance',data:'{}',restoredFrom:'Preview'};return{ok:true}}
function esc(s){const str=String(s??'');let out='';for(let i=0;i<str.length;i++){const ch=str[i];if(ch==='&')out+='&amp;';else if(ch==='<')out+='&lt;';else if(ch==='>')out+='&gt;';else if(ch==='\"')out+='&quot;';else if(ch==="'")out+='&#39;';else out+=ch;}return out;}function parseISO(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)}function toISO(d){return d.toISOString().slice(0,10)}function addDays(iso,n){const d=parseISO(iso);d.setDate(d.getDate()+n);return toISO(d)}function fmt(iso){const d=parseISO(iso);return (d.getMonth()+1)+'/'+d.getDate()}function weekKey(d){let x=new Date(d);x.setDate(x.getDate()-x.getDay());return toISO(x)}
function toast(msg){

window.addEventListener('unhandledrejection',ev=>{reportActionError('Unhandled action',ev.reason||ev);});function applyTheme(){document.documentElement.setAttribute('data-theme',settings.theme||'dark')}

  const m=String(s||'').match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?/i);
  if(!m)return '';
  let h=Number(m[1]),min=m[2],ap=(m[3]||'').toUpperCase();
  if(ap==='PM'&&h<12)h+=12;if(ap==='AM'&&h===12)h=0;
  return String(h).padStart(2,'0')+':'+min;
}
function minutesOf(t){const m=String(t||'').match(/(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):null;}
async function runNativeBadgeAudit(){
  try{
    const punch=badgeAuditState.files.punch;
    if(!punch){toast('Badge audit needs the punch file first');return;}
    const punchText=await readAuditFile(punch);
    const punchRows=rowsFromCsv(punchText);
    if(!punchRows.length){toast('Punch file did not contain readable CSV/text rows');return;}
    const badgeFiles=['ts','gate','dispatch','recep'].filter(k=>badgeAuditState.files[k]);
    let badges=[];
    for(const k of badgeFiles){
      const txt=await readAuditFile(badgeAuditState.files[k]);
      for(const line of String(txt||'').split(/\r?\n/)){
        const date=maybeDate(line), time=maybeTime(line);
        if(!date||!time)continue;
        badges.push({date,time,line,source:k});
      }
    }
    const findings=[];
    const headers=punchRows[0].map(h=>String(h).toLowerCase());
    const nameIdx=headers.findIndex(h=>/name|employee/.test(h));
    const dateIdx=headers.findIndex(h=>/date/.test(h));
    const clockIdx=headers.findIndex(h=>/in|clock|punch|time/.test(h));
    for(const r of punchRows.slice(1)){
      const employee=normalizePersonName(r[nameIdx]||r[0]||'Unknown');
      const date=maybeDate(r[dateIdx]||r.join(' '));
      const clock=maybeTime(r[clockIdx]||r.join(' '));
      if(!date||!clock)continue;
      const sameDay=badges.filter(b=>b.date===date);
      if(!sameDay.length){findings.push({type:'No Badge Match',employee,date,clock,badge:'',source:'',notes:'No reader event found for this date in loaded logs'});continue;}
      const cm=minutesOf(clock);
      const prior=sameDay.filter(b=>minutesOf(b.time)!==null&&minutesOf(b.time)<=cm).sort((a,b)=>minutesOf(b.time)-minutesOf(a.time))[0];
      if(!prior){findings.push({type:'Clock-in Before Badge',employee,date,clock,badge:sameDay[0].time,source:sameDay[0].source,notes:'Clock time appears before first loaded badge event for that date'});}
    }
    badgeAuditState.findings=findings;
    badgeAuditState.ranAt=new Date().toISOString();
    safeRenderPages();toast('Badge audit complete: '+findings.length+' finding(s)');
  }catch(e){toast('Badge audit failed: '+e.message)}
}

async function alignAttendanceNamesToRoster(){
  if(!confirm('Align Attendance employee names and basic fields to the Roster source of truth? This will NOT merge, delete, or erase attendance history. A backup will be created first.'))return;
  try{await SuiteBridge.send('suite:createBackup',attendance,{module:'attendance'});}catch(e){console.warn('Pre-align backup failed',e)}
  let updated=0, linked=0, skipped=0;
  const activeRoster=rosterActiveEmployees();
  for(const re of activeRoster){
    const a=findAttendanceEmployeeForRosterLoose(re);
    if(!a){skipped++;continue;}
    const before=JSON.stringify({name:a.name,title:a.title,shift:a.shift,rdos:a.rdos,startDate:a.startDate,rosterId:a.rosterId});
    a.rosterId=String(re.id);
    a.name=rosterEmployeeAttendanceName(re);
    a.title=re.rank||a.title||'';
    a.shift=rosterShiftToAttendanceShift(re.shift)||a.shift||'';
    a.rdos=rosterRdoToAttendanceRdos(re.rdo);
    a.startDate=a.startDate||re.doh||re.dop||'';
    a.active=true;
    a.archived=false;
    a.status='Active';
    const after=JSON.stringify({name:a.name,title:a.title,shift:a.shift,rdos:a.rdos,startDate:a.startDate,rosterId:a.rosterId});
    if(before!==after)updated++;
    linked++;
  }
  attendance.audit=Array.isArray(attendance.audit)?attendance.audit:[];
  attendance.audit.unshift({at:new Date().toISOString(),user:currentUserName()||env.user||'',machine:env.machine||'',action:'Aligned Attendance names to Roster',detail:`Linked ${linked}, updated ${updated}, skipped ${skipped}. No history deleted or merged.`});
  const ok=await saveAttendanceNow('align-attendance-names');
  safeRenderPages();
  toast(ok?`Attendance names aligned: ${updated} updated, ${skipped} skipped.`:'Attendance alignment failed');
}

function renderRosterList(){const list=filteredRoster();const activeEmps=rosterActiveEmployees();const archiveCount=rosterArchivedEmployees().length;const total=activeEmps.length;const classCounts=employmentClassCounts(activeEmps);const openUni=activeEmps.reduce((n,e)=>n+['shirt','pants','jacket'].filter(k=>(e[k+'Status']||'')&&e[k+'Status']!=='issued').length,0);return `<div class="grid cols-4 roster-summary"><div class="kpi"><div class="num">${total}</div><div class="lbl">Employees</div></div><div class="kpi"><div class="num">${classCounts.FT||0}</div><div class="lbl">FT Pig</div></div><div class="kpi"><div class="num">${classCounts.PT||0}</div><div class="lbl">PT Pig</div></div><div class="kpi"><div class="num">${classCounts.TempToHire||0}</div><div class="lbl">TempToHire</div></div></div><div class="card roster-workbar-card"><div class="card-title">Roster Controls</div><div class="roster-filters roster-workbar"><div><label>Search</label><input value="${esc(rosterSearch)}" placeholder="Name, EID, rank, shift..." oninput="rosterSearch=this.value;safeRenderPages()"></div><div><label>Shift</label><select onchange="rosterShiftFilter=this.value;safeRenderPages()"><option value="all">All Shifts</option>${rosterShifts().map(x=>`<option value="${esc(x)}" ${rosterShiftFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div><label>Rank</label><select onchange="rosterRankFilter=this.value;safeRenderPages()"><option value="all">All Ranks</option>${rosterRanks().map(x=>`<option value="${esc(x)}" ${rosterRankFilter===x?'selected':''}>${esc(rankLong(x))}</option>`).join('')}</select></div><div><label>Type</label><select onchange="rosterTypeFilter=this.value;safeRenderPages()"><option value="all">All Types</option>${rosterTypes().map(x=>`<option value="${esc(x)}" ${rosterTypeFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="top-actions"><button class="primary" onclick="openEmployeeModal()">+ Add Employee</button><button onclick="openManageRanksModal()">Manage Ranks</button><button onclick="openRosterPrintModal()">Print Roster</button><button onclick="exportRosterCSV()">Export CSV</button></div></div><div class="mini-note">Showing ${list.length} of ${total} active employees. ${archiveCount} archived / old employee(s) hidden by default. ${openUni} uniform need/order item(s) are still open. Employment class drives loaded-cost analytics: FT 33%, PT 27%, TempToHire 35%.</div></div><div class="table-wrap"><table class="wide-table roster-table"><thead><tr>${sortHeader('Name','name')}${sortHeader('EID','eid')}${sortHeader('Rank','rank')}${sortHeader('Shift','shift')}${sortHeader('Gate Shift','gateShift')}${sortHeader('Rate','rate')}${sortHeader('Type','type')}${sortHeader('PT/FT/Temp','employmentClass')}${sortHeader('HPW','scheduledHours')}${sortHeader('Base Wk','baseWeekCost')}${sortHeader('Loaded Wk','loadedWeekCost')}${sortHeader('RDO','rdo')}${sortHeader('Uniform','uniform')}${sortHeader('DOH','doh')}${sortHeader('DOP','dop')}${sortHeader('Notes','notes')}<th>Actions</th></tr></thead><tbody>${list.map(e=>`<tr><td><strong>${esc(fullName(e))}</strong></td><td>${esc(e.eid||'')}</td><td>${rankBadge(e.rank)}</td><td>${esc(e.shift||'')}</td><td>${esc(e.gateShift||'')}</td><td>${money(e.rate)}</td><td>${esc(e.type||'')}</td><td>${esc(employmentClass(e))}</td><td>${employeeCostProfile(e).hours}</td><td>${money(employeeCostProfile(e).baseWeek)}</td><td>${money(employeeCostProfile(e).loadedWeek)}</td><td>${esc((e.rdo||[]).join('/'))}</td><td>${uniformSummary(e)}</td><td>${esc(fmtDate(e.doh))}</td><td>${esc(fmtDate(e.dop))}</td><td class="notes-cell">${esc(e.notes||'')}</td><td><div class="td-actions"><button class="sm" onclick="openEmployeeModal('${esc(e.id)}')">Edit</button><button class="sm gold" onclick="openPromoteModal('${esc(e.id)}')">Promote</button><button class="sm" onclick="openMeritModal('${esc(e.id)}')">Merit</button><button class="sm danger" onclick="removeRosterEmployee('${esc(e.id)}')">Remove</button></div></td></tr>`).join('')||'<tr><td colspan="17">No roster records match the current filters.</td></tr>'}</tbody></table></div>${renderArchivedRosterSection()}`}
function rosterTypes(){return [...new Set(roster.employees.map(e=>e.type||'').filter(Boolean))].sort()}
const DEFAULT_RANKS=['PSO','SO','SSO','LSO','SUPV','Receptionist','ONIN','APS'];
function rosterCustomRanks(){
  roster.customRanks=Array.isArray(roster.customRanks)?roster.customRanks:[];
  return roster.customRanks.map(r=>String(r||'').trim()).filter(Boolean);
}
function allRosterRanks(){
  const set=new Set([...DEFAULT_RANKS,...rosterCustomRanks(),...roster.employees.map(e=>e.rank||'').filter(Boolean)]);
  return [...set].filter(Boolean).sort((a,b)=>rankLong(a).localeCompare(rankLong(b))||String(a).localeCompare(String(b)));
}
function rosterShifts(){return [...new Set(rosterActiveEmployees().map(e=>e.shift||'').filter(Boolean))].sort((a,b)=>rosterShift(a).localeCompare(rosterShift(b))||String(a).localeCompare(String(b)))}
function rosterRanks(){return allRosterRanks()}
function rankLong(rank){return ({PSO:'Security Trainee',SO:'Security Officer',SSO:'Senior Security Officer',LSO:'Lead Security Officer',SUPV:'Supervisor',ONIN:'ONIN',APS:'APS',Receptionist:'Receptionist'}[rank]||rank||'')}
function openManageRanksModal(){
  roster.customRanks=Array.isArray(roster.customRanks)?roster.customRanks:[];
  const existing=rosterCustomRanks();
  showModal(`<div class="modal-head"><div class="modal-title">Manage Ranks</div><button onclick="closeModal()">Close</button></div><div class="notice">Default ranks stay available. Add custom ranks here when you need a new title/rank option.</div><div class="form-grid"><div class="full"><label>Add Rank</label><input id="newRankName" placeholder="Example: Coordinator, Manager, Lead Guard"></div></div><div class="modal-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="confirmAddRank()">Add Rank</button></div><div class="card"><div class="card-title">Custom Ranks</div>${existing.length?existing.map(r=>`<div class="list-row"><strong>${esc(r)}</strong><button class="sm danger" onclick="removeCustomRank('${esc(r)}')">Remove</button></div>`).join(''):'<p class="mini-note">No custom ranks yet.</p>'}</div>`);
}
async function confirmAddRank(){
  const r=String(val('newRankName')||'').trim();
  if(!r){toast('Enter a rank first');return;}
  roster.customRanks=Array.isArray(roster.customRanks)?roster.customRanks:[];
  const exists=allRosterRanks().some(x=>x.toLowerCase()===r.toLowerCase());
  if(exists){toast('That rank already exists');return;}
  roster.customRanks.push(r);
  roster.audit=Array.isArray(roster.audit)?roster.audit:[];
  roster.audit.push({at:new Date().toISOString(),user:currentUserName()||env.user||'',action:'Rank added',detail:r});
  await saveRosterNow('rank-add');
  openManageRanksModal();
  safeRenderPages();
}
async function removeCustomRank(rank){
  const inUse=roster.employees.some(e=>String(e.rank||'').toLowerCase()===String(rank||'').toLowerCase());
  if(inUse){toast('Cannot remove rank while assigned to employees');return;}
  if(!confirm('Remove custom rank: '+rank+'?'))return;
  roster.customRanks=rosterCustomRanks().filter(r=>String(r).toLowerCase()!==String(rank).toLowerCase());
  roster.audit=Array.isArray(roster.audit)?roster.audit:[];
  roster.audit.push({at:new Date().toISOString(),user:currentUserName()||env.user||'',action:'Rank removed',detail:rank});
  await saveRosterNow('rank-remove');
  openManageRanksModal();
  safeRenderPages();
}
function rankBadge(rank){let cls=String(rank||'').toLowerCase().replace(/[^a-z0-9]/g,'');return `<span class="rank-badge ${cls}">${esc(rank||'')}</span>`}
function money(v){let n=Number(v);return Number.isFinite(n)&&n>0?'$'+n.toFixed(2):''}
function fmtDate(d){if(!d)return '';let x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString()}
function uniformSummary(e){let chips=[];for(const k of ['shirt','pants','jacket']){let st=e[k+'Status']||'';let size=e[k]||'';if(st)chips.push(`<span class="uniform-chip ${esc(st)}">${k[0].toUpperCase()} ${esc(size)} ${esc(st)}</span>`)}return `<div class="uniform-needs">${chips.join('')||'<span class="mini-note">Not set</span>'}</div>`}
function rosterSortValue(e,key){
 const v={name:fullName(e),eid:e.eid,rank:e.rank,shift:e.shift,gateShift:e.gateShift,rate:Number(e.rate||0),type:e.type,employmentClass:employmentClass(e),rdo:(e.rdo||[]).join('/'),uniform:[e.shirtStatus,e.pantsStatus,e.jacketStatus,e.shirt,e.pants,e.jacket].join(' '),doh:e.doh,dop:e.dop,notes:e.notes}[key];
 return v===undefined||v===null?'':v;
}
function setRosterSort(key){if(rosterSortKey===key)rosterSortDir=rosterSortDir==='asc'?'desc':'asc';else{rosterSortKey=key;rosterSortDir='asc'}safeRenderPages()}
function sortHeader(label,key){const arrow=rosterSortKey===key?(rosterSortDir==='asc'?' ▲':' ▼'):'';return `<th class="sortable" onclick="setRosterSort('${key}')" title="Sort by ${esc(label)}">${esc(label)}${arrow}</th>`}
function filteredRoster(){let q=(rosterSearch||'').toLowerCase();return rosterActiveEmployees().filter(e=>{let blob=[fullName(e),e.eid,e.rank,e.shift,e.gateShift,e.type,employmentClass(e),e.notes].join(' ').toLowerCase();return (!q||blob.includes(q))&&(rosterShiftFilter==='all'||e.shift===rosterShiftFilter)&&(rosterRankFilter==='all'||e.rank===rosterRankFilter)&&(rosterTypeFilter==='all'||e.type===rosterTypeFilter)}).sort((a,b)=>{let av=rosterSortValue(a,rosterSortKey),bv=rosterSortValue(b,rosterSortKey);let cmp=0;if(typeof av==='number'||typeof bv==='number')cmp=(Number(av)||0)-(Number(bv)||0);else cmp=String(av||'').localeCompare(String(bv||''),undefined,{numeric:true,sensitivity:'base'});if(cmp===0)cmp=fullName(a).localeCompare(fullName(b),undefined,{numeric:true,sensitivity:'base'});return rosterSortDir==='desc'?-cmp:cmp})}
function renderArchivedRosterSection(){const list=rosterArchivedEmployees();if(!list.length)return '';return `<div class="archive-panel"><div class="archive-head" onclick="showArchivedRoster=!showArchivedRoster;safeRenderPages()"><div><div class="archive-title">Archive / Old Employees</div><div class="page-sub">Hidden by default. These records stay out of daily roster views but remain available for reference.</div></div><button onclick="showArchivedRoster=!showArchivedRoster;event.stopPropagation()">${showArchivedRoster?'Hide':'Show'} Archive (${list.length})</button></div>${showArchivedRoster?`<div class="archive-body"><div class="table-wrap"><table class="wide-table roster-table"><thead><tr><th>Name</th><th>EID</th><th>Rank</th><th>Shift</th><th>Archived</th><th>Notes</th><th>Actions</th></tr></thead><tbody>${list.map(e=>`<tr class="archived-row"><td><strong>${esc(fullName(e))}</strong> <span class="archive-badge">Archived</span></td><td>${esc(e.eid||'')}</td><td>${rankBadge(e.rank)}</td><td>${esc(e.shift||'')}</td><td>${esc(e.archivedAt?new Date(e.archivedAt).toLocaleDateString():'')}</td><td>${esc(e.notes||'')}</td><td><div class="td-actions"><button class="sm" onclick="openEmployeeModal('${esc(e.id)}')">Edit</button><button class="sm gold" onclick="restoreArchivedEmployee('${esc(e.id)}')">Restore</button><button class="sm danger" onclick="deleteArchivedEmployee('${esc(e.id)}')">Delete</button></div></td></tr>`).join('')}</tbody></table></div></div>`:''}</div>`}
async function restoreArchivedEmployee(id){let e=roster.employees.find(x=>String(x.id)===String(id));if(!e)return;e.archived=false;e.status='Active';delete e.archivedAt;roster.audit.push({at:new Date().toISOString(),user:currentUserName()||env.user||'',action:'Employee restored',detail:fullName(e)});const ok=await saveRosterNow('employee-restore');if(ok){await syncAttendanceFromRoster(false);safeRenderPages();toast('Employee restored and synced to Attendance')}} 
async function deleteArchivedEmployee(id){
  let idx=(roster.employees||[]).findIndex(x=>String(x.id)===String(id));
  if(idx<0)return;
  let e=roster.employees[idx];
  if(!isArchivedEmployee(e)){toast('Only archived employees can be deleted from this section.');return;}
  if(!confirm('Permanently delete '+fullName(e)+' from the Roster archive? Attendance history will not be deleted.'))return;
  roster.employees.splice(idx,1);
  roster.audit=roster.audit||[];
  roster.audit.push({at:new Date().toISOString(),user:currentUserName()||env.user||'',action:'Archived employee deleted from roster archive',detail:fullName(e)});
  let attChanged=false;
  for(let i=(attendance.employees||[]).length-1;i>=0;i--){
    const ae=attendance.employees[i];
    if(ae&&String(ae.rosterId||'')===String(id)){
      const hist=attendance.attendance&&attendance.attendance[ae.id]?Object.keys(attendance.attendance[ae.id]).length:0;
      if(hist===0){
        attendance.employees.splice(i,1);
        if(attendance.attendance)delete attendance.attendance[ae.id];
        attChanged=true;
      }else{
        ae.active=false;ae.archived=true;ae.status='Deleted from Roster Archive';ae.archivedAt=ae.archivedAt||new Date().toISOString();
        attChanged=true;
      }
    }
  }
  const ok=await saveRosterNow('archive-delete');
  if(attChanged)await saveAttendance('archive-delete-sync');
  if(ok){safeRenderPages();toast('Archived employee deleted from roster archive. Attendance history preserved.')}
}

function buildScheduleColorCache(){
  const cache={};
  for(const row of (roster.schedule||[])){
    const sec=row.section||'Unsectioned';
    const secCache=cache[sec]||(cache[sec]={});
    const fixed=EMP_SECTION_COLORS[sec]||{};
    const used=new Set(Object.values(secCache).concat(Object.values(fixed)));
    for(const cell of (row.days||[])){
      const key=scheduleColorKey(cell); if(!key||secCache[key])continue;
      if(fixed[key]){secCache[key]=fixed[key]; used.add(fixed[key]); continue;}
      let color=SCHEDULE_COLOR_PALETTE.find(c=>!used.has(c));
      if(!color){
        let h=0; const seed=sec+'|'+key; for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;
        color=SCHEDULE_COLOR_PALETTE[h%SCHEDULE_COLOR_PALETTE.length];
      }
      secCache[key]=color; used.add(color);
    }
  }
  scheduleColorCache=cache;
}

function employeeScheduleLabel(e){return ((e.rank||'')?e.rank+' ':'')+fullName(e)}
function normalizedShiftText(v){return String(v||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,' ').trim()}
function employeeMatchesScheduleContext(e,section='',post=''){
 const sec=normalizedShiftText(section),pst=normalizedShiftText(post),sh=normalizedShiftText(e.shift),gate=normalizedShiftText(e.gateShift),blob=[sh,gate,pst].join(' ');
 if(!sec)return true;
 if(sec.includes('1st'))return sh.includes('1st')||sh==='first';
 if(sec.includes('2nd'))return sh.includes('2nd')||sh==='second';
 if(sec.includes('3rd'))return sh.includes('3rd')||sh==='third';
 if(sec.includes('gate'))return sh.includes('gate')||gate.length>0||pst.includes('gate');
 if(sec.includes('dock')||sec.includes('support'))return sh.includes('dock')||sh.includes('crosswalk')||sh.includes('reception')||pst.includes('dock')||pst.includes('grocery')||pst.includes('perishable')||pst.includes('crosswalk')||pst.includes('reception');
 return blob.includes(sec.split(' ')[0]);
}
function scheduleEmployeePool(section='',post=''){
 const active=rosterActiveEmployees().filter(e=>employeeMatchesScheduleContext(e,section,post));
 return active.sort((a,b)=>fullName(a).localeCompare(fullName(b),undefined,{numeric:true,sensitivity:'base'}));
}
function scheduleEmployeeOptions(selected='',section='',post=''){
 const base=['None','Open','Pending'];
 const selectedLabel=String(selected||'');
 let emps=scheduleEmployeePool(section,post).map(employeeScheduleLabel);
 if(selectedLabel&&!base.includes(selectedLabel)&&!emps.includes(selectedLabel))emps=[selectedLabel,...emps];
 return [...base,...emps].map(v=>`<option value="${esc(v)}" ${String(selected)===String(v)?'selected':''}>${esc(v)}</option>`).join('')
}

function renderRosterTraining(){
  const topics=(roster.trainingTopics||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
  const rows=trainingRows();
  const visibleRows=filteredTrainingRows(rows);
  const overdue=visibleRows.filter(r=>r.status==='Overdue').length;
  const dueSoon=visibleRows.filter(r=>r.status==='Due Soon').length;
  const noRecord=visibleRows.filter(r=>r.status==='No Record').length;
  return `<div class="training-toolbar"><div><div class="page-title">Training Tracker</div><div class="page-sub">Employees run down the left. Topics run across the top. Add/edit records from any cell.</div></div><div class="top-actions"><button onclick="openTrainingTopicModal()">+ Add Topic</button><button class="gold" onclick="openTrainingRecordModal()">+ Add Training Record</button><button onclick="printTrainingMatrix()">Print Training</button><button onclick="exportTrainingCSV()">Export Training CSV</button></div></div>
  <div class="grid cols-4"><div class="kpi"><div class="num">${topics.length}</div><div class="lbl">Topics</div></div><div class="kpi"><div class="num">${roster.trainingRecords.length}</div><div class="lbl">Records</div></div><div class="kpi"><div class="num schedule-risk">${overdue}</div><div class="lbl">Overdue</div></div><div class="kpi"><div class="num">${noRecord}</div><div class="lbl">No Record</div></div></div>
  <div class="training-filters"><div><label>Search</label><input id="trainingSearch" placeholder="Employee, topic, notes..." value="${esc(window._trainingSearch||'')}" oninput="window._trainingSearch=this.value;safeRenderPages()"></div><div><label>Topic</label><select id="trainingTopicFilter" onchange="window._trainingTopicFilter=this.value;safeRenderPages()"><option value="">All Topics</option>${topics.map(t=>`<option value="${esc(t.id)}" ${(window._trainingTopicFilter||'')==String(t.id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div><label>Status</label><select id="trainingStatusFilter" onchange="window._trainingStatusFilter=this.value;safeRenderPages()"><option value="">All Statuses</option>${['Complete','Due Soon','Overdue','No Record'].map(x=>`<option value="${x}" ${(window._trainingStatusFilter||'')===x?'selected':''}>${x}</option>`).join('')}</select></div><div style="align-self:end"><button onclick="window._trainingSearch='';window._trainingTopicFilter='';window._trainingStatusFilter='';safeRenderPages()">Clear Filters</button></div></div>
  <div class="training-layout"><div class="card training-side-card"><div class="card-title">Training Topics</div>${renderTrainingTopicsList()}</div><div class="card"><div class="card-title">Training Matrix</div><div class="training-print-note">Status summary: ${overdue} overdue · ${dueSoon} due soon · ${noRecord} no record</div>${renderTrainingMatrix()}</div></div>`
}
function trainingRows(){const topics=(roster.trainingTopics||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));const emps=(roster.employees||[]).slice().sort((a,b)=>fullName(a).localeCompare(fullName(b)));let rows=[];for(const emp of emps){for(const topic of topics){const rec=latestTrainingRecord(emp.id,topic.id);const status=trainingStatus(rec,topic);rows.push({emp,topic,rec,status});}}return rows}
function filteredTrainingRows(rows){const q=(window._trainingSearch||'').toLowerCase();const topicFilter=String(window._trainingTopicFilter||'');const statusFilter=window._trainingStatusFilter||'';return rows.filter(r=>!topicFilter||String(r.topic.id)===topicFilter).filter(r=>!statusFilter||r.status===statusFilter).filter(r=>!q||(fullName(r.emp)+' '+(r.emp.eid||'')+' '+(r.emp.shift||'')+' '+(r.topic.name||'')+' '+((r.rec&&r.rec.notes)||'')).toLowerCase().includes(q))}
function renderTrainingTopicsList(){const topics=(roster.trainingTopics||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));if(!topics.length)return '<div class="training-empty">No topics yet. Add a topic to start tracking training.</div>';return topics.map(t=>`<div class="topic-card"><div><div class="topic-title">${esc(t.name)}</div><div class="topic-meta">${t.required!==false?'Required':'Optional'} · ${esc(intervalLabel(t.intervalDays))}${t.notes?'<br>'+esc(t.notes):''}</div></div><div class="td-actions"><button class="sm" onclick="openTrainingTopicModal('${esc(t.id)}')">Edit</button><button class="sm danger" onclick="deleteTrainingTopic('${esc(t.id)}')">Remove</button></div></div>`).join('')}
function renderTrainingMatrix(){let topics=(roster.trainingTopics||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));let emps=(roster.employees||[]).slice().sort((a,b)=>{const sa=shiftSortName(a.shift),sb=shiftSortName(b.shift);return sa.localeCompare(sb)||fullName(a).localeCompare(fullName(b));});const q=(window._trainingSearch||'').toLowerCase();const topicFilter=String(window._trainingTopicFilter||'');const statusFilter=window._trainingStatusFilter||'';if(topicFilter)topics=topics.filter(t=>String(t.id)===topicFilter);if(q){emps=emps.filter(emp=>{const empHit=(fullName(emp)+' '+(emp.eid||'')+' '+(emp.shift||'')).toLowerCase().includes(q);const trainHit=topics.some(topic=>{const rec=latestTrainingRecord(emp.id,topic.id);return ((topic.name||'')+' '+((rec&&rec.notes)||'')).toLowerCase().includes(q)});return empHit||trainHit;});}if(statusFilter){emps=emps.filter(emp=>topics.some(topic=>trainingStatus(latestTrainingRecord(emp.id,topic.id),topic)===statusFilter));}if(!topics.length)return '<div class="training-empty">No training topics match the current filter.</div>';if(!emps.length)return '<div class="training-empty">No employees match the current training filters.</div>';const groups={};for(const emp of emps){const key=trainingShiftGroup(emp.shift);groups[key]=groups[key]||[];groups[key].push(emp);}const order=['1st','2nd','3rd','GATE','W/E Gate','DOCK','Crosswalk','RECP','Other'];const keys=Object.keys(groups).sort((a,b)=>(order.indexOf(a)<0?99:order.indexOf(a))-(order.indexOf(b)<0?99:order.indexOf(b))||a.localeCompare(b));return keys.map(key=>`<div class="training-shift-block"><div class="training-shift-head"><span>${esc(trainingShiftLabel(key))}</span><small>${groups[key].length} employee(s)</small></div><div class="training-matrix-wrap"><table class="training-matrix"><thead><tr><th>Employee</th>${topics.map(t=>`<th class="training-topic-th">${esc(t.name)}<div style="font-size:10px;color:var(--muted);margin-top:3px">${t.required!==false?'Required':'Optional'} · ${esc(intervalLabel(t.intervalDays))}</div></th>`).join('')}</tr></thead><tbody>${groups[key].map(emp=>`<tr><td><strong>${esc(fullName(emp))}</strong><div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(emp.shift||'')} ${emp.eid?'· '+esc(emp.eid):''}</div></td>${topics.map(topic=>renderTrainingCell(emp,topic,statusFilter)).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('')}
function trainingShiftGroup(shift){const s=String(shift||'').trim();if(/^1st/i.test(s))return '1st';if(/^2nd/i.test(s))return '2nd';if(/^3rd/i.test(s))return '3rd';if(/w\/e gate/i.test(s))return 'W/E Gate';if(/gate/i.test(s))return 'GATE';if(/dock/i.test(s))return 'DOCK';if(/crosswalk/i.test(s))return 'Crosswalk';if(/recp|reception/i.test(s))return 'RECP';return s||'Other'}
function shiftSortName(shift){const order={'1st':'01','2nd':'02','3rd':'03','GATE':'04','W/E Gate':'05','DOCK':'06','Crosswalk':'07','RECP':'08','Other':'99'};const g=trainingShiftGroup(shift);return (order[g]||'98')+' '+g}
function trainingShiftLabel(key){return key==='RECP'?'Reception':key==='GATE'?'Gate':key==='DOCK'?'Dock':key}
function renderTrainingCell(emp,topic,statusFilter=''){const rec=latestTrainingRecord(emp.id,topic.id);const status=trainingStatus(rec,topic);const filteredClass=statusFilter&&status!==statusFilter?' training-filtered-out':'';const dates=rec?`<div class="training-dates">Completed: ${esc(fmtDate(rec.completed||''))}<br>Due: ${esc(fmtDate(rec.due||''))}${rec.notes?'<br>Notes: '+esc(rec.notes):''}</div>`:'<div class="training-dates">No completion recorded</div>';return `<td class="training-cell${filteredClass}"><div class="training-cell-inner">${trainingStatusBadge(status)}${dates}<div class="training-actions"><button class="sm" onclick="openTrainingRecordModal('${rec?esc(rec.id):''}','${esc(emp.id)}','${esc(topic.id)}')">${rec?'Edit':'Add'}</button>${rec?`<button class="sm danger" onclick="deleteTrainingRecord('${esc(rec.id)}')">Remove</button>`:''}</div></div></td>`}
function latestTrainingRecord(empId,topicId){return (roster.trainingRecords||[]).filter(r=>String(r.employeeId)===String(empId)&&String(r.topicId)===String(topicId)).sort((a,b)=>String(b.completed||'').localeCompare(String(a.completed||'')))[0]||null}
function trainingStatus(rec,topic){if(!rec)return 'No Record';if(!rec.due||!topic||!Number(topic.intervalDays))return 'Complete';const today=parseISO(new Date().toISOString().slice(0,10));const due=parseISO(rec.due);const diff=Math.ceil((due-today)/86400000);if(diff<0)return 'Overdue';if(diff<=30)return 'Due Soon';return 'Complete'}
function trainingStatusBadge(status){const cls=status==='Complete'?'training-complete':status==='Due Soon'?'training-due':status==='Overdue'?'training-overdue':'training-none';return `<span class="training-status ${cls}">${esc(status)}</span>`}
function intervalLabel(n){n=Number(n)||0;if(!n)return 'One-time';if(n===30)return '30 days';if(n===90)return '90 days';if(n===180)return '6 months';if(n===365)return 'Annual';if(n===730)return 'Every 2 years';return n+' days'}
function trainingTopicById(id){return (roster.trainingTopics||[]).find(t=>String(t.id)===String(id))}
function trainingRecordById(id){return (roster.trainingRecords||[]).find(r=>String(r.id)===String(id))}
function openTrainingTopicModal(id=''){const t=id?trainingTopicById(id):null;showModal(`<div class="modal-head"><div class="modal-title">${t?'Edit Training Topic':'Add Training Topic'}</div><button onclick="closeModal()">Close</button></div><div class="form-grid"><div class="full"><label>Topic Name</label><input id="trainTopicName" value="${esc(t&&t.name||'')}" placeholder="Gate Procedures, Post Orders Review"></div><div><label>Renewal Interval</label><select id="trainTopicInterval">${[[0,'One-time / no expiration'],[30,'30 days'],[90,'90 days'],[180,'6 months'],[365,'Annual'],[730,'Every 2 years']].map(([v,l])=>`<option value="${v}" ${Number(t&&t.intervalDays||365)===v?'selected':''}>${l}</option>`).join('')}</select></div><div><label>Required?</label><select id="trainTopicRequired"><option value="yes" ${!t||t.required!==false?'selected':''}>Yes</option><option value="no" ${t&&t.required===false?'selected':''}>No</option></select></div><div class="full"><label>Notes</label><input id="trainTopicNotes" value="${esc(t&&t.notes||'')}" placeholder="Optional standard or reminder note"></div></div><div class="modal-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveTrainingTopic('${esc(id)}')">Save Topic</button></div>`)}
function saveTrainingTopic(id=''){const name=val('trainTopicName').trim();if(!name){toast('Training topic name is required');return;}if((roster.trainingTopics||[]).some(t=>String(t.id)!==String(id)&&String(t.name||'').toLowerCase()===name.toLowerCase())){toast('That topic already exists');return;}const data={name,intervalDays:Number(val('trainTopicInterval'))||0,required:val('trainTopicRequired')!=='no',notes:val('trainTopicNotes').trim()};if(id){Object.assign(trainingTopicById(id),data);}else{roster.trainingTopics.push({id:roster.nextTrainingTopicId++, ...data});}saveRosterNow('training-topic').then(ok=>{if(ok){closeModal();safeRenderPages();toast('Training topic saved')}})}
function deleteTrainingTopic(id){const t=trainingTopicById(id);if(!t)return;const count=(roster.trainingRecords||[]).filter(r=>String(r.topicId)===String(id)).length;if(!confirm('Remove training topic "'+t.name+'"?'+(count?'\n\nThis will also remove '+count+' record(s).':'')))return;roster.trainingTopics=roster.trainingTopics.filter(x=>String(x.id)!==String(id));roster.trainingRecords=roster.trainingRecords.filter(r=>String(r.topicId)!==String(id));saveRoster('training-topic-remove');safeRenderPages();toast('Training topic removed')}
function openTrainingRecordModal(recordId='',empId='',topicId=''){const rec=recordId?trainingRecordById(recordId):null;const emps=(roster.employees||[]).slice().sort((a,b)=>fullName(a).localeCompare(fullName(b)));const topics=(roster.trainingTopics||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));if(!emps.length){toast('Add employees before adding training records');return;}if(!topics.length){toast('Add a topic before adding records');return;}const selEmp=rec?rec.employeeId:(empId||emps[0].id);const selTopic=rec?rec.topicId:(topicId||topics[0].id);showModal(`<div class="modal-head"><div class="modal-title">${rec?'Edit Training Record':'Add Training Record'}</div><button onclick="closeModal()">Close</button></div><div class="form-grid"><div class="full"><label>Employee</label><select id="trainRecEmp">${emps.map(e=>`<option value="${esc(e.id)}" ${String(selEmp)===String(e.id)?'selected':''}>${esc(fullName(e))}</option>`).join('')}</select></div><div class="full"><label>Topic</label><select id="trainRecTopic" onchange="trainingRecordDateChanged()">${topics.map(t=>`<option value="${esc(t.id)}" ${String(selTopic)===String(t.id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div><label>Completed Date</label><input id="trainRecCompleted" type="date" value="${esc(rec&&rec.completed||new Date().toISOString().slice(0,10))}" onchange="trainingRecordDateChanged()"></div><div><label>Due / Expiration Date</label><input id="trainRecDue" type="date" value="${esc(rec&&rec.due||'')}"></div><div class="full"><label>Notes</label><input id="trainRecNotes" value="${esc(rec&&rec.notes||'')}" placeholder="Optional notes"></div></div><div class="modal-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveTrainingRecord('${esc(recordId)}')">Save Record</button></div>`);setTimeout(trainingRecordDateChanged,0)}
function trainingRecordDateChanged(){const completed=val('trainRecCompleted');const topic=trainingTopicById(val('trainRecTopic'));const due=document.getElementById('trainRecDue');if(due&&completed&&topic&&Number(topic.intervalDays))due.value=addDays(completed,Number(topic.intervalDays))}
function saveTrainingRecord(recordId=''){const employeeId=val('trainRecEmp'),topicId=val('trainRecTopic'),completed=val('trainRecCompleted'),due=val('trainRecDue'),notes=val('trainRecNotes').trim();if(!employeeId||!topicId||!completed){toast('Employee, topic, and completed date are required');return;}const data={employeeId,topicId,completed,due,notes};if(recordId){Object.assign(trainingRecordById(recordId),data);}else{roster.trainingRecords.push({id:roster.nextTrainingRecordId++, ...data});}saveRosterNow('training-record').then(ok=>{if(ok){closeModal();safeRenderPages();toast('Training record saved')}})}
function deleteTrainingRecord(id){if(!confirm('Remove this training record?'))return;roster.trainingRecords=roster.trainingRecords.filter(r=>String(r.id)!==String(id));saveRoster('training-record-remove');safeRenderPages();toast('Training record removed')}
function exportTrainingCSV(){const topics=(roster.trainingTopics||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));let rows=[['Employee','EID','Shift','Topic','Status','Completed','Due','Notes']];for(const emp of (roster.employees||[]).slice().sort((a,b)=>fullName(a).localeCompare(fullName(b)))){for(const topic of topics){const rec=latestTrainingRecord(emp.id,topic.id);rows.push([fullName(emp),emp.eid||'',emp.shift||'',topic.name||'',trainingStatus(rec,topic),rec&&rec.completed||'',rec&&rec.due||'',rec&&rec.notes||'']);}}downloadCSV('PWADC_Training_'+new Date().toISOString().slice(0,10)+'.csv',rows);toast('Exported training CSV')}
function printTrainingMatrix(){const topics=(roster.trainingTopics||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));const emps=(roster.employees||[]).slice().sort((a,b)=>fullName(a).localeCompare(fullName(b)));let html=`<div class="print-overlay" id="printOverlay"><div class="print-toolbar"><div><h2>PWADC Security Training Matrix</h2><div>${new Date().toLocaleString()} · ${topics.length} topic(s) · ${roster.trainingRecords.length} record(s)</div></div><div><button onclick="window.print()">Print</button> <button onclick="document.getElementById('printOverlay').remove()">Close</button></div></div><table class="print-table"><thead><tr><th>Employee</th>${topics.map(t=>`<th>${esc(t.name)}</th>`).join('')}</tr></thead><tbody>${emps.map(emp=>`<tr><td>${esc(fullName(emp))}<br>${esc(emp.shift||'')}</td>${topics.map(topic=>{const rec=latestTrainingRecord(emp.id,topic.id);return `<td>${esc(trainingStatus(rec,topic))}<br>${rec?('Completed: '+esc(fmtDate(rec.completed||''))+'<br>Due: '+esc(fmtDate(rec.due||''))):'No record'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;document.body.insertAdjacentHTML('beforeend',html);setTimeout(()=>window.print(),150)}
function renderRosterUniforms(){
  const eligible=(roster.employees||[]).filter(e=>!['ONIN','APS','Onin'].includes(e.type)&&!['ONIN','APS'].includes(e.rank));
  const SIZES=['XS','S','M','L','XL','2X','3X','4X','5X'];
  const items=['shirt','pants','jacket'];
  const itemLabel={shirt:'Shirts',pants:'Pants',jacket:'Jackets'};
  const itemSingular={shirt:'shirt',pants:'pants',jacket:'jacket'};
  const itemColor={shirt:'var(--red)',pants:'var(--orange)',jacket:'var(--blue)'};
  const statusText=v=>v==='issued'?'Issued':v==='ordered'?'Ordered':'Needed';
  const statusBadge=v=>`<span class="status-badge ${esc(v||'needed')}">${esc(statusText(v||'needed'))}</span>`;
  const needsOrder=(e,k)=>{let v=(e[k+'Status']||'').toLowerCase();return !v||v==='needed'};
  const isOrdered=(e,k)=>(e[k+'Status']||'').toLowerCase()==='ordered';
  const isIssued=(e,k)=>(e[k+'Status']||'').toLowerCase()==='issued';
  const personSort=(a,b)=>String(a.last||'').localeCompare(String(b.last||''))||String(a.first||'').localeCompare(String(b.first||''));
  const buildTotals=(empList,k)=>{let totals={};for(const e of empList){let sz=e[k]||'Unspecified';let q=uniformQty(e,k);totals[sz]=(totals[sz]||0)+q}return totals};
  const sizeCards=(totals,label)=>{let standard=SIZES.filter(sz=>totals[sz]).map(sz=>`<div class="uni-card"><div class="uni-size">${esc(sz)}</div><div class="uni-qty">${totals[sz]} ${esc(label)}</div></div>`).join('');let extra=Object.entries(totals).filter(([sz])=>!SIZES.includes(sz)).sort().map(([sz,qty])=>`<div class="uni-card"><div class="uni-size" style="font-size:15px">${esc(sz)}</div><div class="uni-qty">${qty} ${esc(label)}</div></div>`).join('');return (standard+extra)||'<p class="empty-note">No sizes on record for employees needing this item.</p>'};
  const table=(empList,k,statusMode)=>{if(!empList.length)return `<p class="empty-note">No ${esc(itemSingular[k])} currently marked ${esc(statusMode)}.</p>`;let rows=empList.map(e=>{let ft=(7-((e.rdo||[]).length||0))>=5;let q=uniformQty(e,k);let st=(e[k+'Status']||'needed').toLowerCase()||'needed';return `<tr><td><strong>${esc(fullName(e))}</strong></td><td>${rankBadge(e.rank)}</td><td><span class="shift-pill">${esc(e.shift||'')}</span>${e.gateShift?`<br><span class="mini-note">${esc(e.gateShift)}</span>`:''}</td><td>${statusBadge(st)}</td><td style="color:${ft?'var(--green)':'var(--gold)'};font-size:12px;font-weight:900">${ft?'FT':'PT'}</td><td><strong>${q}</strong></td><td><strong>${esc(e[k]||'—')}</strong></td></tr>`}).join('');return `<div class="table-wrap"><table class="wide-table"><thead><tr><th>Name</th><th>Rank</th><th>Shift</th><th>Status</th><th>FT/PT</th><th>Qty</th><th>Size</th></tr></thead><tbody>${rows}</tbody></table></div>`};
  const collapsible=(title,count,inner,open=false,cls='')=>`<details class="uniform-collapse ${esc(cls)}" ${open?'open':''}><summary><span>${esc(title)} <b>(${count})</b></span><span class="collapse-hint">Click to ${open?'collapse':'expand'}</span></summary><div class="collapse-body">${inner}</div></details>`;
  const block=k=>{let need=eligible.filter(e=>needsOrder(e,k)).sort(personSort);let ordered=eligible.filter(e=>isOrdered(e,k)).sort(personSort);let issued=eligible.filter(e=>isIssued(e,k)).sort(personSort);let totals=buildTotals(need,k);let color=itemColor[k];return `<div class="item-block"><div class="item-head" style="color:${color};border-left-color:${color}">${itemLabel[k]}</div>${collapsible('Needed / Sizes to Order',need.length,`<div class="sub-head">Sizes to order${k==='jacket'?' - jackets count as 1 per employee':''}</div><div class="uniform-summary">${sizeCards(totals,k==='jacket'?'jackets':itemSingular[k]+'s')}</div><div class="sub-head">Who needs ${itemSingular[k]}s</div>${table(need,k,'needed')}`,true,'needed')}${collapsible('Already Ordered',ordered.length,table(ordered,k,'ordered'),false,'ordered')}${collapsible('Issued',issued.length,table(issued,k,'issued'),false,'issued')}</div>`};
  let shirtNeed=eligible.filter(e=>needsOrder(e,'shirt')).length;
  let pantsNeed=eligible.filter(e=>needsOrder(e,'pants')).length;
  let jacketNeed=eligible.filter(e=>needsOrder(e,'jacket')).length;
  return `<div class="uniform-original"><div class="uniform-toolbar"><div><div class="page-title">Uniform Orders</div><div class="page-sub">5 sets for full-time, 3 sets for part-time. ONIN / APS excluded. Jackets count as 1 per employee.</div></div><div class="top-actions"><button onclick="printUniformOrderSheet()">Print Order Sheet</button><button onclick="exportUniformCSV()">Export Uniform CSV</button></div></div><div class="stat-strip"><div class="stat-card"><div class="stat-value">${shirtNeed}</div><div class="stat-label">Shirts to Order</div></div><div class="stat-card orange"><div class="stat-value">${pantsNeed}</div><div class="stat-label">Pants to Order</div></div><div class="stat-card blue"><div class="stat-value">${jacketNeed}</div><div class="stat-label">Jackets to Order</div></div><div class="stat-card gold"><div class="stat-value">${eligible.length}</div><div class="stat-label">Eligible Staff</div></div></div>${items.map(block).join('')}</div>`
}
function renderRosterAnalytics(){
  const activeEmps=rosterActiveEmployees();
  const byShift=countBy(activeEmps,e=>e.shift||'Blank');
  const byRank=countBy(activeEmps,e=>e.rank||'Blank');
  const byClass=countBy(activeEmps,e=>employmentClass(e));
  const sched=scheduleMetrics();
  const costRows=employeeCostRows(activeEmps);
  const openUniform=activeEmps.reduce((n,e)=>n+['shirt','pants','jacket'].filter(k=>(e[k+'Status']||'')&&e[k+'Status']!=='issued').length,0);
  const training=trainingReadinessMetrics(activeEmps);
  const tempPct=activeEmps.length?(((byClass.TempToHire||0)/activeEmps.length)*100):0;
  return `<div class="analytics-toolbar"><div><div class="page-title">Labor Analytics</div><div class="page-sub">Headcount, coverage, loaded cost, overtime exposure, RDO risk, temp dependency, and readiness indicators from the live roster schedule.</div></div><div class="top-actions"><button onclick="printAnalytics()">Print Analytics</button><button onclick="exportAnalyticsCSV()">Export Analytics CSV</button></div></div>

  <div class="grid cols-2"><div class="card"><div class="card-title">PT / FT / TempToHire</div>${analyticsBars(byClass)}<div class="health-row"><span>Temp dependency</span><span class="${tempPct>25?'warn':'ok'}">${tempPct.toFixed(1)}%</span></div></div><div class="card"><div class="card-title">Coverage Risk by Shift / Area</div>${coverageRiskTable(sched)}</div><div class="card"><div class="card-title">Cost Snapshot</div><div class="analytics-money">${money(sched.loadedCost)} / week loaded</div><div class="health-row"><span>Base labor cost</span><span>${money(sched.cost)}</span></div><div class="health-row"><span>Loaded add-on</span><span>${money(sched.loadedCost-sched.cost)}</span></div><div class="health-row"><span>Monthly loaded run rate</span><span>${money(sched.loadedCost*52/12)}</span></div><div class="health-row"><span>Annual loaded run rate</span><span>${money(sched.loadedCost*52)}</span></div></div><div class="card"><div class="card-title">Readiness / Risk Signals</div><div class="health-row"><span>Uniform needs/orders</span><span class="warn">${openUniform}</span></div><div class="health-row"><span>Training no-record/overdue</span><span class="warn">${training.issueCount}</span></div><div class="health-row"><span>Unmatched schedule names</span><span class="warn">${sched.unmatched}</span></div><div class="health-row"><span>RDO conflict flags</span><span class="warn">${sched.rdoConflicts}</span></div><div class="health-row"><span>People over 40 HPW</span><span class="warn">${sched.overtimePeople}</span></div></div></div>
  <div class="card"><div class="card-title">Scheduled vs Required Hours</div><div class="table-wrap"><table class="wide-table"><thead><tr><th>Section</th><th>Rows</th><th>Assigned Slots</th><th>Open Slots</th><th>Assigned HPW</th><th>Required HPW</th><th>Gap HPW</th><th>Base Cost</th><th>Loaded Cost</th></tr></thead><tbody>${Object.values(sched.sections).map(x=>`<tr><td>${esc(x.section)}</td><td>${x.rows}</td><td>${x.assigned}</td><td class="schedule-risk">${x.open}</td><td>${x.assignedHours}</td><td>${x.requiredHours}</td><td class="schedule-risk">${x.openHours}</td><td>${money(x.cost)}</td><td>${money(x.loadedCost)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><div class="card-title">Employee Cost Detail</div><div class="mini-note">Weekly cost uses scheduled hours when the employee appears on the master schedule. If no schedule row is found, it uses a planning fallback of FT/Temp 40 HPW and PT 24 HPW.</div><div class="table-wrap"><table class="wide-table"><thead><tr><th>Employee</th><th>Class</th><th>Rate</th><th>HPW</th><th>Base Week</th><th>Loaded Week</th><th>Base Month</th><th>Loaded Month</th><th>Base Year</th><th>Loaded Year</th></tr></thead><tbody>${costRows.map(r=>`<tr><td><strong>${esc(r.employee)}</strong><br><span class="mini-note">${esc(r.shift)} · ${esc(r.rank)}${r.source==='fallback'?' · fallback hours':''}</span></td><td>${esc(r.class)}</td><td>${money(r.rate)}</td><td>${r.hours}</td><td>${money(r.baseWeek)}</td><td>${money(r.loadedWeek)}</td><td>${money(r.baseMonth)}</td><td>${money(r.loadedMonth)}</td><td>${money(r.baseYear)}</td><td>${money(r.loadedYear)}</td></tr>`).join('')}</tbody></table></div></div>`

function scheduleMetrics(){let out={hours:0,assignedHours:0,requiredHours:0,openHours:0,cost:0,loadedCost:0,open:0,unmatched:0,fte:0,rdoConflicts:0,overtimeHours:0,overtimePeople:0,sections:{},risk:{},employeeHours:{}};for(const row of (roster.schedule||[])){let sec=row.section||'Unassigned';let shift=scheduleSectionShift(sec);let bucket=out.sections[sec]||(out.sections[sec]={section:sec,rows:0,assigned:0,open:0,assignedHours:0,requiredHours:0,openHours:0,cost:0,loadedCost:0});let risk=out.risk[shift]||(out.risk[shift]={shift,assigned:0,open:0,assignedHours:0,requiredHours:0,openHours:0});bucket.rows++;for(let dayIdx=0;dayIdx<(row.days||[]).length;dayIdx++){let val=(row.days||[])[dayIdx];let low=String(val||'').trim().toLowerCase();if(scheduleCellIsBlank(val))continue;let hrs=Number(row.hrs||8);bucket.requiredHours+=hrs;out.requiredHours+=hrs;risk.requiredHours+=hrs;if(scheduleCellIsOpen(val)){out.open++;out.openHours+=hrs;bucket.open++;bucket.openHours+=hrs;risk.open++;risk.openHours+=hrs;continue;}out.hours+=hrs;out.assignedHours+=hrs;bucket.assigned++;bucket.assignedHours+=hrs;risk.assigned++;risk.assignedHours+=hrs;let emp=findRosterByScheduleName(val);if(emp){let cost=Number(emp.rate||0)*hrs;let loaded=loadedHourlyRate(emp)*hrs;out.cost+=cost;out.loadedCost+=loaded;bucket.cost+=cost;bucket.loadedCost+=loaded;let key=String(emp.id);out.employeeHours[key]=(out.employeeHours[key]||0)+hrs;if((emp.rdo||[]).includes(DAYS[dayIdx]))out.rdoConflicts++;}else out.unmatched++;}}for(const [id,h] of Object.entries(out.employeeHours)){if(h>40){out.overtimePeople++;out.overtimeHours+=h-40;}}out.fte=out.assignedHours/40;return out}
function coverageRiskTable(sched){let rows=Object.values(sched.risk||{}).sort((a,b)=>b.openHours-a.openHours||String(a.shift).localeCompare(String(b.shift)));if(!rows.length)return '<p class="empty-note">No schedule rows found.</p>';return `<div class="table-wrap"><table class="wide-table"><thead><tr><th>Shift / Area</th><th>Assigned HPW</th><th>Required HPW</th><th>Gap HPW</th><th>Open Slots</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.shift)}</td><td>${r.assignedHours}</td><td>${r.requiredHours}</td><td class="schedule-risk">${r.openHours}</td><td class="schedule-risk">${r.open}</td></tr>`).join('')}</tbody></table></div>`}
function trainingReadinessMetrics(activeEmps){let issueCount=0;const topics=(roster.trainingTopics||[]).filter(t=>t.required!==false);for(const e of activeEmps||[]){for(const t of topics){let rec=latestTrainingRecord(e.id,t.id);let st=trainingStatus(rec,t);if(st==='No Record'||st==='Overdue')issueCount++;}}return{issueCount}}

function attendancePatternFindings(opts={}){const dates=getPatternDates(),s=attendance.settings||{},items=[];for(const e of activeAttendanceEmployees()){const resetDates=acknowledgedDisciplineDateSet(e.id);const disc=[],week={},month={},dow={};for(const d of dates){if(resetDates.has(d))continue;const c=getCode(e.id,d);if(!DISCIPLINE_CODES.has(c))continue;const dt=parseISO(d),wk=weekKey(dt),mo=d.slice(0,7),day=DAYS[dt.getDay()];const item={date:d,code:c};disc.push(item);if(c==='T'){(week[wk]=week[wk]||[]).push(item);(month[mo]=month[mo]||[]).push(item);(dow[day]=dow[day]||[]).push(item)}}const add=(type,sev,sort,msg,periodKey,arr)=>{const key=patternKey(e.id,type,periodKey);items.push({emp:e,type,sev,sort,msg,periodKey,dates:arr,key,acknowledged:false,action:null})};if(disc.length>=(s.rollingThreshold||6))add('90-Day Discipline','critical',0,`${disc.length} open T/U/UE occurrence(s) in the rolling 90-day window`,`rolling-${dates[0]}-${dates[dates.length-1]}`,disc);else if(disc.length>=4)add('90-Day Discipline','high',1,`${disc.length} open T/U/UE occurrence(s) in the rolling 90-day window`,`rolling-${dates[0]}-${dates[dates.length-1]}`,disc);for(const [k,v] of Object.entries(week))if(v.length>=(s.weekThreshold||3))add('Weekly Tardy Pattern','high',2,`${v.length} open tardy occurrence(s) in week of ${k}`,k,v);for(const [k,v] of Object.entries(month))if(v.length>=(s.monthThreshold||5))add('Monthly Tardy Pattern','high',3,`${v.length} open tardy occurrence(s) in ${k}`,k,v);for(const [k,v] of Object.entries(dow))if(v.length>=(s.patternThreshold||3))add('Day-of-Week Pattern','medium',4,`${v.length} open tardy occurrence(s) on ${k}s`,k,v);}return items.sort((a,b)=>a.sort-b.sort||a.emp.name.localeCompare(b.emp.name)||a.type.localeCompare(b.type))}

function patternPersonGroups(){
  const open=attendancePatternFindings({includeAcknowledged:false}).filter(x=>entryShift==='All'||x.emp.shift===entryShift);
  const map={};
  for(const p of open){
    const id=String(p.emp.id);
    if(!map[id])map[id]={emp:p.emp,patterns:[],stats:attendancePeriodStats(p.emp)};
    map[id].patterns.push(p);
  }
  return Object.values(map).sort((a,b)=>{
    const ac=a.patterns.some(p=>p.sev==='critical')?0:1,bc=b.patterns.some(p=>p.sev==='critical')?0:1;
    return ac-bc||a.emp.name.localeCompare(b.emp.name);
  });
}

function computeFlags(){const dates=getDates(),flags=[],s=attendance.settings;for(const e of activeAttendanceEmployees()){let issues=[],counts={week:{},month:{},dow:{}},disc=[],occ=[];for(const d of dates){const c=getCode(e.id,d);if(!DISCIPLINE_CODES.has(c))continue;const dt=parseISO(d),wk=weekKey(dt),mo=d.slice(0,7),dow=DAYS[dt.getDay()];const item={date:d,code:c};if(c==='U')issues.push({type:'Unexcused',sev:'critical',periodKey:d,msg:`Unexcused absence on ${fmt(d)}`,issueDates:[item]});if(c==='UE')issues.push({type:'Unauthorized Early',sev:'high',periodKey:d,msg:`Unauthorized early departure on ${fmt(d)}`,issueDates:[item]});disc.push(item);occ.push(item);if(c==='T'){counts.week[wk]=counts.week[wk]||[];counts.week[wk].push(item);counts.month[mo]=counts.month[mo]||[];counts.month[mo].push(item);counts.dow[dow]=counts.dow[dow]||[];counts.dow[dow].push(item)}}if(disc.length>=s.rollingThreshold)issues.push({type:'90-Day',sev:'critical',periodKey:`rolling-${dates[dates.length-1]}-${dates[0]}`,msg:`${disc.length} discipline occurrence(s) in 90 days`,issueDates:disc});for(const [k,it] of Object.entries(counts.week))if(it.length>=s.weekThreshold)issues.push({type:'Weekly',sev:'high',periodKey:k,msg:`${it.length} tardy occurrence(s) in week of ${k}`,issueDates:it});for(const [k,it] of Object.entries(counts.month))if(it.length>=s.monthThreshold)issues.push({type:'Monthly',sev:'high',periodKey:k,msg:`${it.length} tardy occurrence(s) in ${k}`,issueDates:it});for(const [k,it] of Object.entries(counts.dow))if(it.length>=s.patternThreshold)issues.push({type:'Pattern',sev:'medium',periodKey:k,msg:`${it.length} tardy occurrence(s) on ${k}s`,issueDates:it});if(occ.length>=6)issues.push({type:'Occurrences',sev:'critical',periodKey:`occ-${dates[dates.length-1]}-${dates[0]}`,msg:`${occ.length} discipline occurrence(s) in 90 days`,issueDates:occ});else if(occ.length>=4)issues.push({type:'Occurrences',sev:'high',periodKey:`occ-${dates[dates.length-1]}-${dates[0]}`,msg:`${occ.length} discipline occurrence(s) in 90 days`,issueDates:occ});for(const iss of issues){const k=flagKey(e.id,iss.type,iss.periodKey),a=attendance.flagActions[k];flags.push({...iss,emp:e,key:k,addressed:!!a,action:a||null})}}return flags}
function attendancePeriodStats(emp){
  const dates=getDates();
  const todayIso=new Date().toISOString().slice(0,10);
  const weekStart=weekKey(new Date());
  const monthKey=todayIso.slice(0,7);
  const buckets={week:{},month:{},rolling:{},dates:{},entries:[]};
  for(const d of dates){
    const c=getCode(emp.id,d);
    if(!c)continue;
    const entry={date:d,code:c,label:codeLabel(c)};
    buckets.entries.push(entry);
    buckets.dates[c]=buckets.dates[c]||[];
    buckets.dates[c].push(d);
    if(d>=weekStart)buckets.week[c]=(buckets.week[c]||0)+1;
    if(d.slice(0,7)===monthKey)buckets.month[c]=(buckets.month[c]||0)+1;
    buckets.rolling[c]=(buckets.rolling[c]||0)+1;
  }
  return buckets;
}
function codeCount(stats,period,code){return Number((stats[period]||{})[code]||0)}
function codeDateList(stats,code){return (stats.dates[code]||[]).slice().sort((a,b)=>b.localeCompare(a))}
function codeCountExceeded(stats,period,code){
  const n=codeCount(stats,period,code);
  if(!n)return false;
  const s=attendance.settings||{};
  if(code==='U'||code==='UE')return n>0;
  if(code==='T'){
    if(period==='week')return n>=(s.weekThreshold||3);
    if(period==='month')return n>=(s.monthThreshold||5);
    if(period==='rolling')return n>=(s.rollingThreshold||6);
  }
  return false;
}
function codeCountCells(stats,period,codes){return codes.map(c=>{const n=codeCount(stats,period,c);const hit=codeCountExceeded(stats,period,c);return `<td class="${hit?'threshold-number':''}"><span class="badge ${esc(c)}" title="${esc(codeLabel(c))}">${esc(c)}</span><br><strong>${n}</strong></td>`}).join('')}
function periodCodeTotal(stats,period,codes){return codes.reduce((n,c)=>n+codeCount(stats,period,c),0)}

  }).join('');

function buildBuckets(flags){const order=['T','AL','LE','E','U','UE','V','GEN'],map={};for(const f of flags){for(const it of (f.issueDates&&f.issueDates.length?f.issueDates:[{code:'GEN',date:f.periodKey}])){const code=order.includes(it.code)?it.code:'GEN';map[code]=map[code]||{code,dates:{},flags:[]};if(it.date)map[code].dates[it.date]=true;if(!map[code].flags.some(x=>x.key===f.key))map[code].flags.push(f)}}return Object.values(map).sort((a,b)=>order.indexOf(a.code)-order.indexOf(b.code)).map(b=>({...b,dateList:Object.keys(b.dates).sort((a,b)=>b.localeCompare(a))}))}
function renderExceptions(){const flags=computeFlags();const open=flags.filter(f=>!f.addressed);let groups={};for(const f of flags){groups[f.emp.id]=groups[f.emp.id]||{emp:f.emp,flags:[]};groups[f.emp.id].flags.push(f)}let list=Object.values(groups).sort((a,b)=>b.flags.filter(f=>!f.addressed).length-a.flags.filter(f=>!f.addressed).length||a.emp.name.localeCompare(b.emp.name));return `<div class="grid cols-3"><div class="kpi"><div class="num">${open.filter(f=>f.sev==='critical').length}</div><div class="lbl">Critical Open</div></div><div class="kpi"><div class="num">${open.filter(f=>f.sev==='high').length}</div><div class="lbl">High Open</div></div><div class="kpi"><div class="num">${open.length}</div><div class="lbl">Total Open</div></div></div><div class="notice">Grouped by person, then code bucket. Clear individual rule, clear code, or clear person.</div><br>${list.map(renderFlagGroup).join('')||'<div class="card"><div class="card-title">No Exceptions</div>No exceptions found.</div>'}`}
function renderFlagGroup(g){const open=g.flags.filter(f=>!f.addressed),buckets=buildBuckets(g.flags);const critical=g.flags.filter(f=>f.sev==='critical'&&!f.addressed).length;return `<details class="flag-person-details"><summary><div class="flag-person"><strong>${esc(g.emp.name)}</strong><span>${esc(g.emp.shift)} · ${esc(g.emp.title)}</span></div><div>${open.length?`<span class="chip">${open.length} Open</span>`:''}${critical?'<span class="chip critical">Critical</span>':''}<span class="chip">${buckets.length} Code Bucket(s)</span></div><div>${open.length?`<button data-clear-person="${esc(g.emp.id)}">Clear Person</button>`:''}</div></summary><div class="flag-person-detail-body">${buckets.map(b=>renderBucket(g.emp,b)).join('')}</div></details>`}
function renderBucket(emp,b){const open=b.flags.filter(f=>!f.addressed);return `<details class="bucket"><summary><span class="badge ${esc(b.code)}">${esc(b.code)}</span><span>${esc(codeLabel(b.code))}<br><small>${esc(b.dateList.slice(0,8).map(fmt).join(', '))}${b.dateList.length>8?' ...':''}</small></span><span class="chip">${b.dateList.length} dates</span><span>${open.length?`<button class="sm" data-clear-code-emp="${esc(emp.id)}" data-clear-code="${esc(b.code)}">Clear ${esc(b.code)}</button>`:''}</span></summary><div class="bucket-body">${b.flags.map(renderExceptionCard).join('')}</div></details>`}function codeLabel(c){return CODES.find(x=>x[0]===c)?.[1]||'General'}function renderExceptionCard(f){return `<div class="exception-card ${f.sev} ${f.addressed?'addressed':''}"><div><div class="sev ${f.sev}">${f.sev}</div><span class="chip">${esc(f.type)}</span></div><div>${esc(f.msg)}<br><small>Issue Dates: ${esc(issueDateLabel(f.issueDates))}</small>${f.addressed?`<br><span class="ok">${esc(f.action.actionType||'Reviewed')} · ${esc(f.action.note||'')}</span>`:''}</div><div>${f.addressed?`<button class="sm" data-reopen="${esc(f.key)}">Reopen</button>`:`<button class="sm" data-action="Coaching" data-key="${esc(f.key)}">Coaching</button> <button class="sm" data-action="Verbal Warning" data-key="${esc(f.key)}">Verbal</button> <button class="sm" data-action="Written Warning" data-key="${esc(f.key)}">Written</button> <button class="sm" data-action="Final Warning" data-key="${esc(f.key)}">Final</button>`}</div></div>`}
function clearKeys(keys,actionType,note){const stamp=new Date().toISOString();for(const k of keys)attendance.flagActions[k]={at:stamp,actionType,note};audit('Flags cleared',`${keys.length} flag(s) · ${actionType}`);saveAttendance();safeRenderPages()}document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b){let note=prompt('Supervisor note:',b.dataset.action+' completed');if(note!==null)clearKeys([b.dataset.key],b.dataset.action,note||b.dataset.action);return}b=e.target.closest('[data-reopen]');if(b){delete attendance.flagActions[b.dataset.reopen];saveAttendance();safeRenderPages();return}b=e.target.closest('[data-clear-person]');if(b){let fs=computeFlags().filter(f=>f.emp.id===b.dataset.clearPerson&&!f.addressed);let note=prompt('Clear all open exceptions for this person:', 'Reviewed / cleared');if(note!==null)clearKeys(fs.map(f=>f.key),'Reviewed / Cleared',note);return}b=e.target.closest('[data-clear-code]');if(b){let fs=computeFlags().filter(f=>f.emp.id===b.dataset.clearCodeEmp&&!f.addressed&&(f.issueDates||[]).some(it=>it.code===b.dataset.clearCode));let note=prompt('Clear '+b.dataset.clearCode+' exceptions:', b.dataset.clearCode+' reviewed / cleared');if(note!==null)clearKeys([...new Set(fs.map(f=>f.key))],'Reviewed / Cleared',note);return}});

async function importAttendanceJSON(input){const file=input&&input.files&&input.files[0];if(!file)return;try{const text=await file.text();const data=JSON.parse(text);if(!Array.isArray(data.employees)||!data.attendance||typeof data.attendance!=='object')throw new Error('File does not look like a PWADC attendance JSON export.');const oldCount=attendance.employees.length;attendance=data;normalizeAttendance();audit('Attendance JSON imported',file.name+' · '+attendance.employees.length+' employees · previous '+oldCount);await createAttendanceBackup();saveAttendance('import');entryDate='2026-06-01';gridEnd='2026-06-01';safeRenderPages();toast('Imported attendance JSON: '+file.name)}catch(e){toast('Import failed: '+e.message)}finally{if(input)input.value=''}}

async function createAttendanceBackup(){try{let r=await SuiteBridge.send('suite:createBackup',attendance,{module:'attendance'});toast('Backup created');}catch(e){toast('Backup failed: '+e.message)}}function exportAttendanceCSV(){let rows=['Employee,Shift,Title,Date,Code,Note'];for(const e of attendance.employees){for(const [d,c] of Object.entries(attendance.attendance[e.id]||{})){let n=attendance.notes[e.id+'|'+d]||'';rows.push([e.name,e.shift,e.title,d,c,n].map(x=>'"'+String(x||'').replace(/"/g,'""')+'"').join(','))}}SuiteBridge.send('suite:writeExport',rows.join('\n'),{module:'attendance',fileName:'attendance-export-'+new Date().toISOString().slice(0,10)+'.csv'}).then(()=>toast('CSV exported')).catch(e=>toast('Export failed: '+e.message))}

function taskClass(st){let s=String(st||'').toLowerCase();if(s.includes('complete'))return'task-complete';if(s.includes('hold')||s.includes('table'))return'task-hold';if(s.includes('wait')||s.includes('follow'))return'task-waiting';if(s.includes('risk')||s.includes('blocked'))return'task-risk';if(s.includes('plan')||s.includes('final'))return'task-planning';return'task-active'}

function taskDateShort(iso){if(!iso)return'';try{return new Date(iso+'T00:00:00').toLocaleDateString()}catch(e){return iso}}
function filteredTasks(){let q=taskSearch.toLowerCase().trim();return (tasks.tasks||[]).filter(t=>{const st=String(t.status||'Active');if(taskStatusFilter==='all'&&(st==='Archived'||st==='Complete'))return false;if(taskStatusFilter!=='all'&&st!==taskStatusFilter)return false;if(taskPriorityFilter!=='all'&&t.priority!==taskPriorityFilter)return false;if(taskCategoryFilter!=='all'&&t.category!==taskCategoryFilter)return false;if(q&&!(`${t.project} ${t.status} ${t.priority} ${t.category} ${t.owner} ${t.update}`.toLowerCase().includes(q)))return false;return true;}).sort((a,b)=>{const order={High:0,Medium:1,Low:2};return (order[a.priority]??1)-(order[b.priority]??1)||String(a.project).localeCompare(String(b.project));})}
