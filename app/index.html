}

}

window.addEventListener('unhandledrejection',ev=>{reportActionError('Unhandled action',ev.reason||ev);});function applyTheme(){document.documentElement.setAttribute('data-theme',settings.theme||'dark')}

function findAttendanceEmployeeForRoster(re){

function parseCsvLine(line){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(ch===','&&!q){out.push(cur);cur='';}else cur+=ch;}
  out.push(cur);return out.map(x=>x.trim());
}
function rowsFromCsv(text){
  return String(text||'').split(/\r?\n/).filter(x=>x.trim()).map(parseCsvLine);
}
function normalizePersonName(s){
  s=String(s||'').trim().replace(/\s+/g,' ');
  if(!s)return '';
  if(s.includes(','))return s;
  const parts=s.split(' ');
  if(parts.length>=2)return parts.slice(-1)[0]+', '+parts.slice(0,-1).join(' ');
  return s;
}
function maybeDate(s){
  const d=new Date(s);return isNaN(d.getTime())?'':d.toISOString().slice(0,10);

function maybeTime(s){
  const m=String(s||'').match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?/i);
  if(!m)return '';
  let h=Number(m[1]),min=m[2],ap=(m[3]||'').toUpperCase();
  if(ap==='PM'&&h<12)h+=12;if(ap==='AM'&&h===12)h=0;
  return String(h).padStart(2,'0')+':'+min;
}
function minutesOf(t){const m=String(t||'').match(/(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):null;}
async function runNativeBadgeAudit(){
  try{
    const punch=badgeAuditState.files.punch;
    if(!punch){toast('Badge audit needs the punch file first');return;}
    const punchText=await readAuditFile(punch);
    const punchRows=rowsFromCsv(punchText);
    if(!punchRows.length){toast('Punch file did not contain readable CSV/text rows');return;}
    const badgeFiles=['ts','gate','dispatch','recep'].filter(k=>badgeAuditState.files[k]);
    let badges=[];
    for(const k of badgeFiles){
      const txt=await readAuditFile(badgeAuditState.files[k]);
      for(const line of String(txt||'').split(/\r?\n/)){
        const date=maybeDate(line), time=maybeTime(line);
        if(!date||!time)continue;
        badges.push({date,time,line,source:k});
      }
    }
    const findings=[];
    const headers=punchRows[0].map(h=>String(h).toLowerCase());
    const nameIdx=headers.findIndex(h=>/name|employee/.test(h));
    const dateIdx=headers.findIndex(h=>/date/.test(h));
    const clockIdx=headers.findIndex(h=>/in|clock|punch|time/.test(h));
    for(const r of punchRows.slice(1)){
      const employee=normalizePersonName(r[nameIdx]||r[0]||'Unknown');
      const date=maybeDate(r[dateIdx]||r.join(' '));
      const clock=maybeTime(r[clockIdx]||r.join(' '));
      if(!date||!clock)continue;
      const sameDay=badges.filter(b=>b.date===date);
      if(!sameDay.length){findings.push({type:'No Badge Match',employee,date,clock,badge:'',source:'',notes:'No reader event found for this date in loaded logs'});continue;}
      const cm=minutesOf(clock);
      const prior=sameDay.filter(b=>minutesOf(b.time)!==null&&minutesOf(b.time)<=cm).sort((a,b)=>minutesOf(b.time)-minutesOf(a.time))[0];
      if(!prior){findings.push({type:'Clock-in Before Badge',employee,date,clock,badge:sameDay[0].time,source:sameDay[0].source,notes:'Clock time appears before first loaded badge event for that date'});}
    }
    badgeAuditState.findings=findings;
    badgeAuditState.ranAt=new Date().toISOString();
    safeRenderPages();toast('Badge audit complete: '+findings.length+' finding(s)');
  }catch(e){toast('Badge audit failed: '+e.message)}
}

  </div>`;
}

function normPersonName(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
function rosterDisplayName(e){return fullName(e||{});}
function attendanceDisplayName(e){return String((e&&e.name)||'').trim();}
function scheduleNameToPersonKey(s){let x=String(s||'').trim();if(!x||['none','open','pending','closed'].includes(x.toLowerCase()))return '';x=x.replace(/^(SUPV|LSO|SSO|SO|PSO|APS|ONIN|RECEP|Receptionist)\s+/i,'').trim();if(x.includes(',')){let parts=x.split(',');x=(parts[1]+' '+parts[0]).trim();}return normPersonName(x);}
function buildRosterIndexes(){const active=(roster.employees||[]).filter(e=>!e.archived&&e.status!=='Archived');const archived=(roster.employees||[]).filter(e=>e.archived||e.status==='Archived');const byName=new Map(),archByName=new Map(),byId=new Map();active.forEach(e=>{byName.set(normPersonName(rosterDisplayName(e)),e);byId.set(String(e.id),e);});archived.forEach(e=>archByName.set(normPersonName(rosterDisplayName(e)),e));return{active,archived,byName,archByName,byId};}
function buildAttendanceIndexes(){const active=(attendance.employees||[]).filter(e=>e.active!==false&&!e.archived&&e.status!=='Archived');const archived=(attendance.employees||[]).filter(e=>e.active===false||e.archived||e.status==='Archived');const byName=new Map(),byId=new Map();active.forEach(e=>{byName.set(normPersonName(attendanceDisplayName(e)),e);byId.set(String(e.id),e);});return{active,archived,byName,byId};}
function findRosterEmployeeForAttendance(a){return findRosterEmployeeForAttendanceLoose(a);}
function computeDataHealth(){const issues=[];const add=(severity,module,title,detail)=>issues.push({severity,module,title,detail});const ri=buildRosterIndexes(),ai=buildAttendanceIndexes();
 const rosterNameCounts={},attNameCounts={},eidCounts={};
 for(const e of roster.employees||[]){const nk=normPersonName(rosterDisplayName(e));if(nk)rosterNameCounts[nk]=(rosterNameCounts[nk]||0)+1;const eid=String(e.eid||'').trim().toUpperCase();if(eid&&eid!=='ONIN'&&eid!=='AUTOMATION')eidCounts[eid]=(eidCounts[eid]||0)+1;if(!e.last&&!e.first)add('warning','Roster','Blank roster name','Roster employee id '+(e.id||'?')+' is missing first/last name.');if(!e.shift)add('warning','Roster','Missing shift',rosterDisplayName(e)+' does not have a shift.');if(!Array.isArray(e.rdo))add('warning','Roster','Invalid RDO',rosterDisplayName(e)+' has missing or invalid RDO values.');}
 for(const e of attendance.employees||[]){const nk=normPersonName(attendanceDisplayName(e));if(nk)attNameCounts[nk]=(attNameCounts[nk]||0)+1;if(!attendanceDisplayName(e))add('warning','Attendance','Blank attendance name','Attendance employee id '+(e.id||'?')+' is missing a name.');if(!e.shift)add('warning','Attendance','Missing shift',attendanceDisplayName(e)+' does not have a shift.');}
 Object.keys(rosterNameCounts).filter(k=>rosterNameCounts[k]>1).forEach(k=>add('warning','Roster','Duplicate roster name',k+' appears '+rosterNameCounts[k]+' times.'));
 Object.keys(attNameCounts).filter(k=>attNameCounts[k]>1).forEach(k=>add('warning','Attendance','Duplicate attendance name',k+' appears '+attNameCounts[k]+' times.'));
 Object.keys(eidCounts).filter(k=>eidCounts[k]>1).forEach(k=>add('critical','Roster','Duplicate EID',k+' appears '+eidCounts[k]+' times in active/archived roster data.'));
 for(const e of ri.active){if(!findAttendanceEmployeeForRosterLoose(e))add('info','Roster/Attendance','Roster employee not linked to Attendance',rosterDisplayName(e)+' is active in Roster but not confidently matched in Attendance.');}
 for(const e of ai.active){if(!findRosterEmployeeForAttendanceLoose(e))add('warning','Roster/Attendance','Attendance employee missing from active Roster',attendanceDisplayName(e)+' is active in Attendance but not confidently matched in active Roster.');}
 for(const e of ai.active){const key=normPersonName(attendanceDisplayName(e));if(key&&ri.archByName.has(key))add('critical','Roster/Attendance','Archived employee still active in Attendance',attendanceDisplayName(e)+' is archived in Roster but still active in Attendance.');}
 for(const row of roster.schedule||[]){for(const d of row.days||[]){const k=scheduleNameToPersonKey(d);if(!k)continue;const match=findRosterByScheduleName(d);if(!match)add('warning','Schedule','Schedule assignment not found in Roster',String(d)+' in '+(row.section||'Schedule')+' / '+(row.post||'post')+' does not match a roster employee.');else if(isArchivedEmployee(match))add('critical','Schedule','Archived person on schedule',String(d)+' appears on the schedule but is archived.');}}
 const topicById=new Map((roster.trainingTopics||[]).map(t=>[String(t.id),t]));for(const tr of roster.trainingRecords||[]){if(!ri.byId.has(String(tr.employeeId)))add('warning','Training','Training record for missing employee','Training record '+(tr.id||'?')+' points to employeeId '+(tr.employeeId||'?')+'.');const topic=topicById.get(String(tr.topicId));if(topic&&Number(topic.interval||topic.renewalDays||0)>0&&!tr.dueDate)add('warning','Training','Missing due date','Training record '+(tr.id||'?')+' is tied to renewable topic '+(topic.name||topic.title||tr.topicId)+' but has no due date.');if(tr.dueDate&&tr.dueDate<new Date().toISOString().slice(0,10))add('info','Training','Overdue training record','Training record '+(tr.id||'?')+' due '+tr.dueDate+'.');}
 for(const e of roster.employees||[]){const nm=rosterDisplayName(e);[['shirt','shirtStatus'],['pants','pantsStatus'],['jacket','jacketStatus']].forEach(pair=>{const size=e[pair[0]],status=String(e[pair[1]]||'').toLowerCase();if(['needed','ordered','issued'].includes(status)&&!size)add('warning','Uniforms','Uniform status without size',nm+' has '+pair[0]+' marked '+status+' but no size entered.');});}
 const today=new Date().toISOString().slice(0,10);for(const t of tasks.tasks||[]){if(t.status!=='Complete'&&t.status!=='Archived'){if(t.dueDate&&t.dueDate<today)add('warning','Tasks','Overdue active task',t.project+' was due '+t.dueDate+'.');if(!t.status)add('warning','Tasks','Task missing status',t.project+' has no status.');if(!t.update)add('info','Tasks','Task missing update',t.project+' has no current update.');}}
 const critical=issues.filter(i=>i.severity==='critical').length,warning=issues.filter(i=>i.severity==='warning').length,info=issues.filter(i=>i.severity==='info').length;return{issues,critical,warning,info,ok:critical===0&&warning===0};}
async function alignAttendanceNamesToRoster(){
  if(!confirm('Align Attendance employee names and basic fields to the Roster source of truth? This will NOT merge, delete, or erase attendance history. A backup will be created first.'))return;
  try{await SuiteBridge.send('suite:createBackup',attendance,{module:'attendance'});}catch(e){console.warn('Pre-align backup failed',e)}
  let updated=0, linked=0, skipped=0;
  const activeRoster=rosterActiveEmployees();
  for(const re of activeRoster){
    const a=findAttendanceEmployeeForRosterLoose(re);
    if(!a){skipped++;continue;}
    const before=JSON.stringify({name:a.name,title:a.title,shift:a.shift,rdos:a.rdos,startDate:a.startDate,rosterId:a.rosterId});
    a.rosterId=String(re.id);
    a.name=rosterEmployeeAttendanceName(re);
    a.title=re.rank||a.title||'';
    a.shift=rosterShiftToAttendanceShift(re.shift)||a.shift||'';
    a.rdos=rosterRdoToAttendanceRdos(re.rdo);
    a.startDate=a.startDate||re.doh||re.dop||'';
    a.active=true;
    a.archived=false;
    a.status='Active';
    const after=JSON.stringify({name:a.name,title:a.title,shift:a.shift,rdos:a.rdos,startDate:a.startDate,rosterId:a.rosterId});
    if(before!==after)updated++;
    linked++;
  }
  attendance.audit=Array.isArray(attendance.audit)?attendance.audit:[];
  attendance.audit.unshift({at:new Date().toISOString(),user:currentUserName()||env.user||'',machine:env.machine||'',action:'Aligned Attendance names to Roster',detail:`Linked ${linked}, updated ${updated}, skipped ${skipped}. No history deleted or merged.`});
  const ok=await saveAttendanceNow('align-attendance-names');
  safeRenderPages();
  toast(ok?`Attendance names aligned: ${updated} updated, ${skipped} skipped.`:'Attendance alignment failed');
}

function printDataHealth(){const h=computeDataHealth();const html=`<html><head><title>PWADC Data Health Check</title><style>body{font-family:Arial,sans-serif;padding:24px}h1{margin-bottom:4px}.issue{border:1px solid #ccc;border-left:5px solid #999;margin:8px 0;padding:8px}.critical{border-left-color:#c0272d}.warning{border-left-color:#e08a2f}.info{border-left-color:#4a90d9}.meta{font-size:12px;color:#555;text-transform:uppercase}</style></head><body><h1>PWADC Data Health Check</h1><p>${new Date().toLocaleString()} · ${h.issues.length} issue(s)</p>${h.issues.map(i=>`<div class="issue ${esc(i.severity)}"><strong>${esc(i.title)}</strong><div class="meta">${esc(i.severity)} · ${esc(i.module)}</div><div>${esc(i.detail)}</div></div>`).join('')||'<p>No issues found.</p>'}</body></html>`;const w=window.open('','_blank');w.document.write(html);w.document.close();w.print();}

function renderRestoreCenter(){const mods=[['attendance','Attendance'],['roster','Roster'],['tasks','Task Tracker'],['suite-settings','Suite Settings'],['programs','Standalone Programs']];return `<div class="page-head"><div><div class="page-title">Restore Center</div><div class="page-sub">Controlled recovery from JSON backups. The current live file is backed up before any restore.</div></div><div class="btn-group"><button class="primary" onclick="backupEverything()">Backup Everything First</button><button onclick="SuiteBridge.send('suite:openPath',{path:settings.dataRoot+'\\\\Backups'}).catch(e=>toast('Open backup folder failed: '+e.message))">Open Backup Folder</button></div></div><div class="restore-grid"><div class="card"><div class="card-title">Backup Sets</div><div class="restore-module-list">${mods.map(m=>`<button class="${restoreSelectedModule===m[0]?'active':''}" onclick="loadRestoreBackups('${m[0]}')">${m[1]}</button>`).join('')}</div><div class="small-note" style="margin-top:12px">Use this screen when a build or sync operation damages live data. Restores are deliberate, backed up, and module-specific.</div></div><div class="card"><div class="card-title">${esc(mods.find(m=>m[0]===restoreSelectedModule)?.[1]||restoreSelectedModule)} Backups</div>${restoreLoading?'<p>Loading backups...</p>':restoreBackups.length===0?`<p class="small-note">No backups loaded. Click a module on the left, or there are no backups for this module yet.</p>`:`${restoreBackups.map(b=>`<div class="backup-row"><div><div class="backup-name">${esc(b.name)}</div><div class="backup-meta">${esc(b.path)}</div></div><div class="backup-meta">${esc(b.modified||'')}</div><div><button class="danger" onclick="restoreBackup('${restoreSelectedModule}','${escAttr(b.path)}')">Restore This</button></div></div>`).join('')}`}</div></div>`;}

function printChangeLog(){const rows=combinedChangeLog().slice(0,500);const html=`<html><head><title>PWADC Change Log</title><style>body{font-family:Arial,sans-serif;padding:24px}.row{border-bottom:1px solid #ccc;padding:6px 0}.meta{font-size:12px;color:#555}</style></head><body><h1>PWADC Change Log</h1><p>${new Date().toLocaleString()}</p>${rows.map(r=>`<div class="row"><strong>${esc(r.module)} · ${esc(r.action||'')}</strong><div class="meta">${esc(r.at?new Date(r.at).toLocaleString():'')} · ${esc(r.user||'')} ${r.machine?'@ '+esc(r.machine):''}</div><div>${esc(r.detail||'')}</div></div>`).join('')}</body></html>`;const w=window.open('','_blank');w.document.write(html);w.document.close();w.print();}

function renderAttendance(){if(activeAttView==='exceptions')activeAttView='patterns';const views=['daily','grid','review','patterns','audit'];const label=v=>v==='daily'?'Daily Entry':v==='grid'?'90-Day Grid':v==='review'?'Attendance Review':v==='patterns'?'Patterns':'Audit Log';return `<div class="page-head"><div><div class="page-title">Attendance</div><div class="page-sub">Fast daily entry, 90-day grid, attendance review, pattern detection, shared JSON autosave</div></div><div><button onclick="document.getElementById('attendanceImportFile').click()">Import JSON</button> <button onclick="reloadPackagedAttendanceData()">Use Packaged Latest JSON</button> <button onclick="createAttendanceBackup()">Backup Now</button> <button onclick="exportAttendanceCSV()">Export CSV</button><input id="attendanceImportFile" type="file" accept=".json,application/json" class="hidden" onchange="importAttendanceJSON(this)"></div></div><div class="subnav">${views.map(v=>`<button class="${activeAttView===v?'active':''}" onclick="activeAttView='${v}';safeRenderPages()">${label(v)}</button>`).join('')}</div>${activeAttView==='daily'?renderDaily():activeAttView==='grid'?renderGrid():activeAttView==='review'?renderAttendanceReview():activeAttView==='patterns'?renderPatterns():renderAudit()}`}
function shiftRank(shift){let i=SHIFT_ORDER.indexOf(shift||'');return i>=0?i:99}
function sortedEmployees(){return activeAttendanceEmployees().slice().sort((a,b)=>shiftRank(a.shift)-shiftRank(b.shift)||(a.shift||'').localeCompare(b.shift||'')||(a.name||'').localeCompare(b.name||''))}
function currentRows(){let rows=sortedEmployees();if(entryShift!=='All')rows=rows.filter(e=>e.shift===entryShift);if(showBlanks)rows=rows.filter(e=>!getCode(e.id,entryDate));return rows}
function groupRowsByShift(rows){const groups=[];const map={};for(const e of rows){const sh=e.shift||'Unassigned';if(!map[sh]){map[sh]=[];groups.push({shift:sh,rows:map[sh]});}map[sh].push(e);}groups.sort((a,b)=>shiftRank(a.shift)-shiftRank(b.shift)||a.shift.localeCompare(b.shift));return groups}
function dailyCounts(rows){const dow=parseISO(entryDate).getDay();let entered=0,blank=0,rdo=0;for(const e of rows){if((e.rdos||[]).includes(dow))rdo++;if(getCode(e.id,entryDate))entered++;else blank++;}return{entered,blank,rdo,total:rows.length}}
function autoFillRdosForDate(date){let changed=0;const dow=parseISO(date).getDay();for(const e of activeAttendanceEmployees()){if((e.rdos||[]).includes(dow)&&!getCode(e.id,date)){attendance.attendance[e.id]=attendance.attendance[e.id]||{};attendance.attendance[e.id][date]='O';changed++;}}if(changed){audit('RDO auto-filled',changed+' blank RDO(s) set to O for '+date);saveAttendance('rdo-auto');}}
function empOpenFlags(empId){return computeFlags().filter(f=>String(f.emp.id)===String(empId)&&!f.addressed)}
function patternKey(empId,type,periodKey){return `pattern|${empId}|${type}|${periodKey}`}
function empOpenPatterns(empId){return attendancePatternFindings({includeAcknowledged:false}).filter(p=>String(p.emp.id)===String(empId))}
function empThresholdClass(empId){const fs=empOpenPatterns(empId);if(!fs.length)return '';return fs.some(f=>f.sev==='critical')?'threshold-hit':'threshold-high'}
function thresholdBadge(empId){const fs=empOpenPatterns(empId);if(!fs.length)return '';const crit=fs.some(f=>f.sev==='critical');return `<span class="threshold-pill ${crit?'':'high'}" title="${esc(fs.map(f=>f.msg).join(' | '))}">${crit?'Threshold':'Review'} ${fs.length}</span>`}
function getPatternDates(){let arr=[];for(let d=addDays(gridEnd,-89);d<=gridEnd;d=addDays(d,1))arr.push(d);return arr}
function acknowledgedDisciplineDateSet(empId){const set=new Set();const actions=attendance.patternActions||{};for(const a of Object.values(actions)){if(!a||String(a.empId)!==String(empId))continue;(a.dates||[]).forEach(it=>{if(it&&it.date)set.add(it.date);else if(typeof it==='string')set.add(it)})}return set}
function acknowledgedPatternsList(){return Object.entries(attendance.patternActions||{}).map(([key,a])=>({key,...a})).sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')))}
function attendancePatternFindings(opts={}){const dates=getPatternDates(),s=attendance.settings||{},items=[];for(const e of activeAttendanceEmployees()){const resetDates=acknowledgedDisciplineDateSet(e.id);const disc=[],week={},month={},dow={};for(const d of dates){if(resetDates.has(d))continue;const c=getCode(e.id,d);if(!DISCIPLINE_CODES.has(c))continue;const dt=parseISO(d),wk=weekKey(dt),mo=d.slice(0,7),day=DAYS[dt.getDay()];const item={date:d,code:c};disc.push(item);if(c==='T'){(week[wk]=week[wk]||[]).push(item);(month[mo]=month[mo]||[]).push(item);(dow[day]=dow[day]||[]).push(item)}}const add=(type,sev,sort,msg,periodKey,arr)=>{const key=patternKey(e.id,type,periodKey);items.push({emp:e,type,sev,sort,msg,periodKey,dates:arr,key,acknowledged:false,action:null})};if(disc.length>=(s.rollingThreshold||6))add('90-Day Discipline','critical',0,`${disc.length} open T/U/UE occurrence(s) in the rolling 90-day window`,`rolling-${dates[0]}-${dates[dates.length-1]}`,disc);else if(disc.length>=4)add('90-Day Discipline','high',1,`${disc.length} open T/U/UE occurrence(s) in the rolling 90-day window`,`rolling-${dates[0]}-${dates[dates.length-1]}`,disc);for(const [k,v] of Object.entries(week))if(v.length>=(s.weekThreshold||3))add('Weekly Tardy Pattern','high',2,`${v.length} open tardy occurrence(s) in week of ${k}`,k,v);for(const [k,v] of Object.entries(month))if(v.length>=(s.monthThreshold||5))add('Monthly Tardy Pattern','high',3,`${v.length} open tardy occurrence(s) in ${k}`,k,v);for(const [k,v] of Object.entries(dow))if(v.length>=(s.patternThreshold||3))add('Day-of-Week Pattern','medium',4,`${v.length} open tardy occurrence(s) on ${k}s`,k,v);}return items.sort((a,b)=>a.sort-b.sort||a.emp.name.localeCompare(b.emp.name)||a.type.localeCompare(b.type))}

function patternPersonGroups(){
  const open=attendancePatternFindings({includeAcknowledged:false}).filter(x=>entryShift==='All'||x.emp.shift===entryShift);
  const map={};
  for(const p of open){
    const id=String(p.emp.id);
    if(!map[id])map[id]={emp:p.emp,patterns:[],stats:attendancePeriodStats(p.emp)};
    map[id].patterns.push(p);
  }
  return Object.values(map).sort((a,b)=>{
    const ac=a.patterns.some(p=>p.sev==='critical')?0:1,bc=b.patterns.some(p=>p.sev==='critical')?0:1;

  });
}

function patternCategoryRows(stats,codes,patterns){

    const dates=codeDateList(stats,c).filter(d=>codes.includes(c));

    const cls=DISCIPLINE_CODES.has(c)&&issueDates.length?'threshold-number':'';
    return `<details class="bucket att-review-code"><summary><span class="badge ${esc(c)}">${esc(c)}</span><span><strong>${esc(codeLabel(c))}</strong><br><small>Week ${codeCount(stats,'week',c)} · Month ${codeCount(stats,'month',c)} · 90-Day ${codeCount(stats,'rolling',c)}</small></span><span class="chip ${cls? 'critical':''}">${issueDates.length||dates.length} date(s)</span></summary><div class="bucket-body">${dates.length?dates.map(d=>`<span class="chip ${pdates.has(d)?'critical':''}">${fmt(d)}</span>`).join(' '):'<span class="muted">No dates in selected 90-day window.</span>'}</div></details>`;

function acknowledgePattern(key){attendance.patternActions=attendance.patternActions||{};const pattern=attendancePatternFindings({includeAcknowledged:false}).find(p=>p.key===key);if(!pattern){toast('Pattern not found or already acknowledged');return}const note=prompt('Acknowledge and hide these dates from future threshold counts without creating a notice:', 'Reviewed. No notice issued at this time.');if(note===null)return;attendance.patternActions[key]={at:new Date().toISOString(),actionType:'Acknowledged',note:note||'Reviewed. No notice issued at this time.',empId:pattern.emp.id,empName:pattern.emp.name,empShift:pattern.emp.shift||'',empTitle:pattern.emp.title||'',type:pattern.type,msg:pattern.msg,dates:pattern.dates||[]};audit('Attendance pattern acknowledged and hidden',pattern.emp.name+' · '+pattern.type);saveAttendance();safeRenderPages({preserveScroll:true})}

function applyGridKeyboardCode(code){if(!selectedGridEmpId||!selectedGridDate){const rows=currentRows();const dates=getDates();if(rows.length)selectedGridEmpId=rows[0].id;if(dates.length)selectedGridDate=dates[0]}if(!selectedGridEmpId||!selectedGridDate)return;if(code==='CLEAR'){if(attendance.attendance[selectedGridEmpId])delete attendance.attendance[selectedGridEmpId][selectedGridDate];audit('Grid cell cleared',selectedGridEmpId+' · '+selectedGridDate);updateGridCellDom(selectedGridEmpId,selectedGridDate,'');saveAttendance();return;}activeCode=code;setCode(selectedGridEmpId,selectedGridDate,code);updateGridCellDom(selectedGridEmpId,selectedGridDate,code)}
function issueDateLabel(items){return (items||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>fmt(x.date)+' '+x.code).join(', ')||'No dates'}
function flagKey(empId,type,periodKey){return `${empId}|${type}|${periodKey}`}
function computeFlags(){const dates=getDates(),flags=[],s=attendance.settings;for(const e of activeAttendanceEmployees()){let issues=[],counts={week:{},month:{},dow:{}},disc=[],occ=[];for(const d of dates){const c=getCode(e.id,d);if(!DISCIPLINE_CODES.has(c))continue;const dt=parseISO(d),wk=weekKey(dt),mo=d.slice(0,7),dow=DAYS[dt.getDay()];const item={date:d,code:c};if(c==='U')issues.push({type:'Unexcused',sev:'critical',periodKey:d,msg:`Unexcused absence on ${fmt(d)}`,issueDates:[item]});if(c==='UE')issues.push({type:'Unauthorized Early',sev:'high',periodKey:d,msg:`Unauthorized early departure on ${fmt(d)}`,issueDates:[item]});disc.push(item);occ.push(item);if(c==='T'){counts.week[wk]=counts.week[wk]||[];counts.week[wk].push(item);counts.month[mo]=counts.month[mo]||[];counts.month[mo].push(item);counts.dow[dow]=counts.dow[dow]||[];counts.dow[dow].push(item)}}if(disc.length>=s.rollingThreshold)issues.push({type:'90-Day',sev:'critical',periodKey:`rolling-${dates[dates.length-1]}-${dates[0]}`,msg:`${disc.length} discipline occurrence(s) in 90 days`,issueDates:disc});for(const [k,it] of Object.entries(counts.week))if(it.length>=s.weekThreshold)issues.push({type:'Weekly',sev:'high',periodKey:k,msg:`${it.length} tardy occurrence(s) in week of ${k}`,issueDates:it});for(const [k,it] of Object.entries(counts.month))if(it.length>=s.monthThreshold)issues.push({type:'Monthly',sev:'high',periodKey:k,msg:`${it.length} tardy occurrence(s) in ${k}`,issueDates:it});for(const [k,it] of Object.entries(counts.dow))if(it.length>=s.patternThreshold)issues.push({type:'Pattern',sev:'medium',periodKey:k,msg:`${it.length} tardy occurrence(s) on ${k}s`,issueDates:it});if(occ.length>=6)issues.push({type:'Occurrences',sev:'critical',periodKey:`occ-${dates[dates.length-1]}-${dates[0]}`,msg:`${occ.length} discipline occurrence(s) in 90 days`,issueDates:occ});else if(occ.length>=4)issues.push({type:'Occurrences',sev:'high',periodKey:`occ-${dates[dates.length-1]}-${dates[0]}`,msg:`${occ.length} discipline occurrence(s) in 90 days`,issueDates:occ});for(const iss of issues){const k=flagKey(e.id,iss.type,iss.periodKey),a=attendance.flagActions[k];flags.push({...iss,emp:e,key:k,addressed:!!a,action:a||null})}}return flags}
function attendancePeriodStats(emp){
  const dates=getDates();
  const todayIso=new Date().toISOString().slice(0,10);
  const weekStart=weekKey(new Date());
  const monthKey=todayIso.slice(0,7);
  const buckets={week:{},month:{},rolling:{},dates:{},entries:[]};
  for(const d of dates){
    const c=getCode(emp.id,d);
    if(!c)continue;
    const entry={date:d,code:c,label:codeLabel(c)};
    buckets.entries.push(entry);
    buckets.dates[c]=buckets.dates[c]||[];
    buckets.dates[c].push(d);
    if(d>=weekStart)buckets.week[c]=(buckets.week[c]||0)+1;
    if(d.slice(0,7)===monthKey)buckets.month[c]=(buckets.month[c]||0)+1;
    buckets.rolling[c]=(buckets.rolling[c]||0)+1;
  }
  return buckets;
}
function codeCount(stats,period,code){return Number((stats[period]||{})[code]||0)}
function codeDateList(stats,code){return (stats.dates[code]||[]).slice().sort((a,b)=>b.localeCompare(a))}
function codeCountExceeded(stats,period,code){
  const n=codeCount(stats,period,code);
  if(!n)return false;
  const s=attendance.settings||{};
  if(code==='U'||code==='UE')return n>0;
  if(code==='T'){
    if(period==='week')return n>=(s.weekThreshold||3);
    if(period==='month')return n>=(s.monthThreshold||5);
    if(period==='rolling')return n>=(s.rollingThreshold||6);
  }
  return false;
}
function codeCountCells(stats,period,codes){return codes.map(c=>{const n=codeCount(stats,period,c);const hit=codeCountExceeded(stats,period,c);return `<td class="${hit?'threshold-number':''}"><span class="badge ${esc(c)}" title="${esc(codeLabel(c))}">${esc(c)}</span><br><strong>${n}</strong></td>`}).join('')}
function periodCodeTotal(stats,period,codes){return codes.reduce((n,c)=>n+codeCount(stats,period,c),0)}
function categoryCodeTotal(stats,codes){return codes.reduce((n,c)=>n+codeDateList(stats,c).length,0)}
function attendanceReviewCategoryRows(stats,codes){
  return codes.map(c=>{
    const dates=codeDateList(stats,c);
    return `<details class="bucket att-review-code"><summary><span class="badge ${esc(c)}">${esc(c)}</span><span><strong>${esc(codeLabel(c))}</strong><br><small>Week ${codeCount(stats,'week',c)} · Month ${codeCount(stats,'month',c)} · 90-Day ${codeCount(stats,'rolling',c)}</small></span><span class="chip">${dates.length} date(s)</span></summary><div class="bucket-body">${dates.length?dates.map(d=>`<span class="chip">${fmt(d)}</span>`).join(' '):'<span class="muted">No dates in selected 90-day window.</span>'}</div></details>`;
  }).join('');
}

function printAttendanceNotice(empId){const emp=(attendance.employees||[]).find(e=>String(e.id)===String(empId));if(!emp)return;const date=val('noticeDate')||new Date().toISOString().slice(0,10);const subj=val('noticeSubject')||'Warning';const level=val('noticeLevel')||'Written Warning';const title=val('noticeTitle')||emp.title||'Security Officer';const issue=val('noticeIssueText')||'continued attendance issues are unacceptable and must not reoccur.';const dt=new Date(date+'T00:00:00');const dateShort=dt.toLocaleDateString(undefined,{month:'numeric',day:'numeric',year:'2-digit'});const dateLong=dt.toLocaleDateString(undefined,{month:'numeric',day:'numeric',year:'numeric'});const html=`<!doctype html><html><head><title>Confirming Notice - ${esc(emp.name)}</title><style>*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff;margin:0;font-size:21px}.page{width:10.4in;min-height:7.7in;margin:.2in auto;padding:.18in .25in}.logo-wrap{text-align:center;margin:0 0 2px}.logo-box{display:inline-block;border:1px solid #ddd;padding:3px 14px 1px;background:#fff}.logo-main{font-size:30px;line-height:28px;font-weight:900;color:#c0272d;letter-spacing:.3px;text-transform:lowercase}.logo-tag{font-size:10px;color:#9d7426;font-weight:bold}.title{text-align:center;font-size:28px;font-weight:900;margin:0 0 24px}.info{display:grid;grid-template-columns:140px 1fr;column-gap:10px;row-gap:18px;margin-top:6px}.lbl{font-weight:900}.to-block{line-height:1.05}.subj{text-decoration:underline;font-weight:900}.rule{border-top:2px solid #222;margin:16px 0 18px}.body{font-size:21px;line-height:1.15;margin:0 0 30px;text-align:left}.sig{display:grid;grid-template-columns:1fr 1fr;gap:2.05in;margin-top:34px}.sigline{border-top:2px solid #333;height:24px;display:flex;justify-content:space-between;align-items:flex-start;padding-top:2px}.comments{border:1px solid #444;height:1.9in;margin-top:.75in;padding:5px 10px;font-size:20px}.printbar{text-align:center;margin:12px}@media print{.printbar{display:none}.page{margin:0;padding:.18in .25in}body{font-size:21px}}</style></head><body><div class="page"><div class="logo-wrap"><div class="logo-box"><div class="logo-main">piggly<br>wiggly</div><div class="logo-tag">Down Home. Down The Street.</div></div></div><div class="title">Confirming Notice</div><div class="info"><div class="lbl">Date:</div><div>${esc(dateShort)}</div><div class="lbl">To:</div><div class="to-block">${esc(emp.name)}<br>${esc(title)} ${esc(dateLong)}</div><div class="lbl">From:</div><div>David MacBain</div><div class="lbl">Subj:</div><div class="subj">${esc(subj)}</div></div><div class="rule"></div><div class="body">This is to confirm the conversation of today during which it was communicated that your<br> ${esc(issue)}<br><br>This Confirming Notice serves as a <strong>${esc(level)}</strong>.</div><div class="sig"><div class="sigline"><span>${esc(emp.name)}</span><span>Date</span></div><div class="sigline"><span>David MacBain</span><span>Date</span></div></div><div class="comments">Employee Comments:</div></div><div class="printbar"><button onclick="window.print()">Print</button></div></body></html>`;const w=window.open('','_blank');if(!w){toast('Popup blocked. Allow popups or use browser print.');return}w.document.open();w.document.write(html);w.document.close();audit('Attendance notice generated',emp.name+' · '+subj+' · '+level);saveAttendance()}
function buildBuckets(flags){const order=['T','AL','LE','E','U','UE','V','GEN'],map={};for(const f of flags){for(const it of (f.issueDates&&f.issueDates.length?f.issueDates:[{code:'GEN',date:f.periodKey}])){const code=order.includes(it.code)?it.code:'GEN';map[code]=map[code]||{code,dates:{},flags:[]};if(it.date)map[code].dates[it.date]=true;if(!map[code].flags.some(x=>x.key===f.key))map[code].flags.push(f)}}return Object.values(map).sort((a,b)=>order.indexOf(a.code)-order.indexOf(b.code)).map(b=>({...b,dateList:Object.keys(b.dates).sort((a,b)=>b.localeCompare(a))}))}
function renderExceptions(){const flags=computeFlags();const open=flags.filter(f=>!f.addressed);let groups={};for(const f of flags){groups[f.emp.id]=groups[f.emp.id]||{emp:f.emp,flags:[]};groups[f.emp.id].flags.push(f)}let list=Object.values(groups).sort((a,b)=>b.flags.filter(f=>!f.addressed).length-a.flags.filter(f=>!f.addressed).length||a.emp.name.localeCompare(b.emp.name));return `<div class="grid cols-3"><div class="kpi"><div class="num">${open.filter(f=>f.sev==='critical').length}</div><div class="lbl">Critical Open</div></div><div class="kpi"><div class="num">${open.filter(f=>f.sev==='high').length}</div><div class="lbl">High Open</div></div><div class="kpi"><div class="num">${open.length}</div><div class="lbl">Total Open</div></div></div><div class="notice">Grouped by person, then code bucket. Clear individual rule, clear code, or clear person.</div><br>${list.map(renderFlagGroup).join('')||'<div class="card"><div class="card-title">No Exceptions</div>No exceptions found.</div>'}`}
function renderFlagGroup(g){const open=g.flags.filter(f=>!f.addressed),buckets=buildBuckets(g.flags);const critical=g.flags.filter(f=>f.sev==='critical'&&!f.addressed).length;return `<details class="flag-person-details"><summary><div class="flag-person"><strong>${esc(g.emp.name)}</strong><span>${esc(g.emp.shift)} · ${esc(g.emp.title)}</span></div><div>${open.length?`<span class="chip">${open.length} Open</span>`:''}${critical?'<span class="chip critical">Critical</span>':''}<span class="chip">${buckets.length} Code Bucket(s)</span></div><div>${open.length?`<button data-clear-person="${esc(g.emp.id)}">Clear Person</button>`:''}</div></summary><div class="flag-person-detail-body">${buckets.map(b=>renderBucket(g.emp,b)).join('')}</div></details>`}
function renderBucket(emp,b){const open=b.flags.filter(f=>!f.addressed);return `<details class="bucket"><summary><span class="badge ${esc(b.code)}">${esc(b.code)}</span><span>${esc(codeLabel(b.code))}<br><small>${esc(b.dateList.slice(0,8).map(fmt).join(', '))}${b.dateList.length>8?' ...':''}</small></span><span class="chip">${b.dateList.length} dates</span><span>${open.length?`<button class="sm" data-clear-code-emp="${esc(emp.id)}" data-clear-code="${esc(b.code)}">Clear ${esc(b.code)}</button>`:''}</span></summary><div class="bucket-body">${b.flags.map(renderExceptionCard).join('')}</div></details>`}function codeLabel(c){return CODES.find(x=>x[0]===c)?.[1]||'General'}function renderExceptionCard(f){return `<div class="exception-card ${f.sev} ${f.addressed?'addressed':''}"><div><div class="sev ${f.sev}">${f.sev}</div><span class="chip">${esc(f.type)}</span></div><div>${esc(f.msg)}<br><small>Issue Dates: ${esc(issueDateLabel(f.issueDates))}</small>${f.addressed?`<br><span class="ok">${esc(f.action.actionType||'Reviewed')} · ${esc(f.action.note||'')}</span>`:''}</div><div>${f.addressed?`<button class="sm" data-reopen="${esc(f.key)}">Reopen</button>`:`<button class="sm" data-action="Coaching" data-key="${esc(f.key)}">Coaching</button> <button class="sm" data-action="Verbal Warning" data-key="${esc(f.key)}">Verbal</button> <button class="sm" data-action="Written Warning" data-key="${esc(f.key)}">Written</button> <button class="sm" data-action="Final Warning" data-key="${esc(f.key)}">Final</button>`}</div></div>`}
function clearKeys(keys,actionType,note){const stamp=new Date().toISOString();for(const k of keys)attendance.flagActions[k]={at:stamp,actionType,note};audit('Flags cleared',`${keys.length} flag(s) · ${actionType}`);saveAttendance();safeRenderPages()}document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b){let note=prompt('Supervisor note:',b.dataset.action+' completed');if(note!==null)clearKeys([b.dataset.key],b.dataset.action,note||b.dataset.action);return}b=e.target.closest('[data-reopen]');if(b){delete attendance.flagActions[b.dataset.reopen];saveAttendance();safeRenderPages();return}b=e.target.closest('[data-clear-person]');if(b){let fs=computeFlags().filter(f=>f.emp.id===b.dataset.clearPerson&&!f.addressed);let note=prompt('Clear all open exceptions for this person:', 'Reviewed / cleared');if(note!==null)clearKeys(fs.map(f=>f.key),'Reviewed / Cleared',note);return}b=e.target.closest('[data-clear-code]');if(b){let fs=computeFlags().filter(f=>f.emp.id===b.dataset.clearCodeEmp&&!f.addressed&&(f.issueDates||[]).some(it=>it.code===b.dataset.clearCode));let note=prompt('Clear '+b.dataset.clearCode+' exceptions:', b.dataset.clearCode+' reviewed / cleared');if(note!==null)clearKeys([...new Set(fs.map(f=>f.key))],'Reviewed / Cleared',note);return}});

async function createAttendanceBackup(){try{let r=await SuiteBridge.send('suite:createBackup',attendance,{module:'attendance'});toast('Backup created');}catch(e){toast('Backup failed: '+e.message)}}function exportAttendanceCSV(){let rows=['Employee,Shift,Title,Date,Code,Note'];for(const e of attendance.employees){for(const [d,c] of Object.entries(attendance.attendance[e.id]||{})){let n=attendance.notes[e.id+'|'+d]||'';rows.push([e.name,e.shift,e.title,d,c,n].map(x=>'"'+String(x||'').replace(/"/g,'""')+'"').join(','))}}SuiteBridge.send('suite:writeExport',rows.join('\n'),{module:'attendance',fileName:'attendance-export-'+new Date().toISOString().slice(0,10)+'.csv'}).then(()=>toast('CSV exported')).catch(e=>toast('Export failed: '+e.message))}

function normalizeTasks(){tasks=tasks&&typeof tasks==='object'?tasks:{tasks:[],audit:[],nextId:1};tasks.tasks=Array.isArray(tasks.tasks)?tasks.tasks:[];tasks.audit=Array.isArray(tasks.audit)?tasks.audit:[];tasks.nextId=Number(tasks.nextId||0)||((tasks.tasks.reduce((m,t)=>Math.max(m,Number(t.id)||0),0))+1);for(const t of tasks.tasks){t.id=t.id||tasks.nextId++;t.project=t.project||'';t.status=t.status||'Active';t.priority=t.priority||'Medium';t.category=t.category||'General';t.owner=t.owner||'David';t.update=t.update||'';t.dueDate=t.dueDate||'';t.createdAt=t.createdAt||new Date().toISOString();t.updatedAt=t.updatedAt||new Date().toISOString();}}
async function loadTasks(){try{const res=await SuiteBridge.send('suite:loadModuleData',{}, {module:'tasks'});tasks=JSON.parse(res.data||'{}');normalizeTasks();}catch(e){tasks={tasks:[],audit:[],nextId:1};normalizeTasks();toast('Task data load failed: '+e.message)}}

function taskAudit(action,detail){tasks.audit.unshift({at:new Date().toISOString(),user:currentUserName()||env.user||'',machine:env.machine||'',action,detail});tasks.audit=tasks.audit.slice(0,500)}
function taskClass(st){let s=String(st||'').toLowerCase();if(s.includes('complete'))return'task-complete';if(s.includes('hold')||s.includes('table'))return'task-hold';if(s.includes('wait')||s.includes('follow'))return'task-waiting';if(s.includes('risk')||s.includes('blocked'))return'task-risk';if(s.includes('plan')||s.includes('final'))return'task-planning';return'task-active'}
function taskBadge(st){return `<span class="task-status ${taskClass(st)}">${esc(st||'Active')}</span>`}
function taskPriorityClass(p){p=String(p||'Medium').toLowerCase();return p.startsWith('h')?'priority-high':p.startsWith('l')?'priority-low':'priority-med'}
function taskDateShort(iso){if(!iso)return'';try{return new Date(iso+'T00:00:00').toLocaleDateString()}catch(e){return iso}}
function filteredTasks(){let q=taskSearch.toLowerCase().trim();return (tasks.tasks||[]).filter(t=>{const st=String(t.status||'Active');if(taskStatusFilter==='all'&&(st==='Archived'||st==='Complete'))return false;if(taskStatusFilter!=='all'&&st!==taskStatusFilter)return false;if(taskPriorityFilter!=='all'&&t.priority!==taskPriorityFilter)return false;if(taskCategoryFilter!=='all'&&t.category!==taskCategoryFilter)return false;if(q&&!(`${t.project} ${t.status} ${t.priority} ${t.category} ${t.owner} ${t.update}`.toLowerCase().includes(q)))return false;return true;}).sort((a,b)=>{const order={High:0,Medium:1,Low:2};return (order[a.priority]??1)-(order[b.priority]??1)||String(a.project).localeCompare(String(b.project));})}
function uniqueTaskValues(field){return [...new Set((tasks.tasks||[]).map(t=>t[field]).filter(Boolean))].sort()}
function taskMetrics(){let all=tasks.tasks||[];let visible=all.filter(t=>!['Archived','Complete'].includes(String(t.status||'')));return{total:visible.length,active:visible.filter(t=>!['On Hold','Tabled'].includes(t.status)).length,waiting:visible.filter(t=>['Waiting','Follow-up','Blocked'].includes(t.status)).length,high:visible.filter(t=>t.priority==='High').length,done:all.filter(t=>['Archived','Complete'].includes(String(t.status||''))).length}}
function renderTasks(){const m=taskMetrics();const list=filteredTasks();const statuses=uniqueTaskValues('status');if(!statuses.includes('Archived'))statuses.push('Archived');const cats=uniqueTaskValues('category');return `<div class="page-head"><div><div class="page-title">Task Tracker</div><div class="page-sub">Weekly project command board · ${tasks.lastSaved?'Last saved '+new Date(tasks.lastSaved).toLocaleString():'Using packaged starter tasks'}</div></div><div class="top-actions"><button class="primary" onclick="openTaskModal()">+ Add Task</button><button class="gold" onclick="generateWeeklyUpdate()">Weekly Boss Update</button><button onclick="exportTasksCSV()">Export CSV</button><button onclick="createTaskBackup()">Backup Now</button><button onclick="document.getElementById('tasksImportFile').click()">Import JSON</button><button onclick="reloadPackagedTasksData()">Use Packaged Tasks</button><input id="tasksImportFile" type="file" accept=".json,application/json" class="hidden" onchange="importTasksJSON(this)"></div></div><div class="task-summary-row"><div class="kpi task-kpi-primary"><div class="num">${m.total}</div><div class="lbl">Open Projects</div></div><div class="kpi"><div class="num">${m.active}</div><div class="lbl">Active</div></div><div class="kpi"><div class="num">${m.waiting}</div><div class="lbl">Waiting / Follow-up</div></div><div class="kpi"><div class="num">${m.high}</div><div class="lbl">High Priority</div></div><div class="kpi"><div class="num">${m.done}</div><div class="lbl">Archived</div></div></div><div class="card"><div class="task-card-title"><div class="card-title">Task Controls</div><div class="mini-note">Tip: completed tasks archive themselves and can be viewed by filtering Status to Archived.</div></div><div class="task-toolbar"><div><label>Search</label><input value="${esc(taskSearch)}" placeholder="Search project or update..." oninput="taskSearch=this.value;safeRenderPages()"></div><div><label>Status</label><select onchange="taskStatusFilter=this.value;safeRenderPages()"><option value="all">Open Statuses</option>${statuses.map(x=>`<option ${taskStatusFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div><label>Priority</label><select onchange="taskPriorityFilter=this.value;safeRenderPages()"><option value="all">All Priorities</option>${['High','Medium','Low'].map(x=>`<option ${taskPriorityFilter===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Category</label><select onchange="taskCategoryFilter=this.value;safeRenderPages()"><option value="all">All Categories</option>${cats.map(x=>`<option ${taskCategoryFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div></div><div class="table-wrap"><table class="wide-table"><thead><tr><th>Project</th><th>Status</th><th>Priority</th><th>Category</th><th>Owner</th><th>Due</th><th>Current Update</th><th>Actions</th></tr></thead><tbody>${list.map(t=>`<tr><td class="td-name">${esc(t.project)}</td><td>${taskBadge(t.status)}</td><td class="${taskPriorityClass(t.priority)}">${esc(t.priority)}</td><td>${esc(t.category||'')}</td><td>${esc(t.owner||'')}</td><td>${esc(taskDateShort(t.dueDate))}</td><td class="task-update">${esc(t.update||'')}</td><td><div class="task-actions"><button class="sm" onclick="openTaskModal(${Number(t.id)})">Edit</button>${String(t.status||'')==='Archived'?'<button class="sm" onclick="reopenTask('+Number(t.id)+')">Reopen</button>':'<button class="sm" onclick="markTaskComplete('+Number(t.id)+')">Done</button>'}<button class="sm danger" onclick="removeTask(${Number(t.id)})">Remove</button></div></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No tasks match current filters.</td></tr>'}</tbody></table></div>`}
function openTaskModal(id){taskEditId=id||null;const t=id?(tasks.tasks||[]).find(x=>Number(x.id)===Number(id)):{project:'',status:'Active',priority:'Medium',category:'General',owner:'David',dueDate:'',update:''};if(!t){toast('Task not found');return;}showModal(`<div class="modal-head"><div class="modal-title">${id?'Edit Task':'Add Task'}</div><button onclick="closeModal()">Close</button></div><div class="form-grid"><div class="form-group full"><label>Project / Task</label><input id="taskProject" value="${esc(t.project)}"></div><div class="form-group"><label>Status</label><select id="taskStatus">${['Active','Planning','Finalizing','Waiting','Follow-up','Blocked','On Hold','Tabled','Archived'].map(x=>`<option ${t.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label>Priority</label><select id="taskPriority">${['High','Medium','Low'].map(x=>`<option ${t.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label>Category</label><input id="taskCategory" value="${esc(t.category||'General')}"></div><div class="form-group"><label>Owner</label><input id="taskOwner" value="${esc(t.owner||'David')}"></div><div class="form-group"><label>Target / Due Date</label><input type="date" id="taskDue" value="${esc(t.dueDate||'')}"></div><div class="form-group full"><label>Current Update</label><textarea id="taskUpdate" rows="5">${esc(t.update||'')}</textarea></div></div><div class="form-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveTaskFromModal()">Save Task</button></div>`) }
function saveTaskFromModal(){const data={project:document.getElementById('taskProject').value.trim(),status:document.getElementById('taskStatus').value,priority:document.getElementById('taskPriority').value,category:document.getElementById('taskCategory').value.trim()||'General',owner:document.getElementById('taskOwner').value.trim()||'David',dueDate:document.getElementById('taskDue').value,update:document.getElementById('taskUpdate').value.trim()};if(data.status==='Complete')data.status='Archived';if(!data.project){toast('Task needs a project name');return;}if(taskEditId){let t=tasks.tasks.find(x=>Number(x.id)===Number(taskEditId));Object.assign(t,data,{updatedAt:new Date().toISOString()});taskAudit(data.status==='Archived'?'Archived task':'Updated task',data.project)}else{data.id=tasks.nextId++;data.createdAt=new Date().toISOString();data.updatedAt=new Date().toISOString();tasks.tasks.push(data);taskAudit('Added task',data.project)}saveTasksNow('task-modal').then(ok=>{if(ok){closeModal();safeRenderPages();toast(data.status==='Archived'?'Task archived':'Task saved')}});}
function markTaskComplete(id){let t=tasks.tasks.find(x=>Number(x.id)===Number(id));if(!t)return;t.status='Archived';t.completedAt=new Date().toISOString();t.updatedAt=t.completedAt;taskAudit('Archived completed task',t.project);saveTasks();safeRenderPages();toast('Task completed and archived')}

function applyViewportSizing(){
  const root=document.documentElement;
  const w=window.innerWidth||document.documentElement.clientWidth||1400;
  const h=window.innerHeight||document.documentElement.clientHeight||900;
  let view='standard';
  if(w<1280 || h<760) view='compact';
  else if(w>=2200) view='wide';
  root.setAttribute('data-view',view);
  root.style.setProperty('--vh',(h*0.01)+'px');
}
let viewportResizeTimer=null;
window.addEventListener('resize',()=>{clearTimeout(viewportResizeTimer);viewportResizeTimer=setTimeout(()=>{applyViewportSizing();try{safeRenderPages();}catch(_){ }},120);});
window.addEventListener('orientationchange',()=>setTimeout(applyViewportSizing,150));
applyViewportSizing();

init();
</script>
