function renderAudit(){return `<div class="card"><div class="card-title">Attendance Audit Log</div>${attendance.audit.slice(0,300).map(a=>`<div class="log-row"><div>${new Date(a.at).toLocaleString()}</div><div>Attendance</div><div class="log-action">${esc(a.action)}</div><div>${esc(a.detail)}<br><small>${esc(a.user||'')} @ ${esc(a.machine||'')}</small></div></div>`).join('')||'<p>No audit entries.</p>'}</div>`}
function rankLong(r){return r||''}function rankBadge(r){return `<span class="rank-pill">${esc(rankLong(r))}</span>`}function rosterShifts(){return Array.from(new Set(rosterActiveEmployees().map(e=>e.shift).filter(Boolean))).sort()}function rosterRanks(){return Array.from(new Set([...((roster.ranks||[])),...rosterActiveEmployees().map(e=>e.rank).filter(Boolean)])).sort()}function rosterTypes(){return Array.from(new Set(rosterActiveEmployees().map(e=>e.type).filter(Boolean))).sort()}function sortHeader(label,key){let arrow=rosterSortKey===key?(rosterSortDir==='asc'?' ▲':' ▼'):'';return `<th class="sortable" onclick="rosterSort('${key}')">${esc(label)}${arrow}</th>`}function rosterSort(key){if(rosterSortKey===key)rosterSortDir=rosterSortDir==='asc'?'desc':'asc';else{rosterSortKey=key;rosterSortDir='asc'}safeRenderPages()}function filteredRoster(){let list=rosterActiveEmployees();if(rosterSearch){let q=rosterSearch.toLowerCase();list=list.filter(e=>JSON.stringify(e).toLowerCase().includes(q))}if(rosterShiftFilter!=='all')list=list.filter(e=>e.shift===rosterShiftFilter);if(rosterRankFilter!=='all')list=list.filter(e=>e.rank===rosterRankFilter);if(rosterTypeFilter!=='all')list=list.filter(e=>e.type===rosterTypeFilter);const val=e=>{if(rosterSortKey==='name')return fullName(e);if(rosterSortKey==='rdo')return (e.rdo||[]).join('/');if(rosterSortKey==='uniform')return uniformSummary(e);return e[rosterSortKey]||''};list=list.slice().sort((a,b)=>String(val(a)).localeCompare(String(val(b)),undefined,{numeric:true}));if(rosterSortDir==='desc')list.reverse();return list}function uniformSummary(e){let arr=['shirt','pants','jacket'].map(k=>{let size=e[k]||'',st=e[k+'Status']||'';return size?`<span class="uniform-pill ${st}">${k[0].toUpperCase()} ${esc(size)} ${st?esc(st):''}</span>`:''}).filter(Boolean);return arr.join('')||'<span class="muted">Not set</span>'}function fmtDate(d){return d?String(d):''}
function renderRoster(){return `<div class="page-head roster-page-head"><div><div class="page-title">Roster</div><div class="page-sub">Staff records, schedule, training, uniforms, and labor analytics. This module uses the shared roster JSON and keeps the original Staff Manager workflow as the blueprint.</div></div><div class="roster-utility-actions"><button onclick="document.getElementById('rosterImportFile').click()">Import JSON</button><button onclick="reloadPackagedRosterData()">Use Packaged Latest JSON</button><button onclick="createRosterBackup()">Backup Now</button><button onclick="syncAttendanceFromRoster(true)">Link Existing Attendance</button><button onclick="hideAttendanceSyncDuplicates()">Hide Sync Duplicates</button><button onclick="showArchivedRoster=!showArchivedRoster;safeRenderPages()">Archive / Old Employees</button><button onclick="exportRosterCSV()">Export CSV</button><input id="rosterImportFile" type="file" accept=".json,application/json" class="hidden" onchange="importRosterJSON(this)"></div></div><div class="subnav">${['roster','schedule','training','uniforms','analytics'].map(v=>`<button class="${activeRosterView===v?'active':''}" onclick="activeRosterView='${v}';safeRenderPages()">${v==='roster'?'Roster':v==='schedule'?'Schedule':v==='training'?'Training':v==='uniforms'?'Uniforms':'Analytics'}</button>`).join('')}</div>${activeRosterView==='roster'?renderRosterList():activeRosterView==='schedule'?renderRosterSchedule():activeRosterView==='training'?renderRosterTraining():activeRosterView==='uniforms'?renderRosterUniforms():renderRosterAnalytics()}`}
function renderRosterList(){const list=filteredRoster();const activeEmps=rosterActiveEmployees();const archiveCount=rosterArchivedEmployees().length;const total=activeEmps.length;const hourly=activeEmps.filter(e=>(e.type||'')==='Hourly').length;const salary=activeEmps.filter(e=>(e.type||'')==='Salary').length;const openUni=activeEmps.reduce((n,e)=>n+['shirt','pants','jacket'].filter(k=>(e[k+'Status']||'')&&e[k+'Status']!=='issued').length,0);return `<div class="grid cols-4 roster-summary"><div class="kpi"><div class="num">${total}</div><div class="lbl">Employees</div></div><div class="kpi"><div class="num">${hourly}</div><div class="lbl">Hourly</div></div><div class="kpi"><div class="num">${salary}</div><div class="lbl">Salary</div></div><div class="kpi"><div class="num">${openUni}</div><div class="lbl">Uniform Needs / Orders</div></div></div><div class="card roster-workbar-card"><div class="card-title">Roster Controls</div><div class="roster-filters roster-workbar"><div><label>Search</label><input value="${esc(rosterSearch)}" placeholder="Name, EID, rank, shift..." oninput="rosterSearch=this.value;safeRenderPages()"></div><div><label>Shift</label><select onchange="rosterShiftFilter=this.value;safeRenderPages()"><option value="all">All Shifts</option>${rosterShifts().map(x=>`<option value="${esc(x)}" ${rosterShiftFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div><label>Rank</label><select onchange="rosterRankFilter=this.value;safeRenderPages()"><option value="all">All Ranks</option>${rosterRanks().map(x=>`<option value="${esc(x)}" ${rosterRankFilter===x?'selected':''}>${esc(rankLong(x))}</option>`).join('')}</select></div><div><label>Type</label><select onchange="rosterTypeFilter=this.value;safeRenderPages()"><option value="all">All Types</option>${rosterTypes().map(x=>`<option value="${esc(x)}" ${rosterTypeFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="top-actions"><button class="primary" onclick="openEmployeeModal()">+ Add Employee</button><button onclick="openManageRanksModal()">Manage Ranks</button><button onclick="openRosterPrintModal()">Print Roster</button><button onclick="exportRosterCSV()">Export CSV</button></div></div><div class="mini-note">Showing ${list.length} of ${total} active employees. ${archiveCount} archived / old employee(s) hidden by default. Showing live roster records from shared JSON. Employee management, promote, merit, remove, import/export, and custom print are active. Schedule, uniforms, analytics, and training continue in staged rebuilds.</div></div><div class="table-wrap"><table class="wide-table roster-table"><thead><tr>${sortHeader('Name','name')}${sortHeader('EID','eid')}${sortHeader('Rank','rank')}${sortHeader('Shift','shift')}${sortHeader('Gate Shift','gateShift')}${sortHeader('Rate','rate')}${sortHeader('Type','type')}${sortHeader('RDO','rdo')}${sortHeader('Uniform','uniform')}${sortHeader('DOH','doh')}${sortHeader('DOP','dop')}${sortHeader('Notes','notes')}<th>Actions</th></tr></thead><tbody>${list.map(e=>`<tr><td><strong>${esc(fullName(e))}</strong></td><td>${esc(e.eid||'')}</td><td>${rankBadge(e.rank)}</td><td>${esc(e.shift||'')}</td><td>${esc(e.gateShift||'')}</td><td>${money(e.rate)}</td><td>${esc(e.type||'')}</td><td>${esc((e.rdo||[]).join('/'))}</td><td>${uniformSummary(e)}</td><td>${esc(fmtDate(e.doh))}</td><td>${esc(fmtDate(e.dop))}</td><td class="notes-cell">${esc(e.notes||'')}</td><td><div class="td-actions"><button class="sm" onclick="openEmployeeModal('${esc(e.id)}')">Edit</button><button class="sm gold" onclick="openPromoteModal('${esc(e.id)}')">Promote</button><button class="sm" onclick="openMeritModal('${esc(e.id)}')">Merit</button><button class="sm danger" onclick="removeRosterEmployee('${esc(e.id)}')">Remove</button></div></td></tr>`).join('')||'<tr><td colspan="13">No roster records match the current filters.</td></tr>'}</tbody></table></div>${renderArchivedRosterSection()}`}
function renderArchivedRosterSection(){const rows=rosterArchivedEmployees();if(!showArchivedRoster)return `<details class="archive-panel"><summary class="archive-head"><span class="archive-title">Archive / Old Employees</span><span class="chip">${rows.length} hidden</span></summary><div class="archive-body"><p class="mini-note">Archived employees are hidden. Click Archive / Old Employees above to show them in detail.</p></div></details>`;return `<details class="archive-panel" open><summary class="archive-head"><span class="archive-title">Archive / Old Employees</span><span class="chip">${rows.length}</span></summary><div class="archive-body"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Rank</th><th>Shift</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(e=>`<tr class="archived-row"><td>${esc(fullName(e))}</td><td>${rankBadge(e.rank)}</td><td>${esc(e.shift||'')}</td><td><span class="archive-badge">Archived</span></td><td><button class="sm" onclick="restoreRosterEmployee('${esc(e.id)}')">Restore</button> <button class="sm danger" onclick="deleteArchivedRosterEmployee('${esc(e.id)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No archived records.</td></tr>'}</tbody></table></div></div></details>`}
function openEmployeeModal(id=''){const e=id?roster.employees.find(x=>x.id===id):{id:'',first:'',last:'',eid:'',rank:'Security Officer',shift:'',gateShift:'',rate:'',type:'Hourly',rdo:[],shirt:'',shirtStatus:'',pants:'',pantsStatus:'',jacket:'',jacketStatus:'',doh:'',dop:'',notes:''};showModal(`<div class="modal-head"><div class="modal-title">${id?'Edit':'Add'} Employee</div><button onclick="closeModal()">Close</button></div><div class="form-grid"><div><label>First</label><input id="empFirst" value="${escAttr(e.first||'')}"></div><div><label>Last</label><input id="empLast" value="${escAttr(e.last||'')}"></div><div><label>EID</label><input id="empEid" value="${escAttr(e.eid||'')}"></div><div><label>Rank</label><select id="empRank">${rosterRanks().map(r=>`<option ${e.rank===r?'selected':''}>${esc(r)}</option>`).join('')}</select></div><div><label>Shift</label><input id="empShift" value="${escAttr(e.shift||'')}"></div><div><label>Gate Shift</label><input id="empGateShift" value="${escAttr(e.gateShift||'')}"></div><div><label>Rate</label><input id="empRate" value="${escAttr(e.rate||'')}"></div><div><label>Type</label><select id="empType"><option ${e.type==='Hourly'?'selected':''}>Hourly</option><option ${e.type==='Salary'?'selected':''}>Salary</option></select></div><div><label>DOH</label><input id="empDoh" type="date" value="${escAttr(e.doh||'')}"></div><div><label>DOP</label><input id="empDop" type="date" value="${escAttr(e.dop||'')}"></div><div class="full"><label>Notes</label><textarea id="empNotes">${esc(e.notes||'')}</textarea></div></div><div class="modal-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveEmployeeModal('${esc(id)}')">Save</button></div>`)}
function saveEmployeeModal(id){let e=id?roster.employees.find(x=>x.id===id):null;if(!e){e={id:cryptoId()};roster.employees.push(e)}e.first=val('empFirst');e.last=val('empLast');e.name=`${e.first} ${e.last}`.trim();e.eid=val('empEid');e.rank=val('empRank');e.shift=val('empShift');e.gateShift=val('empGateShift');e.rate=val('empRate');e.type=val('empType');e.doh=val('empDoh');e.dop=val('empDop');e.notes=val('empNotes');roster.audit.unshift({at:new Date().toISOString(),user:currentUserName()||env.user||'',machine:env.machine||'',action:id?'Employee updated':'Employee added',detail:fullName(e)});if(!id)syncOneRosterEmployeeToAttendance(e);saveRoster();saveAttendance();closeModal();safeRenderPages()}
function removeRosterEmployee(id){let e=roster.employees.find(x=>x.id===id);if(!e)return;if(!confirm('Archive '+fullName(e)+'?'))return;e.archived=true;e.status='Archived';roster.audit.unshift({at:new Date().toISOString(),user:currentUserName()||'',machine:env.machine||'',action:'Employee archived',detail:fullName(e)});saveRoster();safeRenderPages()}function restoreRosterEmployee(id){let e=roster.employees.find(x=>x.id===id);if(!e)return;e.archived=false;e.status='Active';saveRoster();safeRenderPages()}function deleteArchivedRosterEmployee(id){let e=roster.employees.find(x=>x.id===id);if(!e||!e.archived)return;if(!confirm('Permanently delete archived employee '+fullName(e)+'?'))return;roster.employees=roster.employees.filter(x=>x.id!==id);saveRoster();safeRenderPages()}function openPromoteModal(id){const e=roster.employees.find(x=>x.id===id);if(!e)return;showModal(`<div class="modal-head"><div class="modal-title">Promote ${esc(fullName(e))}</div><button onclick="closeModal()">Close</button></div><div class="form-grid"><div><label>New Rank</label><select id="promoteRank">${rosterRanks().map(r=>`<option ${e.rank===r?'selected':''}>${esc(r)}</option>`).join('')}</select></div><div><label>New Rate</label><input id="promoteRate" value="${escAttr(e.rate||'')}"></div><div><label>Date</label><input id="promoteDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="full"><label>Note</label><textarea id="promoteNote"></textarea></div></div><div class="modal-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="savePromotion('${esc(id)}')">Save Promotion</button></div>`)}function savePromotion(id){let e=roster.employees.find(x=>x.id===id);if(!e)return;let old=e.rank;e.rank=val('promoteRank');e.rate=val('promoteRate');e.dop=val('promoteDate');roster.audit.unshift({at:new Date().toISOString(),user:currentUserName()||'',machine:env.machine||'',action:'Promotion',detail:`${fullName(e)} · ${old} -> ${e.rank} · ${val('promoteNote')}`});saveRoster();closeModal();safeRenderPages()}function openMeritModal(id){const e=roster.employees.find(x=>x.id===id);if(!e)return;showModal(`<div class="modal-head"><div class="modal-title">Merit / Rate Change</div><button onclick="closeModal()">Close</button></div><div class="form-grid"><div><label>Current Rate</label><input value="${money(e.rate)}" disabled></div><div><label>New Rate</label><input id="meritRate" value="${escAttr(e.rate||'')}"></div><div><label>Date</label><input id="meritDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="full"><label>Reason</label><textarea id="meritNote"></textarea></div></div><div class="modal-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveMerit('${esc(id)}')">Save</button></div>`)}function saveMerit(id){let e=roster.employees.find(x=>x.id===id);if(!e)return;let old=e.rate;e.rate=val('meritRate');roster.audit.unshift({at:new Date().toISOString(),user:currentUserName()||'',machine:env.machine||'',action:'Merit / Rate Change',detail:`${fullName(e)} · ${old} -> ${e.rate} · ${val('meritNote')}`});saveRoster();closeModal();safeRenderPages()}function openManageRanksModal(){showModal(`<div class="modal-head"><div class="modal-title">Manage Ranks</div><button onclick="closeModal()">Close</button></div><div class="card"><div class="card-title">Ranks</div>${(roster.ranks||[]).map((r,i)=>`<div class="person-row"><div>${esc(r)}</div><div></div><div><button class="sm" onclick="editRank(${i})">Edit</button></div><div><button class="sm danger" onclick="deleteRank(${i})">Delete</button></div></div>`).join('')}</div><div class="form-grid"><div><label>New Rank</label><input id="newRank"></div><div style="display:flex;align-items:end"><button class="primary" onclick="addRank()">Add Rank</button></div></div>`)}function addRank(){let r=val('newRank').trim();if(!r)return;if(!roster.ranks.includes(r))roster.ranks.push(r);saveRoster();openManageRanksModal()}function editRank(i){let old=roster.ranks[i];let r=prompt('New rank name:',old);if(!r)return;roster.ranks[i]=r;for(const e of roster.employees)if(e.rank===old)e.rank=r;saveRoster();openManageRanksModal()}function deleteRank(i){let r=roster.ranks[i];if(roster.employees.some(e=>e.rank===r)){toast('Cannot delete assigned rank');return}roster.ranks.splice(i,1);saveRoster();openManageRanksModal()}
function renderRosterSchedule(){const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const sections=Array.from(new Set((roster.schedule||[]).map(r=>r.section||'Schedule')));return `<div class="page-head"><div><div class="page-title">Master Schedule</div><div class="page-sub">Click any cell to reassign. Non/Open cells can be reopened and assigned.</div></div><div class="btn-group"><button onclick="shareScheduleHtml()">Share Schedule</button><button onclick="printSchedule()">Print Schedule</button><button onclick="addScheduleRow()">+ Add Row</button><button onclick="addScheduleSection()">+ Add Section</button></div></div>${sections.map(sec=>`<div class="card"><div class="card-title">${esc(sec)}</div><div class="schedule-grid"><div class="sch-head">Post</div>${days.map(d=>`<div class="sch-head">${d}</div>`).join('')}${(roster.schedule||[]).filter(r=>(r.section||'Schedule')===sec).map((row,rowIdx)=>renderScheduleRow(row,days,rowIdx)).join('')}</div></div>`).join('')||'<div class="card"><div class="card-title">No Schedule</div>Add schedule rows to begin.</div>'}`}
function renderScheduleRow(row,days,rowIdx){return `<div class="sch-post">${esc(row.post||row.role||'Post')}<br><small>${esc(row.hours||'')}</small></div>${days.map(d=>{let v=row.assignments?row.assignments[d]:row[d];return `<div class="sch-cell" onclick="openScheduleCellModal('${esc(row.id||rowIdx)}','${d}')"><div class="sch-name ${!v||v==='Closed'?'none':''}">${esc(v||'Open')}</div></div>`}).join('')}`}
function openScheduleCellModal(rowId,day){const idx=(roster.schedule||[]).findIndex((r,i)=>String(r.id||i)===String(rowId));if(idx<0)return;const row=roster.schedule[idx];const current=row.assignments?row.assignments[day]:(row[day]||'');const names=['Open','Closed',...rosterActiveEmployees().map(fullName)];showModal(`<div class="modal-head"><div class="modal-title">Schedule Assignment</div><button onclick="closeModal()">Close</button></div><div class="notice"><strong>${esc(row.section||'Schedule')} · ${esc(row.post||'Post')} · ${day}</strong></div><div><label>Assignment</label><select id="schedAssign">${names.map(n=>`<option ${n===current?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="modal-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveScheduleAssignment(${idx},'${day}')">Save</button></div>`)}function saveScheduleAssignment(idx,day){roster.schedule[idx].assignments=roster.schedule[idx].assignments||{};roster.schedule[idx].assignments[day]=val('schedAssign');roster.audit.unshift({at:new Date().toISOString(),user:currentUserName()||'',machine:env.machine||'',action:'Schedule updated',detail:`${roster.schedule[idx].post} ${day} -> ${val('schedAssign')}`});saveRoster();closeModal();safeRenderPages()}function addScheduleRow(){roster.schedule.push({id:cryptoId(),section:'Schedule',post:'New Post',hours:'8 HRS',assignments:{}});saveRoster();safeRenderPages()}function addScheduleSection(){let sec=prompt('Section name:','New Section');if(!sec)return;roster.schedule.push({id:cryptoId(),section:sec,post:'New Post',hours:'8 HRS',assignments:{}});saveRoster();safeRenderPages()}function shareScheduleHtml(){const html=buildScheduleHtml();const blob=new Blob([html],{type:'text/html'});downloadBlob(blob,'PWADC_Security_Schedule_'+new Date().toISOString().slice(0,10)+'.html')}function buildScheduleHtml(){return `<html><body><h1>PWADC Security Schedule</h1>${document.querySelector('#page-roster')?.innerHTML||''}</body></html>`}function printSchedule(){const w=window.open('','_blank');w.document.write(buildScheduleHtml());w.document.close();w.print()}
function renderRosterTraining(){return `<div class="page-head"><div><div class="page-title">Training Matrix</div><div class="page-sub">Names left, topics across top. Add topics, search, filter by shift.</div></div><div class="btn-group"><button onclick="addTrainingTopic()">+ Add Topic</button><button onclick="printTrainingMatrix()">Print</button></div></div><div class="card"><div class="toolbar"><input placeholder="Search employees..." oninput="rosterSearch=this.value;safeRenderPages()"><select onchange="rosterShiftFilter=this.value;safeRenderPages()"><option value="all">All Shifts</option>${rosterShifts().map(s=>`<option>${esc(s)}</option>`).join('')}</select></div></div><div class="table-wrap"><table><thead><tr><th>Name</th>${(roster.trainingTopics||[]).map(t=>`<th>${esc(t.name)}</th>`).join('')}</tr></thead><tbody>${filteredRoster().map(e=>`<tr><td><strong>${esc(fullName(e))}</strong><br><small>${esc(e.shift||'')}</small></td>${(roster.trainingTopics||[]).map(t=>`<td onclick="toggleTraining('${esc(e.id)}','${esc(t.id)}')">${trainingDone(e.id,t.id)?'<span class="ok">✓</span>':'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function addTrainingTopic(){let name=prompt('Training topic name:');if(!name)return;roster.trainingTopics.push({id:cryptoId(),name});saveRoster();safeRenderPages()}function trainingDone(empId,topicId){return (roster.trainingRecords||[]).some(r=>r.empId===empId&&r.topicId===topicId&&r.done)}function toggleTraining(empId,topicId){let r=(roster.trainingRecords||[]).find(x=>x.empId===empId&&x.topicId===topicId);if(!r){r={id:cryptoId(),empId,topicId,done:true,at:new Date().toISOString()};roster.trainingRecords.push(r)}else r.done=!r.done;saveRoster();safeRenderPages()}function printTrainingMatrix(){window.print()}
function renderRosterUniforms(){const rows=filteredRoster();return `<div class="page-head"><div><div class="page-title">Uniforms</div><div class="page-sub">Needed, ordered, issued. Collapsible by employee and printable inventory.</div></div><div class="btn-group"><button onclick="printUniforms()">Print Inventory</button></div></div>${rows.map(e=>`<details class="bucket"><summary><strong>${esc(fullName(e))}</strong><span>${uniformSummary(e)}</span></summary><div class="bucket-body"><div class="form-grid"><div><label>Shirt</label><input value="${escAttr(e.shirt||'')}" onchange="setUniform('${esc(e.id)}','shirt',this.value)"></div><div><label>Shirt Status</label><select onchange="setUniform('${esc(e.id)}','shirtStatus',this.value)">${['','needed','ordered','issued'].map(s=>`<option ${e.shirtStatus===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Pants</label><input value="${escAttr(e.pants||'')}" onchange="setUniform('${esc(e.id)}','pants',this.value)"></div><div><label>Pants Status</label><select onchange="setUniform('${esc(e.id)}','pantsStatus',this.value)">${['','needed','ordered','issued'].map(s=>`<option ${e.pantsStatus===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Jacket</label><input value="${escAttr(e.jacket||'')}" onchange="setUniform('${esc(e.id)}','jacket',this.value)"></div><div><label>Jacket Status</label><select onchange="setUniform('${esc(e.id)}','jacketStatus',this.value)">${['','needed','ordered','issued'].map(s=>`<option ${e.jacketStatus===s?'selected':''}>${s}</option>`).join('')}</select></div></div></div></details>`).join('')}`}
function setUniform(id,key,val){let e=roster.employees.find(x=>x.id===id);if(e){e[key]=val;saveRoster();}}function printUniforms(){window.print()}
function renderRosterAnalytics(){const emps=rosterActiveEmployees();const byShift={};for(const e of emps)byShift[e.shift||'Unassigned']=(byShift[e.shift||'Unassigned']||0)+1;return `<div class="grid cols-4"><div class="kpi"><div class="num">${emps.length}</div><div class="lbl">Active Employees</div></div><div class="kpi"><div class="num">${Object.keys(byShift).length}</div><div class="lbl">Shift Groups</div></div><div class="kpi"><div class="num">${emps.filter(e=>e.type==='Hourly').length}</div><div class="lbl">Hourly</div></div><div class="kpi"><div class="num">${emps.filter(e=>e.type==='Salary').length}</div><div class="lbl">Salary</div></div></div><div class="card"><div class="card-title">By Shift</div>${Object.entries(byShift).map(([k,v])=>`<div class="stat-line"><strong>${esc(k)}</strong><span>${v}</span></div>`).join('')}</div>`}
function renderTasks(){const rows=filteredTasks();return `<div class="page-head"><div><div class="page-title">Task Tracker</div><div class="page-sub">Projects, follow-ups, weekly update, archive when complete.</div></div><div class="btn-group"><button class="primary" onclick="openTaskModal()">+ Add Task</button><button onclick="openWeeklyTaskEmail()">Weekly Email</button><button onclick="backupTasks()">Backup Now</button></div></div><div class="card"><div class="task-toolbar"><div><label>Search</label><input value="${esc(taskSearch)}" oninput="taskSearch=this.value;safeRenderPages()"></div><div><label>Status</label><select onchange="taskStatusFilter=this.value;safeRenderPages()"><option value="all">All Active</option>${['Open','In Progress','Waiting','On Hold','Tabled','Complete','Archived'].map(s=>`<option ${taskStatusFilter===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Priority</label><select onchange="taskPriorityFilter=this.value;safeRenderPages()"><option value="all">All</option>${['High','Medium','Low'].map(s=>`<option ${taskPriorityFilter===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Category</label><input value="${esc(taskCategoryFilter==='all'?'':taskCategoryFilter)}" placeholder="Category" oninput="taskCategoryFilter=this.value||'all';safeRenderPages()"></div></div></div>${rows.map(renderTaskCard).join('')||'<div class="card"><div class="card-title">No Tasks</div>No tasks match current filters.</div>'}`}
function filteredTasks(){let list=(tasks.tasks||[]).slice();if(taskStatusFilter==='all')list=list.filter(t=>!['Complete','Archived'].includes(t.status));else list=list.filter(t=>t.status===taskStatusFilter);if(taskPriorityFilter!=='all')list=list.filter(t=>t.priority===taskPriorityFilter);if(taskCategoryFilter!=='all')list=list.filter(t=>String(t.category||'').toLowerCase().includes(taskCategoryFilter.toLowerCase()));if(taskSearch)list=list.filter(t=>JSON.stringify(t).toLowerCase().includes(taskSearch.toLowerCase()));return list.sort((a,b)=>(a.status==='Archived')-(b.status==='Archived')||String(a.priority).localeCompare(String(b.priority))||String(a.project||a.title).localeCompare(String(b.project||b.title)))}function renderTaskCard(t){return `<div class="task-card ${['Complete','Archived'].includes(t.status)?'complete':''}"><div style="display:flex;justify-content:space-between;gap:12px"><div><strong>${esc(t.project||t.title||'Untitled Task')}</strong><div class="task-meta"><span class="chip">${esc(t.status)}</span><span class="priority-${String(t.priority).toLowerCase()}">${esc(t.priority)}</span><span class="chip">${esc(t.category||'General')}</span>${t.dueDate?`<span class="chip">Due ${esc(t.dueDate)}</span>`:''}</div><div>${esc(t.description||t.notes||'')}</div></div><div class="btn-group"><button class="sm" onclick="openTaskModal(${t.id})">Edit</button>${!['Complete','Archived'].includes(t.status)?`<button class="sm gold" onclick="completeTask(${t.id})">Done</button>`:`<button class="sm" onclick="reopenTask(${t.id})">Reopen</button>`}<button class="sm danger" onclick="deleteTask(${t.id})">Remove</button></div></div></div>`}
function openTaskModal(id=null){const t=id?(tasks.tasks||[]).find(x=>x.id===id):{project:'',status:'Open',priority:'Medium',category:'General',dueDate:'',description:''};showModal(`<div class="modal-head"><div class="modal-title">${id?'Edit':'Add'} Task</div><button onclick="closeModal()">Close</button></div><div class="form-grid"><div><label>Project / Task</label><input id="taskProject" value="${escAttr(t.project||t.title||'')}"></div><div><label>Status</label><select id="taskStatus">${['Open','In Progress','Waiting','On Hold','Tabled','Complete','Archived'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Priority</label><select id="taskPriority">${['High','Medium','Low'].map(s=>`<option ${t.priority===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Category</label><input id="taskCategory" value="${escAttr(t.category||'General')}"></div><div><label>Due Date</label><input id="taskDue" type="date" value="${escAttr(t.dueDate||'')}"></div><div class="full"><label>Description / Notes</label><textarea id="taskDesc">${esc(t.description||t.notes||'')}</textarea></div></div><div class="modal-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveTaskModal(${id||0})">Save</button></div>`)}function saveTaskModal(id){let t=id?(tasks.tasks||[]).find(x=>x.id===id):null;if(!t){t={id:tasks.nextId++};tasks.tasks.push(t)}t.project=val('taskProject');t.title=t.project;t.status=val('taskStatus');t.priority=val('taskPriority');t.category=val('taskCategory');t.dueDate=val('taskDue');t.description=val('taskDesc');if(t.status==='Complete'&&!t.archivedAt)t.archivedAt=new Date().toISOString();tasks.audit.unshift({at:new Date().toISOString(),user:currentUserName()||'',machine:env.machine||'',action:id?'Task updated':'Task added',detail:t.project});saveTasks();closeModal();safeRenderPages()}async function saveTasks(){tasks.lastSaved=new Date().toISOString();await saveModuleDataStrict('tasks',tasks);document.getElementById('saveStatus').textContent='Tasks saved '+new Date().toLocaleTimeString()}function completeTask(id){let t=tasks.tasks.find(x=>x.id===id);if(!t)return;t.status='Archived';t.archivedAt=new Date().toISOString();tasks.audit.unshift({at:new Date().toISOString(),user:currentUserName()||'',machine:env.machine||'',action:'Task archived',detail:t.project});saveTasks();safeRenderPages()}function reopenTask(id){let t=tasks.tasks.find(x=>x.id===id);if(!t)return;t.status='Open';t.archivedAt='';saveTasks();safeRenderPages()}function deleteTask(id){if(!confirm('Remove task?'))return;tasks.tasks=tasks.tasks.filter(t=>t.id!==id);saveTasks();safeRenderPages()}function backupTasks(){createBackup('tasks',tasks).then(()=>toast('Task backup created'))}function openWeeklyTaskEmail(){const html=weeklyTaskHtml();SuiteBridge.send('mail:openTaskUpdate',{html}).catch(e=>{const w=window.open('','_blank');w.document.write(html);w.document.close();})}function weeklyTaskHtml(){const today=new Date().toLocaleDateString();let list=(tasks.tasks||[]).filter(t=>!['Complete','Archived'].includes(String(t.status||''))).sort((a,b)=>String(a.category||'').localeCompare(String(b.category||''))||String(a.project).localeCompare(String(b.project)));return `<!doctype html><html><head><meta charset="utf-8"><title>PWADC Security Weekly Project Update</title><style>body{font-family:Segoe UI,Arial,sans-serif;margin:28px;color:#1d2430}h1{color:#8f1c21;margin-bottom:4px}.sub{color:#667085;margin-bottom:22px}.item{border-left:4px solid #C0272D;background:#f5f6f8;margin:10px 0;padding:10px 14px;border-radius:6px}.project{font-weight:800;color:#1e2330}.meta{font-size:12px;color:#667085;margin:2px 0 8px}.next{margin-top:6px;color:#344054}button{padding:8px 14px;margin-bottom:18px}</style></head><body><button onclick="window.print()">Print / Save PDF</button><h1>PWADC Security Weekly Project Update</h1><div class="sub">Prepared ${today}</div>${list.map(t=>`<div class="item"><div class="project">${esc(t.project||t.title||'Task')}</div><div class="meta">${esc(t.category||'General')} · ${esc(t.status||'Open')} · ${esc(t.priority||'Medium')}${t.dueDate?' · Due '+esc(t.dueDate):''}</div><div>${esc(t.description||t.notes||'')}</div></div>`).join('')||'<p>No active tasks.</p>'}</body></html>`}
async function backupEverything(){await Promise.all([createBackup('attendance',attendance),createBackup('roster',roster),createBackup('tasks',tasks),createBackup('settings',settings)]);toast('Backup complete')}function combinedChangeLog(){const arr=[];(attendance.audit||[]).forEach(a=>arr.push({module:'Attendance',...a}));(roster.audit||[]).forEach(a=>arr.push({module:'Roster',...a}));(tasks.audit||[]).forEach(a=>arr.push({module:'Task Tracker',...a}));return arr.sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')))}function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportAttendanceCSV(){let lines=['Name,Shift,Title'];activeAttendanceEmployees().forEach(e=>lines.push([e.name,e.shift,e.title].map(x=>`"${String(x||'').replace(/"/g,'""')}"`).join(',')));downloadBlob(new Blob([lines.join('\n')],{type:'text/csv'}),'attendance-employees.csv')}function exportRosterCSV(){let lines=['Name,EID,Rank,Shift,Rate,Type,RDO'];rosterActiveEmployees().forEach(e=>lines.push([fullName(e),e.eid,e.rank,e.shift,e.rate,e.type,(e.rdo||[]).join('/')].map(x=>`"${String(x||'').replace(/"/g,'""')}"`).join(',')));downloadBlob(new Blob([lines.join('\n')],{type:'text/csv'}),'roster.csv')}function importRosterJSON(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{roster=JSON.parse(r.result);normalizeRoster();saveRosterNow('import').then(()=>safeRenderPages())}catch(e){toast('Import failed: '+e.message)}};r.readAsText(f)}function importAttendanceJSON(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{attendance=JSON.parse(r.result);normalizeAttendance();saveAttendanceNow('import').then(()=>safeRenderPages())}catch(e){toast('Import failed: '+e.message)}};r.readAsText(f)}function createRosterBackup(){createBackup('roster',roster).then(()=>toast('Roster backup created'))}function createAttendanceBackup(){createBackup('attendance',attendance).then(()=>toast('Attendance backup created'))}function reloadPackagedRosterData(){SuiteBridge.send('data:loadPackaged',{module:'roster'}).then(d=>{if(d){roster=d;normalizeRoster();saveRoster();safeRenderPages();toast('Packaged roster loaded')}}).catch(e=>toast(e.message))}function reloadPackagedAttendanceData(){SuiteBridge.send('data:loadPackaged',{module:'attendance'}).then(d=>{if(d){attendance=d;normalizeAttendance();saveAttendance();safeRenderPages();toast('Packaged attendance loaded')}}).catch(e=>toast(e.message))}function syncAttendanceFromRoster(linkOnly=false){createBackup('attendance',attendance);let count=0;for(const e of rosterActiveEmployees()){let found=findAttendanceByRosterEmployee(e);if(found){found.name=rosterEmployeeAttendanceName(e)||fullName(e);found.shift=e.shift||found.shift;found.title=rankLong(e.rank)||e.rank||found.title;found.rdos=e.rdo||found.rdos||[];found.rosterId=e.id;count++;}}audit('Attendance linked from roster',count+' existing attendance employee(s) aligned');saveAttendance();safeRenderPages();toast('Linked '+count+' existing attendance row(s). No history deleted.')}function hideAttendanceSyncDuplicates(){let removed=0;const seen={};for(const e of attendance.employees){const k=scheduleNameToPersonKey(e.name);const hist=Object.keys(attendance.attendance[String(e.id)]||{}).length;if(seen[k]&&hist===0){e.archived=true;removed++;}else if(!seen[k])seen[k]=e}audit('Empty sync duplicates hidden',removed+' duplicate blank row(s) archived');saveAttendance();safeRenderPages()}function alignAttendanceNamesToRoster(){let n=0;for(const re of rosterActiveEmployees()){const a=findAttendanceByRosterEmployee(re);if(a){a.name=rosterEmployeeAttendanceName(re)||fullName(re);a.shift=re.shift||a.shift;a.title=rankLong(re.rank)||re.rank||a.title;a.rdos=re.rdo||a.rdos||[];a.rosterId=re.id;n++;}}audit('Attendance names aligned to roster',n+' row(s)');saveAttendance();safeRenderPages()}function openRosterPrintModal(){showModal(`<div class="modal-head"><div class="modal-title">Print Roster</div><button onclick="closeModal()">Close</button></div><p class="mini-note">Current filtered roster will print.</p><div class="modal-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="window.print()">Print</button></div>`)}
function showModal(html){let b=document.createElement('div');b.className='modal-backdrop';b.id='modalBackdrop';b.innerHTML=`<div class="modal-card" onclick="event.stopPropagation()">${html}</div>`;b.onclick=closeModal;document.body.appendChild(b)}function closeModal(){document.getElementById('modalBackdrop')?.remove()}function openSettings(){renderSettings();document.getElementById('settingsPanel').classList.add('open')}function closeSettings(){document.getElementById('settingsPanel').classList.remove('open')}function renderSettings(){normalizeSettings();const users=settings.users||[];document.getElementById('settingsBody').innerHTML=`<div class="form-grid"><div><label>Theme</label><select onchange="settings.theme=this.value;applyTheme();saveSettings()"><option ${settings.theme==='dark'?'selected':''}>dark</option><option ${settings.theme==='light'?'selected':''}>light</option><option ${settings.theme==='auto'?'selected':''}>auto</option></select></div><div><label>Default Module</label><select onchange="settings.defaultModule=this.value;saveSettings()">${MODULES.map(m=>`<option value="${m.id}" ${settings.defaultModule===m.id?'selected':''}>${m.label}</option>`).join('')}</select></div><div class="full"><label>Data Root</label><input value="${escAttr(settings.dataRoot)}" onchange="settings.dataRoot=this.value;saveSettings()"></div></div><hr style="border-color:var(--border);margin:18px 0"><div class="card-title">User Management</div><div class="notice">PINs are stored in the local shared settings JSON. This is a simple internal control, not Active Directory authentication.</div>${users.map(u=>`<div class="person-row"><div><strong>${esc(u.displayName)}</strong><br><small>${esc(u.username)} · ${esc(u.role)} · ${u.active?'Active':'Inactive'}</small></div><div></div><div><button class="sm" onclick="editUser('${esc(u.id)}')">Edit</button></div><div><button class="sm danger" onclick="toggleUser('${esc(u.id)}')">${u.active?'Disable':'Enable'}</button></div></div>`).join('')}<button class="primary" onclick="editUser('')">+ Add User</button>`}async function saveSettings(){normalizeSettings();await saveModuleDataStrict('settings',settings);document.getElementById('saveStatus').textContent='Settings saved '+new Date().toLocaleTimeString()}function applyTheme(){document.documentElement.dataset.theme=settings.theme||'dark'}function editUser(id){const u=id?settings.users.find(x=>x.id===id):{id:'',username:'',displayName:'',role:'Viewer',pin:'',active:true};showModal(`<div class="modal-head"><div class="modal-title">${id?'Edit':'Add'} User</div><button onclick="closeModal()">Close</button></div><div class="form-grid"><div><label>Display Name</label><input id="uDisplay" value="${escAttr(u.displayName)}"></div><div><label>Username</label><input id="uName" value="${escAttr(u.username)}"></div><div><label>Role</label><select id="uRole">${['Admin','Supervisor','Guard','Viewer'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></div><div><label>PIN</label><input id="uPin" value="${escAttr(u.pin)}"></div></div><div class="modal-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveUser('${esc(id)}')">Save</button></div>`)}function saveUser(id){let u=id?settings.users.find(x=>x.id===id):null;if(!u){u={id:cryptoId(),active:true};settings.users.push(u)}u.displayName=val('uDisplay');u.username=val('uName');u.role=val('uRole');u.pin=val('uPin');saveSettings();closeModal();renderSettings();renderPin()}function toggleUser(id){let u=settings.users.find(x=>x.id===id);if(u){u.active=!u.active;saveSettings();renderSettings();renderPin()}}function updateUserStatus(){const el=document.getElementById('userStatus');if(el)el.textContent=currentUser?`${currentUserName()} · ${currentRole()}`:'Not signed in'}
function safeRenderPages(opts={}){const preserveScroll=opts.preserveScroll;const sx=window.scrollX,sy=window.scrollY;try{renderPages();if(preserveScroll)setTimeout(()=>window.scrollTo(sx,sy),0);}catch(e){showStartupError(e)}}function showStartupError(e){console.error(e);const p=document.getElementById('pages')||document.body;p.innerHTML=`<div class="startup-error"><h2>Suite Render Error</h2><p>${esc(e.message||e)}</p><pre>${esc(e.stack||'')}</pre></div>`}function applyViewportSizing(){const root=document.documentElement;root.style.setProperty('--page-max',window.innerWidth>2100?'2300px':'1900px')}window.addEventListener('resize',applyViewportSizing);function init(){applyViewportSizing();bootstrap()}applyTheme();init();
</script>
