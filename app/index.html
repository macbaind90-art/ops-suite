function openTaskModal(id){taskEditId=id||null;const t=id?(tasks.tasks||[]).find(x=>Number(x.id)===Number(id)):{project:'',status:'Active',priority:'Medium',category:'General',owner:'David',dueDate:'',update:''};if(!t){toast('Task not found');return;}showModal(`<div class="modal-head"><div class="modal-title">${id?'Edit Task':'Add Task'}</div><button onclick="closeModal()">Close</button></div><div class="form-grid"><div class="form-group full"><label>Project / Task</label><input id="taskProject" value="${esc(t.project)}"></div><div class="form-group"><label>Status</label><select id="taskStatus">${['Active','Planning','Finalizing','Waiting','Follow-up','Blocked','On Hold','Tabled','Archived'].map(x=>`<option ${t.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label>Priority</label><select id="taskPriority">${['High','Medium','Low'].map(x=>`<option ${t.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label>Category</label><input id="taskCategory" value="${esc(t.category||'General')}"></div><div class="form-group"><label>Owner</label><input id="taskOwner" value="${esc(t.owner||'David')}"></div><div class="form-group"><label>Target / Due Date</label><input type="date" id="taskDue" value="${esc(t.dueDate||'')}"></div><div class="form-group full"><label>Current Update</label><textarea id="taskUpdate" rows="5">${esc(t.update||'')}</textarea></div></div><div class="form-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveTaskFromModal()">Save Task</button></div>`) }
function saveTaskFromModal(){const data={project:document.getElementById('taskProject').value.trim(),status:document.getElementById('taskStatus').value,priority:document.getElementById('taskPriority').value,category:document.getElementById('taskCategory').value.trim()||'General',owner:document.getElementById('taskOwner').value.trim()||'David',dueDate:document.getElementById('taskDue').value,update:document.getElementById('taskUpdate').value.trim()};if(data.status==='Complete')data.status='Archived';if(!data.project){toast('Task needs a project name');return;}if(taskEditId){let t=tasks.tasks.find(x=>Number(x.id)===Number(taskEditId));Object.assign(t,data,{updatedAt:new Date().toISOString()});taskAudit(data.status==='Archived'?'Archived task':'Updated task',data.project)}else{data.id=tasks.nextId++;data.createdAt=new Date().toISOString();data.updatedAt=new Date().toISOString();tasks.tasks.push(data);taskAudit('Added task',data.project)}saveTasksNow('task-modal').then(ok=>{if(ok){closeModal();safeRenderPages();toast(data.status==='Archived'?'Task archived':'Task saved')}});}
function markTaskComplete(id){let t=tasks.tasks.find(x=>Number(x.id)===Number(id));if(!t)return;t.status='Archived';t.completedAt=new Date().toISOString();t.updatedAt=t.completedAt;taskAudit('Archived completed task',t.project);saveTasks();safeRenderPages();toast('Task completed and archived')}
function reopenTask(id){let t=tasks.tasks.find(x=>Number(x.id)===Number(id));if(!t)return;t.status='Active';t.updatedAt=new Date().toISOString();taskAudit('Reopened archived task',t.project);saveTasks();safeRenderPages();toast('Task reopened')}
function removeTask(id){let t=tasks.tasks.find(x=>Number(x.id)===Number(id));if(!t)return;if(!confirm('Remove task: '+t.project+'?'))return;tasks.tasks=tasks.tasks.filter(x=>Number(x.id)!==Number(id));taskAudit('Removed task',t.project);saveTasks();safeRenderPages()}
async function createTaskBackup(){try{await SuiteBridge.send('suite:createBackup',tasks,{module:'tasks'});toast('Task backup created')}catch(e){toast('Task backup failed: '+e.message)}}
async function reloadPackagedTasksData(){if(!confirm('Replace current task tracker with the packaged starter task list? A backup will be created first.'))return;try{const res=await SuiteBridge.send('suite:resetModuleFromSeed',{}, {module:'tasks'});tasks=JSON.parse(res.data||'{}');normalizeTasks();toast('Packaged task tracker loaded');safeRenderPages();}catch(e){toast('Task seed restore failed: '+e.message)}}
async function importTasksJSON(input){const file=input&&input.files&&input.files[0];if(!file)return;try{const text=await file.text();const data=JSON.parse(text);if(!Array.isArray(data.tasks))throw new Error('File does not look like a PWADC task tracker JSON export.');tasks=data;normalizeTasks();taskAudit('Imported task JSON',file.name);saveTasks('import');safeRenderPages();toast('Task JSON imported')}catch(e){toast('Task import failed: '+e.message)}}
function exportTasksCSV(){let rows=[['Project','Status','Priority','Category','Owner','Due Date','Current Update','Updated At','Completed/Archived At'],...(tasks.tasks||[]).map(t=>[t.project,t.status,t.priority,t.category,t.owner,t.dueDate,t.update,t.updatedAt,t.completedAt||''])];downloadCSV('PWADC_Tasks_'+new Date().toISOString().slice(0,10)+'.csv',rows)}
function weeklyTaskText(){const today=new Date().toLocaleDateString();let list=(tasks.tasks||[]).filter(t=>!['Complete','Archived'].includes(String(t.status||''))).sort((a,b)=>String(a.category||'').localeCompare(String(b.category||''))||String(a.project).localeCompare(String(b.project)));let lines=['Security Projects Weekly Update - '+today,''];for(const t of list){lines.push(t.project+' - '+(t.update||'No current update entered.'));}return lines.join('\n')}
function weeklyTaskHtml(){const today=new Date().toLocaleDateString();let list=(tasks.tasks||[]).filter(t=>!['Complete','Archived'].includes(String(t.status||''))).sort((a,b)=>String(a.category||'').localeCompare(String(b.category||''))||String(a.project).localeCompare(String(b.project)));return `<!doctype html><html><head><meta charset="utf-8"><title>PWADC Security Weekly Project Update</title><style>body{font-family:Segoe UI,Arial,sans-serif;margin:28px;color:#1d2430}h1{color:#8f1c21;margin-bottom:4px}.sub{color:#667085;margin-bottom:22px}.item{border-left:4px solid #C0272D;background:#f5f6f8;margin:10px 0;padding:10px 14px;border-radius:6px}.project{font-weight:800;color:#1e2330}.meta{font-size:12px;color:#667085;margin:2px 0 8px}.next{margin-top:6px;color:#344054}button{padding:8px 14px;margin-bottom:18px}

.audit-native-frame-wrap{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface);height:calc(100vh - 150px);min-height:720px}.audit-native-frame{width:100%;height:100%;border:0;background:#fff}.audit-action-note{margin-bottom:12px}
</style></head><body><button onclick="window.print()">Print</button><h1>PWADC Security Weekly Project Update</h1><div class="sub">Generated ${esc(today)} · ${list.length} active projects</div>${list.map(t=>`<div class="item"><div class="project">${esc(t.project)}</div><div class="meta">${esc(t.status)} · ${esc(t.priority)} Priority · ${esc(t.category||'General')}</div><div>${esc(t.update||'No current update entered.')}</div></div>`).join('')}</body></html>`}
function taskEmailBody(){return weeklyTaskText()+"\n\nRespectfully,\nDavid"}
function openWeeklyTaskEmail(){const subject='PWADC Security Weekly Project Update - '+new Date().toLocaleDateString();const body=taskEmailBody();const mailto='mailto:jfaure@pwadc.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);const a=document.createElement('a');a.href=mailto;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{try{a.remove()}catch(e){}},1000);toast('Opening email draft to jfaure@pwadc.com')}
async function generateWeeklyUpdate(){const html=weeklyTaskHtml();const txt=weeklyTaskText();const date=new Date().toISOString().slice(0,10);try{await SuiteBridge.send('suite:writeExport',html,{module:'tasks',fileName:'PWADC_Weekly_Project_Update_'+date+'.html'});await SuiteBridge.send('suite:writeExport',txt,{module:'tasks',fileName:'PWADC_Weekly_Project_Update_'+date+'.txt'});toast('Weekly update exported and email draft opening');}catch(e){toast('Weekly export failed: '+e.message)}openWeeklyTaskEmail();showModal(`<div class="modal-title">Weekly Boss Update</div><div class="notice">A preformatted email draft should open to <strong>jfaure@pwadc.com</strong>. HTML and plain text copies were also exported to the Task Tracker export folder.</div><div class="weekly-preview">${esc(txt)}</div><div class="form-actions"><button onclick="closeModal()">Close</button><button onclick="openWeeklyTaskEmail()">Open Email Again</button><button class="primary" onclick="printWeeklyTaskUpdate()">Print Preview</button></div>`)}
function printWeeklyTaskUpdate(){let w=window.open('','_blank');if(!w){toast('Popup blocked. Allow popups to preview weekly update.');return;}w.document.write(weeklyTaskHtml());w.document.close();}

function openSettings(){if(!canAdmin()){toast('Settings are admin-only');return;}renderSettings();document.getElementById('settingsPanel').classList.add('open')}function closeSettings(){document.getElementById('settingsPanel').classList.remove('open')}
function renderSettings(){
  document.getElementById('settingsBody').innerHTML=`<div class="form-grid"><div><label>Theme</label><select id="setTheme"><option ${settings.theme==='dark'?'selected':''}>dark</option><option ${settings.theme==='light'?'selected':''}>light</option><option ${settings.theme==='auto'?'selected':''}>auto</option></select></div><div><label>Default Module</label><select id="setDefault">${MODULES.map(m=>`<option value="${m.id}" ${settings.defaultModule===m.id?'selected':''}>${m.label}</option>`).join('')}</select></div><div><label>Legacy Admin PIN</label><input id="setPin" value="${esc(settings.pin)}" maxlength="8"></div><div><label>Backup Retention Days</label><input id="setRetention" type="number" value="${settings.backupRetentionDays}"></div><div class="full"><label>Data Root</label><input id="setRoot" value="${esc(settings.dataRoot)}"></div><div class="full"><button class="primary" onclick="saveSettings()">Save Settings</button> <button onclick="runHealthCheck()">Run Health Check</button> <button class="gold" onclick="backupEverything()">Backup Everything</button></div></div><div class="card"><div class="card-title">User Management</div><div class="notice">First-pass role system: individual username + PIN. Admin users can manage users and settings.</div><div style="overflow:auto"><table class="print-table" style="margin-top:10px"><thead><tr><th>User</th><th>Display Name</th><th>Role</th><th>PIN</th><th>Active</th><th>Actions</th></tr></thead><tbody id="userRows">${renderUserRows()}</tbody></table></div><div class="toolbar"><button class="primary" onclick="addUserRow()">Add User</button></div></div><div id="healthBox" style="margin-top:14px"></div>`
}
function renderUserRows(){return (settings.users||[]).map((u,i)=>`<tr><td><input id="u_name_${i}" value="${esc(u.username||'')}"></td><td><input id="u_disp_${i}" value="${esc(u.displayName||'')}"></td><td><select id="u_role_${i}">${['Admin','Supervisor','Guard','Viewer'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></td><td><input id="u_pin_${i}" value="${esc(u.pin||'')}" maxlength="8"></td><td><select id="u_active_${i}"><option value="true" ${u.active!==false?'selected':''}>Yes</option><option value="false" ${u.active===false?'selected':''}>No</option></select></td><td><button class="danger sm" onclick="removeUserRow(${i})">Remove</button></td></tr>`).join('')}
function collectUsersFromSettings(){return (settings.users||[]).map((u,i)=>normalizeUser({id:u.id||('user'+Date.now()+i),username:document.getElementById('u_name_'+i)?.value||u.username,displayName:document.getElementById('u_disp_'+i)?.value||u.displayName,role:document.getElementById('u_role_'+i)?.value||u.role,pin:document.getElementById('u_pin_'+i)?.value||u.pin,active:(document.getElementById('u_active_'+i)?.value||'true')==='true'},i))}
function addUserRow(){settings.users=settings.users||[];settings.users.push(normalizeUser({id:'user'+Date.now(),username:'NewUser',displayName:'New User',role:'Viewer',pin:'1234',active:true},settings.users.length));renderSettings()}
function removeUserRow(i){if((settings.users||[]).filter(u=>u.role==='Admin'&&u.active!==false).length<=1 && settings.users[i]?.role==='Admin'){toast('At least one active Admin is required');return;}settings.users.splice(i,1);renderSettings()}
async function saveSettings(){
  const users=collectUsersFromSettings();
  if(!users.some(u=>u.role==='Admin'&&u.active!==false)){toast('At least one active Admin is required');return;}
  settings={...settings,theme:document.getElementById('setTheme').value,defaultModule:document.getElementById('setDefault').value,pin:document.getElementById('setPin').value||'1234',dataRoot:document.getElementById('setRoot').value,backupRetentionDays:Number(document.getElementById('setRetention').value||60),users};
  applyTheme();renderShell();
  try{await SuiteBridge.send('suite:saveSettings',settings);toast('Settings saved')}catch(e){toast('Settings failed: '+e.message)}
}
async function backupEverything(){
  const stamp=new Date().toLocaleString();
  const results=[];
  try{await SuiteBridge.send('suite:createBackup',attendance,{module:'attendance'});results.push({name:'Attendance',ok:true});}catch(e){results.push({name:'Attendance',ok:false,error:e.message});}
  try{await SuiteBridge.send('suite:createBackup',roster,{module:'roster'});results.push({name:'Roster',ok:true});}catch(e){results.push({name:'Roster',ok:false,error:e.message});}
  try{await SuiteBridge.send('suite:createBackup',tasks,{module:'tasks'});results.push({name:'Task Tracker',ok:true});}catch(e){results.push({name:'Task Tracker',ok:false,error:e.message});}
  try{await SuiteBridge.send('suite:createBackup',settings,{module:'suite-settings'});results.push({name:'Suite Settings',ok:true});}catch(e){results.push({name:'Suite Settings',ok:false,error:e.message});}
  try{await SuiteBridge.send('suite:backupPrograms');results.push({name:'Standalone Programs',ok:true});}catch(e){results.push({name:'Standalone Programs',ok:false,error:e.message});}
  const okCount=results.filter(r=>r.ok).length;
  const box=document.getElementById('healthBox');
  if(box)box.innerHTML=`<div class="card"><div class="card-title">Backup Everything</div><div style="color:var(--muted);font-size:12px;margin-bottom:8px">Run ${esc(stamp)}</div>${results.map(r=>`<div class="health-row"><span>${esc(r.name)}</span><span class="${r.ok?'ok':'bad'}">${r.ok?'BACKED UP':esc(r.error||'FAILED')}</span></div>`).join('')}</div>`;
  toast(okCount===results.length?'Everything backed up':'Backup completed with '+(results.length-okCount)+' issue(s)');
}
async function runHealthCheck(){try{let r=await SuiteBridge.send('suite:healthCheck');document.getElementById('healthBox').innerHTML=`<div class="card"><div class="card-title">Health Check</div><div style="color:var(--muted);font-size:12px;margin-bottom:8px">${esc(r.dataRoot)}</div>${r.checks.map(c=>`<div class="health-row"><span>${esc(c.name)}</span><span class="${c.ok?'ok':'bad'}">${c.ok?'OK':esc(c.error)}</span></div>`).join('')}</div>`}catch(e){toast('Health check failed')}}


function applyViewportSizing(){
  const root=document.documentElement;
  const w=window.innerWidth||document.documentElement.clientWidth||1400;
  const h=window.innerHeight||document.documentElement.clientHeight||900;
  let view='standard';
  if(w<1280 || h<760) view='compact';
  else if(w>=2200) view='wide';
  root.setAttribute('data-view',view);
  root.style.setProperty('--vh',(h*0.01)+'px');
}
let viewportResizeTimer=null;
window.addEventListener('resize',()=>{clearTimeout(viewportResizeTimer);viewportResizeTimer=setTimeout(()=>{applyViewportSizing();try{safeRenderPages();}catch(_){ }},120);});
window.addEventListener('orientationchange',()=>setTimeout(applyViewportSizing,150));
applyViewportSizing();

init();
</script>
