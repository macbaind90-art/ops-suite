<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PWADC Security Operations Suite v2.0</title>
<style>
:root{--red:#C0272D;--red2:#e03840;--gold:#C6B273;--gold2:#ddce91;--bg:#1e2330;--surface:#28303f;--surface2:#313b4d;--surface3:#3d4a5e;--border:#404d62;--text:#eef0f4;--muted:#8a96a8;--dim:#c4cad5;--green:#4caf6e;--blue:#4a90d9;--orange:#e08a2f;--purple:#a06ede;--danger:#ff7676;--shadow:0 12px 30px rgba(0,0,0,.28);--radius:10px}
:root[data-theme="light"]{--bg:#f3f2ef;--surface:#ffffff;--surface2:#f2f4f7;--surface3:#e3e7ed;--border:#d7dce5;--text:#1d2430;--muted:#697386;--dim:#303848;--shadow:0 8px 22px rgba(20,30,45,.11)}
@media(prefers-color-scheme:light){:root[data-theme="auto"]{--bg:#f3f2ef;--surface:#ffffff;--surface2:#f2f4f7;--surface3:#e3e7ed;--border:#d7dce5;--text:#1d2430;--muted:#697386;--dim:#303848;--shadow:0 8px 22px rgba(20,30,45,.11)}}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:6px;padding:8px 13px;font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;cursor:pointer;transition:.15s}button:hover{background:var(--surface2);color:var(--text);border-color:var(--muted)}button.primary{background:var(--red);border-color:var(--red);color:white}button.primary:hover{background:var(--red2)}button.gold{background:var(--gold);border-color:var(--gold);color:#1e2330}button.danger{border-color:var(--danger);color:var(--danger)}input,select,textarea{width:100%;border:1px solid var(--border);background:var(--surface2);border-radius:6px;padding:8px 10px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(198,178,115,.18)}label{display:block;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px}.hidden{display:none!important}
.lock-screen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:grid;place-items:center}.lock-card{width:min(390px,92vw);background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--red);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px;text-align:center}.suite-title{font-size:22px;font-weight:900;color:var(--gold);letter-spacing:1.2px;text-transform:uppercase}.suite-sub{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:4px}.pin-row{display:flex;gap:10px;justify-content:center;margin:22px 0}.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border)}.pin-dot.on{background:var(--gold);border-color:var(--gold)}.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pin-pad button{font-size:18px;padding:14px;color:var(--text)}.pin-error{min-height:18px;color:var(--danger);font-size:13px;margin-top:12px}
.topbar{height:58px;background:var(--surface);border-bottom:3px solid var(--red);display:flex;align-items:center;gap:16px;padding:0 18px;position:sticky;top:0;z-index:100}.brand{min-width:245px}.brand strong{display:block;color:var(--gold);font-weight:900;letter-spacing:1.2px;text-transform:uppercase}.brand span{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;text-transform:uppercase}.nav{display:flex;gap:4px;flex:1;overflow-x:auto}.nav button{border-color:transparent}.nav button.active{background:var(--surface2);color:var(--gold);border-color:var(--border)}.nav button::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:7px;vertical-align:1px}.nav button[data-module="attendance"]::before{background:var(--red)}.nav button[data-module="roster"]::before{background:var(--gold)}.nav button[data-module="badge-audit"]::before{background:var(--blue)}.nav button[data-module="amag-audit"]::before{background:var(--orange)}.nav button[data-module="access-audit"]::before{background:var(--purple)}.status{text-align:right;font-size:11px;color:var(--muted);border-left:1px solid var(--border);padding-left:14px;white-space:nowrap}.wrap{max-width:1500px;margin:0 auto;padding:22px}.page{display:none}.page.active{display:block}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}.page-title{font-size:28px;color:var(--gold);font-weight:900;letter-spacing:1px;text-transform:uppercase}.page-sub{font-size:12px;color:var(--muted);margin-top:3px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;position:relative;overflow:hidden}.card:before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--red)}.card-title{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--gold);font-weight:900;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:14px}.grid{display:grid;gap:14px}.grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.grid.cols-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden}.kpi:before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--gold)}.kpi .num{font-size:32px;font-weight:900}.kpi .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px}.module-card{cursor:pointer;transition:.15s}.module-card:hover{transform:translateY(-2px);border-color:var(--gold)}.module-card h3{color:var(--gold);font-size:18px;margin-bottom:8px}.module-card p{color:var(--dim);font-size:13px;line-height:1.45}.module-card .tag{display:inline-block;margin-top:12px;border:1px solid var(--border);background:var(--surface2);border-radius:99px;padding:4px 9px;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:800}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:12px}.toolbar>div{min-width:180px}.quick-codes{display:flex;gap:8px;flex-wrap:wrap}.code-btn{min-width:52px;padding:10px 12px;border-width:2px}.code-btn.active{background:var(--gold);border-color:var(--gold);color:#1e2330}.people-list{display:grid;gap:8px}.person-row{display:grid;grid-template-columns:minmax(220px,1fr) 90px 100px 130px;gap:10px;align-items:center;border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:10px;cursor:pointer}.person-row:hover{border-color:var(--gold)}.person-name strong{display:block}.person-name span{display:block;color:var(--muted);font-size:12px}.badge{display:inline-flex;align-items:center;justify-content:center;min-width:34px;border:1px solid var(--border);border-radius:5px;padding:3px 8px;font-weight:900;color:var(--gold);background:var(--surface)}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left}th{background:var(--surface2);color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:1px}.settings-panel{position:fixed;right:0;top:0;bottom:0;width:min(520px,96vw);background:var(--surface);border-left:1px solid var(--border);z-index:1000;box-shadow:var(--shadow);transform:translateX(105%);transition:.2s;overflow:auto}.settings-panel.open{transform:translateX(0)}.settings-head{display:flex;justify-content:space-between;align-items:center;padding:18px;border-bottom:3px solid var(--red)}.settings-body{padding:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}.health-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);padding:8px 0}.ok{color:#8ae0a0}.bad{color:#ff8a8a}.toast{position:fixed;right:22px;bottom:22px;z-index:2000;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--green);border-radius:7px;padding:12px 16px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.notice{border-left:4px solid var(--blue);background:var(--surface2);padding:12px;border-radius:7px;color:var(--dim);line-height:1.45}.warn{border-left-color:var(--orange)}@media(max-width:900px){.topbar{height:auto;min-height:58px;flex-wrap:wrap;padding:10px}.brand{min-width:100%}.status{display:none}.person-row{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="lockScreen" class="lock-screen"><div class="lock-card"><div class="suite-title">PWADC Security Operations</div><div class="suite-sub">Command Suite v2.0</div><p style="color:var(--muted);margin-top:18px">Enter global PIN</p><div class="pin-row" id="pinDots"></div><div class="pin-pad" id="pinPad"></div><div class="pin-error" id="pinError"></div></div></div>
<div id="app" class="hidden">
  <div class="topbar"><div class="brand"><strong>PWADC Security Operations</strong><span>Command Suite v2.0</span></div><div class="nav" id="nav"></div><div class="status"><div id="moduleStatus">Loading</div><div id="saveStatus">Initializing...</div></div><button onclick="openSettings()">Settings</button><button class="gold" onclick="lockSuite()">Lock</button></div>
  <main class="wrap" id="pages"></main>
</div>
<aside class="settings-panel" id="settingsPanel"><div class="settings-head"><div><strong style="color:var(--gold);text-transform:uppercase;letter-spacing:1px">Global Settings</strong><div style="font-size:11px;color:var(--muted)">Suite-wide configuration</div></div><button onclick="closeSettings()">Close</button></div><div class="settings-body" id="settingsBody"></div></aside>
<div class="toast" id="toast"></div>
<script>
'use strict';
const MODULES=[
 {id:'home',label:'Home',color:'var(--muted)'},{id:'attendance',label:'Attendance',color:'var(--red)'},{id:'roster',label:'Roster',color:'var(--gold)'},{id:'badge-audit',label:'Badge Audit',color:'var(--blue)'},{id:'amag-audit',label:'AMAG Audit',color:'var(--orange)'},{id:'access-audit',label:'Access Audit',color:'var(--purple)'}
];
const DEFAULT_SETTINGS={theme:'dark',defaultModule:'home',pin:'1234',dataRoot:'\\\\pig-fs\\Security\\Security Operations Suite',backupRetentionDays:60};
let settings={...DEFAULT_SETTINGS}, env={}, unlocked=false, pinInput='', activeModule='home', activeCode='P', attendanceDraft={date:new Date().toISOString().slice(0,10), rows:[]};
const samplePeople=['Brewer, Jaz','Aiken, Don','Reese, Javontae','Cleveland, Kenyetta','Ferguson, Matt','Parker, Lacey','Summerhill, Rickey','Anderson, Shaun'].map((name,i)=>({id:String(i+1),name,shift:i<4?'1st Shift':i<6?'2nd Shift':'3rd Shift',code:''}));
const CODES=[['P','Present'],['T','Late'],['AL','Approved Late'],['LE','Left Early'],['UE','Unauthorized Early'],['E','Excused'],['U','Unexcused'],['V','Vacation'],['O','Off/RDO'],['FL','Protected Leave'],['NE','Not Employed']];
const SuiteBridge={seq:0,pending:{},send(type,payload={},extra={}){return new Promise((resolve,reject)=>{const id='r'+(++this.seq);this.pending[id]={resolve,reject};if(window.chrome&&chrome.webview){chrome.webview.postMessage({id,type,payload,...extra});}else{setTimeout(()=>resolve(mockResponse(type,payload,extra)),150);}})},receive(res){const p=this.pending[res.id];if(!p)return;delete this.pending[res.id];res.ok?p.resolve(res.payload):p.reject(new Error((res.payload&&res.payload.error)||'Bridge error'));}};window.SuiteBridge=SuiteBridge;
function mockResponse(type,payload){if(type==='suite:getSettings')return{settings:{...DEFAULT_SETTINGS},environment:{user:'Preview',machine:'Browser',version:'2.0.0'}};if(type==='suite:healthCheck')return{dataRoot:settings.dataRoot,checks:[{name:'Preview mode',ok:true,error:''},{name:'Desktop bridge unavailable in browser',ok:false,error:'Run EXE for real checks'}]};return{ok:true};}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800)}
function applyTheme(){const t=settings.theme||'dark';document.documentElement.setAttribute('data-theme',t)}
function renderPin(){const dots=document.getElementById('pinDots');dots.innerHTML='';for(let i=0;i<4;i++)dots.innerHTML+=`<div class="pin-dot ${pinInput.length>i?'on':''}"></div>`;const pad=document.getElementById('pinPad');pad.innerHTML=[1,2,3,4,5,6,7,8,9,'C',0,'X'].map(x=>`<button onclick="pinPress('${x}')">${x==='C'?'CLR':x==='X'?'⌫':x}</button>`).join('')}
function pinPress(x){if(x==='C')pinInput='';else if(x==='X')pinInput=pinInput.slice(0,-1);else if(pinInput.length<4)pinInput+=x;renderPin();if(pinInput.length===4){if(pinInput===(settings.pin||'1234'))unlockSuite();else{document.getElementById('pinError').textContent='Invalid PIN';pinInput='';setTimeout(renderPin,250)}}}
function unlockSuite(){unlocked=true;document.getElementById('lockScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');navigate(settings.defaultModule||'home')}
function lockSuite(){unlocked=false;pinInput='';renderPin();document.getElementById('pinError').textContent='';document.getElementById('app').classList.add('hidden');document.getElementById('lockScreen').classList.remove('hidden')}
function renderNav(){document.getElementById('nav').innerHTML=MODULES.map(m=>`<button data-module="${m.id}" class="${activeModule===m.id?'active':''}" onclick="navigate('${m.id}')">${m.label}</button>`).join('')}
function navigate(id){activeModule=id;renderNav();document.getElementById('moduleStatus').textContent=MODULES.find(m=>m.id===id)?.label||id;renderPages()}
function renderPages(){const p=document.getElementById('pages');p.innerHTML=renderPage(activeModule)}
function renderPage(id){if(id==='home')return homePage();if(id==='attendance')return attendancePage();if(id==='roster')return rosterPage();if(id==='badge-audit')return auditPage('Badge Audit','badge-audit');if(id==='amag-audit')return auditPage('AMAG Audit','amag-audit');if(id==='access-audit')return auditPage('Access Audit','access-audit');return ''}
function homePage(){return `<section class="page active"><div class="page-head"><div><div class="page-title">Command Dashboard</div><div class="page-sub">Unified v2 foundation. Modules are being rebuilt into this shell.</div></div><button class="primary" onclick="runHealthCheck()">Run Health Check</button></div><div class="grid cols-3"><div class="kpi"><div class="num">2.0</div><div class="lbl">Suite Version</div></div><div class="kpi"><div class="num">${env.user||'User'}</div><div class="lbl">Windows User</div></div><div class="kpi"><div class="num">${settings.theme}</div><div class="lbl">Appearance</div></div></div><div class="grid cols-3">${MODULES.filter(m=>m.id!=='home').map(m=>`<div class="card module-card" onclick="navigate('${m.id}')"><h3>${m.label}</h3><p>${moduleDescription(m.id)}</p><span class="tag">Open Module</span></div>`).join('')}</div></section>`}
function moduleDescription(id){return {attendance:'Daily entry, attendance codes, exceptions, clear-by-person/code workflow, and future shared JSON storage.',roster:'Staff records, schedule, training, uniforms, roster reports, and future shared JSON storage.','badge-audit':'Upload badge/clock files, run exceptions, and export reports.','amag-audit':'Upload AMAG user exports and review access-control exceptions.','access-audit':'Review contractor/temp access and termination/access mismatch workflows.'}[id]||''}
function attendancePage(){attendanceDraft.rows=attendanceDraft.rows.length?attendanceDraft.rows:samplePeople.map(x=>({...x}));return `<section class="page active"><div class="page-head"><div><div class="page-title">Attendance v2 Rebuild</div><div class="page-sub">Fast daily-entry command pad. Live data migration comes in v2.1.</div></div><button class="primary" onclick="saveAttendanceDraft()">Save Draft Snapshot</button></div><div class="card"><div class="card-title">Daily Entry Fast Pad</div><div class="toolbar"><div><label>Date</label><input type="date" value="${attendanceDraft.date}" onchange="attendanceDraft.date=this.value"></div><div><label>Shift Filter</label><select><option>All Shifts</option><option>1st Shift</option><option>2nd Shift</option><option>3rd Shift</option><option>Gate</option><option>Dock</option></select></div><div><button onclick="markAllScheduledPresent()">Mark Scheduled Present</button></div><div><button onclick="markRdosOff()">Mark RDOs Off</button></div><div><button class="danger" onclick="clearDay()">Clear Day</button></div></div><label>Active Code</label><div class="quick-codes">${CODES.map(c=>`<button class="code-btn ${activeCode===c[0]?'active':''}" onclick="activeCode='${c[0]}';renderPages()"><strong>${c[0]}</strong><br><span style="font-size:10px;font-weight:600">${c[1]}</span></button>`).join('')}</div></div><div class="card"><div class="card-title">Click Employee to Apply: ${activeCode}</div><div class="people-list">${attendanceDraft.rows.map(r=>`<div class="person-row" onclick="setPersonCode('${r.id}')"><div class="person-name"><strong>${r.name}</strong><span>${r.shift}</span></div><div><span class="badge">${r.code||'Blank'}</span></div><button onclick="event.stopPropagation();rNote('${r.id}')">Note</button><div style="color:var(--muted);font-size:12px">Last 7 days: pending</div></div>`).join('')}</div></div></section>`}
function setPersonCode(id){const r=attendanceDraft.rows.find(x=>x.id===id);if(r){r.code=activeCode;document.getElementById('saveStatus').textContent='Unsaved attendance draft';renderPages()}}
function markAllScheduledPresent(){attendanceDraft.rows.forEach(r=>{if(!r.code)r.code='P'});renderPages();toast('Marked blanks as Present')}
function markRdosOff(){toast('RDO automation will be wired to roster schedule in v2.1')}
function clearDay(){if(confirm('Clear all entries for this draft day?')){attendanceDraft.rows.forEach(r=>r.code='');renderPages()}}
function rNote(id){toast('Notes will be part of v2.1 attendance data model')}
async function saveAttendanceDraft(){await SuiteBridge.send('suite:saveModuleData',{date:attendanceDraft.date,rows:attendanceDraft.rows},{module:'attendance'});document.getElementById('saveStatus').textContent='Attendance draft saved';toast('Attendance draft saved to shared JSON')}
function rosterPage(){return `<section class="page active"><div class="page-head"><div><div class="page-title">Roster v2 Rebuild</div><div class="page-sub">Clean module placeholder. Live roster migration comes in v2.2.</div></div><button class="primary" onclick="toast('Roster save will be wired in v2.2')">Save Roster</button></div><div class="notice warn">Roster will be rebuilt as a native suite module instead of embedding the old standalone HTML app. This prevents the raw-script issue and gives us shared settings, backups, and consistent styling.</div><div class="grid cols-3" style="margin-top:14px"><div class="kpi"><div class="num">0</div><div class="lbl">Live Staff Loaded</div></div><div class="kpi"><div class="num">0</div><div class="lbl">Training Gaps</div></div><div class="kpi"><div class="num">0</div><div class="lbl">Uniform Needs</div></div></div><div class="card"><div class="card-title">Planned Roster Tools</div><table><tr><th>Feature</th><th>Status</th></tr><tr><td>Staff Records</td><td>v2.2 rebuild</td></tr><tr><td>Schedule</td><td>v2.2 rebuild</td></tr><tr><td>Training Matrix</td><td>v2.2 rebuild</td></tr><tr><td>Uniform Tracking</td><td>v2.2 rebuild</td></tr></table></div></section>`}
function auditPage(title,module){return `<section class="page active"><div class="page-head"><div><div class="page-title">${title}</div><div class="page-sub">Audit module rebuild shell. Upload/run/export logic will be ported after Attendance and Roster.</div></div><button class="primary" onclick="toast('${title} export center pending')">Export Center</button></div><div class="notice">This module will be rebuilt into the shared theme and offline file-processing model. The old standalone HTML tool remains reference material, not the final architecture.</div><div class="card"><div class="card-title">Audit Workflow</div><table><tr><th>Step</th><th>Planned v2 Behavior</th></tr><tr><td>1. Upload source files</td><td>Suite file picker</td></tr><tr><td>2. Run audit</td><td>Module-specific rules</td></tr><tr><td>3. Review findings</td><td>Unified tables/cards</td></tr><tr><td>4. Export report</td><td>Shared export folder</td></tr></table></div></section>`}
function openSettings(){renderSettings();document.getElementById('settingsPanel').classList.add('open')}
function closeSettings(){document.getElementById('settingsPanel').classList.remove('open')}
function renderSettings(){document.getElementById('settingsBody').innerHTML=`<div class="card"><div class="card-title">Appearance</div><div class="form-grid"><div><label>Theme</label><select id="setTheme"><option value="dark" ${settings.theme==='dark'?'selected':''}>Dark</option><option value="light" ${settings.theme==='light'?'selected':''}>Light</option><option value="auto" ${settings.theme==='auto'?'selected':''}>Auto</option></select></div><div><label>Default Startup</label><select id="setDefault">${MODULES.map(m=>`<option value="${m.id}" ${settings.defaultModule===m.id?'selected':''}>${m.label}</option>`).join('')}</select></div><div><label>PIN</label><input id="setPin" value="${settings.pin||'1234'}" maxlength="12"></div><div><label>Backup Retention Days</label><input id="setRetention" type="number" value="${settings.backupRetentionDays||60}"></div><div class="full"><label>Shared Data Root</label><input id="setRoot" value="${settings.dataRoot}"></div></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="primary" onclick="saveSettings()">Save Settings</button><button onclick="runHealthCheck()">Health Check</button></div></div><div class="card"><div class="card-title">Health Check</div><div id="healthBox"><div style="color:var(--muted)">Run health check to verify shared drive access.</div></div></div>`}
async function saveSettings(){settings.theme=document.getElementById('setTheme').value;settings.defaultModule=document.getElementById('setDefault').value;settings.pin=document.getElementById('setPin').value||'1234';settings.dataRoot=document.getElementById('setRoot').value||DEFAULT_SETTINGS.dataRoot;settings.backupRetentionDays=Number(document.getElementById('setRetention').value||60);applyTheme();await SuiteBridge.send('suite:saveSettings',settings);toast('Settings saved');renderNav();renderPages()}
async function runHealthCheck(){try{const res=await SuiteBridge.send('suite:healthCheck');const html=`<div style="font-size:12px;color:var(--muted);margin-bottom:8px">${res.dataRoot}</div>`+res.checks.map(c=>`<div class="health-row"><span>${c.name}</span><strong class="${c.ok?'ok':'bad'}">${c.ok?'OK':'FAIL'}</strong></div>${c.error?`<div style="color:var(--muted);font-size:12px">${c.error}</div>`:''}`).join('');const box=document.getElementById('healthBox');if(box)box.innerHTML=html;toast('Health check complete')}catch(e){toast('Health check failed: '+e.message)}}
async function init(){renderPin();try{const res=await SuiteBridge.send('suite:getSettings');settings={...DEFAULT_SETTINGS,...(res.settings||{})};env=res.environment||{};}catch(e){toast('Bridge unavailable, preview mode')};applyTheme();renderNav();document.getElementById('saveStatus').textContent='Ready';}
init();
</script>
</body>
</html>
