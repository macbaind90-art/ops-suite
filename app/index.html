function enhanceSortableTables(scope=document){
  const tables=Array.from(scope.querySelectorAll('table')).filter(t=>!t.dataset.noSort);
  for(const table of tables){
    const thead=table.tHead;
    const tbody=table.tBodies&&table.tBodies[0];
    if(!thead||!tbody)continue;
    const headerRow=thead.rows&&thead.rows[0];
    if(!headerRow)continue;
    const ths=Array.from(headerRow.cells);
    if(ths.length<2)continue;
    table.classList.add('sortable-table');
    ths.forEach((th,col)=>{
      if(th.dataset.sortReady==='1')return;
      if(Number(th.colSpan||1)>1){th.classList.add('sortable-disabled');return;}
      th.dataset.sortReady='1';
      th.classList.add('sortable-column');
      th.title=(th.title?th.title+' · ':'')+'Click to sort this table by '+cleanSortText(th.textContent||('Column '+(col+1)));
      th.addEventListener('click',()=>sortHtmlTable(table,col,th));
    });
  }
}

function sortHtmlTable(table,col,th){
  const tbody=table.tBodies&&table.tBodies[0];
  if(!tbody)return;
  const rows=Array.from(tbody.rows).filter(r=>r.cells.length>1 && !r.classList.contains('sort-placeholder'));
  if(rows.length<2)return;
  const nextDir=th.dataset.sortDir==='asc'?'desc':'asc';
  Array.from(table.tHead.rows[0].cells).forEach(h=>{h.classList.remove('sort-asc','sort-desc');delete h.dataset.sortDir;});

  th.classList.add(nextDir==='asc'?'sort-asc':'sort-desc');
  const decorated=rows.map((row,i)=>({row,i,value:sortCellValue(row.cells[col])}));
  decorated.sort((a,b)=>compareSortValues(a.value,b.value)||a.i-b.i);
  if(nextDir==='desc')decorated.reverse();
  const frag=document.createDocumentFragment();
  decorated.forEach(x=>frag.appendChild(x.row));
  tbody.appendChild(frag);
}

  let raw=cell?cleanSortText(cell.textContent):'';

  if(/^[-+]?\d+(\.\d+)?$/.test(money))return{type:'number',value:Number(money)};

async function runNativeBadgeAudit(){
  try{
    const punch=badgeAuditState.files.punch;
    if(!punch){toast('Badge audit needs the punch file first');return;}
    const punchText=await readAuditFile(punch);
    const punchRows=rowsFromCsv(punchText);
    if(!punchRows.length){toast('Punch file did not contain readable CSV/text rows');return;}
    const badgeFiles=['ts','gate','dispatch','recep'].filter(k=>badgeAuditState.files[k]);
    let badges=[];
    for(const k of badgeFiles){
      const txt=await readAuditFile(badgeAuditState.files[k]);
      for(const line of String(txt||'').split(/\r?\n/)){
        const date=maybeDate(line), time=maybeTime(line);
        if(!date||!time)continue;
        badges.push({date,time,line,source:k});
      }
    }
    const findings=[];
    const headers=punchRows[0].map(h=>String(h).toLowerCase());
    const nameIdx=headers.findIndex(h=>/name|employee/.test(h));
    const dateIdx=headers.findIndex(h=>/date/.test(h));
    const clockIdx=headers.findIndex(h=>/in|clock|punch|time/.test(h));
    for(const r of punchRows.slice(1)){
      const employee=normalizePersonName(r[nameIdx]||r[0]||'Unknown');
      const date=maybeDate(r[dateIdx]||r.join(' '));
      const clock=maybeTime(r[clockIdx]||r.join(' '));
      if(!date||!clock)continue;
      const sameDay=badges.filter(b=>b.date===date);
      if(!sameDay.length){findings.push({type:'No Badge Match',employee,date,clock,badge:'',source:'',notes:'No reader event found for this date in loaded logs'});continue;}
      const cm=minutesOf(clock);
      const prior=sameDay.filter(b=>minutesOf(b.time)!==null&&minutesOf(b.time)<=cm).sort((a,b)=>minutesOf(b.time)-minutesOf(a.time))[0];
      if(!prior){findings.push({type:'Clock-in Before Badge',employee,date,clock,badge:sameDay[0].time,source:sameDay[0].source,notes:'Clock time appears before first loaded badge event for that date'});}
    }
    badgeAuditState.findings=findings;
    badgeAuditState.ranAt=new Date().toISOString();
    safeRenderPages();toast('Badge audit complete: '+findings.length+' finding(s)');
  }catch(e){toast('Badge audit failed: '+e.message)}
}

async function alignAttendanceNamesToRoster(){
  if(!confirm('Align Attendance employee names and basic fields to the Roster source of truth? This will NOT merge, delete, or erase attendance history. A backup will be created first.'))return;
  try{await SuiteBridge.send('suite:createBackup',attendance,{module:'attendance'});}catch(e){console.warn('Pre-align backup failed',e)}
  let updated=0, linked=0, skipped=0;
  const activeRoster=rosterActiveEmployees();
  for(const re of activeRoster){
    const a=findAttendanceEmployeeForRosterLoose(re);
    if(!a){skipped++;continue;}
    const before=JSON.stringify({name:a.name,title:a.title,shift:a.shift,rdos:a.rdos,startDate:a.startDate,rosterId:a.rosterId});
    a.rosterId=String(re.id);
    a.name=rosterEmployeeAttendanceName(re);
    a.title=re.rank||a.title||'';
    a.shift=rosterShiftToAttendanceShift(re.shift)||a.shift||'';
    a.rdos=rosterRdoToAttendanceRdos(re.rdo);
    a.startDate=a.startDate||re.doh||re.dop||'';
    a.active=true;
    a.archived=false;
    a.status='Active';
    const after=JSON.stringify({name:a.name,title:a.title,shift:a.shift,rdos:a.rdos,startDate:a.startDate,rosterId:a.rosterId});
    if(before!==after)updated++;
    linked++;
  }
  attendance.audit=Array.isArray(attendance.audit)?attendance.audit:[];
  attendance.audit.unshift({at:new Date().toISOString(),user:currentUserName()||env.user||'',machine:env.machine||'',action:'Aligned Attendance names to Roster',detail:`Linked ${linked}, updated ${updated}, skipped ${skipped}. No history deleted or merged.`});
  const ok=await saveAttendanceNow('align-attendance-names');
  safeRenderPages();
  toast(ok?`Attendance names aligned: ${updated} updated, ${skipped} skipped.`:'Attendance alignment failed');
}

    let risk='Covered';if(open>0)risk='Open/Pending';if(scheduled===0&&required>0)risk='No scheduled coverage';if(missed>0||missing>0)risk=open>0?'Open/Pending + Attendance Issues':'Attendance Issues';
    const area=(row.section||'Unassigned')+' · '+(row.post||'Post');
    rows.push({area,section:row.section||'Unassigned',post:row.post||'',dayLabel:activeDays.join(', '),requiredHours:required,scheduledHours:scheduled,openHours:open,overHours:0,openPosts,requiredHeadcount:'Schedule',hoursPerPost:hrs,scheduledSlots:scheduled?scheduled/hrs:0,attendanceCoveredHours:covered,attendanceMissedHours:missed,attendanceMissingHours:missing,attendanceTardyHours:tardy,attendanceIssueCount:issues,risk,notes:'Schedule-authority: named cells count as scheduled; Open/Pending count as unfilled.'});
    totals.requiredHours+=required;totals.scheduledHours+=scheduled;totals.openHours+=open;totals.openPosts+=openPosts;totals.attendanceCoveredHours+=covered;totals.attendanceMissedHours+=missed;totals.attendanceMissingHours+=missing;totals.attendanceTardyHours+=tardy;totals.attendanceIssueCount+=issues;
  }
  const worst=rows.slice().sort((a,b)=>(b.openHours+b.attendanceMissedHours+b.attendanceMissingHours)-(a.openHours+a.attendanceMissedHours+a.attendanceMissingHours))[0];
  totals.highestRisk=worst?worst.area:'None';
  return{rows,total:totals,source:'schedule-authority'};
}

else if(type==='notices'){rows=[['Employee','Shift','Date','Type','Subject','Level','Status','Related Dates','Delivered Date','Delivered By','Employee Response','Manager Notes'],...noticeRecords().map(n=>[n.employeeName||attendanceEmployeeNameById(n.employeeId),n.employeeShift||'',n.date||'',n.noticeType||'',n.subject||'',n.level||'',n.status||'',(n.relatedDates||[]).join('; '),n.deliveredDate||'',n.deliveredBy||'',n.employeeResponse||'',n.managerNotes||''])];}
else if(type==='training'){const active=activeRosterForReports();const topics=(roster.trainingTopics||[]).filter(t=>t.required!==false);rows=[['Employee','Shift','Topic','Status','Completed','Due']];for(const e of active){for(const t of topics){const rec=latestTrainingRecord(e.id,t.id);const st=trainingStatus(rec,t);if(st!=='Complete')rows.push([fullName(e),e.shift||'',t.name||'',st,rec&&rec.completed||'',rec&&rec.due||'']);}}}
else if(type==='uniforms'){const items=(typeof getUniformItems==='function')?getUniformItems('all'):[];rows=[['Employee','Rank','Shift','Item','Size/ID','Status','Qty','Order Date','Issue Date','Replacement Due','Cost','Notes'],...items.map(i=>[i.employee,i.rank,i.shift,i.item,i.size,i.status,i.qty,i.orderDate||'',i.issueDate||'',i.replacementDue||'',i.cost||'',i.notes||''])];}
else if(type==='supplies'){const items=officeSupplyItems(true);rows=[['Item','Category','Current Qty','Minimum Qty','Order Qty','Status','Last Ordered','Last Received','Vendor','Storage Location','Cost','Notes','Archived'],...items.map(i=>[i.item||'',i.category||'',i.qty||0,i.minQty||0,i.orderQty||0,officeSupplyStatus(i),i.lastOrdered||'',i.lastReceived||'',i.vendor||'',i.location||'',i.cost||'',i.notes||'',i.archived?'Yes':'No'])];}
else if(type==='tasks'){rows=[['Project','Status','Priority','Category','Owner','Due','Current Update'],...(tasks.tasks||[]).map(t=>[t.project||'',t.status||'',t.priority||'',t.category||'',t.owner||'',t.dueDate||'',t.update||''])];}
downloadCSV('PWADC_'+type+'_Report_'+date+'.csv',rows);toast('Exported '+type+' report CSV')}
function reportCard(id,title,desc,csv=true){return `<div class="report-card"><h3>${esc(title)}</h3><p>${esc(desc)}</p><div class="report-actions"><button class="primary" onclick="viewReport('${id}')">View Report</button><button onclick="printReport('${id}')">Print Report</button>${csv?`<button onclick="exportReportCSV('${id}')">Export CSV</button>`:''}</div></div>`}
function renderReports(){if(!canAccessReports())return `<div class="page-head"><div><div class="page-title">Reports</div><div class="page-sub">Reports are available to Admin and Supervisor roles.</div></div></div><div class="notice warn">Your current role does not have access to Reports.</div>`;const m=reportMetrics();return `<div class="page-head"><div><div class="page-title">Professional Report Center</div><div class="page-sub">Management-ready print and CSV reports. Pay detail is controlled by user role.</div></div><div class="btn-group"><button class="primary" onclick="viewReport('weekly')">View Weekly Staffing</button><button onclick="printReport('weekly')">Print Weekly Staffing</button><button onclick="exportReportCSV('weekly')">Export Staffing CSV</button></div></div><div class="grid cols-4"><div class="kpi"><div class="num">${m.active.length}</div><div class="lbl">Active Headcount</div></div><div class="kpi"><div class="num schedule-risk">${m.cov.total.openHours}</div><div class="lbl">Open/Pending HPW</div></div><div class="kpi"><div class="num">${m.training.issueCount}</div><div class="lbl">Training Issues</div></div><div class="kpi"><div class="num">${m.openTasks}</div><div class="lbl">Open Tasks</div></div></div><div class="card"><div class="card-title">Report Access</div><div class="report-note">Admin sees full pay and employee-level cost detail. Supervisor sees operational reports and summary loaded-cost totals only. Lead and Viewer roles do not see this page.</div></div><div class="report-card-grid">${reportCard('weekly','Weekly Staffing Report','Headcount, FT/PT/Temp split, schedule-required HPW, named scheduled HPW, Open/Pending HPW, attendance comparison, and operating risk.')}${reportCard('labor','Labor Cost Summary','Loaded labor run rate, section-level cost, and Admin-only employee cost detail.')}${reportCard('coverage','Coverage Gap Report','Open/Pending schedule cells and attendance exceptions using the schedule as the authority.')}${reportCard('attendance','Attendance Summary Report','30-day and 90-day attendance code counts with top issue-code employees.')}${reportCard('notices','Attendance Notice Workflow Report','Notice status, delivery, acknowledgement, refused-to-sign, and escalation tracking.')}${reportCard('training','Training Readiness Report','Required training exceptions, overdue items, and no-record exposure.')}${reportCard('uniforms','Uniform Status Report','Uniform issue, order, replacement due, and lost/damaged uniform exceptions.')}${reportCard('supplies','Office Supplies Report','Low stock, out-of-stock, ordered items, vendor, storage location, and reorder visibility.')}${reportCard('tasks','Task Status Report','Active project list, priority, owner, due dates, and current updates.')}</div>`}


function defaultSupplyCategories(){return ['Writing','Paper','Printer / Toner','Forms','Binders / Folders','Batteries','Labels / Tape','Breakroom','PPE / Safety','Other']}
function officeSupplyStatus(item){if(item.archived)return 'Archived';const manual=String(item.status||'Auto');if(manual==='Ordered'||manual==='Discontinued')return manual;const q=Number(item.qty||0),min=Number(item.minQty||0);if(q<=0)return 'Out';if(q<=min)return 'Low';return 'In Stock'}
function supplyStatusClass(st){return 'supply-'+String(st||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function supplyStatusBadge(st){return `<span class="supply-status ${supplyStatusClass(st)}">${esc(st)}</span>`}
function supplyRowId(id,field){return 'supply_'+String(id||'new').replace(/[^a-zA-Z0-9_-]/g,'')+'_'+field}
function supplyVal(id,field){let el=document.getElementById(supplyRowId(id,field));return el?el.value:''}
function officeSupplyItems(includeArchived=false){let list=Array.isArray(roster.officeSupplies)?roster.officeSupplies:[];if(!includeArchived)list=list.filter(i=>!i.archived);return list;}
function officeSupplyMetrics(){const all=officeSupplyItems(true);const active=all.filter(i=>!i.archived);const low=active.filter(i=>officeSupplyStatus(i)==='Low').length;const out=active.filter(i=>officeSupplyStatus(i)==='Out').length;const ordered=active.filter(i=>officeSupplyStatus(i)==='Ordered').length;const value=active.reduce((n,i)=>n+(Number(i.cost||0)*Number(i.orderQty||1)),0);return{all,active,low,out,ordered,archived:all.length-active.length,value}}
function supplyCategoryOptions(selected){const cats=Array.from(new Set(defaultSupplyCategories().concat((roster.officeSupplies||[]).map(i=>i.category||'').filter(Boolean))));return cats.map(c=>`<option value="${esc(c)}" ${String(selected)===String(c)?'selected':''}>${esc(c)}</option>`).join('')}
function supplyStatusOptions(selected){return ['Auto','In Stock','Low','Out','Ordered','Discontinued'].map(st=>`<option value="${esc(st)}" ${String(selected||'Auto')===st?'selected':''}>${esc(st)}</option>`).join('')}
function supplyFilterOptions(vals,selected,allLabel){return ['all'].concat(vals).map(v=>`<option value="${esc(v)}" ${String(selected)===String(v)?'selected':''}>${v==='all'?esc(allLabel):esc(v)}</option>`).join('')}
function filteredOfficeSupplies(){let rows=officeSupplyItems(showArchivedSupplies);if(supplySearch){const q=supplySearch.toLowerCase();rows=rows.filter(i=>(String(i.item||'')+' '+String(i.category||'')+' '+String(i.vendor||'')+' '+String(i.location||'')+' '+String(i.notes||'')).toLowerCase().includes(q));}if(supplyCategoryFilter!=='all')rows=rows.filter(i=>String(i.category||'')===String(supplyCategoryFilter));if(supplyStatusFilter!=='all')rows=rows.filter(i=>officeSupplyStatus(i)===supplyStatusFilter);return rows.slice().sort((a,b)=>String(a.archived||false).localeCompare(String(b.archived||false))||String(officeSupplyStatus(a)).localeCompare(String(officeSupplyStatus(b)))||String(a.category||'').localeCompare(String(b.category||''))||String(a.item||'').localeCompare(String(b.item||'')))}
function renderSupplyRow(i){const id=i.id;const st=officeSupplyStatus(i);const archived=!!i.archived;return `<tr class="${archived?'archived-row':''}"><td><input id="${supplyRowId(id,'item')}" value="${esc(i.item||'')}" placeholder="Item name" ${archived?'disabled':''}></td><td><select id="${supplyRowId(id,'category')}" ${archived?'disabled':''}>${supplyCategoryOptions(i.category||'Other')}</select></td><td><input id="${supplyRowId(id,'qty')}" type="number" min="0" step="1" value="${esc(i.qty||0)}" ${archived?'disabled':''}></td><td><input id="${supplyRowId(id,'minQty')}" type="number" min="0" step="1" value="${esc(i.minQty||0)}" ${archived?'disabled':''}></td><td><input id="${supplyRowId(id,'orderQty')}" type="number" min="0" step="1" value="${esc(i.orderQty||0)}" ${archived?'disabled':''}></td><td>${supplyStatusBadge(st)}<br><select id="${supplyRowId(id,'status')}" ${archived?'disabled':''}>${supplyStatusOptions(i.status||'Auto')}</select></td><td><input id="${supplyRowId(id,'lastOrdered')}" type="date" value="${esc(i.lastOrdered||'')}" ${archived?'disabled':''}></td><td><input id="${supplyRowId(id,'lastReceived')}" type="date" value="${esc(i.lastReceived||'')}" ${archived?'disabled':''}></td><td><input id="${supplyRowId(id,'vendor')}" value="${esc(i.vendor||'')}" placeholder="Vendor" ${archived?'disabled':''}></td><td><input id="${supplyRowId(id,'location')}" value="${esc(i.location||'')}" placeholder="Storage" ${archived?'disabled':''}></td><td class="admin-pay"><input id="${supplyRowId(id,'cost')}" type="number" min="0" step="0.01" value="${esc(i.cost||'')}" ${archived?'disabled':''}></td><td><input id="${supplyRowId(id,'notes')}" value="${esc(i.notes||'')}" placeholder="Notes" ${archived?'disabled':''}></td><td><div class="supply-actions">${archived?`<button class="sm primary admin-only" onclick="restoreOfficeSupply('${esc(id)}')">Restore</button>`:`<button class="sm primary admin-only" onclick="saveOfficeSupplyRow('${esc(id)}')">Save</button><button class="sm danger admin-only" onclick="removeOfficeSupply('${esc(id)}')">Remove</button>`}</div></td></tr>`}
function openOfficeSupplyModal(){if(!canAdmin()){toast('Office supply edits are Admin-only');return;}showModal(`<div class="modal-head"><div class="modal-title">Add Office Supply Item</div><button onclick="closeModal()">Close</button></div><div class="form-grid"><div class="full"><label>Item Name</label><input id="supplyNewItem" placeholder="Printer paper, toner, clipboards"></div><div><label>Category</label><select id="supplyNewCategory">${supplyCategoryOptions('Other')}</select></div><div><label>Current Quantity</label><input id="supplyNewQty" type="number" min="0" value="0"></div><div><label>Minimum Quantity</label><input id="supplyNewMin" type="number" min="0" value="0"></div><div><label>Order Quantity</label><input id="supplyNewOrder" type="number" min="0" value="0"></div><div><label>Status</label><select id="supplyNewStatus">${supplyStatusOptions('Auto')}</select></div><div><label>Vendor</label><input id="supplyNewVendor"></div><div><label>Storage Location</label><input id="supplyNewLocation"></div><div class="admin-pay"><label>Cost</label><input id="supplyNewCost" type="number" min="0" step="0.01"></div><div class="full"><label>Notes</label><input id="supplyNewNotes"></div></div><div class="modal-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="addOfficeSupply()">Add Item</button></div>`)}
async function addOfficeSupply(){const name=val('supplyNewItem').trim();if(!name){toast('Item name is required');return;}roster.officeSupplies=Array.isArray(roster.officeSupplies)?roster.officeSupplies:[];const item={id:roster.nextOfficeSupplyId++,item:name,category:val('supplyNewCategory')||'Other',qty:Number(val('supplyNewQty')||0),minQty:Number(val('supplyNewMin')||0),orderQty:Number(val('supplyNewOrder')||0),status:val('supplyNewStatus')||'Auto',vendor:val('supplyNewVendor'),location:val('supplyNewLocation'),cost:Number(val('supplyNewCost')||0),notes:val('supplyNewNotes'),createdAt:new Date().toISOString(),createdBy:currentUserName()||env.user||''};roster.officeSupplies.push(item);roster.audit.unshift({at:new Date().toISOString(),user:currentUserName()||env.user||'',action:'Office supply item added',detail:name});await saveRosterNow('office-supply-add');closeModal();safeRenderPages();toast('Office supply item added')}
async function saveOfficeSupplyRow(id){if(!canAdmin()){toast('Office supply edits are Admin-only');return;}let i=(roster.officeSupplies||[]).find(x=>String(x.id)===String(id));if(!i){toast('Supply item not found');return;}const name=supplyVal(id,'item').trim();if(!name){toast('Item name is required');return;}i.item=name;i.category=supplyVal(id,'category')||'Other';i.qty=Number(supplyVal(id,'qty')||0);i.minQty=Number(supplyVal(id,'minQty')||0);i.orderQty=Number(supplyVal(id,'orderQty')||0);i.status=supplyVal(id,'status')||'Auto';i.lastOrdered=supplyVal(id,'lastOrdered');i.lastReceived=supplyVal(id,'lastReceived');i.vendor=supplyVal(id,'vendor');i.location=supplyVal(id,'location');i.cost=Number(supplyVal(id,'cost')||0);i.notes=supplyVal(id,'notes');i.updatedAt=new Date().toISOString();i.updatedBy=currentUserName()||env.user||'';roster.audit.unshift({at:new Date().toISOString(),user:currentUserName()||env.user||'',action:'Office supply item updated',detail:name});await saveRosterNow('office-supply-save');safeRenderPages({preserveScroll:true});toast('Supply item saved')}
async function removeOfficeSupply(id){if(!canAdmin()){toast('Office supply removal is Admin-only');return;}let i=(roster.officeSupplies||[]).find(x=>String(x.id)===String(id));if(!i)return;const reason=prompt('Reason for removing/archive this supply item:');if(reason===null)return;if(!String(reason).trim()){toast('Removal reason is required');return;}i.archived=true;i.archivedAt=new Date().toISOString();i.archivedBy=currentUserName()||env.user||'';i.archiveReason=String(reason).trim();roster.audit.unshift({at:new Date().toISOString(),user:currentUserName()||env.user||'',action:'Office supply item archived',detail:(i.item||'')+' · '+reason});await saveRosterNow('office-supply-remove');safeRenderPages({preserveScroll:true});toast('Supply item archived')}
async function restoreOfficeSupply(id){if(!canAdmin()){toast('Restore is Admin-only');return;}let i=(roster.officeSupplies||[]).find(x=>String(x.id)===String(id));if(!i)return;i.archived=false;i.restoredAt=new Date().toISOString();i.restoredBy=currentUserName()||env.user||'';roster.audit.unshift({at:new Date().toISOString(),user:currentUserName()||env.user||'',action:'Office supply item restored',detail:i.item||''});await saveRosterNow('office-supply-restore');safeRenderPages({preserveScroll:true});toast('Supply item restored')}
function printOfficeSupplies(){const rows=filteredOfficeSupplies();let html=`<div class="print-overlay" id="printOverlay"><div class="print-toolbar"><div><h2>PWADC Security Office Supplies</h2><div>${new Date().toLocaleString()} · low stock, ordered, vendor, and storage location tracker</div></div><div><button onclick="window.print()">Print</button> <button onclick="document.getElementById('printOverlay').remove()">Close</button></div></div><table class="print-table"><thead><tr><th>Item</th><th>Category</th><th>Qty</th><th>Min</th><th>Order Qty</th><th>Status</th><th>Last Ordered</th><th>Last Received</th><th>Vendor</th><th>Location</th><th>Notes</th></tr></thead><tbody>${rows.map(i=>`<tr><td>${esc(i.item)}</td><td>${esc(i.category)}</td><td>${Number(i.qty||0)}</td><td>${Number(i.minQty||0)}</td><td>${Number(i.orderQty||0)}</td><td>${esc(officeSupplyStatus(i))}</td><td>${esc(fmtDate(i.lastOrdered||''))}</td><td>${esc(fmtDate(i.lastReceived||''))}</td><td>${esc(i.vendor||'')}</td><td>${esc(i.location||'')}</td><td>${esc(i.notes||'')}</td></tr>`).join('')||'<tr><td colspan="11">No matching supplies.</td></tr>'}</tbody></table></div>`;document.body.insertAdjacentHTML('beforeend',html);setTimeout(()=>window.print(),150)}
function exportOfficeSuppliesCSV(){const rows=[['Item','Category','Current Qty','Minimum Qty','Order Qty','Status','Last Ordered','Last Received','Vendor','Storage Location','Cost','Notes','Archived','Archive Reason'],...officeSupplyItems(true).map(i=>[i.item||'',i.category||'',i.qty||0,i.minQty||0,i.orderQty||0,officeSupplyStatus(i),i.lastOrdered||'',i.lastReceived||'',i.vendor||'',i.location||'',i.cost||'',i.notes||'',i.archived?'Yes':'No',i.archiveReason||''])];downloadCSV('PWADC_Office_Supplies_'+new Date().toISOString().slice(0,10)+'.csv',rows)}
function renderOfficeSupplies(){const m=officeSupplyMetrics();const cats=Array.from(new Set(defaultSupplyCategories().concat((roster.officeSupplies||[]).map(i=>i.category||'').filter(Boolean))));const sts=['In Stock','Low','Out','Ordered','Discontinued','Archived'];const rows=filteredOfficeSupplies();return `<div class="page-head"><div><div class="page-title">Office Supplies</div><div class="page-sub">Dedicated tracker for office/security supplies. Radios, keys, and uniforms stay in their own trackers.</div></div><div class="btn-group"><button class="primary admin-only" onclick="openOfficeSupplyModal()">+ Add Item</button><button onclick="printOfficeSupplies()">Print Supplies</button><button onclick="exportOfficeSuppliesCSV()">Export CSV</button></div></div><div class="grid cols-5"><div class="kpi"><div class="num">${m.active.length}</div><div class="lbl">Active Items</div></div><div class="kpi"><div class="num schedule-risk">${m.low}</div><div class="lbl">Low Stock</div></div><div class="kpi"><div class="num schedule-risk">${m.out}</div><div class="lbl">Out</div></div><div class="kpi"><div class="num">${m.ordered}</div><div class="lbl">Ordered</div></div><div class="kpi admin-pay"><div class="num" style="font-size:22px">${money(m.value)||'$0.00'}</div><div class="lbl">Est. Reorder Value</div></div></div><div class="card"><div class="supplies-toolbar"><div class="supplies-filters"><div><label>Search</label><input value="${esc(supplySearch)}" placeholder="Item, vendor, location..." oninput="supplySearch=this.value;safeRenderPages()"></div><div><label>Category</label><select onchange="supplyCategoryFilter=this.value;safeRenderPages()">${supplyFilterOptions(cats,supplyCategoryFilter,'All Categories')}</select></div><div><label>Status</label><select onchange="supplyStatusFilter=this.value;safeRenderPages()">${supplyFilterOptions(sts,supplyStatusFilter,'All Statuses')}</select></div><div><label>Archived</label><select onchange="showArchivedSupplies=this.value==='yes';safeRenderPages()"><option value="no" ${!showArchivedSupplies?'selected':''}>Hide Archived</option><option value="yes" ${showArchivedSupplies?'selected':''}>Show Archived</option></select></div></div><div class="notice" style="max-width:420px">Add, edit, remove/archive, restore, print, and export office supplies. Cost fields are Admin-only.</div></div><div class="table-wrap"><table class="wide-table supply-table"><thead><tr><th>Item</th><th>Category</th><th>Qty</th><th>Min</th><th>Order Qty</th><th>Status</th><th>Ordered</th><th>Received</th><th>Vendor</th><th>Storage</th><th class="admin-pay">Cost</th><th>Notes</th><th>Actions</th></tr></thead><tbody>${rows.map(renderSupplyRow).join('')||'<tr><td colspan="13">No office supplies match the current filters.</td></tr>'}</tbody></table></div></div>`}
function reportOfficeSupplies(autoPrint=false){const items=officeSupplyItems(false);const low=items.filter(i=>officeSupplyStatus(i)==='Low');const out=items.filter(i=>officeSupplyStatus(i)==='Out');const ordered=items.filter(i=>officeSupplyStatus(i)==='Ordered');const value=items.filter(i=>['Low','Out'].includes(officeSupplyStatus(i))).reduce((n,i)=>n+(Number(i.cost||0)*Number(i.orderQty||1)),0);const exceptions=items.filter(i=>['Low','Out','Ordered'].includes(officeSupplyStatus(i)));let body=`<div class="report-section"><div class="report-summary"><strong>Executive Summary:</strong> ${low.length} item(s) are low, ${out.length} item(s) are out, and ${ordered.length} item(s) are marked ordered. ${canViewIndividualPay()?'Estimated reorder value for low/out items is '+reportMoney(value)+'.':'Cost detail is restricted to Admin.'}</div></div><div class="report-section">${reportKpis([{label:'Active Items',value:items.length},{label:'Low Stock',value:low.length},{label:'Out',value:out.length},{label:'Ordered',value:ordered.length}].concat(canViewIndividualPay()?[{label:'Est. Reorder Value',value:reportMoney(value)}]:[]))}</div><div class="report-section"><h2>Supply Exceptions</h2>${reportTable(canViewIndividualPay()?['Item','Category','Qty','Min','Order Qty','Status','Vendor','Location','Cost','Notes']:['Item','Category','Qty','Min','Order Qty','Status','Vendor','Location','Notes'],exceptions.map(i=>{const row=[esc(i.item),esc(i.category),Number(i.qty||0),Number(i.minQty||0),Number(i.orderQty||0),supplyStatusBadge(officeSupplyStatus(i)),esc(i.vendor||''),esc(i.location||''),canViewIndividualPay()?reportMoney(Number(i.cost||0)*Number(i.orderQty||1)):'',esc(i.notes||'')];return canViewIndividualPay()?row:row.filter((_,idx)=>idx!==8)}))}</div>`;showReport('Office Supplies Report','Low stock, out-of-stock, ordered items, vendor, and storage location accountability',body,'landscape',autoPrint)}

function renderRosterList(){const list=filteredRoster();const activeEmps=rosterActiveEmployees();const archiveCount=rosterArchivedEmployees().length;const total=activeEmps.length;const classCounts=employmentClassCounts(activeEmps);const openUni=activeEmps.reduce((n,e)=>n+['shirt','pants','jacket'].filter(k=>(e[k+'Status']||'')&&e[k+'Status']!=='issued').length,0);return `<div class="grid cols-4 roster-summary"><div class="kpi"><div class="num">${total}</div><div class="lbl">Employees</div></div><div class="kpi"><div class="num">${classCounts.FT||0}</div><div class="lbl">FT Pig</div></div><div class="kpi"><div class="num">${classCounts.PT||0}</div><div class="lbl">PT Pig</div></div><div class="kpi"><div class="num">${classCounts.TempToHire||0}</div><div class="lbl">TempToHire</div></div></div><div class="card roster-workbar-card"><div class="card-title">Roster Controls</div><div class="roster-filters roster-workbar"><div><label>Search</label><input value="${esc(rosterSearch)}" placeholder="Name, EID, rank, shift..." oninput="rosterSearch=this.value;safeRenderPages()"></div><div><label>Shift</label><select onchange="rosterShiftFilter=this.value;safeRenderPages()"><option value="all">All Shifts</option>${rosterShifts().map(x=>`<option value="${esc(x)}" ${rosterShiftFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div><label>Rank</label><select onchange="rosterRankFilter=this.value;safeRenderPages()"><option value="all">All Ranks</option>${rosterRanks().map(x=>`<option value="${esc(x)}" ${rosterRankFilter===x?'selected':''}>${esc(rankLong(x))}</option>`).join('')}</select></div><div><label>Type</label><select onchange="rosterTypeFilter=this.value;safeRenderPages()"><option value="all">All Types</option>${rosterTypes().map(x=>`<option value="${esc(x)}" ${rosterTypeFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="top-actions"><button class="primary admin-only" onclick="openEmployeeModal()">+ Add Employee</button><button class="admin-only" onclick="openManageRanksModal()">Manage Ranks</button><button onclick="openRosterPrintModal()">Print Roster</button><button onclick="exportRosterCSV()">Export CSV</button></div></div><div class="mini-note">Showing ${list.length} of ${total} active employees. ${archiveCount} archived / old employee(s) hidden by default. ${openUni} uniform need/order item(s) are still open. Employment class drives loaded-cost analytics: ${esc(laborRateSummary())}.</div></div><div class="table-wrap"><table class="wide-table roster-table"><thead><tr>${sortHeader('Name','name')}${sortHeader('EID','eid')}${sortHeader('Rank','rank')}${sortHeader('Shift','shift')}${sortHeader('Gate Shift','gateShift')}${sortHeader('Rate','rate')}${sortHeader('Type','type')}${sortHeader('PT/FT/Temp','employmentClass')}${sortHeader('HPW','scheduledHours')}${sortHeader('Base Wk','baseWeekCost')}${sortHeader('Loaded Wk','loadedWeekCost')}${sortHeader('RDO','rdo')}${sortHeader('Uniform','uniform')}${sortHeader('DOH','doh')}${sortHeader('DOP','dop')}${sortHeader('Notes','notes')}<th>Actions</th></tr></thead><tbody>${list.map(e=>`<tr><td><strong>${esc(fullName(e))}</strong></td><td>${esc(e.eid||'')}</td><td>${rankBadge(e.rank)}</td><td>${esc(e.shift||'')}</td><td>${esc(e.gateShift||'')}</td><td class="admin-pay">${money(e.rate)}</td><td>${esc(e.type||'')}</td><td>${esc(employmentClass(e))}</td><td class="admin-pay">${employeeCostProfile(e).hours}</td><td class="admin-pay">${money(employeeCostProfile(e).baseWeek)}</td><td class="admin-pay">${money(employeeCostProfile(e).loadedWeek)}</td><td>${esc((e.rdo||[]).join('/'))}</td><td>${uniformSummary(e)}</td><td>${esc(fmtDate(e.doh))}</td><td>${esc(fmtDate(e.dop))}</td><td class="notes-cell">${esc(e.notes||'')}</td><td><div class="td-actions"><button class="sm admin-only" onclick="openEmployeeModal('${esc(e.id)}')">Edit</button><button class="sm" onclick="openEmployeeProfile('${esc(e.id)}')">Profile</button><button class="sm" onclick="openUniformsForEmployee('${esc(e.id)}')">Uniforms</button><button class="sm gold admin-only" onclick="openPromoteModal('${esc(e.id)}')">Promote</button><button class="sm admin-only" onclick="openMeritModal('${esc(e.id)}')">Merit</button><button class="sm danger admin-only" onclick="removeRosterEmployee('${esc(e.id)}')">Remove</button></div></td></tr>`).join('')||'<tr><td colspan="17">No roster records match the current filters.</td></tr>'}</tbody></table></div>${renderArchivedRosterSection()}`}
function rosterTypes(){return [...new Set(roster.employees.map(e=>e.type||'').filter(Boolean))].sort()}
const DEFAULT_RANKS=['PSO','SO','SSO','LSO','SUPV','Receptionist','ONIN','APS'];
function rosterCustomRanks(){
  roster.customRanks=Array.isArray(roster.customRanks)?roster.customRanks:[];
  return roster.customRanks.map(r=>String(r||'').trim()).filter(Boolean);
}
function allRosterRanks(){
  const set=new Set([...DEFAULT_RANKS,...rosterCustomRanks(),...roster.employees.map(e=>e.rank||'').filter(Boolean)]);
  return [...set].filter(Boolean).sort((a,b)=>rankLong(a).localeCompare(rankLong(b))||String(a).localeCompare(String(b)));
}
function rosterShifts(){return [...new Set(rosterActiveEmployees().map(e=>e.shift||'').filter(Boolean))].sort((a,b)=>rosterShift(a).localeCompare(rosterShift(b))||String(a).localeCompare(String(b)))}
function rosterRanks(){return allRosterRanks()}
function rankLong(rank){return ({PSO:'Security Trainee',SO:'Security Officer',SSO:'Senior Security Officer',LSO:'Lead Security Officer',SUPV:'Supervisor',ONIN:'ONIN',APS:'APS',Receptionist:'Receptionist'}[rank]||rank||'')}
function openManageRanksModal(){if(!canAdmin()){toast('Manage ranks is Admin-only');return;}
  roster.customRanks=Array.isArray(roster.customRanks)?roster.customRanks:[];
  const existing=rosterCustomRanks();
  showModal(`<div class="modal-head"><div class="modal-title">Manage Ranks</div><button onclick="closeModal()">Close</button></div><div class="notice">Default ranks stay available. Add custom ranks here when you need a new title/rank option.</div><div class="form-grid"><div class="full"><label>Add Rank</label><input id="newRankName" placeholder="Example: Coordinator, Manager, Lead Guard"></div></div><div class="modal-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="confirmAddRank()">Add Rank</button></div><div class="card"><div class="card-title">Custom Ranks</div>${existing.length?existing.map(r=>`<div class="list-row"><strong>${esc(r)}</strong><button class="sm danger" onclick="removeCustomRank('${esc(r)}')">Remove</button></div>`).join(''):'<p class="mini-note">No custom ranks yet.</p>'}</div>`);
}
async function confirmAddRank(){
  const r=String(val('newRankName')||'').trim();
  if(!r){toast('Enter a rank first');return;}
  roster.customRanks=Array.isArray(roster.customRanks)?roster.customRanks:[];
  const exists=allRosterRanks().some(x=>x.toLowerCase()===r.toLowerCase());
  if(exists){toast('That rank already exists');return;}
  roster.customRanks.push(r);
  roster.audit=Array.isArray(roster.audit)?roster.audit:[];
  roster.audit.push({at:new Date().toISOString(),user:currentUserName()||env.user||'',action:'Rank added',detail:r});
  await saveRosterNow('rank-add');
  openManageRanksModal();
  safeRenderPages();
}
async function removeCustomRank(rank){
  const inUse=roster.employees.some(e=>String(e.rank||'').toLowerCase()===String(rank||'').toLowerCase());
  if(inUse){toast('Cannot remove rank while assigned to employees');return;}
  if(!confirm('Remove custom rank: '+rank+'?'))return;
  roster.customRanks=rosterCustomRanks().filter(r=>String(r).toLowerCase()!==String(rank).toLowerCase());
  roster.audit=Array.isArray(roster.audit)?roster.audit:[];
  roster.audit.push({at:new Date().toISOString(),user:currentUserName()||env.user||'',action:'Rank removed',detail:rank});
  await saveRosterNow('rank-remove');
  openManageRanksModal();
  safeRenderPages();
}
function rankBadge(rank){let cls=String(rank||'').toLowerCase().replace(/[^a-z0-9]/g,'');return `<span class="rank-badge ${cls}">${esc(rank||'')}</span>`}
function money(v){let n=Number(v);return Number.isFinite(n)&&n>0?'$'+n.toFixed(2):''}

async function deleteArchivedEmployee(id){if(!canAdmin()){toast('Archive deletion is Admin-only');return;}
  let idx=(roster.employees||[]).findIndex(x=>String(x.id)===String(id));
  if(idx<0)return;
  let e=roster.employees[idx];
  if(!isArchivedEmployee(e)){toast('Only archived employees can be deleted from this section.');return;}
  if(!confirm('Permanently delete '+fullName(e)+' from the Roster archive? Attendance history will not be deleted.'))return;
  roster.employees.splice(idx,1);
  roster.audit=roster.audit||[];
  roster.audit.push({at:new Date().toISOString(),user:currentUserName()||env.user||'',action:'Archived employee deleted from roster archive',detail:fullName(e)});
  let attChanged=false;
  for(let i=(attendance.employees||[]).length-1;i>=0;i--){
    const ae=attendance.employees[i];
    if(ae&&String(ae.rosterId||'')===String(id)){
      const hist=attendance.attendance&&attendance.attendance[ae.id]?Object.keys(attendance.attendance[ae.id]).length:0;
      if(hist===0){
        attendance.employees.splice(i,1);
        if(attendance.attendance)delete attendance.attendance[ae.id];
        attChanged=true;
      }else{
        ae.active=false;ae.archived=true;ae.status='Deleted from Roster Archive';ae.archivedAt=ae.archivedAt||new Date().toISOString();
        attChanged=true;
      }
    }
  }
  const ok=await saveRosterNow('archive-delete');
  if(attChanged)await saveAttendance('archive-delete-sync');
  if(ok){safeRenderPages();toast('Archived employee deleted from roster archive. Attendance history preserved.')}
}

async function archiveAttendanceForRosterEmployee(re){
  normalizeRoster();normalizeAttendance();
  if(!re)return {archived:false,matched:false};
  let ae=findAttendanceEmployeeForRoster(re)||findAttendanceEmployeeForRosterLoose(re);
  if(!ae)return {archived:false,matched:false};
  const already=isArchivedAttendanceEmployee(ae);
  ae.rosterId=String(re.id);
  ae.active=false;
  ae.archived=true;
  ae.status='Archived';
  ae.archivedAt=ae.archivedAt||new Date().toISOString();
  ae.removedFromRosterAt=ae.removedFromRosterAt||new Date().toISOString();
  ae.removedFromRosterBy=currentUserName()||env.user||'';
  attendance.audit=Array.isArray(attendance.audit)?attendance.audit:[];
  attendance.audit.unshift({at:new Date().toISOString(),user:currentUserName()||env.user||'',machine:env.machine||'',action:'Roster removal synced',detail:`${attendanceDisplayName(ae)} hidden from active Attendance after ${fullName(re)} was removed from Roster. Attendance history was preserved.`});
  return {archived:!already,matched:true,employee:ae};
}
async function removeRosterEmployee(id){if(!canAdmin()){toast('Roster removal is Admin-only');return;}
  let e=roster.employees.find(x=>String(x.id)===String(id));
  if(!e)return;
  if(!confirm('Archive '+fullName(e)+' as an old employee? They will also be removed from active Attendance. Attendance history will stay preserved.'))return;
  try{await SuiteBridge.send('suite:createBackup',attendance,{module:'attendance'});}catch(err){console.warn('Pre-removal attendance backup failed',err)}

  roster.audit.push({at:new Date().toISOString(),user:currentUserName()||env.user||'',action:'Employee archived',detail:fullName(e)+(attendanceResult.matched?' · hidden from active Attendance':' · no active Attendance match found')});
  const rosterOk=await saveRosterNow('employee-archive');
  let attendanceOk=true;
  if(attendanceResult.matched)attendanceOk=await saveAttendanceNow('employee-archive-sync');
  if(rosterOk){safeRenderPages();toast(attendanceResult.matched?'Employee moved to Archive and removed from active Attendance':'Employee moved to Archive. No active Attendance record was found.');}

}

function normalizeScheduleNameKey(cell){
 const known=new Set(['PSO','SO','SSO','LSO','SUPV','ONIN','APS','RECEP','RECEPTIONIST']);
 const parts=String(cell||'').trim().split(/\s+/); if(parts.length>1&&known.has(parts[0].toUpperCase())) return parts.slice(1).join(' ').toLowerCase();
 return String(cell||'').trim().toLowerCase();
}
const SCHEDULE_COLOR_PALETTE=['#f65555','#1c38ec','#54ec1c','#1caeec','#bc1cec','#f6c555','#55f6e0','#ff8fd1','#a0e060','#e08a2f','#4a90d9','#c6b273','#ff6f91','#845ec2','#00c9a7','#ffc75f','#008f7a','#b39cd0','#4d8076','#d65db1'];
let scheduleColorCache=null;
function scheduleColorKey(cell){const x=String(cell||'').trim();if(!x||['none','open','pending','closed'].includes(x.toLowerCase()))return '';return normalizeScheduleNameKey(x)}
function buildScheduleColorCache(){
  const cache={};
  for(const row of (roster.schedule||[])){
    const sec=row.section||'Unsectioned';
    const secCache=cache[sec]||(cache[sec]={});
    const fixed=EMP_SECTION_COLORS[sec]||{};
    const used=new Set(Object.values(secCache).concat(Object.values(fixed)));
    for(const cell of (row.days||[])){
      const key=scheduleColorKey(cell); if(!key||secCache[key])continue;
      if(fixed[key]){secCache[key]=fixed[key]; used.add(fixed[key]); continue;}
      let color=SCHEDULE_COLOR_PALETTE.find(c=>!used.has(c));
      if(!color){
        let h=0; const seed=sec+'|'+key; for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;
        color=SCHEDULE_COLOR_PALETTE[h%SCHEDULE_COLOR_PALETTE.length];
      }
      secCache[key]=color; used.add(color);
    }
  }
  scheduleColorCache=cache;
}
function empColorFromCell(cell,section){
  const key=scheduleColorKey(cell); if(!key)return null;
  if(!scheduleColorCache)buildScheduleColorCache();
  const sec=section||'Unsectioned';
  return (scheduleColorCache[sec]&&scheduleColorCache[sec][key])||null;
}
function scheduleCellParts(cell){
 const x=String(cell||'None').trim()||'None';
 if(['None','Open','Pending'].includes(x)) return {special:x,display:x==='None'?'Closed':x,rank:''};
 const known=new Set(['PSO','SO','SSO','LSO','SUPV','ONIN','APS','Receptionist','RECEP']);
 const m=x.match(/^([A-Za-z]+)\s(.+)$/); const raw=(m&&known.has(m[1]))?m[1]:''; const name=raw?m[2]:x;
 let abbr=''; const upper=raw.toUpperCase();
 if(['PSO','ONIN','APS'].includes(upper)) abbr='ST'; else if(!['SUPV','RECEP','RECEPTIONIST',''].includes(upper)) abbr=upper;
 return {special:'',display:name,rank:abbr};
}

 return `<div class="sch-post">${post}${tools}</div>${cells.map((name,day)=>renderScheduleCell(name,sec,idx,day,forExport)).join('')}`

function normalizedShiftText(v){return String(v||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,' ').trim()}
function employeeMatchesScheduleContext(e,section='',post=''){
 const sec=normalizedShiftText(section),pst=normalizedShiftText(post),sh=normalizedShiftText(e.shift),gate=normalizedShiftText(e.gateShift),blob=[sh,gate,pst].join(' ');
 if(!sec)return true;
 if(sec.includes('1st'))return sh.includes('1st')||sh==='first';
 if(sec.includes('2nd'))return sh.includes('2nd')||sh==='second';
 if(sec.includes('3rd'))return sh.includes('3rd')||sh==='third';
 if(sec.includes('gate'))return sh.includes('gate')||gate.length>0||pst.includes('gate');
 if(sec.includes('dock')||sec.includes('support'))return sh.includes('dock')||sh.includes('crosswalk')||sh.includes('reception')||pst.includes('dock')||pst.includes('grocery')||pst.includes('perishable')||pst.includes('crosswalk')||pst.includes('reception');
 return blob.includes(sec.split(' ')[0]);
}

function scheduleRowWindowHours(row){
 const t=String(row.shiftLabel||'').match(/(\d{3,4})\s*-\s*(\d{3,4})/); if(!t)return null;
 const mins=x=>{x=String(x).padStart(4,'0');return Number(x.slice(0,2))*60+Number(x.slice(2));};
 let a=mins(t[1]),b=mins(t[2]); if(b<=a)b+=1440; return Math.round((b-a)/60*100)/100;
}
function scheduleWarnings(){
 const warnings=[]; const rows=roster.schedule||[];
 rows.forEach((row,idx)=>{
   const label=(row.section||'Unsectioned')+' / '+(row.post||'Post');
   const hrs=Number(row.hrs||0);
   if(!hrs||hrs<=0)warnings.push({level:'bad',msg:`${label}: missing or invalid cost hours.`});
   const windowHours=scheduleRowWindowHours(row);
   if(windowHours!==null&&hrs&&Math.abs(windowHours-hrs)>1){warnings.push({level:'warn',msg:`${label}: coverage window is ${windowHours} hours but cost hours is ${hrs}. Confirm this is intentional.`});}
   (row.days||[]).slice(0,7).forEach((cell,day)=>{
     const v=String(cell||'').trim(); const dayName=DAYS[day]||('Day '+day);
     if(v==='')warnings.push({level:'warn',msg:`${label} ${dayName}: blank active cell. Use Closed, Open, Pending, or assign an employee.`});
     if(['open','pending'].includes(v.toLowerCase()))warnings.push({level:'warn',msg:`${label} ${dayName}: ${v} will count as unfilled HPW.`});
     if(v&&!['none','closed','open','pending'].includes(v.toLowerCase())){const emp=findRosterByScheduleName(v); if(emp&&isRosterArchived(emp))warnings.push({level:'bad',msg:`${label} ${dayName}: ${schedulePersonName(v)} is inactive/archived on the roster.`});}
   });
 });
 const byEmp={};
 for(const row of rows){for(const cell of (row.days||[]).slice(0,7)){const low=String(cell||'').trim().toLowerCase();if(!cell||['none','closed','open','pending'].includes(low))continue;const emp=findRosterByScheduleName(cell);if(emp){const id=String(emp.id);byEmp[id]=(byEmp[id]||{name:fullName(emp),hours:0});byEmp[id].hours+=Number(row.hrs||8);}}}
 const base=Number(settings.fteBaselineHours||40); Object.values(byEmp).forEach(x=>{if(x.hours>base)warnings.push({level:'warn',msg:`${x.name}: scheduled ${x.hours} HPW, above the ${base} HPW baseline.`});});
 return warnings;
}
function renderScheduleWarningsPanel(){

 if(!warnings.length)return `<div class="schedule-warning-panel ok"><div class="schedule-warning-title">Schedule Data Check</div><div class="mini-note">No schedule warnings found. HPW will use named assignments, while Open/Pending cells count as unfilled.</div></div>`;
 const top=warnings.slice(0,8);
 return `<div class="schedule-warning-panel"><div class="schedule-warning-title">Schedule Data Check · ${warnings.length} item${warnings.length===1?'':'s'}</div><ul class="schedule-warning-list">${top.map(w=>`<li><strong>${w.level==='bad'?'Fix':'Review'}:</strong> ${esc(w.msg)}</li>`).join('')}${warnings.length>top.length?`<li><strong>More:</strong> ${warnings.length-top.length} additional item(s). Use Data Health for broader review.</li>`:''}</ul></div>`;
}

function exportScheduleOnly(){const html=scheduleShareHtml();const dateStamp=new Date().toISOString().slice(0,10);const blob=new Blob([html],{type:'text/html'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='PWADC_Security_Schedule_'+dateStamp+'.html';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Exported schedule-only HTML for supervisors.')}

function renderRosterTraining(){
  const topics=activeTrainingTopics().slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
  const rows=trainingRows();
  const visibleRows=filteredTrainingRows(rows);
  const expired=visibleRows.filter(r=>r.status==='Expired'||r.status==='Overdue').length;
  const expiring=visibleRows.filter(r=>r.status==='Expiring Soon'||r.status==='Due Soon').length;
  const missing=visibleRows.filter(r=>r.status==='Missing'||r.status==='No Record').length;
  const current=visibleRows.filter(r=>r.status==='Current'||r.status==='Complete').length;
  return `<div class="training-toolbar"><div><div class="page-title">Training Tracker</div><div class="page-sub">Role/post-based requirements, expiration tracking, trainers, and readiness exceptions.</div></div><div class="top-actions"><button onclick="openTrainingTopicModal()">+ Add Topic</button><button class="gold" onclick="openTrainingRecordModal()">+ Add Training Record</button><button onclick="printTrainingMatrix()">Print Training</button><button onclick="exportTrainingCSV()">Export Training CSV</button></div></div>
  <div class="training-readiness-grid"><div class="kpi"><div class="num">${topics.length}</div><div class="lbl">Active Topics</div></div><div class="kpi"><div class="num">${roster.trainingRecords.length}</div><div class="lbl">Records</div></div><div class="kpi"><div class="num ok">${current}</div><div class="lbl">Current</div></div><div class="kpi"><div class="num schedule-risk">${expired}</div><div class="lbl">Expired</div></div><div class="kpi"><div class="num">${expiring}</div><div class="lbl">Expiring Soon</div></div><div class="kpi"><div class="num schedule-risk">${missing}</div><div class="lbl">Missing</div></div></div>
  <div class="training-filters"><div><label>Search</label><input id="trainingSearch" placeholder="Employee, topic, trainer, notes..." value="${esc(window._trainingSearch||'')}" oninput="window._trainingSearch=this.value;safeRenderPages()"></div><div><label>Topic</label><select id="trainingTopicFilter" onchange="window._trainingTopicFilter=this.value;safeRenderPages()"><option value="">All Topics</option>${topics.map(t=>`<option value="${esc(t.id)}" ${(window._trainingTopicFilter||'')==String(t.id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div><label>Status</label><select id="trainingStatusFilter" onchange="window._trainingStatusFilter=this.value;safeRenderPages()"><option value="">All Statuses</option>${['Current','Expiring Soon','Expired','Missing','Not Required'].map(x=>`<option value="${x}" ${(window._trainingStatusFilter||'')===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Requirement</label><select id="trainingReqFilter" onchange="window._trainingReqFilter=this.value;safeRenderPages()"><option value="">All Requirements</option>${['All','Supervisors','Leads','Gate','BaseEOC','DockCrosswalk','Reception','PLE','Custom'].map(x=>`<option value="${x}" ${(window._trainingReqFilter||'')===x?'selected':''}>${esc(trainingRequirementLabel(x))}</option>`).join('')}</select></div><div style="align-self:end"><button onclick="window._trainingSearch='';window._trainingTopicFilter='';window._trainingStatusFilter='';window._trainingReqFilter='';safeRenderPages()">Clear Filters</button></div></div>
  <div class="training-layout"><div class="card training-side-card"><div class="card-title">Training Topics</div>${renderTrainingTopicsList()}</div><div class="card"><div class="card-title">Training Matrix</div><div class="training-print-note">Status summary: ${expired} expired · ${expiring} expiring soon · ${missing} missing. Requirements are based on each employee's role, shift, and scheduled posts.</div>${renderTrainingMatrix()}</div></div>`
}
function trainingRows(){const topics=activeTrainingTopics().slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));const emps=(roster.employees||[]).filter(e=>!isArchivedEmployee(e)).slice().sort((a,b)=>fullName(a).localeCompare(fullName(b)));let rows=[];for(const emp of emps){for(const topic of topics){const rec=latestTrainingRecord(emp.id,topic.id);const applies=topicAppliesToEmployee(topic,emp);const status=applies?trainingStatus(rec,topic):'Not Required';rows.push({emp,topic,rec,status,applies});}}return rows}
function filteredTrainingRows(rows){const q=(window._trainingSearch||'').toLowerCase();const topicFilter=String(window._trainingTopicFilter||'');const statusFilter=window._trainingStatusFilter||'';const reqFilter=window._trainingReqFilter||'';return rows.filter(r=>!topicFilter||String(r.topic.id)===topicFilter).filter(r=>!statusFilter||r.status===statusFilter).filter(r=>!reqFilter||String(r.topic.requirementGroup||'All')===reqFilter).filter(r=>!q||(fullName(r.emp)+' '+(r.emp.eid||'')+' '+(r.emp.shift||'')+' '+(r.topic.name||'')+' '+(r.topic.notes||'')+' '+((r.rec&&r.rec.notes)||'')+' '+((r.rec&&r.rec.trainer)||'')).toLowerCase().includes(q))}
function renderTrainingTopicsList(){const topics=(roster.trainingTopics||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));if(!topics.length)return '<div class="training-empty">No topics yet. Add a topic to start tracking training.</div>';return topics.map(t=>`<div class="topic-card"><div><div class="topic-title">${esc(t.name)} ${t.active===false?'<span class="training-status training-na">Inactive</span>':''}</div><div class="topic-meta">${t.required!==false?'Required':'Optional'} · ${esc(intervalLabel(t.intervalDays))} · Warn ${Number(t.warningDays||30)} day(s)<br><span class="training-topic-scope">${esc(trainingRequirementLabel(t.requirementGroup||'All'))}</span>${t.requirementText?'<div class="training-req-note">Match: '+esc(t.requirementText)+'</div>':''}${t.notes?'<br>'+esc(t.notes):''}</div></div><div class="td-actions"><button class="sm" onclick="openTrainingTopicModal('${esc(t.id)}')">Edit</button><button class="sm danger" onclick="deleteTrainingTopic('${esc(t.id)}')">Remove</button></div></div>`).join('')}
function renderTrainingMatrix(){let topics=activeTrainingTopics().slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));let emps=(roster.employees||[]).filter(e=>!isArchivedEmployee(e)).slice().sort((a,b)=>{const sa=shiftSortName(a.shift),sb=shiftSortName(b.shift);return sa.localeCompare(sb)||fullName(a).localeCompare(fullName(b));});const q=(window._trainingSearch||'').toLowerCase();const topicFilter=String(window._trainingTopicFilter||'');const statusFilter=window._trainingStatusFilter||'';const reqFilter=window._trainingReqFilter||'';if(topicFilter)topics=topics.filter(t=>String(t.id)===topicFilter);if(reqFilter)topics=topics.filter(t=>String(t.requirementGroup||'All')===reqFilter);if(q){emps=emps.filter(emp=>{const empHit=(fullName(emp)+' '+(emp.eid||'')+' '+(emp.shift||'')+' '+employeeTrainingBlob(emp)).toLowerCase().includes(q);const trainHit=topics.some(topic=>{const rec=latestTrainingRecord(emp.id,topic.id);return ((topic.name||'')+' '+(topic.notes||'')+' '+((rec&&rec.notes)||'')+' '+((rec&&rec.trainer)||'')).toLowerCase().includes(q)});return empHit||trainHit;});}if(statusFilter){emps=emps.filter(emp=>topics.some(topic=>{const st=topicAppliesToEmployee(topic,emp)?trainingStatus(latestTrainingRecord(emp.id,topic.id),topic):'Not Required';return st===statusFilter;}));}if(!topics.length)return '<div class="training-empty">No training topics match the current filter.</div>';if(!emps.length)return '<div class="training-empty">No employees match the current training filters.</div>';const groups={};for(const emp of emps){const key=trainingShiftGroup(emp.shift);groups[key]=groups[key]||[];groups[key].push(emp);}const order=['1st','2nd','3rd','GATE','W/E Gate','DOCK','Crosswalk','RECP','Other'];const keys=Object.keys(groups).sort((a,b)=>(order.indexOf(a)<0?99:order.indexOf(a))-(order.indexOf(b)<0?99:order.indexOf(b))||a.localeCompare(b));return keys.map(key=>`<div class="training-shift-block"><div class="training-shift-head"><span>${esc(trainingShiftLabel(key))}</span><small>${groups[key].length} employee(s)</small></div><div class="training-matrix-wrap"><table class="training-matrix"><thead><tr><th>Employee</th>${topics.map(t=>`<th class="training-topic-th">${esc(t.name)}<div style="font-size:10px;color:var(--muted);margin-top:3px">${t.required!==false?'Required':'Optional'} · ${esc(intervalLabel(t.intervalDays))}<br>${esc(trainingRequirementLabel(t.requirementGroup||'All'))}</div></th>`).join('')}</tr></thead><tbody>${groups[key].map(emp=>`<tr><td><strong>${esc(fullName(emp))}</strong><div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(emp.shift||'')} ${emp.eid?'· '+esc(emp.eid):''}</div></td>${topics.map(topic=>renderTrainingCell(emp,topic,statusFilter)).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('')}
function trainingShiftGroup(shift){const s=String(shift||'').trim();if(/^1st/i.test(s))return '1st';if(/^2nd/i.test(s))return '2nd';if(/^3rd/i.test(s))return '3rd';if(/w\/e gate/i.test(s))return 'W/E Gate';if(/gate/i.test(s))return 'GATE';if(/dock/i.test(s))return 'DOCK';if(/crosswalk/i.test(s))return 'Crosswalk';if(/recp|reception/i.test(s))return 'RECP';return s||'Other'}
function shiftSortName(shift){const order={'1st':'01','2nd':'02','3rd':'03','GATE':'04','W/E Gate':'05','DOCK':'06','Crosswalk':'07','RECP':'08','Other':'99'};const g=trainingShiftGroup(shift);return (order[g]||'98')+' '+g}
function trainingShiftLabel(key){return key==='RECP'?'Reception':key==='GATE'?'Gate':key==='DOCK'?'Dock':key}
function trainingRequirementLabel(group){return ({All:'All employees',Supervisors:'Supervisors',Leads:'Leads / LSO',Gate:'Gate',BaseEOC:'Base / EOC',DockCrosswalk:'Dock / Crosswalk',Reception:'Reception',PLE:'Forklift / PLE',Custom:'Custom match'})[group]||'All employees'}
function employeeTrainingBlob(emp){const schedule=(roster.schedule||[]).filter(row=>(row.days||[]).some(cell=>scheduleNameMatchesEmployee(cell,emp))).map(row=>[row.section,row.post,row.shiftLabel,row.notes].join(' ')).join(' ');return [fullName(emp),emp.eid,emp.rank,emp.title,emp.shift,emp.gateShift,emp.section,emp.type,schedule].filter(Boolean).join(' ').toLowerCase();}
function topicAppliesToEmployee(topic,emp){if(!topic||topic.active===false||!emp||isArchivedEmployee(emp))return false;const group=topic.requirementGroup||'All';const blob=employeeTrainingBlob(emp);if(group==='All')return true;if(group==='Supervisors')return /supervisor|supv|mgr|manager/.test(blob);if(group==='Leads')return /lead|lso/.test(blob);if(group==='Gate')return /gate|0400|1200|2000/.test(blob);if(group==='BaseEOC')return /base|eoc|soc|camera|access|amag|wave/.test(blob);if(group==='DockCrosswalk')return /dock|crosswalk|grocery|perishable|truck/.test(blob);if(group==='Reception')return /reception|recp/.test(blob);if(group==='PLE')return /forklift|ple|powered|lift|cert/.test(blob);if(group==='Custom'){const tokens=String(topic.requirementText||'').toLowerCase().split(',').map(x=>x.trim()).filter(Boolean);return tokens.length?tokens.some(t=>blob.includes(t)):true;}return true}
function requiredTrainingTopicsForEmployee(emp){return (roster.trainingTopics||[]).filter(t=>t.active!==false&&t.required!==false&&topicAppliesToEmployee(t,emp))}
function activeTrainingTopics(){return (roster.trainingTopics||[]).filter(t=>t.active!==false)}
function trainingReadinessForEmployee(emp){const topics=requiredTrainingTopicsForEmployee(emp);let current=0,expiring=0,expired=0,missing=0;const rows=[];for(const t of topics){const rec=latestTrainingRecord(emp.id,t.id);const status=trainingStatus(rec,t);if(status==='Current'||status==='Complete')current++;else if(status==='Expiring Soon'||status==='Due Soon')expiring++;else if(status==='Expired'||status==='Overdue')expired++;else missing++;rows.push({topic:t,status,rec,due:rec&&rec.due||'',completed:rec&&rec.completed||'',trainer:rec&&rec.trainer||''});}const total=topics.length;const good=current;const score=total?Math.round((good/total)*100):100;return{total,current,expiring,expired,missing,score,rows}}
function trainingStatusIssue(status){return ['Missing','No Record','Expired','Overdue','Expiring Soon','Due Soon'].includes(status)}
function renderTrainingCell(emp,topic,statusFilter=''){const rec=latestTrainingRecord(emp.id,topic.id);const applies=topicAppliesToEmployee(topic,emp);const status=applies?trainingStatus(rec,topic):'Not Required';const filteredClass=statusFilter&&status!==statusFilter?' training-filtered-out':'';const dates=!applies?`<div class="training-dates">Not required for this employee's role/post.</div>`:(rec?`<div class="training-dates">Completed: ${esc(fmtDate(rec.completed||''))}<br>Expires: ${esc(fmtDate(rec.due||''))}${rec.trainer?'<br>Trainer: '+esc(rec.trainer):''}${rec.notes?'<br>Notes: '+esc(rec.notes):''}</div>`:'<div class="training-dates">No completion recorded</div>');return `<td class="training-cell${filteredClass}${!applies?' not-required':''}"><div class="training-cell-inner">${trainingStatusBadge(status)}${dates}<div class="training-actions">${applies?`<button class="sm" onclick="openTrainingRecordModal('${rec?esc(rec.id):''}','${esc(emp.id)}','${esc(topic.id)}')">${rec?'Edit':'Add'}</button>${rec?`<button class="sm danger" onclick="deleteTrainingRecord('${esc(rec.id)}')">Remove</button>`:''}`:''}</div></div></td>`}
function latestTrainingRecord(empId,topicId){return (roster.trainingRecords||[]).filter(r=>String(r.employeeId)===String(empId)&&String(r.topicId)===String(topicId)).sort((a,b)=>String(b.completed||'').localeCompare(String(a.completed||'')))[0]||null}
function trainingStatus(rec,topic){if(!rec)return 'Missing';if(!rec.due||!topic||!Number(topic.intervalDays))return 'Current';const today=parseISO(new Date().toISOString().slice(0,10));const due=parseISO(rec.due);const diff=Math.ceil((due-today)/86400000);if(diff<0)return 'Expired';if(diff<=Number(topic.warningDays||30))return 'Expiring Soon';return 'Current'}
function trainingStatusBadge(status){const cls=(status==='Current'||status==='Complete')?'training-current':(status==='Expiring Soon'||status==='Due Soon')?'training-expiring':(status==='Expired'||status==='Overdue')?'training-expired':status==='Not Required'?'training-na':'training-missing';return `<span class="training-status ${cls}">${esc(status)}</span>`}
function intervalLabel(n){n=Number(n)||0;if(!n)return 'No expiration';if(n===30)return '30 days';if(n===90)return '90 days';if(n===180)return '6 months';if(n===365)return 'Annual';if(n===730)return 'Every 2 years';return n+' days'}
function trainingTopicById(id){return (roster.trainingTopics||[]).find(t=>String(t.id)===String(id))}
function trainingRecordById(id){return (roster.trainingRecords||[]).find(r=>String(r.id)===String(id))}
function openTrainingTopicModal(id=''){const t=id?trainingTopicById(id):null;const group=t&&t.requirementGroup||'All';showModal(`<div class="modal-head"><div class="modal-title">${t?'Edit Training Topic':'Add Training Topic'}</div><button onclick="closeModal()">Close</button></div><div class="form-grid"><div class="full"><label>Topic Name</label><input id="trainTopicName" value="${esc(t&&t.name||'')}" placeholder="Gate Post Training, Emergency Procedures"></div><div><label>Expiration Days</label><input id="trainTopicInterval" type="number" min="0" value="${esc(t&&Number(t.intervalDays)||365)}"><div class="settings-help">Use 0 for no expiration, 365 for annual.</div></div><div><label>Warning Window Days</label><input id="trainTopicWarning" type="number" min="1" value="${esc(t&&Number(t.warningDays)||30)}"><div class="settings-help">Status changes to Expiring Soon inside this window.</div></div><div><label>Required?</label><select id="trainTopicRequired"><option value="yes" ${!t||t.required!==false?'selected':''}>Yes</option><option value="no" ${t&&t.required===false?'selected':''}>No</option></select></div><div><label>Active?</label><select id="trainTopicActive"><option value="yes" ${!t||t.active!==false?'selected':''}>Active</option><option value="no" ${t&&t.active===false?'selected':''}>Inactive</option></select></div><div><label>Required For</label><select id="trainTopicGroup" onchange="document.getElementById('trainTopicCustomWrap').style.display=this.value==='Custom'?'block':'none'">${['All','Supervisors','Leads','Gate','BaseEOC','DockCrosswalk','Reception','PLE','Custom'].map(x=>`<option value="${x}" ${group===x?'selected':''}>${esc(trainingRequirementLabel(x))}</option>`).join('')}</select></div><div id="trainTopicCustomWrap" class="full" style="display:${group==='Custom'?'block':'none'}"><label>Custom Match Words</label><input id="trainTopicRequirementText" value="${esc(t&&t.requirementText||'')}" placeholder="Comma-separated words to match employee/schedule, e.g. camera, freezer"><div class="settings-help">Custom topics apply when any word matches the employee's shift, rank, or scheduled post.</div></div><div class="full"><label>Notes</label><input id="trainTopicNotes" value="${esc(t&&t.notes||'')}" placeholder="Optional standard, policy reference, or reminder note"></div></div><div class="modal-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveTrainingTopic('${esc(id)}')">Save Topic</button></div>`)}
function saveTrainingTopic(id=''){const name=val('trainTopicName').trim();if(!name){toast('Training topic name is required');return;}if((roster.trainingTopics||[]).some(t=>String(t.id)!==String(id)&&String(t.name||'').toLowerCase()===name.toLowerCase())){toast('That topic already exists');return;}const intervalDays=Math.max(0,Number(val('trainTopicInterval'))||0);const warningDays=Math.max(1,Number(val('trainTopicWarning'))||30);const data={name,intervalDays,warningDays,required:val('trainTopicRequired')!=='no',active:val('trainTopicActive')!=='no',requirementGroup:val('trainTopicGroup')||'All',requirementText:val('trainTopicRequirementText').trim(),notes:val('trainTopicNotes').trim()};if(id){Object.assign(trainingTopicById(id),data);}else{roster.trainingTopics.push({id:roster.nextTrainingTopicId++, ...data});}saveRosterNow('training-topic').then(ok=>{if(ok){closeModal();safeRenderPages();toast('Training topic saved')}})}
function deleteTrainingTopic(id){const t=trainingTopicById(id);if(!t)return;const count=(roster.trainingRecords||[]).filter(r=>String(r.topicId)===String(id)).length;if(!confirm('Remove training topic "'+t.name+'"?'+(count?'\n\nThis will also remove '+count+' record(s).':'')))return;roster.trainingTopics=roster.trainingTopics.filter(x=>String(x.id)!==String(id));roster.trainingRecords=roster.trainingRecords.filter(r=>String(r.topicId)!==String(id));saveRoster('training-topic-remove');safeRenderPages();toast('Training topic removed')}
function openTrainingRecordModal(recordId='',empId='',topicId=''){const rec=recordId?trainingRecordById(recordId):null;const emps=(roster.employees||[]).filter(e=>!isArchivedEmployee(e)).slice().sort((a,b)=>fullName(a).localeCompare(fullName(b)));const topics=activeTrainingTopics().slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));if(!emps.length){toast('Add employees before adding training records');return;}if(!topics.length){toast('Add a topic before adding records');return;}const selEmp=rec?rec.employeeId:(empId||emps[0].id);const selTopic=rec?rec.topicId:(topicId||topics[0].id);showModal(`<div class="modal-head"><div class="modal-title">${rec?'Edit Training Record':'Add Training Record'}</div><button onclick="closeModal()">Close</button></div><div class="form-grid"><div class="full"><label>Employee</label><select id="trainRecEmp">${emps.map(e=>`<option value="${esc(e.id)}" ${String(selEmp)===String(e.id)?'selected':''}>${esc(fullName(e))}</option>`).join('')}</select></div><div class="full"><label>Topic</label><select id="trainRecTopic" onchange="trainingRecordDateChanged()">${topics.map(t=>`<option value="${esc(t.id)}" ${String(selTopic)===String(t.id)?'selected':''}>${esc(t.name)} · ${esc(trainingRequirementLabel(t.requirementGroup||'All'))}</option>`).join('')}</select></div><div><label>Completed Date</label><input id="trainRecCompleted" type="date" value="${esc(rec&&rec.completed||new Date().toISOString().slice(0,10))}" onchange="trainingRecordDateChanged()"></div><div><label>Expiration Date</label><input id="trainRecDue" type="date" value="${esc(rec&&rec.due||'')}"></div><div><label>Trainer</label><input id="trainRecTrainer" value="${esc(rec&&rec.trainer||currentUserName())}" placeholder="Trainer / supervisor"></div><div class="full"><label>Notes</label><input id="trainRecNotes" value="${esc(rec&&rec.notes||'')}" placeholder="Optional notes"></div></div><div class="modal-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveTrainingRecord('${esc(recordId)}')">Save Record</button></div>`);setTimeout(trainingRecordDateChanged,0)}
function trainingRecordDateChanged(){const completed=val('trainRecCompleted');const topic=trainingTopicById(val('trainRecTopic'));const due=document.getElementById('trainRecDue');if(due&&completed&&topic&&Number(topic.intervalDays))due.value=addDays(completed,Number(topic.intervalDays));if(due&&completed&&topic&&!Number(topic.intervalDays))due.value=''}
function saveTrainingRecord(recordId=''){const employeeId=val('trainRecEmp'),topicId=val('trainRecTopic'),completed=val('trainRecCompleted'),due=val('trainRecDue'),trainer=val('trainRecTrainer').trim(),notes=val('trainRecNotes').trim();if(!employeeId||!topicId||!completed){toast('Employee, topic, and completed date are required');return;}const data={employeeId,topicId,completed,due,trainer,notes};if(recordId){Object.assign(trainingRecordById(recordId),data);}else{roster.trainingRecords.push({id:roster.nextTrainingRecordId++, ...data});}saveRosterNow('training-record').then(ok=>{if(ok){closeModal();safeRenderPages();toast('Training record saved')}})}
function deleteTrainingRecord(id){if(!confirm('Remove this training record?'))return;roster.trainingRecords=roster.trainingRecords.filter(r=>String(r.id)!==String(id));saveRoster('training-record-remove');safeRenderPages();toast('Training record removed')}
function exportTrainingCSV(){const topics=activeTrainingTopics().slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));let rows=[['Employee','EID','Shift','Topic','Required For','Status','Completed','Expires','Trainer','Notes']];for(const emp of (roster.employees||[]).filter(e=>!isArchivedEmployee(e)).slice().sort((a,b)=>fullName(a).localeCompare(fullName(b)))){for(const topic of topics){const rec=latestTrainingRecord(emp.id,topic.id);const applies=topicAppliesToEmployee(topic,emp);rows.push([fullName(emp),emp.eid||'',emp.shift||'',topic.name||'',trainingRequirementLabel(topic.requirementGroup||'All'),applies?trainingStatus(rec,topic):'Not Required',rec&&rec.completed||'',rec&&rec.due||'',rec&&rec.trainer||'',rec&&rec.notes||'']);}}downloadCSV('PWADC_Training_'+new Date().toISOString().slice(0,10)+'.csv',rows);toast('Exported training CSV')}
function printTrainingMatrix(){const topics=activeTrainingTopics().slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));const emps=(roster.employees||[]).filter(e=>!isArchivedEmployee(e)).slice().sort((a,b)=>fullName(a).localeCompare(fullName(b)));let html=`<div class="print-overlay" id="printOverlay"><div class="print-toolbar"><div><h2>PWADC Security Training Matrix</h2><div>${new Date().toLocaleString()} · ${topics.length} active topic(s) · ${roster.trainingRecords.length} record(s)</div></div><div><button onclick="window.print()">Print</button> <button onclick="document.getElementById('printOverlay').remove()">Close</button></div></div><table class="print-table"><thead><tr><th>Employee</th>${topics.map(t=>`<th>${esc(t.name)}<br><small>${esc(trainingRequirementLabel(t.requirementGroup||'All'))}</small></th>`).join('')}</tr></thead><tbody>${emps.map(emp=>`<tr><td>${esc(fullName(emp))}<br>${esc(emp.shift||'')}</td>${topics.map(topic=>{const rec=latestTrainingRecord(emp.id,topic.id);const applies=topicAppliesToEmployee(topic,emp);return `<td>${esc(applies?trainingStatus(rec,topic):'Not Required')}<br>${rec?('Completed: '+esc(fmtDate(rec.completed||''))+'<br>Expires: '+esc(fmtDate(rec.due||''))+'<br>Trainer: '+esc(rec.trainer||'')):(applies?'No record':'')}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;document.body.insertAdjacentHTML('beforeend',html);setTimeout(()=>window.print(),150)}

const DEFAULT_EQUIPMENT_TYPES=['Shirt','Pants','Jacket','Safety Vest','Other'];
const NON_UNIFORM_ITEM_TYPES=['Badge','Radio','Keys','Access Card','Flashlight','Rain Gear'];
function isUniformItemType(item){const x=String(item||'').trim().toLowerCase();return !NON_UNIFORM_ITEM_TYPES.some(n=>n.toLowerCase()===x);}
const EQUIPMENT_STATUS=['Needed','Ordered','Issued','Returned','Lost','Damaged','Retired'];
function titleCase(v){return String(v||'').replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function normalizedStatus(v){let s=String(v||'needed').trim().toLowerCase();if(s==='')s='needed';return s.replace(/\s+/g,'-')}
function uniformQty(e,k){if(k==='jacket')return 1;let cls=employmentClass(e);return cls==='PT'?3:5}
function equipmentList(e){e.equipmentItems=Array.isArray(e.equipmentItems)?e.equipmentItems:[];return e.equipmentItems}
function getUniformItemsForEmployee(e){let out=[];if(!e)return out;for(const k of ['shirt','pants','jacket']){let status=normalizedStatus(e[k+'Status']||'needed');let qty=uniformQty(e,k);out.push({employee:fullName(e),employeeId:e.id,rank:e.rank||'',shift:e.shift||'',item:k,size:e[k]||'',status,qty,issueDate:e[k+'IssueDate']||'',orderDate:e[k+'OrderDate']||'',replacementDue:e[k+'ReplacementDue']||'',cost:Number(e[k+'Cost']||0),notes:e[k+'Notes']||'',legacy:true});}for(const raw of equipmentList(e)){if(!isUniformItemType(raw&&raw.item))continue;let i={...raw};i.employee=fullName(e);i.employeeId=e.id;i.rank=e.rank||'';i.shift=e.shift||'';i.item=i.item||'Other';i.status=normalizedStatus(i.status||'issued');i.qty=Number(i.qty||1);i.cost=Number(i.cost||0);out.push(i);}return out;}
function getUniformItems(mode='all'){let emps=(roster.employees||[]).filter(e=>!isArchivedEmployee(e)&&!['ONIN','APS','Onin'].includes(e.type)&&!['ONIN','APS'].includes(e.rank));let items=[];for(const e of emps)items.push(...getUniformItemsForEmployee(e));if(mode&&mode!=='all')items=items.filter(i=>normalizedStatus(i.status)===normalizedStatus(mode));return items;}
function uniformStatusBadge(v){let st=normalizedStatus(v);return `<span class="status-badge ${esc(st)}">${esc(titleCase(st))}</span>`}
function equipmentStatusOptions(sel){return EQUIPMENT_STATUS.map(s=>`<option value="${esc(normalizedStatus(s))}" ${normalizedStatus(sel)===normalizedStatus(s)?'selected':''}>${esc(s)}</option>`).join('')}
function equipmentTypeOptions(sel){let set=new Set([...DEFAULT_EQUIPMENT_TYPES]);for(const e of roster.employees||[])for(const i of equipmentList(e))if(i.item&&isUniformItemType(i.item))set.add(i.item);return [...set].sort().map(s=>`<option value="${esc(s)}" ${String(sel||'')===s?'selected':''}>${esc(s)}</option>`).join('')}
function replacementDueClass(d){if(!d)return '';let due=new Date(d+'T00:00:00');if(isNaN(due))return '';let today=new Date();today.setHours(0,0,0,0);let diff=(due-today)/86400000;if(diff<0)return 'past-due';if(diff<=30)return 'due-soon';return '';}
function uniformMetrics(){const items=getUniformItems('all');const dueSoon=items.filter(i=>{let c=replacementDueClass(i.replacementDue);return c==='due-soon'||c==='past-due'});return{items,needed:items.filter(i=>i.status==='needed').length,ordered:items.filter(i=>i.status==='ordered').length,issued:items.filter(i=>i.status==='issued').length,returned:items.filter(i=>i.status==='returned').length,lostDamaged:items.filter(i=>['lost','damaged'].includes(i.status)).length,retired:items.filter(i=>i.status==='retired').length,dueSoon:dueSoon.length,value:items.filter(i=>['issued','lost','damaged'].includes(i.status)).reduce((n,i)=>n+(Number(i.cost||0)*Number(i.qty||1)),0)}}

async function saveUniformInline(empId,itemId){
  if(!canAdmin()){toast('Uniform edits are Admin-only');return;}
  let e=(roster.employees||[]).find(x=>String(x.id)===String(empId));if(!e){toast('Employee not found');return;}
  const legacy=String(itemId||'').startsWith('legacy-');
  const size=uniformInlineValue(empId,itemId,'size');
  const qty=Number(uniformInlineValue(empId,itemId,'qty')||1);
  const status=normalizedStatus(uniformInlineValue(empId,itemId,'status'));
  const orderDate=uniformInlineValue(empId,itemId,'orderDate');
  const issueDate=uniformInlineValue(empId,itemId,'issueDate');
  const replacementDue=uniformInlineValue(empId,itemId,'replacementDue');
  const cost=Number(uniformInlineValue(empId,itemId,'cost')||0);
  const notes=uniformInlineValue(empId,itemId,'notes');
  if(legacy){
    const key=String(itemId).replace('legacy-','');
    if(!['shirt','pants','jacket'].includes(key)){toast('Unknown legacy uniform item');return;}
    e[key]=size;e[key+'Status']=status;e[key+'OrderDate']=orderDate;e[key+'IssueDate']=issueDate;e[key+'ReplacementDue']=replacementDue;e[key+'Cost']=cost;e[key+'Notes']=notes;e[key+'Qty']=qty;
  }else{
    let list=equipmentList(e);let item=list.find(i=>String(i.id)===String(itemId));
    if(!item){toast('Uniform item not found');return;}
    item.item=uniformInlineValue(empId,itemId,'item')||item.item||'Other';item.size=size;item.qty=qty;item.status=status;item.orderDate=orderDate;item.issueDate=issueDate;item.replacementDue=replacementDue;item.cost=cost;item.notes=notes;item.updatedAt=new Date().toISOString();item.updatedBy=currentUserName()||env.user||'';
  }
  roster.audit=Array.isArray(roster.audit)?roster.audit:[];
  roster.audit.unshift({at:new Date().toISOString(),user:currentUserName()||env.user||'',action:'Uniform row saved',detail:fullName(e)});
  await saveRosterNow('uniform-inline-save');
  safeRenderPages({preserveScroll:true});toast('Uniform row saved');
}

function coverageRequirements(){return (settings.coverageRequirements&&settings.coverageRequirements.length?settings.coverageRequirements:DEFAULT_COVERAGE_REQUIREMENTS).map(normalizeCoverageRequirement)}
function coverageDayArray(r){r=r||{};let days=Array.isArray(r.days)?r.days:(Array.isArray(r.Days)?r.Days:[]);days=days.map(String).filter(d=>DAYS.includes(d));if(!days.length){const dt=String(r.dayType||r.DayType||'All');days=dt==='Weekday'?['Mon','Tue','Wed','Thu','Fri']:(dt==='Weekend'?['Sun','Sat']:[...DAYS]);}return days}
function coverageDayLabel(r){const days=coverageDayArray(r);if(days.length===7)return 'Sun-Sat';if(days.join('|')==='Mon|Tue|Wed|Thu|Fri')return 'Mon-Fri';if(days.join('|')==='Sun|Sat')return 'Sat-Sun';return days.join(', ')}
function coverageDayCount(r){return coverageDayArray(r).length}
function coverageRequirementHours(r){return Number(r.requiredHeadcount||0)*Number(r.hoursPerPost||0)*coverageDayCount(r)}
function coverageAreaKey(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function scheduleAreaMatches(section,req){const a=coverageAreaKey(section),r=coverageAreaKey(req.section||req.area);if(!r)return false;return a===r||a.includes(r)||r.includes(a)}

function coverageScheduledHoursFor(req,metrics){let assigned=0,open=0,cost=0,loadedCost=0,slots=0;const reqDays=new Set(coverageDayArray(req));for(const row of (roster.schedule||[])){if(!scheduleAreaMatches(row.section,req)||!schedulePostMatches(row.post,req))continue;for(let dayIdx=0;dayIdx<(row.days||[]).length;dayIdx++){if(!reqDays.has(DAYS[dayIdx]))continue;let val=(row.days||[])[dayIdx];if(scheduleCellIsBlank(val))continue;let hrs=Number(row.hrs||req.hoursPerPost||8);if(scheduleCellIsOpen(val)){open+=hrs;continue;}assigned+=hrs;slots++;let emp=findRosterByScheduleName(val);if(emp){cost+=Number(emp.rate||0)*hrs;loadedCost+=loadedHourlyRate(emp)*hrs;}}}const required=coverageRequirementHours(req);return{assigned:Math.min(assigned,required),rawAssigned:assigned,open,cost,loadedCost,slots}}
