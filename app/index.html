function normalizeSettings(){settings={...DEFAULT_SETTINGS,...settings};if(!Array.isArray(settings.users)||!settings.users.length)settings.users=DEFAULT_USERS.map(u=>({...u}));settings.users=settings.users.map(u=>({id:u.id||cryptoId(),username:u.username||u.displayName||'User',displayName:u.displayName||u.username||'User',role:u.role||'Viewer',pin:String(u.pin||''),active:u.active!==false}));if(!settings.users.some(u=>u.active))settings.users[0].active=true}function currentUserName(){return currentUser?currentUser.displayName||currentUser.username:''}function currentRole(){return currentUser?currentUser.role:'Viewer'}function canAccessModule(id){const role=currentRole();if(role==='Admin')return true;if(role==='Supervisor')return !['restore'].includes(id);if(role==='Guard')return ['home','roster','other-programs'].includes(id);if(role==='Viewer')return ['home','roster','data-health','change-log','other-programs'].includes(id);return id==='home'}function visibleModules(){return MODULES.filter(m=>canAccessModule(m.id))}function ensureAllowedModule(){if(!canAccessModule(activeModule))activeModule='home'}

function dataPath(module){return 'Data/'+module+'.json'}function backupName(module){return `${module}-backup-${new Date().toISOString().replace(/[-:.TZ]/g,'').slice(0,14)}.json`}async function loadModuleData(module,defaults){let data=await SuiteBridge.send('data:loadModule',{module});return data||structuredClone(defaults)}async function saveModuleDataStrict(module,data){return await SuiteBridge.send('data:saveModule',{module,data},{});}async function createBackup(module,data){try{return await SuiteBridge.send('data:backupModule',{module,data,filename:backupName(module)})}catch(e){console.warn('Backup failed',module,e)}}async function bootstrap(){try{env=await SuiteBridge.send('suite:getEnv');settings=await loadModuleData('settings',DEFAULT_SETTINGS);normalizeSettings();attendance=await loadModuleData('attendance',attendance);roster=await loadModuleData('roster',roster);tasks=await loadModuleData('tasks',tasks);normalizeAll();await ensureStandalonePrograms();renderPin();document.getElementById('saveStatus').textContent='Ready';}catch(e){showStartupError(e)}}function normalizeAll(){normalizeAttendance();normalizeRoster();normalizeTasks();normalizeSettings()}function normalizeAttendance(){attendance.employees=Array.isArray(attendance.employees)?attendance.employees:[];attendance.attendance=attendance.attendance||{};attendance.notes=attendance.notes||{};attendance.audit=Array.isArray(attendance.audit)?attendance.audit:[];attendance.flagActions=attendance.flagActions||{};attendance.settings={weekThreshold:3,monthThreshold:5,rollingThreshold:6,patternThreshold:3,...(attendance.settings||{})};attendance.patternActions=attendance.patternActions||{};for(const e of attendance.employees){e.id=String(e.id||cryptoId());e.name=e.name||`${e.first||''} ${e.last||''}`.trim();e.shift=e.shift||'Unassigned';e.title=e.title||e.rank||'';e.rdos=Array.isArray(e.rdos)?e.rdos:(Array.isArray(e.rdo)?e.rdo:[]);if(e.archived===undefined)e.archived=false}}function normalizeRoster(){roster.employe function cryptoId(){return 'id_'+Math.random().toString(36).slice(2,10)+'_'+Date.now().toString(36)}
function activeAttendanceEmployees(){return (attendance.employees||[]).filter(e=>!e.archived&&e.status!=='Archived')}function rosterActiveEmployees(){return (roster.employees||[]).filter(e=>!e.archived&&e.status!=='Archived')}function rosterArchivedEmployees(){return (roster.employees||[]).filter(e=>e.archived||e.status==='Archived')}
function scheduleNameToPersonKey(name){return String(name||'').toLowerCase().replace(/\([^)]*\)/g,'').replace(/[^a-z0-9]+/g,' ').trim()}function rosterEmployeeAttendanceName(e){return e.attendanceName||e.name||`${e.first||''} ${e.last||''}`.trim()}function fullName(e){return e.name||`${e.first||''} ${e.last||''}`.trim()}function findRosterByScheduleName(name){
  const key=scheduleNameToPersonKey(name);
  if(!key)return null;
  return rosterActiveEmployees().find(e=>{
    const keys=[fullName(e),rosterEmployeeAttendanceName(e),`${e.first||''} ${e.last||''}`,`${e.last||''}, ${e.first||''}`].map(scheduleNameToPersonKey);
    return keys.includes(key);
  })||null;
}

function renderHome(){

  const blanks=rows.filter(e=>!getCode(e.id,today)).length;

  const allTasks=(tasks.tasks||[]);
  const activeTasks=allTasks.filter(t=>!['Complete','Archived','On Hold','Tabled'].includes(String(t.status||''))).length;

function renderDataHealth(){const h=computeDataHealth();return `<div class="page-head"><div><div class="page-title">Data Health</div><div class="page-sub">Pre-flight checks for roster, attendance, schedule, task, and backup data. Use before and after imports.</div></div><div class="btn-group"><button onclick="safeRenderPages()">Refresh</button><button onclick="printDataHealth()">Print</button></div></div><div class="grid cols-4"><div class="kpi"><div class="num">${h.critical}</div><div class="lbl">Critical</div></div><div class="kpi"><div class="num">${h.warning}</div><div class="lbl">Warnings</div></div><div class="kpi"><div class="num">${h.info}</div><div class="lbl">Info</div></div><div class="kpi"><div class="num">${h.issues.length}</div><div class="lbl">Total Findings</div></div></div><div class="card"><div class="card-title">Findings</div>${h.issues.map(i=>`<div class="exception-card ${i.severity==='critical'?'critical':i.severity==='warning'?'high':''}"><div><div class="sev ${i.severity==='critical'?'critical':i.severity==='warning'?'high':''}">${esc(i.severity)}</div><span class="chip">${esc(i.module)}</span></div><div><strong>${esc(i.title)}</strong><br>${esc(i.detail)}</div><div>${i.action||''}</div></div>`).join('')||'<div class="notice">No data health findings.</div>'}</div>`}
function computeDataHealth(){const issues=[];const add=(severity,module,title,detail,action='')=>issues.push({severity,module,title,detail,action});const names={};for(const e of activeAttendanceEmployees()){const k=scheduleNameToPersonKey(e.name);if(names[k])add('warning','Attendance','Duplicate active attendance name',`${e.name} duplicates ${names[k].name}`);else names[k]=e;if(!attendance.attendance[String(e.id)])add('info','Attendance','No attendance history row',`${e.name} has no attendance history object yet.`)}for(const e of rosterActiveEmployees()){if(!e.first&&!e.last&&!e.name)add('critical','Roster','Roster employee missing name',`Record ${e.id} has no first/last/name.`);if(e.rate!==''&&e.rate!==undefined&&isNaN(Number(e.rate)))add('warning','Roster','Invalid rate',`${fullName(e)} has non-numeric rate: ${e.rate}`);if(!findAttendanceByRosterEmployee(e))add('info','Roster/Attendance','Roster employee not linked to attendance',`${fullName(e)} is active on roster but not linked to an attendance row.`)}for(const row of roster.schedule||[]){for(const d of DAYS){const v=row.assignments?row.assignments[d]:row[d];if(v&&String(v).toLowerCase()!=='closed'&&!findRosterByScheduleName(v))add('warning','Schedule','Schedule assignment not found in roster',`${v} appears on ${row.section||row.post||'schedule'} ${d} but does not match an active roster employee.`)}}for(const t of tasks.tasks||[]){if(!t.project&&!t.title)add('warning','Task Tracker','Task missing project/title',`Task ${t.id} has no project/title.`);if(!t.dueDate&&['High','Critical'].includes(t.priority))add('info','Task Tracker','High priority task without due date',`${t.project||t.title||t.id}`)}const critical=issues.filter(i=>i.severity==='critical').length,warning=issues.filter(i=>i.severity==='warning').length,info=issues.filter(i=>i.severity==='info').length;return{issues,critical,warning,info}}
function printDataHealth(){const h=computeDataHealth();const html=`<html><head><title>PWADC Data Health Check</title><style>body{font-family:Arial,sans-serif;padding:24px}h1{margin-bottom:4px}.issue{border:1px solid #ccc;border-left:5px solid #999;margin:8px 0;padding:8px}.critical{border-left-color:#c0272d}.warning{border-left-color:#e08a2f}.info{border-left-color:#4a90d9}.meta{font-size:12px;color:#555;text-transform:uppercase}</style></head><body><h1>PWADC Data Health Check</h1><p>${new Date().toLocaleString()} · ${h.issues.length} issue(s)</p>${h.issues.map(i=>`<div class="issue ${esc(i.severity)}"><strong>${esc(i.title)}</strong><div class="meta">${esc(i.severity)} · ${esc(i.module)}</div><div>${esc(i.detail)}</div></div>`).join('')||'<p>No issues found.</p>'}</body></html>`;const w=window.open('','_blank');w.document.write(html);w.document.close();w.print();}
function renderRestoreCenter(){return `<div class="page-head"><div><div class="page-title">Restore Center</div><div class="page-sub">List backups, inspect restore points, and recover module data.</div></div><div class="btn-group"><button onclick="loadRestoreBackups()">Refresh Backups</button><button class="gold" onclick="backupEverything()">Backup Everything</button></div></div><div class="card"><div class="card-title">Backup Browser</div><div class="toolbar"><div><label>Module</label><select onchange="restoreSelectedModule=this.value;loadRestoreBackups()"><option>attendance</option><option>roster</option><option>tasks</option><option>settings</option></select></div></div>${restoreLoading?'<p>Loading backups...</p>':restoreBackups.map(b=>`<div class="log-row"><div>${esc(b.time||'')}</div><div>${esc(b.module||restoreSelectedModule)}</div><div class="log-action">${esc(b.name||b.file||'Backup')}</div><div><button class="sm" onclick="restoreBackup('${esc(b.path||b.file||b.name)}')">Restore</button></div></div>`).join('')||'<p class="mini-note">No backups loaded yet. Click Refresh Backups.</p>'}</div>`}
async function loadRestoreBackups(){restoreLoading=true;safeRenderPages();try{restoreBackups=await SuiteBridge.send('suite:listBackups',{module:restoreSelectedModule})||[]}catch(e){toast('Backup list failed: '+e.message)}restoreLoading=false;safeRenderPages()}async function restoreBackup(path){if(!confirm('Restore backup? Current data will be backed up first.'))return;try{await backupEverything();const data=await SuiteBridge.send('suite:restoreBackup',{path,module:restoreSelectedModule});if(restoreSelectedModule==='attendance')attendance=data;if(restoreSelectedModule==='roster')roster=data;if(restoreSelectedModule==='tasks')tasks=data;if(restoreSelectedModule==='settings')settings=data;normalizeAll();toast('Restore complete');safeRenderPages()}catch(e){toast('Restore failed: '+e.message)}}
function renderChangeLog(){let rows=combinedChangeLog();if(changeLogModule!=='all')rows=rows.filter(r=>r.module===changeLogModule);if(changeLogSearch)rows=rows.filter(r=>(String(r.action||'')+' '+String(r.detail||'')+' '+String(r.user||'')+' '+String(r.machine||'')).toLowerCase().includes(changeLogSearch.toLowerCase()));const mods=['all','Attendance','Roster','Task Tracker'];return `<div class="page-head"><div><div class="page-title">Change Log</div><div class="page-sub">Combined audit trail from Attendance, Roster, and Task Tracker.</div></div><button onclick="printChangeLog()">Print</button></div><div class="card"><div class="log-filter"><select onchange="changeLogModule=this.value;safeRenderPages()">${mods.map(m=>`<option value="${m}" ${changeLogModule===m?'selected':''}>${m==='all'?'All Modules':m}</option>`).join('')}</select><input placeholder="Search changes..." value="${esc(changeLogSearch)}" oninput="changeLogSearch=this.value;safeRenderPages()"></div><div>${rows.slice(0,500).map(r=>`<div class="log-row"><div>${esc(r.at?new Date(r.at).toLocaleString():'')}</div><div>${esc(r.module||'')}</div><div class="log-action">${esc(r.action||'')}</div><div class="log-detail"><strong>${esc(r.user||'')}</strong> ${r.machine?`@ ${esc(r.machine)}`:''}<br>${esc(r.detail||'')}</div></div>`).join('')||'<p class="small-note">No matching audit entries.</p>'}</div></div>`}function printChangeLog(){const rows=combinedChangeLog().slice(0,500);const html=`<html><head><title>PWADC Change Log</title><style>body{font-family:Arial,sans-serif;padding:24px}.row{border-bottom:1px solid #ccc;padding:6px 0}.meta{font-size:12px;color:#555}</style></head><body><h1>PWADC Change Log</h1><p>${new Date().toLocaleString()}</p>${rows.map(r=>`<div class="row"><strong>${esc(r.module)} · ${esc(r.action||'')}</strong><div class="meta">${esc(r.at?new Date(r.at).toLocaleString():'')} · ${esc(r.user||'')} ${r.machine?'@ '+esc(r.machine):''}</div><div>${esc(r.detail||'')}</div></div>`).join('')}</body></html>`;const w=window.open('','_blank');w.document.write(html);w.document.close();w.print();}
function escAttr(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function renderAttendance(){if(activeAttView==='exceptions')activeAttView='patterns';const views=['daily','grid','review','patterns','audit'];const label=v=>v==='daily'?'Daily Entry':v==='grid'?'90-Day Grid':v==='review'?'Attendance Review':v==='patterns'?'Patterns':'Audit Log';return `<div class="page-head"><div><div class="page-title">Attendance</div><div class="page-sub">Fast daily entry, 90-day grid, attendance review, pattern detection, shared JSON autosave</div></div><div><button onclick="document.getElementById('attendanceImportFile').click()">Import JSON</button> <button onclick="reloadPackagedAttendanceData()">Use Packaged Latest JSON</button> <button onclick="createAttendanceBackup()">Backup Now</button> <button onclick="exportAttendanceCSV()">Export CSV</button><input id="attendanceImportFile" type="file" accept=".json,application/json" class="hidden" onchange="importAttendanceJSON(this)"></div></div><div class="subnav">${views.map(v=>`<button class="${activeAttView===v?'active':''}" onclick="activeAttView='${v}';safeRenderPages()">${label(v)}</button>`).join('')}</div>${activeAttView==='daily'?renderDaily():activeAttView==='grid'?renderGrid():activeAttView==='review'?renderAttendanceReview():activeAttView==='patterns'?renderPatterns():renderAudit()}`}
function shiftRank(shift){let i=SHIFT_ORDER.indexOf(shift||'');return i>=0?i:99}function sortedEmployees(){return activeAttendanceEmployees().slice().sort((a,b)=>shiftRank(a.shift)-shiftRank(b.shift)||(a.shift||'').localeCompare(b.shift||'')||(a.name||'').localeCompare(b.name||''))}function currentRows(){let rows=sortedEmployees();if(entryShift!=='All')rows=rows.filter(e=>e.shift===entryShift);if(showBlanks)rows=rows.filter(e=>!getCode(e.id,entryDate));return rows}function groupRowsByShift(rows){const groups=[];const map={};for(const e of rows){const sh=e.shift||'Unassigned';if(!map[sh]){map[sh]=[];groups.push({shift:sh,rows:map[sh]});}map[sh].push(e);}groups.sort((a,b)=>shiftRank(a.shift)-shiftRank(b.shift)||a.shift.localeCompare(b.shift));return groups}function dailyCounts(rows){const dow=parseISO(entryDate).getDay();let entered=0,blank=0,rdo=0;for(const e of rows){if((e.rdos||[]).includes(dow))rdo++;if(getCode(e.id,entryDate))entered++;else blank++;}return{entered,blank,rdo,total:rows.length}}function autoFillRdosForDate(date){let changed=0;const dow=parseISO(date).getDay();for(const e of activeAttendanceEmployees()){if((e.rdos||[]).includes(dow)&&!getCode(e.id,date)){attendance.attendance[e.id]=attendance.attendance[e.id]||{};attendance.attendance[e.id][date]='O';changed++;}}if(changed){audit('RDO auto-filled',changed+' blank RDO(s) set to O for '+date);saveAttendance('rdo-auto');}}
function empOpenFlags(empId){return computeFlags().filter(f=>String(f.emp.id)===String(empId)&&!f.addressed)}function patternKey(empId,type,periodKey){return `pattern|${empId}|${type}|${periodKey}`}function empOpenPatterns(empId){return attendancePatternFindings({includeAcknowledged:false}).filter(p=>String(p.emp.id)===String(empId))}function empThresholdClass(empId){const fs=empOpenPatterns(empId);if(!fs.length)return '';return fs.some(f=>f.sev==='critical')?'threshold-hit':'threshold-high'}function thresholdBadge(empId){const fs=empOpenPatterns(empId);if(!fs.length)return '';const crit=fs.some(f=>f.sev==='critical');return `<span class="threshold-pill ${crit?'':'high'}" title="${esc(fs.map(f=>f.msg).join(' | '))}">${crit?'Threshold':'Review'} ${fs.length}</span>`}function getPatternDates(){let arr=[];for(let d=addDays(gridEnd,-89);d<=gridEnd;d=addDays(d,1))arr.push(d);return arr}function acknowledgedDisciplineDateSet(empId){const set=new Set();const actions=attendance.patternActions||{};for(const a of Object.values(actions)){if(!a||String(a.empId)!==String(empId))continue;(a.dates||[]).forEach(it=>{if(it&&it.date)set.add(it.date);else if(typeof it==='string')set.add(it)})}return set}function acknowledgedPatternsList(){return Object.entries(attendance.patternActions||{}).map(([key,a])=>({key,...a})).sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')))}function attendancePatternFindings(opts={}){const dates=getPatternDates(),s=attendance.settings||{},items=[];for(const e of activeAttendanceEmployees()){const resetDates=acknowledgedDisciplineDateSet(e.id);const disc=[],week={},month={},dow={};for(const d of dates){if(resetDates.has(d))continue;const c=getCode(e.id,d);if(!DISCIPLINE_CODES.has(c))continue;const dt=parseISO(d),wk=weekKey(dt),mo=d.slice(0,7),day=DAYS[dt.getDay()];const item={date:d,code:c};disc.push(item);if(c==='T'){(week[wk]=week[wk]||[]).push(item);(month[mo]=month[mo]||[]).push(item);(dow[day]=dow[day]||[]).push(item)}}const add=(type,sev,sort,msg,periodKey,arr)=>{const key=patternKey(e.id,type,periodKey);items.push({emp:e,type,sev,sort,msg,periodKey,dates:arr,key,acknowledged:false,action:null})};if(disc.length>=(s.rollingThreshold||6))add('90-Day Discipline','critical',0,`${disc.length} open T/U/UE occurrence(s) in the rolling 90-day window`,`rolling-${dates[0]}-${dates[dates.length-1]}`,disc);else if(disc.length>=4)add('90-Day Discipline','high',1,`${disc.length} open T/U/UE occurrence(s) in the rolling 90-day window`,`rolling-${dates[0]}-${dates[dates.length-1]}`,disc);for(const [k,v] of Object.entries(week))if(v.length>=(s.weekThreshold||3))add('Weekly Tardy Pattern','high',2,`${v.length} open tardy occurrence(s) in week of ${k}`,k,v);for(const [k,v] of Object.entries(month))if(v.length>=(s.monthThreshold||5))add('Monthly Tardy Pattern','high',3,`${v.length} open tardy occurrence(s) in ${k}`,k,v);for(const [k,v] of Object.entries(dow))if(v.length>=(s.patternThreshold||3))add('Day-of-Week Pattern','medium',4,`${v.length} open tardy occurrence(s) on ${k}s`,k,v);}return items.sort((a,b)=>a.sort-b.sort||a.emp.name.localeCompare(b.emp.name)||a.type.localeCompare(b.type))}
function renderDaily(){autoFillRdosForDate(entryDate);const shifts=['All',...SHIFT_ORDER.filter(sh=>activeAttendanceEmployees().some(e=>e.shift===sh)),...Array.from(new Set(activeAttendanceEmployees().map(e=>e.shift).filter(Boolean))).filter(sh=>!SHIFT_ORDER.includes(sh))];const rows=currentRows();const counts=dailyCounts(rows);const groups=groupRowsByShift(rows);return `<div class="card"><div class="card-title">Daily Entry Command Pad</div><div class="toolbar"><div><label>Date</label><input type="date" value="${entryDate}" onchange="entryDate=this.value;safeRenderPages()"></div><div><label>Shift</label><select onchange="entryShift=this.value;safeRenderPages()">${shifts.map(s=>`<option ${entryShift===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Mode</label><button onclick="showBlanks=!showBlanks;safeRenderPages()">${showBlanks?'Showing Blanks':'Showing All'}</button></div></div><div class="grid cols-4" style="margin-top:12px"><div class="kpi"><div class="num">${counts.entered}</div><div class="lbl">Entered</div></div><div class="kpi"><div class="num">${counts.blank}</div><div class="lbl">Blank</div></div><div class="kpi"><div class="num">${counts.rdo}</div><div class="lbl">RDO</div></div><div class="kpi"><div class="num">${counts.total}</div><div class="lbl">Rows</div></div></div><div class="code-pad" style="margin-top:14px">${CODES.map(c=>`<button class="code-btn ${activeCode===c[0]?'active':''}" title="${c[1]}" onclick="activeCode='${c[0]}';safeRenderPages()">${c[0]}</button>`).join('')}</div></div>${groups.map(g=>`<div class="card"><div class="card-title">${esc(g.shift)}</div>${g.rows.map(e=>renderDailyRow(e)).join('')}</div>`).join('')}`}
function renderDailyRow(e){const code=getCode(e.id,entryDate),flags=empOpenPatterns(e.id);return `<div class="person-row"><div><strong>${esc(e.name)}</strong> ${thresholdBadge(e.id)}<br><span class="mini-note">${esc(e.title||'')} · ${esc(e.shift||'')}</span></div><div class="row-code-pad">${CODES.map(c=>`<button class="row-code-btn ${code===c[0]?'active':''} ${code===c[0]?'gold':''}" onclick="setCode('${esc(e.id)}','${entryDate}','${c[0]}');safeRenderPages({preserveScroll:true})">${c[0]}</button>`).join('')}<button class="row-code-btn danger" onclick="setCode('${esc(e.id)}','${entryDate}','');safeRenderPages({preserveScroll:true})">Clear</button></div><div class="row-status">${code?`<span class="badge ${code}">${code}</span>`:'<span class="muted">Blank</span>'}</div><div>${flags.length?`<button class="sm danger" onclick="activeAttView='patterns';selectedPatternEmpId='${esc(e.id)}';safeRenderPages()">${flags.length} Pattern</button>`:''}</div></div>`}
function renderGrid(){let dates=[];for(let d=addDays(gridEnd,-89);d<=gridEnd;d=addDays(d,1))dates.push(d);const rows=currentRows();return `<div class="card"><div class="card-title">90-Day Grid</div><div class="toolbar"><div><label>Ending Date</label><input type="date" value="${gridEnd}" onchange="gridEnd=this.value;safeRenderPages()"></div><div><label>Shift</label><select onchange="entryShift=this.value;safeRenderPages()"><option>All</option>${SHIFT_ORDER.map(s=>`<option ${entryShift===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="code-pad">${CODES.map(c=>`<button class="code-btn ${activeCode===c[0]?'active':''}" onclick="activeCode='${c[0]}';safeRenderPages()">${c[0]}</button>`).join('')}</div></div></div><div class="grid-scroll"><table class="grid-table"><thead><tr><th class="name">Employee</th>${dates.map(d=>`<th>${parseISO(d).getMonth()+1}/${parseISO(d).getDate()}</th>`).join('')}</tr></thead><tbody>${rows.map(e=>`<tr><td class="name"><strong>${esc(e.name)}</strong><br><small>${esc(e.shift)}</small></td>${dates.map(d=>{let c=getCode(e.id,d);return `<td class="${selectedGridEmpId===e.id&&selectedGridDate===d?'selected-cell':''}" onclick="selectedGridEmpId='${esc(e.id)}';selectedGridDate='${d}';setCode('${esc(e.id)}','${d}',activeCode);safeRenderPages({preserveScroll:true})">${c?`<span class="badge ${c}">${c}</span>`:''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function computeFlags(){const dates=getPatternDates(),flags=[];for(const e of activeAttendanceEmployees()){const arr=dates.map(d=>({date:d,code:getCode(e.id,d)})).filter(x=>OCC_CODES.has(x.code));if(arr.length>=(attendance.settings.rollingThreshold||6))flags.push({key:`roll|${e.id}|${dates[0]}|${dates.at(-1)}`,emp:e,type:'90-Day Occurrences',sev:'critical',msg:`${arr.length} T/U/UE occurrence(s) in 90 days`,periodKey:`${dates[0]} - ${dates.at(-1)}`,issueDates:arr,addressed:!!attendance.flagActions[`roll|${e.id}|${dates[0]}|${dates.at(-1)}`],action:attendance.flagActions[`roll|${e.id}|${dates[0]}|${dates.at(-1)}`]});let byWeek={},byMonth={},byDow={};for(const it of arr.filter(x=>x.code==='T')){let dt=parseISO(it.date);(byWeek[weekKey(dt)]=byWeek[weekKey(dt)]||[]).push(it);(byMonth[it.date.slice(0,7)]=byMonth[it.date.slice(0,7)]||[]).push(it);let day=DAYS[dt.getDay()];(byDow[day]=byDow[day]||[]).push(it)}for(const [k,v] of Object.entries(byWeek))if(v.length>=(attendance.settings.weekThreshold||3)){let key=`week|${e.id}|${k}`;flags.push({key,emp:e,type:'Weekly Tardy Pattern',sev:'high',msg:`${v.length} tardies in week ${k}`,periodKey:k,issueDates:v,addressed:!!attendance.flagActions[key],action:attendance.flagActions[key]})}for(const [k,v] of Object.entries(byMonth))if(v.length>=(attendance.settings.monthThreshold||5)){let key=`month|${e.id}|${k}`;flags.push({key,emp:e,type:'Monthly Tardy Pattern',sev:'high',msg:`${v.length} tardies in ${k}`,periodKey:k,issueDates:v,addressed:!!attendance.flagActions[key],action:attendance.flagActions[key]})}for(const [k,v] of Object.entries(byDow))if(v.length>=(attendance.settings.patternThreshold||3)){let key=`dow|${e.id}|${k}`;flags.push({key,emp:e,type:'Day-of-Week Pattern',sev:'medium',msg:`${v.length} tardies on ${k}s`,periodKey:k,issueDates:v,addressed:!!attendance.flagActions[key],action:attendance.flagActions[key]})}}return flags.sort((a,b)=>(a.addressed-b.addressed)||({critical:0,high:1,medium:2}[a.sev]-{critical:0,high:1,medium:2}[b.sev])||a.emp.name.localeCompare(b.emp.name))}
function attendancePeriodStats(emp){const dates=getPatternDates();const now=parseISO(gridEnd);const wk=weekKey(now),mo=gridEnd.slice(0,7),out={week:{},month:{},rolling:{},dates:{}};for(const d of dates){const c=getCode(emp.id,d);if(!c)continue;out.dates[c]=out.dates[c]||[];out.dates[c].push(d);out.rolling[c]=(out.rolling[c]||0)+1;if(weekKey(parseISO(d))===wk)out.week[c]=(out.week[c]||0)+1;if(d.slice(0,7)===mo)out.month[c]=(out.month[c]||0)+1}return out}function codeCount(stats,period,code){return (stats[period]&&stats[period][code])||0}function codeDateList(stats,code){return (stats.dates&&stats.dates[code])||[]}function codeCountExceeded(stats,period,code){const n=codeCount(stats,period,code);if(!n)return false;const s=attendance.settings||{};if(code==='U'||code==='UE')return n>0;if(code==='T'){if(period==='week')return n>=(s.weekThreshold||3);if(period==='month')return n>=(s.monthThreshold||5);if(period==='rolling')return n>=(s.rollingThreshold||6)}return false}function codeCountCells(stats,period,codes){return codes.map(c=>{const n=codeCount(stats,period,c);const hit=codeCountExceeded(stats,period,c);return `<td class="${hit?'threshold-number':''}"><span class="badge ${esc(c)}" title="${esc(codeLabel(c))}">${esc(c)}</span><br><strong>${n}</strong></td>`}).join('')}function periodCodeTotal(stats,period,codes){return codes.reduce((n,c)=>n+codeCount(stats,period,c),0)}function categoryCodeTotal(stats,codes){return codes.reduce((n,c)=>n+codeDateList(stats,c).length,0)}function attendanceReviewCategoryRows(stats,codes){return codes.map(c=>{const dates=codeDateList(stats,c);return `<details class="bucket att-review-code"><summary><span class="badge ${esc(c)}">${esc(c)}</span><span><strong>${esc(codeLabel(c))}</strong><br><small>Week ${codeCount(stats,'week',c)} · Month ${codeCount(stats,'month',c)} · 90-Day ${codeCount(stats,'rolling',c)}</small></span><span class="chip">${dates.length} date(s)</span></summary><div class="bucket-body">${dates.length?dates.map(d=>`<span class="chip">${fmt(d)}</span>`).join(' '):'<span class="muted">No dates in selected 90-day window.</span>'}</div></details>`}).join('')}
function renderAttendanceReview(){const rows=currentRows().map(emp=>({emp,stats:attendancePeriodStats(emp)}));const disc=['T','U','UE'],track=['AL','V','E','LE'];const shifts=['All',...SHIFT_ORDER.filter(sh=>activeAttendanceEmployees().some(e=>e.shift===sh)),...Array.from(new Set(activeAttendanceEmployees().map(e=>e.shift).filter(Boolean))).filter(sh=>!SHIFT_ORDER.includes(sh))];const secondHeader=['week','week','month','month','rolling','rolling'].map((p,i)=>i%2===0?disc.map(c=>`<th>${c}</th>`).join(''):track.map(c=>`<th>${c}</th>`).join('')).join('');return `<div class="card"><div class="card-title">Attendance Review</div><div class="notice">Approved codes are tracked but do not create exceptions: AL, V, E, LE. Discipline-review codes are T, U, and UE. Counts that meet or exceed the discipline threshold are highlighted.</div><div class="toolbar"><div><label>Shift</label><select onchange="entryShift=this.value;safeRenderPages()">${shifts.map(s=>`<option ${entryShift===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>90-Day Ending Date</label><input type="date" value="${gridEnd}" onchange="gridEnd=this.value;safeRenderPages()"></div></div></div><div class="table-wrap"><table><thead><tr><th class="name">Employee</th><th colspan="3">Week Discipline</th><th colspan="4">Week Approved</th><th colspan="3">Month Discipline</th><th colspan="4">Month Approved</th><th colspan="3">90-Day Discipline</th><th colspan="4">90-Day Approved</th><th>Action</th></tr><tr><th class="name"></th>${secondHeader}<th></th></tr></thead><tbody>${rows.map(r=>`<tr class="${empThresholdClass(r.emp.id)}"><td class="name"><details><summary><strong>${esc(r.emp.name)}</strong> ${thresholdBadge(r.emp.id)}<br><small>${esc(r.emp.shift)} · ${esc(r.emp.title||'')}</small></summary><div style="margin-top:8px">${renderAttendanceCodeDates(r.stats)}</div></details></td>${codeCountCells(r.stats,'week',disc)}${codeCountCells(r.stats,'week',track)}${codeCountCells(r.stats,'month',disc)}${codeCountCells(r.stats,'month',track)}${codeCountCells(r.stats,'rolling',disc)}${codeCountCells(r.stats,'rolling',track)}<td><button class="sm gold" onclick="openAttendanceNoticeModal('${esc(r.emp.id)}')">Create Notice</button></td></tr>`).join('')}</tbody></table></div>`}function renderAttendanceCodeDates(stats){const groups=[['Discipline Review',['T','U','UE']],['Approved Tracking',['AL','V','E','LE']],['Neutral / Schedule',['P','O','FL','NE']]];return groups.map(([title,codes])=>`<details class="bucket"><summary><strong>${esc(title)}</strong><span class="chip">${categoryCodeTotal(stats,codes)} total</span></summary><div class="bucket-body">${attendanceReviewCategoryRows(stats,codes)}</div></details>`).join('')}
function openAttendanceNoticeModal(empId){const emp=(attendance.employees||[]).find(e=>String(e.id)===String(empId));if(!emp){toast('Employee not found');return}const today=new Date().toISOString().slice(0,10);showModal(`<div class="modal-head"><div class="modal-title">Create Attendance Notice</div><button onclick="closeModal()">Close</button></div><div class="notice"><strong>${esc(emp.name)}</strong><br>${esc(emp.title||'Security Officer')} · ${esc(emp.shift||'')}</div><div class="form-grid"><div><label>Date</label><input id="noticeDate" type="date" value="${today}"></div><div><label>Subject</label><select id="noticeSubject"><option>Warning</option><option>Final Warning</option></select></div><div><label>Notice Level</label><select id="noticeLevel"><option value="Written Warning">Written Warning</option><option value="Final Written Warning">Final Written Warning</option></select></div><div><label>Title Under Name</label><input id="noticeTitle" value="${esc(emp.title||'Security Officer')}"></div><div class="full"><label>Issue Text</label><textarea id="noticeIssueText" rows="3">continued attendance issues are unacceptable and must not reoccur.</textarea></div></div><div class="modal-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="printAttendanceNotice('${esc(emp.id)}')">Preview / Print Notice</button></div>`) }
function printAttendanceNotice(empId){const emp=(attendance.employees||[]).find(e=>String(e.id)===String(empId));if(!emp)return;const date=val('noticeDate')||new Date().toISOString().slice(0,10);const subj=val('noticeSubject')||'Warning';const level=val('noticeLevel')||'Written Warning';const title=val('noticeTitle')||emp.title||'Security Officer';const issue=val('noticeIssueText')||'continued attendance issues are unacceptable and must not reoccur.';const dt=new Date(date+'T00:00:00');const dateShort=dt.toLocaleDateString(undefined,{month:'numeric',day:'numeric',year:'2-digit'});const dateLong=dt.toLocaleDateString(undefined,{month:'numeric',day:'numeric',year:'numeric'});const html=`<!doctype html><html><head><title>Confirming Notice - ${esc(emp.name)}</title><style>*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff;margin:0;font-size:21px}.page{width:10.4in;min-height:7.7in;margin:.2in auto;padding:.18in .25in}.logo-wrap{text-align:center;margin:0 0 2px}.logo-box{display:inline-block;border:1px solid #ddd;padding:3px 14px 1px;background:#fff}.logo-main{font-size:30px;line-height:28px;font-weight:900;color:#c0272d;letter-spacing:.3px;text-transform:lowercase}.logo-tag{font-size:10px;color:#9d7426;font-weight:bold}.title{text-align:center;font-size:28px;font-weight:900;margin:0 0 24px}.info{display:grid;grid-template-columns:140px 1fr;column-gap:10px;row-gap:18px;margin-top:6px}.lbl{font-weight:900}.to-block{line-height:1.05}.subj{text-decoration:underline;font-weight:900}.rule{border-top:2px solid #222;margin:16px 0 18px}.body{font-size:21px;line-height:1.15;margin:0 0 30px;text-align:left}.sig{display:grid;grid-template-columns:1fr 1fr;gap:2.05in;margin-top:34px}.sigline{border-top:2px solid #333;height:24px;display:flex;justify-content:space-between;align-items:flex-start;padding-top:2px}.comments{border:1px solid #444;height:1.9in;margin-top:.75in;padding:5px 10px;font-size:20px}.printbar{text-align:center;margin:12px}@media print{.printbar{display:none}.page{margin:0;padding:.18in .25in}body{font-size:21px}}</style></head><body><div class="page"><div class="logo-wrap"><div class="logo-box"><div class="logo-main">piggly<br>wiggly</div><div class="logo-tag">Down Home. Down The Street.</div></div></div><div class="title">Confirming Notice</div><div class="info"><div class="lbl">Date:</div><div>${esc(dateShort)}</div><div class="lbl">To:</div><div class="to-block">${esc(emp.name)}<br>${esc(title)} ${esc(dateLong)}</div><div class="lbl">From:</div><div>David MacBain</div><div class="lbl">Subj:</div><div class="subj">${esc(subj)}</div></div><div class="rule"></div><div class="body">This is to confirm the conversation of today during which it was communicated that your<br> ${esc(issue)}<br><br>This Confirming Notice serves as a <strong>${esc(level)}</strong>.</div><div class="sig"><div class="sigline"><span>${esc(emp.name)}</span><span>Date</span></div><div class="sigline"><span>David MacBain</span><span>Date</span></div></div><div class="comments">Employee Comments:</div></div><div class="printbar"><button onclick="window.print()">Print</button></div></body></html>`;const w=window.open('','_blank');if(!w){toast('Popup blocked. Allow popups or use browser print.');return}w.document.open();w.document.write(html);w.document.close();audit('Attendance notice generated',emp.name+' · '+subj+' · '+level);saveAttendance()}
function buildBuckets(flags){const order=['T','AL','LE','E','U','UE','V','GEN'],map={};for(const f of flags){for(const it of (f.issueDates&&f.issueDates.length?f.issueDates:[{code:'GEN',date:f.periodKey}])){const code=order.includes(it.code)?it.code:'GEN';map[code]=map[code]||{code,dates:{},flags:[]};if(it.date)map[code].dates[it.date]=true;if(!map[code].flags.some(x=>x.key===f.key))map[code].flags.push(f)}}return Object.values(map).sort((a,b)=>order.indexOf(a.code)-order.indexOf(b.code)).map(b=>({...b,dateList:Object.keys(b.dates).sort((a,b)=>b.localeCompare(a))}))}
function renderExceptions(){const flags=computeFlags();const open=flags.filter(f=>!f.addressed);let groups={};for(const f of flags){groups[f.emp.id]=groups[f.emp.id]||{emp:f.emp,flags:[]};groups[f.emp.id].flags.push(f)}let list=Object.values(groups).sort((a,b)=>b.flags.filter(f=>!f.addressed).length-a.flags.filter(f=>!f.addressed).length||a.emp.name.localeCompare(b.emp.name));return `<div class="grid cols-3"><div class="kpi"><div class="num">${open.filter(f=>f.sev==='critical').length}</div><div class="lbl">Critical Open</div></div><div class="kpi"><div class="num">${open.filter(f=>f.sev==='high').length}</div><div class="lbl">High Open</div></div><div class="kpi"><div class="num">${open.length}</div><div class="lbl">Total Open</div></div></div><div class="notice">Grouped by person, then code bucket. Clear individual rule, clear code, or clear person.</div><br>${list.map(renderFlagGroup).join('')||'<div class="card"><div class="card-title">No Exceptions</div>No exceptions found.</div>'}`}
function renderFlagGroup(g){const open=g.flags.filter(f=>!f.addressed),buckets=buildBuckets(g.flags);const critical=g.flags.filter(f=>f.sev==='critical'&&!f.addressed).length;return `<details class="flag-person-details"><summary><div class="flag-person"><strong>${esc(g.emp.name)}</strong><span>${esc(g.emp.shift)} · ${esc(g.emp.title)}</span></div><div>${open.length?`<span class="chip">${open.length} Open</span>`:''}${critical?'<span class="chip critical">Critical</span>':''}<span class="chip">${buckets.length} Code Bucket(s)</span></div><div>${open.length?`<button data-clear-person="${esc(g.emp.id)}">Clear Person</button>`:''}</div></summary><div class="flag-person-detail-body">${buckets.map(b=>renderBucket(g.emp,b)).join('')}</div></details>`}
function renderBucket(emp,b){const open=b.flags.filter(f=>!f.addressed);return `<details class="bucket"><summary><span class="badge ${esc(b.code)}">${esc(b.code)}</span><span>${esc(codeLabel(b.code))}<br><small>${esc(b.dateList.slice(0,8).map(fmt).join(', '))}${b.dateList.length>8?' ...':''}</small></span><span class="chip">${b.dateList.length} dates</span><span>${open.length?`<button class="sm" data-clear-code-emp="${esc(emp.id)}" data-clear-code="${esc(b.code)}">Clear ${esc(b.code)}</button>`:''}</span></summary><div class="bucket-body">${b.flags.map(renderExceptionCard).join('')}</div></details>`}function codeLabel(c){return CODES.find(x=>x[0]===c)?.[1]||'General'}function renderExceptionCard(f){return `<div class="exception-card ${f.sev} ${f.addressed?'addressed':''}"><div><div class="sev ${f.sev}">${f.sev}</div><span class="chip">${esc(f.type)}</span></div><div>${esc(f.msg)}<br><small>Issue Dates: ${esc(issueDateLabel(f.issueDates))}</small>${f.addressed?`<br><span class="ok">${esc(f.action.actionType||'Reviewed')} · ${esc(f.action.note||'')}</span>`:''}</div><div>${f.addressed?`<button class="sm" data-reopen="${esc(f.key)}">Reopen</button>`:`<button class="sm" data-action="Coaching" data-key="${esc(f.key)}">Coaching</button> <button class="sm" data-action="Verbal Warning" data-key="${esc(f.key)}">Verbal</button> <button class="sm" data-action="Written Warning" data-key="${esc(f.key)}">Written</button> <button class="sm" data-action="Final Warning" data-key="${esc(f.key)}">Final</button>`}</div></div>`}
function clearKeys(keys,actionType,note){const stamp=new Date().toISOString();for(const k of keys)attendance.flagActions[k]={at:stamp,actionType,note};audit('Flags cleared',`${keys.length} flag(s) · ${actionType}`);saveAttendance();safeRenderPages()}document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b){let note=prompt('Supervisor note:',b.dataset.action+' completed');if(note!==null)clearKeys([b.dataset.key],b.dataset.action,note||b.dataset.action);return}b=e.target.closest('[data-reopen]');if(b){delete attendance.flagActions[b.dataset.reopen];saveAttendance();safeRenderPages();return}b=e.target.closest('[data-clear-person]');if(b){let fs=computeFlags().filter(f=>f.emp.id===b.dataset.clearPerson&&!f.addressed);let note=prompt('Clear all open exceptions for this person:', 'Reviewed / cleared');if(note!==null)clearKeys(fs.map(f=>f.key),'Reviewed / Cleared',note);return}b=e.target.closest('[data-clear-code]');if(b){let fs=computeFlags().filter(f=>f.emp.id===b.dataset.clearCodeEmp&&!f.addressed&&f.issueDates.some(it=>it.code===b.dataset.clearCode));let note=prompt('Clear '+b.dataset.clearCode+' exceptions:', 'Reviewed / cleared');if(note!==null)clearKeys(fs.map(f=>f.key),'Reviewed / Cleared',note);return}});

function renderPatterns(){const findings=attendancePatternFindings({includeAcknowledged:false}),selected=selectedPatternEmpId;const byEmp={};for(const f of findings){byEmp[f.emp.id]=byEmp[f.emp.id]||{emp:f.emp,items:[]};byEmp[f.emp.id].items.push(f)}const groups=Object.values(byEmp).sort((a,b)=>a.emp.name.localeCompare(b.emp.name));const chosen=groups.find(g=>String(g.emp.id)===String(selected));return `<div class="grid cols-3"><div class="kpi"><div class="num">${findings.filter(f=>f.sev==='critical').length}</div><div class="lbl">Critical Patterns</div></div><div class="kpi"><div class="num">${findings.filter(f=>f.sev==='high').length}</div><div class="lbl">High Patterns</div></div><div class="kpi"><div class="num">${findings.length}</div><div class="lbl">Open Patterns</div></div></div><div class="notice">Pattern screen only groups by person. Select one person tile to open detail. Acknowledge pattern hides the reviewed dates until a new pattern is created.</div><br><div class="grid cols-3">${groups.map(g=>`<div class="card ${selected===g.emp.id?'selected-cell':''}" onclick="selectedPatternEmpId='${esc(g.emp.id)}';safeRenderPages()"><div class="card-title">${esc(g.emp.name)}</div><p>${esc(g.emp.shift)} · ${esc(g.emp.title||'')}</p><p><span class="chip">${g.items.length} open pattern(s)</span></p></div>`).join('')||'<div class="card"><div class="card-title">No Open Patterns</div><p>No discipline-review patterns found.</p></div>'}</div>${chosen?renderSinglePatternDetail(chosen):''}${renderAcknowledgedPatternsPanel()}`}
