<title>PWADC Security Operations Suite v2.1</title>
<style>
:root{--red:#C0272D;--red2:#e03840;--gold:#C6B273;--gold2:#ddce91;--bg:#1e2330;--surface:#28303f;--surface2:#313b4d;--surface3:#3d4a5e;--border:#404d62;--text:#eef0f4;--muted:#8a96a8;--dim:#c4cad5;--green:#4caf6e;--blue:#4a90d9;--orange:#e08a2f;--purple:#a06ede;--danger:#ff7676;--shadow:0 12px 30px rgba(0,0,0,.28);--radius:10px}
:root[data-theme="light"]{--bg:#f3f2ef;--surface:#fff;--surface2:#f2f4f7;--surface3:#e3e7ed;--border:#d7dce5;--text:#1d2430;--muted:#697386;--dim:#303848;--shadow:0 8px 22px rgba(20,30,45,.11)}
@media(prefers-color-scheme:light){:root[data-theme="auto"]{--bg:#f3f2ef;--surface:#fff;--surface2:#f2f4f7;--surface3:#e3e7ed;--border:#d7dce5;--text:#1d2430;--muted:#697386;--dim:#303848;--shadow:0 8px 22px rgba(20,30,45,.11)}}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:6px;padding:8px 13px;font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;cursor:pointer;transition:.15s}button:hover{background:var(--surface2);color:var(--text);border-color:var(--muted)}button.primary{background:var(--red);border-color:var(--red);color:#fff}button.primary:hover{background:var(--red2)}button.gold{background:var(--gold);border-color:var(--gold);color:#1e2330}button.danger{border-color:var(--danger);color:var(--danger)}button.sm{padding:5px 9px;font-size:11px}input,select,textarea{width:100%;border:1px solid var(--border);background:var(--surface2);border-radius:6px;padding:8px 10px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(198,178,115,.18)}label{display:block;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px}.hidden{display:none!important}
.lock-screen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:grid;place-items:center}.lock-card{width:min(390px,92vw);background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--red);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px;text-align:center}.suite-title{font-size:22px;font-weight:900;color:var(--gold);letter-spacing:1.2px;text-transform:uppercase}.suite-sub{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:4px}.pin-row{display:flex;gap:10px;justify-content:center;margin:22px 0}.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border)}.pin-dot.on{background:var(--gold);border-color:var(--gold)}.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pin-pad button{font-size:18px;padding:14px;color:var(--text)}.pin-error{min-height:18px;color:var(--danger);font-size:13px;margin-top:12px}
.topbar{height:58px;background:var(--surface);border-bottom:3px solid var(--red);display:flex;align-items:center;gap:16px;padding:0 18px;position:sticky;top:0;z-index:100}.brand{min-width:255px}.brand strong{display:block;color:var(--gold);font-weight:900;letter-spacing:1.2px;text-transform:uppercase}.brand span{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;text-transform:uppercase}.nav{display:flex;gap:4px;flex:1;overflow-x:auto}.nav button{border-color:transparent}.nav button.active{background:var(--surface2);color:var(--gold);border-color:var(--border)}.status{text-align:right;font-size:11px;color:var(--muted);border-left:1px solid var(--border);padding-left:14px;white-space:nowrap}.wrap{max-width:1600px;margin:0 auto;padding:22px}.page{display:none}.page.active{display:block}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}.page-title{font-size:28px;color:var(--gold);font-weight:900;letter-spacing:1px;text-transform:uppercase}.page-sub{font-size:12px;color:var(--muted);margin-top:3px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;position:relative;overflow:hidden}.card:before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--red)}.card-title{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--gold);font-weight:900;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:14px}.grid{display:grid;gap:14px}.grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.grid.cols-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden}.kpi:before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--gold)}.kpi .num{font-size:32px;font-weight:900}.kpi .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px}.module-card{cursor:pointer;transition:.15s}.module-card:hover{transform:translateY(-2px);border-color:var(--gold)}.module-card h3{color:var(--gold);font-size:18px;margin-bottom:8px}.module-card p{color:var(--dim);font-size:13px;line-height:1.45}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:12px}.toolbar>div{min-width:160px}.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.subnav button.active{background:var(--gold);color:#1e2330;border-color:var(--gold)}.quick-codes{display:flex;gap:8px;flex-wrap:wrap}.code-btn{min-width:52px;padding:10px 12px;border-width:2px}.code-btn.active{background:var(--gold);border-color:var(--gold);color:#1e2330}.people-list{display:grid;gap:8px}.person-row{display:grid;grid-template-columns:minmax(230px,1fr) 110px 90px 110px 120px;gap:10px;align-items:center;border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:10px;cursor:pointer}.person-row:hover{border-color:var(--gold)}.person-name strong{display:block}.person-name span{display:block;color:var(--muted);font-size:12px}.badge{display:inline-flex;align-items:center;justify-content:center;min-width:34px;border:1px solid var(--border);border-radius:5px;padding:3px 8px;font-weight:900;color:var(--gold);background:var(--surface)}.badge.P{color:#8ae0a0}.badge.T,.badge.LE{color:#e0a35e}.badge.U,.badge.UE{color:#ff8a8a}.badge.E,.badge.FL{color:#c2a0e0}.badge.O,.badge.NE{color:var(--muted)}.badge.V{color:#8ed8e0}.badge.AL,.badge.AE{color:#8abce0}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px;max-height:72vh}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);text-align:center;white-space:nowrap}th{position:sticky;top:0;background:var(--surface2);color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:1px;z-index:2}td.name,th.name{position:sticky;left:0;text-align:left;min-width:220px;background:var(--surface);z-index:3}.weekend{background:#202636}.today{outline:2px solid var(--gold);outline-offset:-2px}.flag-group{border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden;margin-bottom:12px}.flag-head{display:grid;grid-template-columns:minmax(230px,1fr) auto auto;gap:12px;align-items:center;background:var(--surface2);padding:12px 14px;border-bottom:1px solid var(--border)}.flag-person strong{display:block;color:var(--gold);text-transform:uppercase}.flag-person span{display:block;color:var(--muted);font-size:12px}.chip{display:inline-flex;gap:5px;border:1px solid var(--border);background:var(--surface3);border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--dim);margin:2px}.chip.critical{color:#ffb3b3;background:#3a2020}.chip.high{color:#ffd09a;background:#3a3020}.chip.medium{color:#eadc9b;background:#37301d}.bucket{margin:10px;border:1px solid var(--border);border-radius:8px;overflow:hidden}.bucket summary{cursor:pointer;background:var(--surface2);padding:10px 12px;display:grid;grid-template-columns:70px 1fr auto auto;gap:10px;align-items:center;list-style:none}.bucket summary::-webkit-details-marker{display:none}.bucket-body{padding:10px}.exception-card{display:grid;grid-template-columns:105px minmax(280px,1fr) auto;gap:12px;border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--surface2)}.exception-card.critical{border-left-color:#ff7676}.exception-card.high{border-left-color:var(--orange)}.exception-card.medium{border-left-color:var(--gold)}.exception-card.addressed{opacity:.65;border-left-color:var(--green)}.sev{text-transform:uppercase;font-weight:900}.sev.critical{color:#ff7676}.sev.high{color:var(--orange)}.sev.medium{color:var(--gold)}.settings-panel{position:fixed;right:0;top:0;bottom:0;width:min(520px,96vw);background:var(--surface);border-left:1px solid var(--border);z-index:1000;box-shadow:var(--shadow);transform:translateX(105%);transition:.2s;overflow:auto}.settings-panel.open{transform:translateX(0)}.settings-head{display:flex;justify-content:space-between;align-items:center;padding:18px;border-bottom:3px solid var(--red)}.settings-body{padding:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}.health-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);padding:8px 0}.ok{color:#8ae0a0}.bad{color:#ff8a8a}.toast{position:fixed;right:22px;bottom:22px;z-index:2000;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--green);border-radius:7px;padding:12px 16px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.notice{border-left:4px solid var(--blue);background:var(--surface2);padding:12px;border-radius:7px;color:var(--dim);line-height:1.45}.warn{border-left-color:var(--orange)}@media(max-width:900px){.topbar{height:auto;min-height:58px;flex-wrap:wrap;padding:10px}.brand{min-width:100%}.status{display:none}.person-row,.exception-card,.flag-head,.bucket summary{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="lockScreen" class="lock-screen"><div class="lock-card"><div class="suite-title">PWADC Security Operations</div><div class="suite-sub">Command Suite v2.1</div><p style="color:var(--muted);margin-top:18px">Enter global PIN</p><div class="pin-row" id="pinDots"></div><div class="pin-pad" id="pinPad"></div><div class="pin-error" id="pinError"></div></div></div>
<div id="app" class="hidden"><div class="topbar"><div class="brand"><strong>PWADC Security Operations</strong><span>Command Suite v2.1</span></div><div class="nav" id="nav"></div><div class="status"><div id="moduleStatus">Loading</div><div id="saveStatus">Initializing...</div></div><button onclick="openSettings()">Settings</button><button class="gold" onclick="lockSuite()">Lock</button></div><main class="wrap" id="pages"></main></div>
<aside class="settings-panel" id="settingsPanel"><div class="settings-head"><div><strong style="color:var(--gold);text-transform:uppercase;letter-spacing:1px">Global Settings</strong><div style="font-size:11px;color:var(--muted)">Suite-wide configuration</div></div><button onclick="closeSettings()">Close</button></div><div class="settings-body" id="settingsBody"></div></aside><div class="toast" id="toast"></div>
<script>
'use strict';
const MODULES=[{id:'home',label:'Home'},{id:'attendance',label:'Attendance'},{id:'roster',label:'Roster'},{id:'badge-audit',label:'Badge Audit'},{id:'amag-audit',label:'AMAG Audit'},{id:'access-audit',label:'Access Audit'}];
const DEFAULT_SETTINGS={theme:'dark',defaultModule:'home',pin:'1234',dataRoot:'\\\\pig-fs\\Security\\Security Operations Suite',backupRetentionDays:60};
let settings={...DEFAULT_SETTINGS},env={},unlocked=false,pinInput='',activeModule='home',activeAttView='daily',activeCode='P',saveTimer=null,showBlanks=false,attendance={employees:[],attendance:{},notes:{},audit:[],flagActions:{},settings:{weekThreshold:3,monthThreshold:5,rollingThreshold:6,patternThreshold:3}};
const CODES=[['P','Present'],['T','Late'],['AL','Approved Late'],['LE','Left Early'],['UE','Unauthorized Early'],['E','Excused'],['U','Unexcused'],['V','Vacation'],['O','Off/RDO'],['FL','Protected Leave'],['NE','Not Employed']];
const PATTERN_CODES=new Set(['T','AL','LE','E','U','V','UE']);const OCC_CODES=new Set(['T','U','LE','UE']);const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let entryDate=new Date().toISOString().slice(0,10), entryShift='All', gridEnd=new Date().toISOString().slice(0,10);
const SuiteBridge={seq:0,pending:{},send(type,payload={},extra={}){return new Promise((resolve,reject)=>{const id='r'+(++this.seq);this.pending[id]={resolve,reject};if(window.chrome&&chrome.webview){chrome.webview.postMessage({id,type,payload,...extra});}else{setTimeout(()=>resolve(mockResponse(type,payload,extra)),150);}})},receive(res){const p=this.pending[res.id];if(!p)return;delete this.pending[res.id];res.ok?p.resolve(res.payload):p.reject(new Error((res.payload&&res.payload.error)||'Bridge error'));}};window.SuiteBridge=SuiteBridge;
async function mockResponse(type,payload,extra){if(type==='suite:getSettings')return{settings:{...DEFAULT_SETTINGS},environment:{user:'Preview',machine:'Browser',version:'2.1.0'}};if(type==='suite:loadModuleData'&&extra.module==='attendance'){let r=await fetch('seed/attendance-data.json');return{module:'attendance',data:await r.text()}};if(type==='suite:healthCheck')return{dataRoot:settings.dataRoot,checks:[{name:'Preview mode',ok:true,error:''},{name:'Desktop bridge unavailable in browser',ok:false,error:'Run EXE for real checks'}]};return{ok:true}}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function parseISO(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)}function toISO(d){return d.toISOString().slice(0,10)}function addDays(iso,n){const d=parseISO(iso);d.setDate(d.getDate()+n);return toISO(d)}function fmt(iso){const d=parseISO(iso);return (d.getMonth()+1)+'/'+d.getDate()}function weekKey(d){let x=new Date(d);x.setDate(x.getDate()-x.getDay());return toISO(x)}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800)}function applyTheme(){document.documentElement.setAttribute('data-theme',settings.theme||'dark')}
function renderPin(){document.getElementById('pinDots').innerHTML=Array.from({length:4},(_,i)=>`<div class="pin-dot ${pinInput.length>i?'on':''}"></div>`).join('');document.getElementById('pinPad').innerHTML=[1,2,3,4,5,6,7,8,9,'C',0,'X'].map(x=>`<button onclick="pinPress('${x}')">${x==='C'?'CLR':x==='X'?'⌫':x}</button>`).join('')}function pinPress(x){if(x==='C')pinInput='';else if(x==='X')pinInput=pinInput.slice(0,-1);else if(pinInput.length<4)pinInput+=x;renderPin();if(pinInput.length===4){if(pinInput===(settings.pin||'1234'))unlockSuite();else{document.getElementById('pinError').textContent='Invalid PIN';pinInput='';setTimeout(renderPin,250)}}}function unlockSuite(){unlocked=true;document.getElementById('lockScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');navigate(settings.defaultModule||'home')}function lockSuite(){unlocked=false;pinInput='';renderPin();document.getElementById('pinError').textContent='';document.getElementById('app').classList.add('hidden');document.getElementById('lockScreen').classList.remove('hidden')}
function normalizeSettings(x){return {...DEFAULT_SETTINGS,theme:x.theme||x.Theme||DEFAULT_SETTINGS.theme,defaultModule:x.defaultModule||x.DefaultModule||DEFAULT_SETTINGS.defaultModule,pin:x.pin||x.Pin||DEFAULT_SETTINGS.pin,dataRoot:x.dataRoot||x.DataRoot||DEFAULT_SETTINGS.dataRoot,backupRetentionDays:x.backupRetentionDays||x.BackupRetentionDays||DEFAULT_SETTINGS.backupRetentionDays}}
async function init(){try{const res=await SuiteBridge.send('suite:getSettings');settings=normalizeSettings(res.settings||{});env=res.environment||{};applyTheme();renderPin();renderShell();await loadAttendance();renderPages()}catch(e){toast('Startup error: '+e.message)}}
async function loadAttendance(){try{const res=await SuiteBridge.send('suite:loadModuleData',{}, {module:'attendance'});let raw=res.data;if(typeof raw==='string')attendance=JSON.parse(raw||'{}');else attendance=raw||{};normalizeAttendance();}catch(e){toast('Attendance load failed: '+e.message);normalizeAttendance()}}
function normalizeAttendance(){attendance.employees=Array.isArray(attendance.employees)?attendance.employees:[];attendance.attendance=attendance.attendance&&typeof attendance.attendance==='object'?attendance.attendance:{};attendance.notes=attendance.notes&&typeof attendance.notes==='object'?attendance.notes:{};attendance.audit=Array.isArray(attendance.audit)?attendance.audit:[];attendance.flagActions=attendance.flagActions&&typeof attendance.flagActions==='object'?attendance.flagActions:{};attendance.settings={weekThreshold:3,monthThreshold:5,rollingThreshold:6,patternThreshold:3,...(attendance.settings||{})}}
function saveAttendance(reason='autosave'){clearTimeout(saveTimer);document.getElementById('saveStatus').textContent='Saving...';saveTimer=setTimeout(async()=>{try{attendance.lastSaved=new Date().toISOString();await SuiteBridge.send('suite:saveModuleData',attendance,{module:'attendance'});document.getElementById('saveStatus').textContent='Saved '+new Date().toLocaleTimeString();}catch(e){document.getElementById('saveStatus').textContent='Save failed';toast('Save failed: '+e.message)}},350)}
function audit(action,detail){attendance.audit.unshift({at:new Date().toISOString(),user:env.user||'',machine:env.machine||'',action,detail});attendance.audit=attendance.audit.slice(0,1000)}
function renderShell(){document.getElementById('nav').innerHTML=MODULES.map(m=>`<button data-module="${m.id}" onclick="navigate('${m.id}')">${m.label}</button>`).join('')}function navigate(id){activeModule=id;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.module===id));document.getElementById('moduleStatus').textContent=MODULES.find(m=>m.id===id)?.label||id;renderPages()}
function renderPages(){const p=document.getElementById('pages');p.innerHTML=MODULES.map(m=>`<section class="page ${activeModule===m.id?'active':''}" id="page-${m.id}">${renderModule(m.id)}</section>`).join('')}
function renderModule(id){if(id==='home')return renderHome();if(id==='attendance')return renderAttendance();return `<div class="page-head"><div><div class="page-title">${MODULES.find(m=>m.id===id).label}</div><div class="page-sub">v2 module placeholder</div></div></div><div class="card"><div class="card-title">Coming Next</div><div class="notice">This module will be rebuilt as a native v2 suite module after Attendance and Roster are complete.</div></div>`}
function renderHome(){const flags=computeFlags();return `<div class="page-head"><div><div class="page-title">Security Operations Dashboard</div><div class="page-sub">${env.user||'User'} @ ${env.machine||'Machine'} · v2.1</div></div></div><div class="grid cols-3"><div class="kpi"><div class="num">${attendance.employees.length}</div><div class="lbl">Attendance Employees</div></div><div class="kpi"><div class="num">${flags.filter(f=>!f.addressed).length}</div><div class="lbl">Open Attendance Exceptions</div></div><div class="kpi"><div class="num">${attendance.lastSaved?new Date(attendance.lastSaved).toLocaleDateString():'-'}</div><div class="lbl">Attendance Last Saved</div></div></div><div class="grid cols-2">${['attendance','roster','badge-audit','amag-audit','access-audit'].map(id=>`<div class="card module-card" onclick="navigate('${id}')"><h3>${MODULES.find(m=>m.id===id).label}</h3><p>${id==='attendance'?'Daily entry, 90-day grid, exceptions, clear by person/code, and shared JSON storage.':'Ready for clean v2 rebuild.'}</p></div>`).join('')}</div>`}
function renderAttendance(){return `<div class="page-head"><div><div class="page-title">Attendance v2.1</div><div class="page-sub">Fast daily entry, grid review, exceptions, shared JSON autosave</div></div><div><button onclick="createAttendanceBackup()">Backup Now</button> <button onclick="exportAttendanceCSV()">Export CSV</button></div></div><div class="subnav">${['daily','grid','exceptions','audit'].map(v=>`<button class="${activeAttView===v?'active':''}" onclick="activeAttView='${v}';renderPages()">${v==='daily'?'Daily Entry':v==='grid'?'90-Day Grid':v==='exceptions'?'Exceptions':'Audit Log'}</button>`).join('')}</div>${activeAttView==='daily'?renderDaily():activeAttView==='grid'?renderGrid():activeAttView==='exceptions'?renderExceptions():renderAudit()}`}
function currentRows(){let rows=attendance.employees.slice().sort((a,b)=>(a.shift||'').localeCompare(b.shift||'')||(a.name||'').localeCompare(b.name||''));if(entryShift!=='All')rows=rows.filter(e=>e.shift===entryShift);if(showBlanks)rows=rows.filter(e=>!getCode(e.id,entryDate));return rows}
function getCode(id,date){return (attendance.attendance[id]&&attendance.attendance[id][date])||''}function setCode(id,date,code){attendance.attendance[id]=attendance.attendance[id]||{};if(code)attendance.attendance[id][date]=code;else delete attendance.attendance[id][date];audit('Attendance code set',`${id} ${date} ${code||'blank'}`);saveAttendance()}
function renderDaily(){const shifts=['All',...new Set(attendance.employees.map(e=>e.shift).filter(Boolean))];const rows=currentRows();return `<div class="card"><div class="card-title">Daily Entry Command Pad</div><div class="toolbar"><div><label>Date</label><input type="date" value="${entryDate}" onchange="entryDate=this.value;renderPages()"></div><div><label>Shift</label><select onchange="entryShift=this.value;renderPages()">${shifts.map(s=>`<option ${entryShift===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Active Code</label><div class="quick-codes">${CODES.map(c=>`<button class="code-btn ${activeCode===c[0]?'active':''}" title="${c[1]}" onclick="activeCode='${c[0]}';renderPages()">${c[0]}</button>`).join('')}</div></div></div><div class="toolbar"><button class="primary" onclick="markScheduledPresent()">Mark Scheduled Present</button><button onclick="markRdosOff()">Mark RDOs Off</button><button onclick="copyPreviousDay()">Copy Previous Day</button><button onclick="showBlanks=!showBlanks;renderPages()">${showBlanks?'Show All':'Show Blanks Only'}</button><button class="danger" onclick="clearDay()">Clear Day</button></div><div class="notice">Active code: <strong>${activeCode||'Blank'}</strong>. Click a row to apply it. Use Note for documentation without changing the code.</div></div><div class="people-list">${rows.map(renderDailyRow).join('')}</div>`}
function renderDailyRow(e){const c=getCode(e.id,entryDate);return `<div class="person-row" onclick="setCode('${e.id}','${entryDate}','${activeCode}')"><div class="person-name"><strong>${esc(e.name)}</strong><span>${esc(e.title)} · ${esc(e.shift)}</span></div><div>${e.rdos&&e.rdos.includes(parseISO(entryDate).getDay())?'<span class="chip">RDO</span>':''}</div><div><span class="badge ${esc(c)}">${esc(c||'Blank')}</span></div><div>${last7(e.id)}</div><div><button class="sm" onclick="event.stopPropagation();editNote('${e.id}','${entryDate}')">Note</button></div></div>`}
function last7(id){let out=[];for(let i=6;i>=0;i--){let d=addDays(entryDate,-i),c=getCode(id,d);out.push(`<span class="badge ${esc(c)}" title="${fmt(d)}">${esc(c||'-')}</span>`)}return out.join(' ')}function editNote(id,date){const k=id+'|'+date;let n=prompt('Attendance note:',attendance.notes[k]||'');if(n===null)return;if(n.trim())attendance.notes[k]=n.trim();else delete attendance.notes[k];audit('Attendance note updated',k);saveAttendance();renderPages()}
function markScheduledPresent(){for(const e of currentRows()){const dow=parseISO(entryDate).getDay();if(!(e.rdos||[]).includes(dow)&&!getCode(e.id,entryDate))setCode(e.id,entryDate,'P')}toast('Scheduled blanks marked Present');renderPages()}function markRdosOff(){for(const e of currentRows()){const dow=parseISO(entryDate).getDay();if((e.rdos||[]).includes(dow))setCode(e.id,entryDate,'O')}toast('RDOs marked Off');renderPages()}function copyPreviousDay(){const prev=addDays(entryDate,-1);for(const e of currentRows()){const c=getCode(e.id,prev);if(c)setCode(e.id,entryDate,c)}toast('Copied previous day');renderPages()}function clearDay(){if(!confirm('Clear visible entries for '+entryDate+'?'))return;for(const e of currentRows())setCode(e.id,entryDate,'');renderPages()}
function getDates(){let arr=[];for(let d=addDays(gridEnd,-89);d<=gridEnd;d=addDays(d,1))arr.push(d);return arr.reverse()}function renderGrid(){const dates=getDates();return `<div class="card"><div class="card-title">90-Day Grid</div><div class="toolbar"><div><label>Ending Date</label><input type="date" value="${gridEnd}" onchange="gridEnd=this.value;renderPages()"></div><div><label>Shift</label><select onchange="entryShift=this.value;renderPages()">${['All',...new Set(attendance.employees.map(e=>e.shift).filter(Boolean))].map(s=>`<option ${entryShift===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="notice">Newest date is on the left.</div></div><div class="table-wrap"><table><thead><tr><th class="name">Employee</th>${dates.map(d=>`<th class="${d===new Date().toISOString().slice(0,10)?'today':''}">${fmt(d)}<br>${DAYS[parseISO(d).getDay()]}</th>`).join('')}</tr></thead><tbody>${currentRows().map(e=>`<tr><td class="name"><strong>${esc(e.name)}</strong><br><small>${esc(e.shift)} · ${esc(e.title)}</small></td>${dates.map(d=>{let c=getCode(e.id,d);return `<td class="${parseISO(d).getDay()%6===0?'weekend':''}" onclick="setCode('${e.id}','${d}','${activeCode}');renderPages()"><span class="badge ${esc(c)}">${esc(c||'')}</span></td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function issueDateLabel(items){return (items||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>fmt(x.date)+' '+x.code).join(', ')||'No dates'}function flagKey(empId,type,periodKey){return `${empId}|${type}|${periodKey}`}function computeFlags(){const dates=getDates(),flags=[],s=attendance.settings;for(const e of attendance.employees){let issues=[],counts={week:{},month:{},dow:{}},disc=[],occ=[];for(const d of dates){const c=getCode(e.id,d),dt=parseISO(d),wk=weekKey(dt),mo=d.slice(0,7),dow=DAYS[dt.getDay()];if(c==='U')issues.push({type:'Unexcused',sev:'critical',periodKey:d,msg:`Unexcused absence on ${fmt(d)}`,issueDates:[{date:d,code:c}]});if(c==='UE')issues.push({type:'Unauthorized Early',sev:'high',periodKey:d,msg:`Unauthorized early departure on ${fmt(d)}`,issueDates:[{date:d,code:c}]});if(OCC_CODES.has(c)){disc.push({date:d,code:c});occ.push({date:d,code:c})}if(PATTERN_CODES.has(c)){let item={date:d,code:c};counts.week[wk]=counts.week[wk]||[];counts.week[wk].push(item);counts.month[mo]=counts.month[mo]||[];counts.month[mo].push(item);counts.dow[dow]=counts.dow[dow]||[];counts.dow[dow].push(item)}}if(disc.length>=s.rollingThreshold)issues.push({type:'90-Day',sev:'critical',periodKey:`rolling-${dates[dates.length-1]}-${dates[0]}`,msg:`${disc.length} discipline occurrence(s) in 90 days`,issueDates:disc});for(const [k,it] of Object.entries(counts.week))if(it.length>=s.weekThreshold)issues.push({type:'Weekly',sev:'high',periodKey:k,msg:`${it.length} attendance issue(s) in week of ${k}`,issueDates:it});for(const [k,it] of Object.entries(counts.month))if(it.length>=s.monthThreshold)issues.push({type:'Monthly',sev:'high',periodKey:k,msg:`${it.length} attendance issue(s) in ${k}`,issueDates:it});for(const [k,it] of Object.entries(counts.dow))if(it.length>=s.patternThreshold)issues.push({type:'Pattern',sev:'medium',periodKey:k,msg:`${it.length} attendance issue(s) on ${k}s`,issueDates:it});if(occ.length>=6)issues.push({type:'Occurrences',sev:'critical',periodKey:`occ-${dates[dates.length-1]}-${dates[0]}`,msg:`${occ.length} discipline occurrence(s) in 90 days`,issueDates:occ});else if(occ.length>=4)issues.push({type:'Occurrences',sev:'high',periodKey:`occ-${dates[dates.length-1]}-${dates[0]}`,msg:`${occ.length} discipline occurrence(s) in 90 days`,issueDates:occ});for(const iss of issues){const k=flagKey(e.id,iss.type,iss.periodKey),a=attendance.flagActions[k];flags.push({...iss,emp:e,key:k,addressed:!!a,action:a||null})}}return flags}
function buildBuckets(flags){const order=['T','AL','LE','E','U','UE','V','GEN'],map={};for(const f of flags){for(const it of (f.issueDates&&f.issueDates.length?f.issueDates:[{code:'GEN',date:f.periodKey}])){const code=order.includes(it.code)?it.code:'GEN';map[code]=map[code]||{code,dates:{},flags:[]};if(it.date)map[code].dates[it.date]=true;if(!map[code].flags.some(x=>x.key===f.key))map[code].flags.push(f)}}return Object.values(map).sort((a,b)=>order.indexOf(a.code)-order.indexOf(b.code)).map(b=>({...b,dateList:Object.keys(b.dates).sort((a,b)=>b.localeCompare(a))}))}
function renderExceptions(){const flags=computeFlags();const open=flags.filter(f=>!f.addressed);let groups={};for(const f of flags){groups[f.emp.id]=groups[f.emp.id]||{emp:f.emp,flags:[]};groups[f.emp.id].flags.push(f)}let list=Object.values(groups).sort((a,b)=>b.flags.filter(f=>!f.addressed).length-a.flags.filter(f=>!f.addressed).length||a.emp.name.localeCompare(b.emp.name));return `<div class="grid cols-3"><div class="kpi"><div class="num">${open.filter(f=>f.sev==='critical').length}</div><div class="lbl">Critical Open</div></div><div class="kpi"><div class="num">${open.filter(f=>f.sev==='high').length}</div><div class="lbl">High Open</div></div><div class="kpi"><div class="num">${open.length}</div><div class="lbl">Total Open</div></div></div><div class="notice">Grouped by person, then code bucket. Clear individual rule, clear code, or clear person.</div><br>${list.map(renderFlagGroup).join('')||'<div class="card"><div class="card-title">No Exceptions</div>No exceptions found.</div>'}`}
function renderFlagGroup(g){const open=g.flags.filter(f=>!f.addressed),buckets=buildBuckets(g.flags);return `<div class="flag-group"><div class="flag-head"><div class="flag-person"><strong>${esc(g.emp.name)}</strong><span>${esc(g.emp.shift)} · ${esc(g.emp.title)}</span></div><div>${open.length?`<span class="chip">${open.length} Open</span>`:''}${g.flags.filter(f=>f.sev==='critical'&&!f.addressed).length?'<span class="chip critical">Critical</span>':''}</div><div>${open.length?`<button data-clear-person="${esc(g.emp.id)}">Clear Person</button>`:''}</div></div>${buckets.map(b=>renderBucket(g.emp,b)).join('')}</div>`}
function renderBucket(emp,b){const open=b.flags.filter(f=>!f.addressed);return `<details class="bucket" open><summary><span class="badge ${esc(b.code)}">${esc(b.code)}</span><span>${esc(codeLabel(b.code))}<br><small>${esc(b.dateList.slice(0,8).map(fmt).join(', '))}${b.dateList.length>8?' ...':''}</small></span><span class="chip">${b.dateList.length} dates</span><span>${open.length?`<button class="sm" data-clear-code-emp="${esc(emp.id)}" data-clear-code="${esc(b.code)}">Clear ${esc(b.code)}</button>`:''}</span></summary><div class="bucket-body">${b.flags.map(renderExceptionCard).join('')}</div></details>`}function codeLabel(c){return CODES.find(x=>x[0]===c)?.[1]||'General'}function renderExceptionCard(f){return `<div class="exception-card ${f.sev} ${f.addressed?'addressed':''}"><div><div class="sev ${f.sev}">${f.sev}</div><span class="chip">${esc(f.type)}</span></div><div>${esc(f.msg)}<br><small>Issue Dates: ${esc(issueDateLabel(f.issueDates))}</small>${f.addressed?`<br><span class="ok">${esc(f.action.actionType||'Reviewed')} · ${esc(f.action.note||'')}</span>`:''}</div><div>${f.addressed?`<button class="sm" data-reopen="${esc(f.key)}">Reopen</button>`:`<button class="sm" data-action="Coaching" data-key="${esc(f.key)}">Coaching</button> <button class="sm" data-action="Verbal Warning" data-key="${esc(f.key)}">Verbal</button> <button class="sm" data-action="Written Warning" data-key="${esc(f.key)}">Written</button> <button class="sm" data-action="Final Warning" data-key="${esc(f.key)}">Final</button>`}</div></div>`}
function clearKeys(keys,actionType,note){const stamp=new Date().toISOString();for(const k of keys)attendance.flagActions[k]={at:stamp,actionType,note};audit('Flags cleared',`${keys.length} flag(s) · ${actionType}`);saveAttendance();renderPages()}document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b){let note=prompt('Supervisor note:',b.dataset.action+' completed');if(note!==null)clearKeys([b.dataset.key],b.dataset.action,note||b.dataset.action);return}b=e.target.closest('[data-reopen]');if(b){delete attendance.flagActions[b.dataset.reopen];saveAttendance();renderPages();return}b=e.target.closest('[data-clear-person]');if(b){let fs=computeFlags().filter(f=>f.emp.id===b.dataset.clearPerson&&!f.addressed);let note=prompt('Clear all open exceptions for this person:', 'Reviewed / cleared');if(note!==null)clearKeys(fs.map(f=>f.key),'Reviewed / Cleared',note);return}b=e.target.closest('[data-clear-code]');if(b){let fs=computeFlags().filter(f=>f.emp.id===b.dataset.clearCodeEmp&&!f.addressed&&(f.issueDates||[]).some(it=>it.code===b.dataset.clearCode));let note=prompt('Clear '+b.dataset.clearCode+' exceptions:', b.dataset.clearCode+' reviewed / cleared');if(note!==null)clearKeys([...new Set(fs.map(f=>f.key))],'Reviewed / Cleared',note);return}});
function renderAudit(){return `<div class="card"><div class="card-title">Attendance Audit Log</div><div class="table-wrap"><table><thead><tr><th>Date/Time</th><th>User</th><th>Action</th><th>Detail</th></tr></thead><tbody>${(attendance.audit||[]).slice(0,300).map(a=>`<tr><td>${esc(new Date(a.at).toLocaleString())}</td><td>${esc(a.user||'')}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`).join('')}</tbody></table></div></div>`}
async function createAttendanceBackup(){try{let r=await SuiteBridge.send('suite:createBackup',attendance,{module:'attendance'});toast('Backup created');}catch(e){toast('Backup failed: '+e.message)}}function exportAttendanceCSV(){let rows=['Employee,Shift,Title,Date,Code,Note'];for(const e of attendance.employees){for(const [d,c] of Object.entries(attendance.attendance[e.id]||{})){let n=attendance.notes[e.id+'|'+d]||'';rows.push([e.name,e.shift,e.title,d,c,n].map(x=>'"'+String(x||'').replace(/"/g,'""')+'"').join(','))}}SuiteBridge.send('suite:writeExport',rows.join('\n'),{module:'attendance',fileName:'attendance-export-'+new Date().toISOString().slice(0,10)+'.csv'}).then(()=>toast('CSV exported')).catch(e=>toast('Export failed: '+e.message))}
function openSettings(){renderSettings();document.getElementById('settingsPanel').classList.add('open')}function closeSettings(){document.getElementById('settingsPanel').classList.remove('open')}function renderSettings(){document.getElementById('settingsBody').innerHTML=`<div class="form-grid"><div><label>Theme</label><select id="setTheme"><option ${settings.theme==='dark'?'selected':''}>dark</option><option ${settings.theme==='light'?'selected':''}>light</option><option ${settings.theme==='auto'?'selected':''}>auto</option></select></div><div><label>Default Module</label><select id="setDefault">${MODULES.map(m=>`<option value="${m.id}" ${settings.defaultModule===m.id?'selected':''}>${m.label}</option>`).join('')}</select></div><div><label>PIN</label><input id="setPin" value="${esc(settings.pin)}" maxlength="8"></div><div><label>Backup Retention Days</label><input id="setRetention" type="number" value="${settings.backupRetentionDays}"></div><div class="full"><label>Data Root</label><input id="setRoot" value="${esc(settings.dataRoot)}"></div><div class="full"><button class="primary" onclick="saveSettings()">Save Settings</button> <button onclick="runHealthCheck()">Run Health Check</button></div></div><div id="healthBox" style="margin-top:14px"></div>`}async function saveSettings(){settings={...settings,theme:document.getElementById('setTheme').value,defaultModule:document.getElementById('setDefault').value,pin:document.getElementById('setPin').value||'1234',dataRoot:document.getElementById('setRoot').value,backupRetentionDays:Number(document.getElementById('setRetention').value||60)};applyTheme();try{await SuiteBridge.send('suite:saveSettings',settings);toast('Settings saved')}catch(e){toast('Settings failed: '+e.message)}}async function runHealthCheck(){try{let r=await SuiteBridge.send('suite:healthCheck');document.getElementById('healthBox').innerHTML=`<div class="card"><div class="card-title">Health Check</div><div style="color:var(--muted);font-size:12px;margin-bottom:8px">${esc(r.dataRoot)}</div>${r.checks.map(c=>`<div class="health-row"><span>${esc(c.name)}</span><span class="${c.ok?'ok':'bad'}">${c.ok?'OK':esc(c.error)}</span></div>`).join('')}</div>`}catch(e){toast('Health check failed')}}
init();
</script>
