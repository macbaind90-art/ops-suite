name: Build PWADC Warehouse Attendance Tracker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate frontend and release controls
        run: node tools/validate.js

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PWADCWarehouseAttendanceTracker.csproj

      - name: Build
        run: dotnet build PWADCWarehouseAttendanceTracker.csproj --configuration Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish PWADCWarehouseAttendanceTracker.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=false -o publish

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: PWADC-Warehouse-Attendance-Tracker-v0-1-0-0-Windows
          path: publish/**
          if-no-files-found: error
