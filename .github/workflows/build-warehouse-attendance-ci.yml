name: Build Warehouse Attendance Tracker CI

on:
  push:
    branches:
      - warehouse-attendance-v0.1.0.0-ci
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout CI branch
        uses: actions/checkout@v4

      - name: Rehydrate verified standalone source
        shell: pwsh
        run: |
          $files = @(
            'warehouse-ci-chunks/chunk00.txt',
            'warehouse-ci-chunks/chunk01.txt',
            'warehouse-ci-chunks/chunk02a.txt',
            'warehouse-ci-chunks/chunk02b.txt',
            'warehouse-ci-chunks/chunk03.txt',
            'warehouse-ci-chunks/chunk04.txt',
            'warehouse-ci-chunks/chunk05.txt'
          )
          $expected = @(
            '78263183fe4422b71c6b38edd301508fd86c57acc2b064033ea094dac4a09266',
            '1ddecaf02d64fceafcb1ea258ad17d9fb20b4e6304cade435340cc7173cff532',
            '18c9ae1242aec638d5b0eed5907d30af54c83482bc1e3a9c92de6cd56b39d0af',
            'c6745d5de6983291c494d1b3ed9033b287710e6d7c5a4ab5c9a368e4405932fd',
            '3753d3dd8fbf74a042a1b20041f33e39a1f23dad3dfae44ed6769ffb54668b91',
            '1daad59fda328e4b6e4d710c01eb8c8a667ed34ed8ca74e7ed1de3d5b6d5430a',
            '63c9cb7b774ff4d17fab83827250cd67843e4bff98c631019d1daf805e4e65c6'
          )
          for ($i=0; $i -lt $files.Count; $i++) {
            $hash = (Get-FileHash $files[$i] -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "$($files[$i]) $hash"
            if ($hash -ne $expected[$i]) { throw "Source chunk $i SHA-256 mismatch: $hash" }
          }
          $b64 = ($files | ForEach-Object { Get-Content $_ -Raw }) -join ''
          if ($b64.Length -ne 38856) { throw "Unexpected base64 length: $($b64.Length)." }
          [IO.File]::WriteAllBytes('warehouse-attendance-source.zip',[Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'warehouse-attendance-source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '9f45d28d11428475c4871980284631d599d843273d81a81192fb0a734104b41a') { throw "Source ZIP SHA-256 mismatch: $hash" }
          Expand-Archive warehouse-attendance-source.zip -DestinationPath warehouse-ci -Force
          New-Item -ItemType Directory -Force -Path 'warehouse-ci/PWADC-Warehouse-Attendance-Tracker/.github/workflows' | Out-Null
          Copy-Item 'warehouse-standalone-build-windows.yml' 'warehouse-ci/PWADC-Warehouse-Attendance-Tracker/.github/workflows/build-windows.yml' -Force

          $storePath = 'warehouse-ci/PWADC-Warehouse-Attendance-Tracker/WarehouseStore.cs'
          $store = [IO.File]::ReadAllText($storePath).Replace("`r`n", "`n")
          $replacement = @'
        var html = $$"""
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font-family: Arial, sans-serif; margin: 42px; color: #111; }
h1 { font-size: 22px; }
table { width: 100%; border-collapse: collapse; margin-top: 18px; }
th, td { border: 1px solid #999; padding: 7px; text-align: left; }
.sig { margin-top: 60px; display: grid; grid-template-columns: 1fr 1fr; gap: 50px; }
.line { border-top: 1px solid #222; padding-top: 6px; }
</style>
</head>
<body>
<h1>{{Html(notice.Title)}}</h1>
<p><strong>Employee:</strong> {{Html(record.Profile.Name)}} &nbsp; <strong>EID:</strong> {{Html(record.Profile.Eid)}}</p>
<p><strong>RDO:</strong> {{Html(record.Profile.Rdo)}} &nbsp; <strong>Active 9-Month Points:</strong> {{notice.PointsAtGeneration:0.##}}</p>
<p><strong>Threshold:</strong> {{Html(notice.ThresholdName)}}</p>
<p>{{Html(notice.Body)}}</p>
<h2>Active Attendance Record</h2>
<table><thead><tr><th>Date</th><th>Event</th><th>Points</th><th>Notes</th></tr></thead><tbody>{{rows}}</tbody></table>
<div class="sig"><div class="line">Employee Signature / Date</div><div class="line">Supervisor Signature / Date</div></div>
</body>
</html>
""";
'@.Replace("`r`n", "`n")
          $pattern = '(?s)        var html = \$""".*?""";'
          $patched = [regex]::Replace($store, $pattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $replacement }, 1)
          if ($patched -eq $store) { throw 'WarehouseStore notice template patch did not apply.' }
          [IO.File]::WriteAllText($storePath, $patched, [Text.UTF8Encoding]::new($false))
          $storeHash = (Get-FileHash $storePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($storeHash -ne '085fe09a0c9d41171156d49b701b0430a702ebe46b2cf3478282832f5fe49d73') { throw "Corrected WarehouseStore SHA-256 mismatch: $storeHash" }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate standalone source
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        run: node tools/validate.js

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        run: dotnet restore PWADCWarehouseAttendanceTracker.csproj

      - name: Build
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        run: dotnet build PWADCWarehouseAttendanceTracker.csproj --configuration Release --no-restore

      - name: Publish Windows x64
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        run: dotnet publish PWADCWarehouseAttendanceTracker.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=false -o publish

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: PWADC-Warehouse-Attendance-Tracker-v0-1-0-0-Windows
          path: warehouse-ci/PWADC-Warehouse-Attendance-Tracker/publish/**
          if-no-files-found: error
