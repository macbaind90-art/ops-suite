name: Build Warehouse Attendance Tracker CI

on:
  push:
    branches:
      - warehouse-attendance-v0.1.0.0-ci
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout CI branch
        uses: actions/checkout@v4

      - name: Rehydrate verified standalone source
        shell: pwsh
        run: |
          $expected = @(
            '78263183fe4422b71c6b38edd301508fd86c57acc2b064033ea094dac4a09266',
            '1ddecaf02d64fceafcb1ea258ad17d9fb20b4e6304cade435340cc7173cff532',
            'd3adf8df19cec7f5e9d974d2d0c43214ae8634ad93a00a063dbac1422afe6c7f',
            '3753d3dd8fbf74a042a1b20041f33e39a1f23dad3dfae44ed6769ffb54668b91',
            '1daad59fda328e4b6e4d710c01eb8c8a667ed34ed8ca74e7ed1de3d5b6d5430a',
            '63c9cb7b774ff4d17fab83827250cd67843e4bff98c631019d1daf805e4e65c6'
          )
          $chunks = Get-ChildItem 'warehouse-ci-chunks/chunk*.txt' | Sort-Object Name
          if ($chunks.Count -ne 6) { throw "Expected 6 source chunks; found $($chunks.Count)." }
          for ($i=0; $i -lt $chunks.Count; $i++) {
            $hash = (Get-FileHash $chunks[$i].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "$($chunks[$i].Name) $hash"
            if ($hash -ne $expected[$i]) { throw "Chunk $i SHA-256 mismatch: $hash" }
          }
          $b64 = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          if ($b64.Length -ne 38856) { throw "Unexpected base64 length: $($b64.Length)." }
          [IO.File]::WriteAllBytes('warehouse-attendance-source.zip',[Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'warehouse-attendance-source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '9f45d28d11428475c4871980284631d599d843273d81a81192fb0a734104b41a') { throw "Source ZIP SHA-256 mismatch: $hash" }
          Expand-Archive warehouse-attendance-source.zip -DestinationPath warehouse-ci -Force

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate standalone source
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        run: node tools/validate.js

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        run: dotnet restore PWADCWarehouseAttendanceTracker.csproj

      - name: Build
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        run: dotnet build PWADCWarehouseAttendanceTracker.csproj --configuration Release --no-restore

      - name: Publish Windows x64
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        run: dotnet publish PWADCWarehouseAttendanceTracker.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=false -o publish

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: PWADC-Warehouse-Attendance-Tracker-v0-1-0-0-Windows
          path: warehouse-ci/PWADC-Warehouse-Attendance-Tracker/publish/**
          if-no-files-found: error
