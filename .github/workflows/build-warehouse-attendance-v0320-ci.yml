name: Warehouse Attendance v0.3.2.0 CI

on:
  push:
    branches:
      - warehouse-attendance-v0.3.2.0-ci
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Rehydrate exact v0.3.1.0 baseline
        shell: pwsh
        run: |
          $sourceFiles=@(
            'warehouse-v0300-ci/chunk00.txt','warehouse-v0300-ci/chunk01.txt','warehouse-v0300-ci/chunk02.txt','warehouse-v0300-ci/chunk03.txt','warehouse-v0300-ci/chunk04.txt',
            'warehouse-v0300-ci/chunk05_0.txt','warehouse-v0300-ci/chunk05_1.txt','warehouse-v0300-ci/chunk05_2.txt','warehouse-v0300-ci/chunk06_0.txt','warehouse-v0300-ci/chunk06_1.txt',
            'warehouse-v0300-ci/chunk06_2.txt','warehouse-v0300-ci/chunk07_0.txt','warehouse-v0300-ci/chunk07_1.txt'
          )
          $b64=($sourceFiles|ForEach-Object{Get-Content $_ -Raw})-join''
          [IO.File]::WriteAllBytes('baseline.zip',[Convert]::FromBase64String($b64))
          $h=(Get-FileHash baseline.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h -ne 'c23070e08425ea0994ce71c65e6b05a999efae353816981ac87d44b02ece7bc8'){throw "Baseline mismatch: $h"}
          Expand-Archive baseline.zip -DestinationPath warehouse-ci -Force
          $root='warehouse-ci/PWADC-Warehouse-Attendance-Tracker'

          $p301=@('warehouse-v0301-patch/patch00.txt','warehouse-v0301-patch/patch01.txt','warehouse-v0301-patch/patch02.txt','warehouse-v0301-patch/patch03.txt','warehouse-v0301-patch/patch04.txt')
          $parts=@();foreach($f in $p301){$parts+=(Get-Content $f -Raw).Replace("`r`n","`n")}
          [IO.File]::WriteAllText('v0301.patch',($parts-join''),[Text.UTF8Encoding]::new($false))
          $h=(Get-FileHash v0301.patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h -ne '03b3d1484975c332cf7c945216a3031e6135193f6523c17cd2f91b3c798a582b'){throw "v0.3.0.1 patch mismatch: $h"}
          git apply -p3 --directory=$root --exclude='*/BUILD-VALIDATION.md' v0301.patch
          if($LASTEXITCODE -ne 0){throw 'v0.3.0.1 patch failed'}
          $normalize=@('.github/workflows/build-windows.yml','ARCHITECTURE.md','AttendancePolicy.cs','CHANGELOG.md','PWADCWarehouseAttendanceTracker.csproj','README.md','WarehouseStore.cs','app/app.js','app/styles.css','app.manifest','tools/validate.js')
          foreach($r in $normalize){$p=Join-Path $root $r;$s=[IO.File]::ReadAllText($p).Replace("`r`n","`n");[IO.File]::WriteAllText($p,$s,[Text.UTF8Encoding]::new($false))}

          $p302=0..15|ForEach-Object{"warehouse-v0302-patch-small/part{0:D2}.txt"-f $_}
          $parts=@();foreach($f in $p302){$parts+=[IO.File]::ReadAllText($f).Replace("`r`n","`n")}
          [IO.File]::WriteAllText('v0302.patch',($parts-join''),[Text.UTF8Encoding]::new($false))
          git apply --directory=$root v0302.patch
          if($LASTEXITCODE -ne 0){throw 'v0.3.0.2 patch failed'}
          $v302=@{
            'AttendancePolicy.cs'='a3cbae2f478731963669504aad6bca1b64ace2b2c1a2b39682d8f1a8871a40e4';'WarehouseStore.cs'='946a0e2274ca03af182155d02d99f33de828e4d261414ed5ad9211656a1257bd';
            'PWADCWarehouseAttendanceTracker.csproj'='155632042764f07b3689e4ce3bc86354e07a34963e4fe48620aba63bb36f7819';'app.manifest'='8883fabb0795ae897e959bcfe2f5276cedb1da4f547c1f658d2446e7f052318b';
            'app/app.js'='1f09ab99117e074fac9e1c29847e953debd29918cf7a317d3040d246df33eb73';'app/styles.css'='cacdf8b2b431a7a6a0b4de60e44ca5c278ed4795ab8512463dc41e6313a566c2'
          }
          foreach($r in $v302.Keys){$p=Join-Path $root $r;$s=[IO.File]::ReadAllText($p).Replace("`r`n","`n");[IO.File]::WriteAllText($p,$s,[Text.UTF8Encoding]::new($false));$h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant();if($h-ne$v302[$r]){throw "v0.3.0.2 mismatch $r $h"}}

          $p310=0..13|ForEach-Object{"warehouse-v0310-patch/part{0:D2}.txt"-f $_}
          $parts=@();foreach($f in $p310){$parts+=[IO.File]::ReadAllText($f).Replace("`r`n","`n")}
          [IO.File]::WriteAllText('v0310.patch',($parts-join''),[Text.UTF8Encoding]::new($false))
          git apply -p2 --directory=$root --exclude='*/tools/validate.js' --exclude='*/.github/workflows/build-windows.yml' v0310.patch
          if($LASTEXITCODE -ne 0){throw 'v0.3.1.0 runtime notice patch failed'}
          $v310=@{
            'WarehouseStore.cs'='5822bcbe11a77572a48310b0955fb07d10d5b59a5350a1280e53e49fceb614b8';'AttendancePolicy.cs'='693b5346df576cd20f7aa4eecd53ca16493e52043142724266d403ec83f6d47f';
            'AutomaticNotices.cs'='45fa29bfb0ab60ab5e25b0424b7222d9dbd93f01d2e64b9e47eca2d14bebbc18';'PWADCWarehouseAttendanceTracker.csproj'='819fdde357b10d96fda52376d9502bade6151e2174f9a07ad23a74097e7f27d4';
            'app.manifest'='c481091b9bbc1d51403b84626046959f3d401fea82fc2a22bcb92c61bb419353';'app/app.js'='2237c2a668e42b07c5d448d34508ad738dcde4e9a578f0a71b15cd905962e758';
            'app/index.html'='0997f9a148f49d8c77c098b6c9a23c7c20958038bb38bd97c490e1d05ad8401c';'app/notice-overrides.js'='4560f6c4e14106a21db7f88970add0826add60cee991793afac2ac3e39353b06'
          }
          foreach($r in $v310.Keys){$p=Join-Path $root $r;$s=[IO.File]::ReadAllText($p).Replace("`r`n","`n");[IO.File]::WriteAllText($p,$s,[Text.UTF8Encoding]::new($false));$h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant();if($h-ne$v310[$r]){throw "v0.3.1.0 mismatch $r $h"}}
          Write-Host 'Verified exact v0.3.1.0 runtime baseline.'

      - name: Apply and verify exact v0.3.2.0 runtime patch
        shell: pwsh
        run: |
          $root='warehouse-ci/PWADC-Warehouse-Attendance-Tracker'
          $chunkFiles=0..3|ForEach-Object{"warehouse-v0320-patch/part{0:D2}.txt"-f $_}
          $expectedChunks=@(
            'f3005a6433f3b75b238d6306836fb2e5e1f74f081ae183a8fb5ca810d84a3add',
            '90ede26f6afdf8bf3dba89c6cc3c190128d0198440dade914e1dbd9d72242a01',
            'bb53097b18adab74513c178a54e82318bcefc2d1d39637325b72043d5fa46660',
            'a56b3c104a60569a79f688de19dd0cb663b0a7e3e51d5d959ffa8d2704cd3d14'
          )
          $parts=@()
          for($i=0;$i -lt $chunkFiles.Count;$i++){
            $text=[IO.File]::ReadAllText($chunkFiles[$i]).Replace("`r",'').Replace("`n",'')
            $bytes=[Text.Encoding]::ASCII.GetBytes($text)
            $h=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
            Write-Host "Patch chunk $i SHA-256: $h"
            if($h-ne$expectedChunks[$i]){throw "v0.3.2.0 patch chunk $i mismatch"}
            $parts+=$text
          }
          $b64=$parts-join''
          [IO.File]::WriteAllBytes('v0320.patch.gz',[Convert]::FromBase64String($b64))
          $h=(Get-FileHash 'v0320.patch.gz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h-ne'20a8d54d5daadc45974c3a9b4b8b59ea75080ed12d6cf4e9cfa8b39984862e7a'){throw "Compressed patch mismatch: $h"}
          $input=[IO.File]::OpenRead('v0320.patch.gz')
          $gzip=[IO.Compression.GZipStream]::new($input,[IO.Compression.CompressionMode]::Decompress)
          $output=[IO.File]::Create('v0320.patch')
          $gzip.CopyTo($output);$output.Dispose();$gzip.Dispose();$input.Dispose()
          $h=(Get-FileHash 'v0320.patch' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h-ne'8e5c93a4a725e9d47509247f1451598a70cdd27df1bd3fc76fe8a16eaeed9dfb'){throw "Runtime patch mismatch: $h"}
          git apply --directory=$root v0320.patch
          if($LASTEXITCODE -ne 0){throw 'v0.3.2.0 runtime patch failed'}

          $final=@{
            'WarehouseStore.cs'='3b3e95e7d7b30f063a425c967d2e80cffbea753fc242340fca8ec8b5e99055cb';
            'AttendancePolicy.cs'='4cd2f8858c70f6a54a1945d6607e9a4a4c0b11b83f044073f6dd56279f38d2e2';
            'MainForm.cs'='6a7cbd589249e2145916cb1a99ef6e4d65be083d61ca7ac668b259e7b884b0e3';
            'ExcelExporter.cs'='4a259b336d9b2479cb084abe7feaa301f0145debf57bead1395999a9db007ddf';
            'PWADCWarehouseAttendanceTracker.csproj'='4ff46ccf278c1cf86c6375259d16c94211db8d7245aecd7a82f5d8bddd7d9909';
            'app.manifest'='73adc18680999894a01308de8dc778b5fb3f2f70c2a0891b5460c97aec7393ed';
            'app/app.js'='2dbbff11c9392074d25e75c941363d4217cf3c6159233d68fad39f11bafc7d89';
            'app/styles.css'='6d5c4ea30d6c5d95a935fc7393ec9d1aa5255ddbd7f0a8ef1b75ffd4ffca7b9b'
          }
          foreach($r in $final.Keys){
            $p=Join-Path $root $r
            $s=[IO.File]::ReadAllText($p).Replace("`r`n","`n")
            [IO.File]::WriteAllText($p,$s,[Text.UTF8Encoding]::new($false))
            $h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "$r SHA-256: $h"
            if($h-ne$final[$r]){throw "Final v0.3.2.0 runtime mismatch: $r"}
          }
          Write-Host 'Verified exact locally validated v0.3.2.0 runtime files.'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate v0.3.2.0 UI contracts
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        shell: pwsh
        run: |
          node --check app/app.js
          node --check app/notice-overrides.js
          $js=[IO.File]::ReadAllText('app/app.js')
          $store=[IO.File]::ReadAllText('WarehouseStore.cs')
          $policy=[IO.File]::ReadAllText('AttendancePolicy.cs')
          $main=[IO.File]::ReadAllText('MainForm.cs')
          $excel=[IO.File]::ReadAllText('ExcelExporter.cs')
          @('Grocery Receiving','Perishable Receiving','Grocery Shipping','Perishable Shipping','Freezer Shipping','Selectors','Cleanup','Damages')|ForEach-Object{if(-not $store.Contains($_)){throw "Missing department $_"}}
          @('dailyDepartment','All Departments','empDepartment','Operator EID')|ForEach-Object{if(-not $js.Contains($_)){throw "Missing UI contract $_"}}
          @('operatorEid','sessionId','SetOperatorEid','Session started')|ForEach-Object{if(-not $store.Contains($_)){throw "Missing audit contract $_"}}
          if(-not $main.Contains('PromptForOperatorEid')){throw 'Launch operator EID prompt missing'}
          if(-not $policy.Contains('department')){throw 'Department scoped bulk Present missing'}
          if(-not $excel.Contains('Department')){throw 'Department Excel export missing'}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        run: dotnet restore PWADCWarehouseAttendanceTracker.csproj

      - name: Build Release
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        run: dotnet build PWADCWarehouseAttendanceTracker.csproj --configuration Release --no-restore

      - name: Publish self-contained win-x64
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        run: dotnet publish PWADCWarehouseAttendanceTracker.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=false -o publish

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: PWADC-Warehouse-Attendance-Tracker-v0-3-2-0-Windows
          path: warehouse-ci/PWADC-Warehouse-Attendance-Tracker/publish/**
          if-no-files-found: error
