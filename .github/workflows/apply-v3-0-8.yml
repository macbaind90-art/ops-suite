name: Apply v3.0.8 Manager Dashboard

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v3-0-8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply v3.0.8 manager dashboard'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch app to v3.0.8
        shell: python
        run: |
          from pathlib import Path

          index = Path('app/index.html')
          s = index.read_text(encoding='utf-8')
          s = s.replace('PWADC Security Operations Suite v3.0.7', 'PWADC Security Operations Suite v3.0.8')
          s = s.replace('COMMAND SUITE v3.0.7', 'COMMAND SUITE v3.0.8')
          s = s.replace('· v3.0.7', '· v3.0.8')

          start = s.index('function renderHome(){')
          end = s.index('\nfunction renderAttendance', start)
          render_home = r'''function renderHome(){
            const flags=computeFlags();
            const health=computeDataHealth();
            const today=todayISO();
            const rows=currentRows(today,'All');
            const entered=rows.filter(r=>!!getCode(r.id,today)).length;
            const blanks=rows.filter(r=>!getCode(r.id,today)).length;
            const rdos=rows.filter(r=>isRdo(r.emp,today)).length;
            const openPatterns=flags.filter(f=>!f.addressed).length;
            const activeTasks=(tasks.tasks||[]).filter(t=>!['Complete','Archived','On Hold','Tabled'].includes(t.status)).length;
            const highTasks=(tasks.tasks||[]).filter(t=>!['Complete','Archived'].includes(t.status)&&String(t.priority||'').toLowerCase()==='high').length;
            const waitingTasks=(tasks.tasks||[]).filter(t=>['Waiting','Follow-up','On Hold','Tabled'].includes(t.status)).length;
            const archivedTasks=(tasks.tasks||[]).filter(t=>['Complete','Archived'].includes(t.status)).length;
            const groups=groupRowsByShift(rows);
            const order=['1st Shift','2nd Shift','3rd Shift','Gate','Dock','Reception','Other'];
            const staffingHtml=order.filter(k=>groups[k]&&groups[k].length).map(k=>{
              const g=groups[k];
              const ge=g.filter(r=>!!getCode(r.id,today)).length;
              const gb=g.filter(r=>!getCode(r.id,today)).length;
              const gr=g.filter(r=>isRdo(r.emp,today)).length;
              return `<div class="stat-line"><strong>${esc(k)}</strong><span>${g.length} scheduled · ${ge} entered · ${gb} blank · ${gr} RDO</span></div>`;
            }).join('') || '<div class="mini-note">No staffing rows found for today.</div>';
            return `<div class="page-head"><div><div class="page-title">Security Operations Dashboard</div><div class="page-sub">${esc(env.user||'User')} @ ${esc(env.machine||'Machine')} · v3.0.8</div></div><div class="btn-group"><button onclick="navigate('data-health')">Run Data Health</button><button class="gold" onclick="backupEverything()">Backup Everything</button></div></div>
            <div class="grid cols-4">
              <div class="kpi"><div class="num">${entered}/${rows.length}</div><div class="lbl">Attendance Entered Today</div></div>
              <div class="kpi"><div class="num">${blanks}</div><div class="lbl">Attendance Blanks</div></div>
              <div class="kpi"><div class="num">${openPatterns}</div><div class="lbl">Open Attendance Patterns</div></div>
              <div class="kpi"><div class="num">${health.critical}/${health.warning}</div><div class="lbl">Critical / Warning Health</div></div>
            </div>
            <div class="grid cols-2">
              <div class="card"><div class="card-title">Attendance</div>
                <div class="grid cols-3">
                  <div class="kpi"><div class="num">${entered}</div><div class="lbl">Entered</div></div>
                  <div class="kpi"><div class="num">${blanks}</div><div class="lbl">Blank</div></div>
                  <div class="kpi"><div class="num">${rdos}</div><div class="lbl">RDO</div></div>
                </div>
                <div class="mini-note">Open patterns use discipline-review codes only: T, U, and UE.</div>
              </div>
              <div class="card"><div class="card-title">Staffing for Today</div>${staffingHtml}</div>
              <div class="card"><div class="card-title">Task Watch</div>
                <div class="grid cols-4">
                  <div class="kpi"><div class="num">${activeTasks}</div><div class="lbl">Active</div></div>
                  <div class="kpi"><div class="num">${highTasks}</div><div class="lbl">High Priority</div></div>
                  <div class="kpi"><div class="num">${waitingTasks}</div><div class="lbl">Waiting / On Hold</div></div>
                  <div class="kpi"><div class="num">${archivedTasks}</div><div class="lbl">Completed / Archived</div></div>
                </div>
              </div>
              <div class="card"><div class="card-title">Quick Actions</div>
                <div class="toolbar">
                  <button onclick="navigate('attendance'); activeAttendanceView='daily'; renderPages();">Daily Entry</button>
                  <button onclick="navigate('attendance'); activeAttendanceView='grid'; renderPages();">90-Day Grid</button>
                  <button onclick="navigate('attendance'); activeAttendanceView='review'; renderPages();">Attendance Review</button>
                  <button onclick="navigate('attendance'); activeAttendanceView='patterns'; renderPages();">Patterns</button>
                  <button onclick="navigate('roster')">Roster</button>
                  <button onclick="navigate('roster'); activeRosterView='schedule'; renderPages();">Schedule</button>
                  <button onclick="navigate('tasks')">Task Tracker</button>
                  <button class="gold" onclick="backupEverything()">Backup Everything</button>
                  <button onclick="navigate('data-health')">Data Health</button>
                  <button onclick="navigate('other-programs')">Other Programs</button>
                </div>
              </div>
            </div>`;
          }
          '''
          s = s[:start] + render_home + s[end:]
          index.write_text(s, encoding='utf-8')

          readme = Path('README.md')
          readme.write_text('# PWADC Security Operations Suite v3.0.8\n\n## Build\n\nUse GitHub Actions workflow at `.github/workflows/build-windows.yml`.\n\nThis build updates the Home screen into Manager Dashboard 2.0 with Attendance, Staffing for Today, Task Watch, and Quick Actions.\n', encoding='utf-8')

          workflow = Path('.github/workflows/build-windows.yml')
          y = workflow.read_text(encoding='utf-8').replace('v3-0-7', 'v3-0-8')
          workflow.write_text(y, encoding='utf-8')

          Path('.github/workflows/apply-v3-0-8.yml').unlink()

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/index.html').read_text(encoding='utf-8')
          js=s[s.index('<script>')+8:s.rindex('</script>')]
          Path('/tmp/app.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Commit v3.0.8
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/index.html README.md .github/workflows/build-windows.yml .github/workflows/apply-v3-0-8.yml
          git commit -m "Apply v3.0.8 manager dashboard"
          git push
