name: Build Warehouse Attendance Tracker v0.3.0.1 CI

on:
  push:
    branches:
      - warehouse-attendance-v0.3.0.1-ci
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout CI branch
        uses: actions/checkout@v4

      - name: Rehydrate v0.3.0.0 baseline and apply exact v0.3.0.1 patch
        shell: pwsh
        run: |
          $sourceFiles = @(
            'warehouse-v0300-ci/chunk00.txt',
            'warehouse-v0300-ci/chunk01.txt',
            'warehouse-v0300-ci/chunk02.txt',
            'warehouse-v0300-ci/chunk03.txt',
            'warehouse-v0300-ci/chunk04.txt',
            'warehouse-v0300-ci/chunk05_0.txt',
            'warehouse-v0300-ci/chunk05_1.txt',
            'warehouse-v0300-ci/chunk05_2.txt',
            'warehouse-v0300-ci/chunk06_0.txt',
            'warehouse-v0300-ci/chunk06_1.txt',
            'warehouse-v0300-ci/chunk06_2.txt',
            'warehouse-v0300-ci/chunk07_0.txt',
            'warehouse-v0300-ci/chunk07_1.txt'
          )
          $sourceExpected = @(
            'f5ee52215140523155c9a931f87bf23e3eb20e56a3b3b5ccc0dc1e278f96483c',
            '4fb30ac6a3b9ae7beb5955c0b62692e68dc402e00dee127dbe5059f60d85146d',
            'eb60f3f4ef7742365d11fe209542a54c3f4c10647e513ef388e3b14365be6b83',
            'be9e3935799757e8d859db2608a72cb1e868fdc33ad2ff76e931448678ebdff2',
            '46665502218b7121989728a2b7b45fa9c64cc957dadeae6dc23e613e0d66d943',
            '31447147548e1166271a6329e2d2ce649ee9d5065f3d4dd415a439c8e4a19287',
            'c620edca0899bd6eeba98e01c8e533ab7f2ce1f5c493ba03f34407c62cbfbc91',
            '1334703e4aeaca6ffc4a0df336d5246ae93fd4d2e10b90658b0186b4245341de',
            '6ccc7f056b116dad5a8cc2bc95cb0d6b4f5cc6532cde5ddd40e52abbabe56636',
            '41d834579513ea03cd6d89e89fc9f56fad9681281af3c96f9c98b77eb37ae49d',
            '5a4a48cea807ac683388233d9671e2d0408dc007bc06b4acc48b5a8dc9f1b13f',
            'fde16ad276920faacc3e598075a741c478b6270dad562a0c49d88dffad4218db',
            '925ddd0c0a0bda4409f78e132d225000ab436e6ab76dc6f4baedc74edc1df126'
          )
          for ($i = 0; $i -lt $sourceFiles.Count; $i++) {
            $hash = (Get-FileHash $sourceFiles[$i] -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $sourceExpected[$i]) { throw "Baseline source segment $i SHA-256 mismatch: $hash" }
          }
          $b64 = ($sourceFiles | ForEach-Object { Get-Content $_ -Raw }) -join ''
          [IO.File]::WriteAllBytes('warehouse-v0300-exact-source.zip', [Convert]::FromBase64String($b64))
          $zipHash = (Get-FileHash 'warehouse-v0300-exact-source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Baseline source ZIP SHA-256: $zipHash"
          if ($zipHash -ne 'c23070e08425ea0994ce71c65e6b05a999efae353816981ac87d44b02ece7bc8') { throw "Baseline ZIP mismatch: $zipHash" }
          Expand-Archive 'warehouse-v0300-exact-source.zip' -DestinationPath warehouse-ci -Force

          $patchFiles = @(
            'warehouse-v0301-patch/patch00.txt',
            'warehouse-v0301-patch/patch01.txt',
            'warehouse-v0301-patch/patch02.txt',
            'warehouse-v0301-patch/patch03.txt',
            'warehouse-v0301-patch/patch04.txt'
          )
          $patchExpected = @(
            '8a8bec64c7abc793d6a40261710d31dd878fc568744d68127ba601c705b47180',
            'e737b22128be7b2cfac30696176edce45edf7284fc2e1a791af15f61e65908a6',
            '33c16fef8d7f958c73503cc8a7ed94da1efe42f7b34610f9d96fddd2bce0aeff',
            '1b0af6808a62cb4554d2347d30976dfafca0fb3825bc5366aea2054af3f87445',
            'b188f3b8b06751b3ba4453e52b03be672b461bffb9f68d4649dc9a6d998eeaac'
          )
          for ($i = 0; $i -lt $patchFiles.Count; $i++) {
            $hash = (Get-FileHash $patchFiles[$i] -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $patchExpected[$i]) { throw "Patch segment $i SHA-256 mismatch: $hash" }
          }
          $patch = ($patchFiles | ForEach-Object { Get-Content $_ -Raw }) -join ''
          [IO.File]::WriteAllText('warehouse-v0301.patch', $patch, [Text.UTF8Encoding]::new($false))
          $patchHash = (Get-FileHash 'warehouse-v0301.patch' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "v0.3.0.1 patch SHA-256: $patchHash"
          if ($patchHash -ne '03b3d1484975c332cf7c945216a3031e6135193f6523c17cd2f91b3c798a582b') { throw "Patch SHA-256 mismatch: $patchHash" }
          git apply -p3 --directory=warehouse-ci/PWADC-Warehouse-Attendance-Tracker warehouse-v0301.patch
          if ($LASTEXITCODE -ne 0) { throw 'git apply failed.' }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact v0.3.0.1 release files
        shell: pwsh
        run: |
          @'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const root=path.resolve('warehouse-ci/PWADC-Warehouse-Attendance-Tracker');
          const lines=fs.readFileSync('warehouse-v0301-source-manifest.sha256','utf8').trim().split(/\r?\n/);
          if(lines.length!==19) throw new Error(`Expected 19 manifest files, got ${lines.length}`);
          for(const line of lines){const m=line.match(/^([0-9a-f]{64})  (.+)$/);if(!m)throw new Error('Bad manifest line: '+line);const f=path.join(root,...m[2].split('/'));const h=crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');if(h!==m[1])throw new Error(`SHA mismatch ${m[2]}: ${h}`)}
          console.log('Verified all 19 v0.3.0.1 release files.');
          '@ | node

      - name: Validate standalone source
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        run: node tools/validate.js

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        run: dotnet restore PWADCWarehouseAttendanceTracker.csproj

      - name: Build
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        run: dotnet build PWADCWarehouseAttendanceTracker.csproj --configuration Release --no-restore

      - name: Publish Windows x64
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        run: dotnet publish PWADCWarehouseAttendanceTracker.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=false -o publish

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: PWADC-Warehouse-Attendance-Tracker-v0-3-0-1-Windows
          path: warehouse-ci/PWADC-Warehouse-Attendance-Tracker/publish/**
          if-no-files-found: error
