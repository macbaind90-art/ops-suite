name: Build Warehouse Attendance Tracker v0.3.0.0 CI

on:
  push:
    branches:
      - warehouse-attendance-v0.3.0.0-ci
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout CI branch
        uses: actions/checkout@v4

      - name: Verify and extract standalone source
        shell: pwsh
        run: |
          $source = 'warehouse-v0300-source.zip'
          $transportExpected = 'c753368baf8295143d1163c1d6a078104bd869ed74e09c3092f040c0c320b05a'
          $transportHash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Transport ZIP SHA-256: $transportHash"
          if ($transportHash -ne $transportExpected) { throw "Transport ZIP SHA-256 mismatch: $transportHash" }
          Expand-Archive $source -DestinationPath warehouse-ci -Force

          $root = Join-Path $PWD 'warehouse-ci/PWADC-Warehouse-Attendance-Tracker'
          $manifest = Get-Content 'warehouse-v0300-source-manifest.sha256'
          $expectedPaths = @()
          foreach ($line in $manifest) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Malformed source manifest line: $line" }
            $expectedHash = $Matches[1]
            $relative = $Matches[2]
            $expectedPaths += $relative
            $file = Join-Path $root ($relative -replace '/', [IO.Path]::DirectorySeparatorChar)
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Required source file missing: $relative" }
            $actualHash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) { throw "Source file SHA-256 mismatch: $relative -> $actualHash" }
          }
          $actualPaths = Get-ChildItem -LiteralPath $root -File -Recurse | ForEach-Object {
            $_.FullName.Substring($root.Length + 1).Replace([IO.Path]::DirectorySeparatorChar, '/')
          } | Sort-Object
          $expectedPaths = $expectedPaths | Sort-Object
          if (($actualPaths -join "`n") -ne ($expectedPaths -join "`n")) {
            Write-Host 'Expected source files:'
            $expectedPaths | ForEach-Object { Write-Host "  $_" }
            Write-Host 'Actual source files:'
            $actualPaths | ForEach-Object { Write-Host "  $_" }
            throw 'Extracted source file set does not match the verified local manifest.'
          }
          Write-Host "Verified $($expectedPaths.Count) source files against the local release manifest."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate standalone source
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        run: node tools/validate.js

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        run: dotnet restore PWADCWarehouseAttendanceTracker.csproj

      - name: Build
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        run: dotnet build PWADCWarehouseAttendanceTracker.csproj --configuration Release --no-restore

      - name: Publish Windows x64
        working-directory: warehouse-ci/PWADC-Warehouse-Attendance-Tracker
        run: dotnet publish PWADCWarehouseAttendanceTracker.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=false -o publish

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: PWADC-Warehouse-Attendance-Tracker-v0-3-0-0-Windows
          path: warehouse-ci/PWADC-Warehouse-Attendance-Tracker/publish/**
          if-no-files-found: error
