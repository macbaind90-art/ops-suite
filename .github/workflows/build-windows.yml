name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Validate all browser and release contracts
        run: node tools/validate-all.js

      - name: Read release version
        shell: pwsh
        run: '"SUITE_VERSION=$(Get-Content VERSION -Raw | ForEach-Object { $_.Trim() })" >> $env:GITHUB_ENV'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Verify .NET 10 SDK selection
        run: dotnet --version

      - name: Restore
        run: dotnet restore SecurityOperationsSuite.csproj

      - name: Build
        run: dotnet build SecurityOperationsSuite.csproj --configuration Release --no-restore

      - name: Test persistence and qualification behavior
        run: dotnet run --project tests/CoreTests/Suite.CoreTests.csproj --configuration Release

      - name: Test native Windows authorization and recovery
        run: dotnet run --project tests/WindowsHostTests/Suite.WindowsHostTests.csproj --configuration Release

      - name: Test actual WebView2 navigation and input
        timeout-minutes: 3
        run: dotnet run --project tests/WebViewTests/Suite.WebViewTests.csproj --configuration Release

      - name: Publish self-contained Windows x64 EXE
        run: dotnet publish SecurityOperationsSuite.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --output publish

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PWADC-Security-Operations-Suite-v${{ env.SUITE_VERSION }}-Windows
          path: publish/**
          retention-days: 7
